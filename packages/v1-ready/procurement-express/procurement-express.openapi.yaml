      responses:
        '200':
          description: Created department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'

  /departments/{departmentId}:
    get:
      operationId: getDepartment
      summary: Get a department
      tags: [Departments]
      parameters:
        - $ref: '#/components/parameters/departmentId'
      responses:
        '200':
          description: Department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
    put:
      operationId: updateDepartment
      summary: Update a department
      tags: [Departments]
      parameters:
        - $ref: '#/components/parameters/departmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [department]
              properties:
                department:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Updated department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'

  /budgets:
    get:
      operationId: listBudgets
      summary: List budgets
      tags: [Budgets]
      parameters:
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Budget list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createBudget
      summary: Create a budget
      tags: [Budgets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget]
              properties:
                budget:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Created budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'

  /budgets/{budgetId}:
    get:
      operationId: getBudget
      summary: Get a budget
      tags: [Budgets]
      parameters:
        - $ref: '#/components/parameters/budgetId'
      responses:
        '200':
          description: Budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
    put:
      operationId: updateBudget
      summary: Update a budget
      tags: [Budgets]
      parameters:
        - $ref: '#/components/parameters/budgetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [budget]
              properties:
                budget:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'

  /products:
    get:
      operationId: listProducts
      summary: List products
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/page'
        - name: search
          in: query
          schema: { type: string }
        - name: supplier_id
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createProduct
      summary: Create a product
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Created product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{productId}:
    get:
      operationId: getProduct
      summary: Get product details
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/productId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    put:
      operationId: updateProduct
      summary: Update a product
      tags: [Products]
      parameters:
        - $ref: '#/components/parameters/productId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /tax_rates:
    get:
      operationId: listTaxRates
      summary: List tax rates
      tags: [TaxRates]
      responses:
        '200':
          description: Tax rate list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxRate'
    post:
      operationId: createTaxRate
      summary: Create a tax rate
      tags: [TaxRates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tax_rate]
              properties:
                tax_rate:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Created tax rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'

  /tax_rates/{taxRateId}:
    get:
      operationId: getTaxRate
      summary: Get a tax rate
      tags: [TaxRates]
      parameters:
        - $ref: '#/components/parameters/taxRateId'
      responses:
        '200':
          description: Tax rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'
    put:
      operationId: updateTaxRate
      summary: Update a tax rate
      tags: [TaxRates]
      parameters:
        - $ref: '#/components/parameters/taxRateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tax_rate]
              properties:
                tax_rate:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Updated tax rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'

  /webhooks:
    get:
      operationId: listWebhooks
      summary: List webhooks
      tags: [Webhooks]
      responses:
        '200':
          description: Webhook list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createWebhook
      summary: Create a webhook
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook]
              properties:
                webhook:
                  $ref: '#/components/schemas/WebhookInput'
      responses:
        '200':
          description: Created webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

  /webhooks/{webhookId}:
    get:
      operationId: getWebhook
      summary: Get a webhook
      tags: [Webhooks]
      parameters:
        - $ref: '#/components/parameters/webhookId'
      responses:
        '200':
          description: Webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
    put:
      operationId: updateWebhook
      summary: Update a webhook
      tags: [Webhooks]
      parameters:
        - $ref: '#/components/parameters/webhookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook]
              properties:
                webhook:
                  $ref: '#/components/schemas/WebhookInput'
      responses:
        '200':
          description: Updated webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

components:
  securitySchemes:
    AuthenticationToken:
      type: apiKey
      in: header
      name: authentication_token
      description: |
        Account authentication token. Optionally also send `app_company_id`
        for the active employer/company context.
  parameters:
    page:
      name: page
      in: query
      schema: { type: integer }
    companyId:
      name: companyId
      in: path
      required: true
      schema: { type: string }
    purchaseOrderId:
      name: purchaseOrderId
      in: path
      required: true
      schema: { type: string }
    invoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string }
    supplierId:
      name: supplierId
      in: path
      required: true
      schema: { type: string }
    departmentId:
      name: departmentId
      in: path
      required: true
      schema: { type: string }
    budgetId:
      name: budgetId
      in: path
      required: true
      schema: { type: string }
    productId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    taxRateId:
      name: taxRateId
      in: path
      required: true
      schema: { type: string }
    webhookId:
      name: webhookId
      in: path
      required: true
      schema: { type: string }
  schemas:
    CurrentUser:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        name: { type: string }
        employer_id: { type: integer }
        authentication_token: { type: string }
        companies:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    Company:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
      additionalProperties: true
    PurchaseOrder:
      type: object
      properties:
        id: { type: integer }
        company_id: { type: integer }
        supplier_id: { type: integer }
        supplier_name: { type: string }
        status: { type: string }
        amount: { type: string }
      additionalProperties: true
    Invoice:
      type: object
      properties:
        id: { type: integer }
        invoice_number: { type: string }
        supplier_id: { type: integer }
        status: { type: string }
      additionalProperties: true
    Supplier:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        address: { type: string }
        phone_number: { type: string }
        tax_number: { type: string }
        archived: { type: boolean }
      additionalProperties: true
    SupplierInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        address: { type: string }
        notes: { type: string }
        phone_number: { type: string }
        tax_number: { type: string }
        contact_person: { type: string }
        archived: { type: boolean }
      additionalProperties: true
    Department:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
      additionalProperties: true
    Budget:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        amount: { type: string }
      additionalProperties: true
    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        supplier_id: { type: integer }
      additionalProperties: true
    TaxRate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        value: { type: number }
        archived: { type: boolean }
        company_id: { type: integer }
        tax_type: { type: string }
      additionalProperties: true
    Webhook:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        archived: { type: boolean }
        event_type:
          type: array
          items:
            type: string
            enum: [new_po, po_approved, po_delivered, po_paid, po_cancelled, po_update]
      additionalProperties: true
    WebhookInput:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        archived: { type: boolean }
        event_type:
          type: array
          items:
            type: string
            enum: [new_po, po_approved, po_delivered, po_paid, po_cancelled, po_update]
        json_wrapper: { type: string }
        send_as_text: { type: boolean }
        basic_auth_uname: { type: string }
        basic_auth_pword: { type: string }
      additionalProperties: true
