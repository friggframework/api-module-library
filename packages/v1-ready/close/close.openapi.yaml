    UpdateOpportunity:
      title: UpdateOpportunity
      type: object
      properties:
        attachments:
          title: Attachments
          type: array
          items:
            $ref: '#/components/schemas/AttachmentIn'
        confidence:
          title: Confidence
          type: integer
        contact_id:
          title: Contact ID
          anyOf:
            - type: string
            - type: 'null'
        date_won:
          title: Date Won
          description: >-
            If not set on the resource or in the request, `date_won` will be set automatically to
            today's date when setting `status_id` to a status with type `won`. The `x-tz-offset`
            header, used to pass your timezone's UTC offset, will be taken into account.
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        note:
          title: Note
          description: >-
            Plaintext/markdown version of the note. If `note_html` is also provided in the same
            request, this value is ignored and `note` is derived from the HTML instead.
          type: string
        note_html:
          title: Note HTML
          description: >-
            Rich-text HTML version of the note. When set, `note` is automatically populated with the
            plaintext version (tags become markdown), overriding any `note` value passed in the same
            request. Pass `null` to clear `note_html`; `note` is cleared as well.
          anyOf:
            - type: string
            - type: 'null'
        status:
          title: Status
          type: string
        status_id:
          title: Status ID
          description: >-
            Setting the `status_id` to a status with a type of `won` will automatically set the
            `date_won` field if it is not already set or provided in the request. Reverting it from
            a `won` status to an `active` or `lost` will not automatically change `date_won`.
          type: string
        user_id:
          title: User ID
          anyOf:
            - type: string
            - type: 'null'
        value:
          title: Value
          description: >-
            Monetary value of the opportunity in cents, e.g. `340000` for $3,400.00. The currency is
            the organization's currency.
          type: integer
        value_period:
          title: Value Period
          $ref: '#/components/schemas/OpportunityValuePeriod'
      additionalProperties: false
      patternProperties:
        ^custom\.:
          not:
            type: object
    UpdateWebhook:
      title: UpdateWebhook
      type: object
      properties:
        events:
          title: Events
          description: >-
            A list of events to subscribe to. Each event has an `object_type` and an `action` from
            values in the [event
            log](https://developer.close.com/api/resources/events/list-of-event-types). You can also
            use [Webhook
            Filters](https://developer.close.com/api/resources/webhooks/webhook-filters) while
            creating your subscription so that an event only fires to a Webhook when certain
            conditions are met.
          default: null
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/WebhookSubscriptionEvent'
            - type: 'null'
        status:
          default: null
          anyOf:
            - $ref: '#/components/schemas/WebhookStatus'
            - type: 'null'
        url:
          title: Url
          description: Destination URL for the webhook subscription
          default: null
          anyOf:
            - type: string
            - type: 'null'
        verify_ssl:
          title: Verify Ssl
          description: >-
            Verify SSL certificate of destination webhook URL. Set to `false` to disable SSL
            certificate validation. We recommend using https to protect your data during delivery.
          default: null
          anyOf:
            - type: boolean
            - type: 'null'
      additionalProperties: false
    WebhookStatus:
      title: WebhookStatus
      type: string
      enum:
        - active
        - paused
    WebhookSubscriptionEvent:
      title: WebhookSubscriptionEvent
      type: object
      properties:
