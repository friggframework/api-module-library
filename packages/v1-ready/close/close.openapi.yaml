          title: Created By
          default: null
          anyOf:
            - type: string
            - type: 'null'
        date_created:
          title: Date Created
          default: null
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        date_won:
          title: Date Won
          description: >-
            If not set on the resource or in the request, `date_won` will be set automatically to
            today's date when setting `status_id` to a status with type `won`. The `x-tz-offset`
            header, used to pass your timezone's UTC offset, will be taken into account.
          default: null
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        lead_id:
          title: Lead ID
          description: >-
            Opportunities belong to exactly one Lead. If not provided, a new lead will be created
            (appearing as "Untitled" in the UI).
          default: null
          anyOf:
            - type: string
            - type: 'null'
        note:
          title: Note
          description: >-
            Plaintext/markdown version of the note. If `note_html` is also provided in the same
            request, this value is ignored and `note` is derived from the HTML instead.
          default: null
          anyOf:
            - type: string
            - type: 'null'
        note_html:
          title: Note HTML
          description: >-
            Rich-text HTML version of the note. When set, `note` is automatically populated with the
            plaintext version (tags become markdown), overriding any `note` value passed in the same
            request.
          default: null
          anyOf:
            - type: string
            - type: 'null'
        pipeline_id:
          title: Pipeline ID
          description: >-
            Specify which pipeline this opportunity should belong to. When supplied without
            `status_id`, the opportunity will be created with the first available status of that
            pipeline. When supplied with `status_id`, the status must belong to the specified
            pipeline or a 400 error will be returned. If the pipeline does not exist, a 400 error
            will be returned. See the [Pipelines
            API](https://developer.close.com/api/resources/pipelines).
          default: null
          anyOf:
            - type: string
            - type: 'null'
        status_id:
          title: Status ID
          description: >-
            Post a `status_id` to create an opportunity with a specific status. If omitted, the
            organization's default (first) status will be used (or the first status of the
            `pipeline_id` if provided). See the [Opportunity Status
            API](https://developer.close.com/api/resources/opportunity-statuses).
          default: null
          anyOf:
            - type: string
            - type: 'null'
        user_id:
          title: User ID
          default: null
          anyOf:
            - type: string
            - type: 'null'
        value:
          title: Value
          description: >-
            Monetary value of the opportunity in cents, e.g. `340000` for $3,400.00. The currency is
            the organization's currency.
          default: null
          anyOf:
            - type: integer
            - type: 'null'
        value_period:
          default: null
          anyOf:
            - $ref: '#/components/schemas/OpportunityValuePeriod'
            - type: 'null'
      additionalProperties: false
      patternProperties:
        ^custom\.:
          not:
            type: object
    CreateWebhook:
      title: CreateWebhook
      type: object
      properties:
        events:
          title: Events
          description: >-
            A list of events to subscribe to. Each event has an `object_type` and an `action` from
            values in the [event
            log](https://developer.close.com/api/resources/events/list-of-event-types). You can also
            use [Webhook
            Filters](https://developer.close.com/api/resources/webhooks/webhook-filters) while
            creating your subscription so that an event only fires to a Webhook when certain
            conditions are met.
          type: array
