openapi: 3.0.3
info:
  title: GitLab REST API (Frigg curated subset)
  version: "1.0.0"
  description: >-
    GitLab (gitlab.com / Self-Managed / Dedicated) DevOps platform REST API v4.
    Curated 1:1 contract for @friggframework/api-module-gitlab (one method per
    operationId).

    Vendor OpenAPI (authoritative for paths/params/bodies in this file):
      https://gitlab.com/gitlab-org/gitlab/-/raw/master/doc/api/openapi/openapi_v2.yaml
    That Swagger 2.0 document uses host `gitlab.com` and path keys prefixed with
    `/api/v4/...` (no basePath). Composed server URL is therefore
    `https://gitlab.com/api/v4` — which is what this curated OpenAPI 3.0 `servers`
    entry and the Api `baseUrl` use (paths below omit the `/api/v4` prefix).

    Notes vs vendor specs:
      - GET /user is absent from openapi_v2.yaml but present in openapi_v3.yaml
        (`/api/v4/user`, operationId getApiV4User) and the human docs.
      - openapi_v2 securityDefinitions are PRIVATE-TOKEN / private_token only;
        openapi_v3 adds http bearer + oauth2 authorizationCode. This module
        implements OAuth Bearer; both are declared under components.securitySchemes.

    Human docs: https://docs.gitlab.com/api/rest/
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
  - url: https://gitlab.com/api/v4
    description: >-
      GitLab.com API v4 — composed from vendor openapi_v2 host `gitlab.com` +
      `/api/v4` path prefix (override host for Self-Managed via Api `host`)
security:
  - OAuth2: [api, read_user]
  - bearerAuth: []
  - privateToken: []
tags:
  - name: Users
  - name: Projects
  - name: Issues
  - name: Merge Requests
  - name: Project Hooks
paths:
  /user:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Retrieve current user details
      description: >-
        Returns the authenticated user (vendor openapi_v3: GET /api/v4/user,
        getApiV4User; missing from openapi_v2.yaml). Requires `read_user` or
        broader scopes. https://docs.gitlab.com/api/users/#retrieve-the-current-user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List all projects
      description: >-
        Vendor: GET /api/v4/projects (getApiV4Projects).
        https://docs.gitlab.com/api/projects/#list-all-projects
      parameters:
        - in: query
          name: membership
          schema: { type: boolean }
        - in: query
          name: owned
          schema: { type: boolean }
        - in: query
          name: starred
          schema: { type: boolean }
        - in: query
          name: archived
          schema: { type: boolean }
        - in: query
          name: visibility
          schema: { type: string, enum: [private, internal, public] }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: search_namespaces
          schema: { type: boolean }
        - in: query
          name: simple
          schema: { type: boolean }
        - in: query
          name: statistics
          schema: { type: boolean }
        - in: query
          name: with_custom_attributes
          schema: { type: boolean }
        - in: query
          name: min_access_level
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
        - in: query
          name: order_by
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: Array of projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: >-
        Creates a project owned by the authenticated user. Provide `name` and/or
        `path`. https://docs.gitlab.com/api/projects/#create-a-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                path: { type: string }
                description: { type: string }
                visibility: { type: string, enum: [private, internal, public] }
                initialize_with_readme: { type: boolean }
                namespace_id: { type: integer }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Retrieve a project
      description: >-
        Vendor: GET /api/v4/projects/{id} (getApiV4ProjectsId).
        https://docs.gitlab.com/api/projects/#get-a-single-project
      parameters:
        - in: query
          name: statistics
          schema: { type: boolean }
        - in: query
          name: with_custom_attributes
          schema: { type: boolean }
        - in: query
          name: license
          schema: { type: boolean }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    put:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      description: >-
        Vendor: PUT /api/v4/projects/{id} (putApiV4ProjectsId).
        https://docs.gitlab.com/api/projects/#edit-a-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                path: { type: string }
                description: { type: string }
                visibility: { type: string, enum: [private, internal, public] }
                default_branch: { type: string }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Issues]
      operationId: listIssues
      summary: List all project issues
      description: >-
        Vendor: GET /api/v4/projects/{id}/issues (getApiV4ProjectsIdIssues).
        https://docs.gitlab.com/api/issues/#list-project-issues
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [opened, closed, all], default: all }
        - in: query
          name: labels
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - in: query
          name: issue_type
          schema:
            type: string
            enum: [issue, incident, test_case, requirement, task, ticket]
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Array of issues
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Issue" }
    post:
      tags: [Issues]
      operationId: createIssue
      summary: Create an issue
      description: >-
        Required: `title`. https://docs.gitlab.com/api/issues/#create-an-issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                labels:
                  type: array
                  items: { type: string }
                  description: >-
                    Label names (vendor OpenAPI type array; API also accepts a
                    comma-separated string in some clients).
                assignee_ids:
                  type: array
                  items: { type: integer }
                assignee_id: { type: integer }
                confidential: { type: boolean }
                due_date: { type: string, format: date }
                start_date: { type: string, format: date }
                milestone_id: { type: integer }
                issue_type:
                  type: string
                  enum: [issue, incident, test_case, requirement, task, ticket]
      responses:
        "201":
          description: Created issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /projects/{id}/issues/{issue_iid}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - in: path
        name: issue_iid
        required: true
        schema: { type: integer }
        description: Internal ID of the issue within the project
    get:
      tags: [Issues]
      operationId: getIssue
      summary: Retrieve a project issue
      description: >-
        Vendor: GET /api/v4/projects/{id}/issues/{issue_iid}
        (getApiV4ProjectsIdIssuesIssueIid).
        https://docs.gitlab.com/api/issues/#single-project-issue
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
    put:
      tags: [Issues]
      operationId: updateIssue
      summary: Update an issue
      description: >-
        Vendor: PUT /api/v4/projects/{id}/issues/{issue_iid}
        (putApiV4ProjectsIdIssuesIssueIid).
        https://docs.gitlab.com/api/issues/#edit-an-issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                state_event: { type: string, enum: [close, reopen] }
                labels:
                  type: array
                  items: { type: string }
                assignee_ids:
                  type: array
                  items: { type: integer }
                assignee_id: { type: integer }
                issue_type:
                  type: string
                  enum: [issue, incident, test_case, requirement, task, ticket]
                confidential: { type: boolean }
                due_date: { type: string, format: date }
                start_date: { type: string, format: date }
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /projects/{id}/merge_requests:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Merge Requests]
      operationId: listMergeRequests
      summary: List all project merge requests
      description: >-
        Vendor: GET /api/v4/projects/{id}/merge_requests
        (getApiV4ProjectsIdMergeRequests).
        https://docs.gitlab.com/api/merge_requests/#list-project-merge-requests
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [opened, closed, locked, merged, all]
            default: all
        - in: query
          name: labels
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - in: query
          name: source_branch
          schema: { type: string }
        - in: query
          name: target_branch
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Array of merge requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MergeRequest" }
    post:
      tags: [Merge Requests]
      operationId: createMergeRequest
      summary: Create a merge request
      description: >-
        Required: `source_branch`, `target_branch`, `title`.
        https://docs.gitlab.com/api/merge_requests/#create-mr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_branch, target_branch, title]
              properties:
                source_branch: { type: string }
                target_branch: { type: string }
                title: { type: string }
                description: { type: string }
                labels:
                  type: array
                  items: { type: string }
                assignee_ids:
                  type: array
                  items: { type: integer }
                assignee_id: { type: integer }
                reviewer_ids:
                  type: array
                  items: { type: integer }
                remove_source_branch: { type: boolean }
                squash: { type: boolean }
                target_project_id: { type: integer }
                allow_collaboration: { type: boolean }
                merge_after: { type: string }
      responses:
        "201":
          description: Created merge request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeRequest" }

  /projects/{id}/merge_requests/{merge_request_iid}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - in: path
        name: merge_request_iid
        required: true
        schema: { type: integer }
    get:
      tags: [Merge Requests]
      operationId: getMergeRequest
      summary: Retrieve a merge request
      description: >-
        Vendor: GET /api/v4/projects/{id}/merge_requests/{merge_request_iid}
        (getApiV4ProjectsIdMergeRequestsMergeRequestIid).
        https://docs.gitlab.com/api/merge_requests/#get-single-mr
      parameters:
        - in: query
          name: render_html
          schema: { type: boolean }
        - in: query
          name: include_diverged_commits_count
          schema: { type: boolean }
        - in: query
          name: include_rebase_in_progress
          schema: { type: boolean }
      responses:
        "200":
          description: Merge request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeRequest" }
        "404":
          description: Not found
    put:
      tags: [Merge Requests]
      operationId: updateMergeRequest
      summary: Update a merge request
      description: >-
        Vendor: PUT /api/v4/projects/{id}/merge_requests/{merge_request_iid}
        (putApiV4ProjectsIdMergeRequestsMergeRequestIid).
        https://docs.gitlab.com/api/merge_requests/#update-mr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                state_event: { type: string, enum: [close, reopen] }
                target_branch: { type: string }
                labels:
                  type: array
                  items: { type: string }
                assignee_ids:
                  type: array
                  items: { type: integer }
                assignee_id: { type: integer }
                reviewer_ids:
                  type: array
                  items: { type: integer }
                remove_source_branch: { type: boolean }
                squash: { type: boolean }
                allow_collaboration: { type: boolean }
                merge_after: { type: string }
      responses:
        "200":
          description: Updated merge request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeRequest" }

  /projects/{id}/hooks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Project Hooks]
      operationId: listProjectHooks
      summary: List all webhooks for a project
      description: >-
        Vendor: GET /api/v4/projects/{id}/hooks (getApiV4ProjectsIdHooks).
        https://docs.gitlab.com/api/project_webhooks/#list-webhooks-for-a-project
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Array of hooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectHook" }
    post:
      tags: [Project Hooks]
      operationId: createProjectHook
      summary: Add a webhook to a project
      description: >-
        Vendor: POST /api/v4/projects/{id}/hooks (postApiV4ProjectsIdHooks).
        Required: `url`. Prefer `signing_token` (whsec_…) over legacy `token`.
        https://docs.gitlab.com/api/project_webhooks/#add-a-webhook-to-a-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                name: { type: string }
                description: { type: string }
                token: { type: string }
                signing_token:
                  type: string
                  description: >-
                    HMAC signing token (whsec_<base64> of a 32-byte key). Not
                    returned in the response.
                push_events: { type: boolean }
                issues_events: { type: boolean }
                confidential_issues_events: { type: boolean }
                merge_requests_events: { type: boolean }
                note_events: { type: boolean }
                confidential_note_events: { type: boolean }
                tag_push_events: { type: boolean }
                pipeline_events: { type: boolean }
                wiki_page_events: { type: boolean }
                deployment_events: { type: boolean }
                job_events: { type: boolean }
                releases_events: { type: boolean }
                feature_flag_events: { type: boolean }
                milestone_events: { type: boolean }
                emoji_events: { type: boolean }
                resource_access_token_events: { type: boolean }
                resource_deploy_token_events: { type: boolean }
                vulnerability_events: { type: boolean }
                enable_ssl_verification: { type: boolean }
                push_events_branch_filter: { type: string }
                branch_filter_strategy: { type: string }
                custom_webhook_template: { type: string }
      responses:
        "201":
          description: Created hook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectHook" }

  /projects/{id}/hooks/{hook_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - in: path
        name: hook_id
        required: true
        schema: { type: integer }
    get:
      tags: [Project Hooks]
      operationId: getProjectHook
      summary: Retrieve a project webhook
      description: >-
        Vendor: GET /api/v4/projects/{id}/hooks/{hook_id}
        (getApiV4ProjectsIdHooksHookId).
        https://docs.gitlab.com/api/project_webhooks/#get-a-project-hook
      responses:
        "200":
          description: Hook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectHook" }
        "404":
          description: Not found
    put:
      tags: [Project Hooks]
      operationId: updateProjectHook
      summary: Update a project webhook
      description: >-
        Vendor: PUT /api/v4/projects/{id}/hooks/{hook_id}
        (putApiV4ProjectsIdHooksHookId). `url` is optional in the vendor
        OpenAPI (not required).
        https://docs.gitlab.com/api/project_webhooks/#edit-a-project-hook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                name: { type: string }
                description: { type: string }
                token: { type: string }
                signing_token: { type: string }
                push_events: { type: boolean }
                issues_events: { type: boolean }
                confidential_issues_events: { type: boolean }
                merge_requests_events: { type: boolean }
                note_events: { type: boolean }
                confidential_note_events: { type: boolean }
                tag_push_events: { type: boolean }
                pipeline_events: { type: boolean }
                wiki_page_events: { type: boolean }
                deployment_events: { type: boolean }
                job_events: { type: boolean }
                releases_events: { type: boolean }
                feature_flag_events: { type: boolean }
                milestone_events: { type: boolean }
                enable_ssl_verification: { type: boolean }
                push_events_branch_filter: { type: string }
                branch_filter_strategy: { type: string }
      responses:
        "200":
          description: Updated hook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectHook" }
    delete:
      tags: [Project Hooks]
      operationId: deleteProjectHook
      summary: Delete a project webhook
      description: >-
        Vendor: DELETE /api/v4/projects/{id}/hooks/{hook_id}
        (deleteApiV4ProjectsIdHooksHookId).
        https://docs.gitlab.com/api/project_webhooks/#delete-a-project-hook
      responses:
        "204":
          description: Deleted

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: >-
        From vendor openapi_v3 oauth2 authorizationCode flow. This module's
        Api uses OAuth Bearer tokens from this flow.
      flows:
        authorizationCode:
          authorizationUrl: https://gitlab.com/oauth/authorize
          tokenUrl: https://gitlab.com/oauth/token
          refreshUrl: https://gitlab.com/oauth/token
          scopes:
            api: >-
              Grants complete read/write access to the API, including all groups
              and projects, the container registry, the dependency proxy, and
              the package registry.
            read_api: >-
              Grants read access to the API, including all groups and projects,
              the container registry, and the package registry.
            read_user: >-
              Grants read-only access to your profile through the /user API
              endpoint, which includes username, public email, and full name.
              Also grants access to read-only API endpoints under /users.
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Vendor openapi_v3 `http` bearer scheme. OAuth access tokens and PATs
        may be sent as `Authorization: Bearer <token>`.
        https://docs.gitlab.com/api/rest/authentication/
    privateToken:
      type: apiKey
      in: header
      name: PRIVATE-TOKEN
      description: >-
        Vendor openapi_v2 `access_token_header` / openapi_v3 `apiKey`. Personal,
        project, and group access tokens via the PRIVATE-TOKEN header.
  parameters:
    ProjectId:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: >-
        The ID or URL-encoded path of the project (vendor OpenAPI).
  schemas:
    User:
      type: object
      description: >-
        Subset of vendor APIEntitiesUserPublic (openapi_v3 GET /api/v4/user).
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        name: { type: string }
        email: { type: string }
        public_email: { type: string }
        state: { type: string }
        web_url: { type: string }
        avatar_url: { type: string }
    Project:
      type: object
      description: Subset of vendor API_Entities_Project / BasicProjectDetails.
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        name_with_namespace: { type: string }
        path: { type: string }
        path_with_namespace: { type: string }
        description: { type: string }
        visibility: { type: string }
        default_branch: { type: string }
        web_url: { type: string }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
    Issue:
      type: object
      description: Subset of vendor API_Entities_Issue.
      properties:
        id: { type: integer, format: int64 }
        iid: { type: integer }
        project_id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        state: { type: string }
        issue_type: { type: string }
        labels:
          type: array
          items: { type: string }
        web_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        author:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            name: { type: string }
            public_email: { type: string }
    MergeRequest:
      type: object
      description: Subset of vendor API_Entities_MergeRequest.
      properties:
        id: { type: integer, format: int64 }
        iid: { type: integer }
        project_id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        state: { type: string }
        source_branch: { type: string }
        target_branch: { type: string }
        web_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        author:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            name: { type: string }
            public_email: { type: string }
    ProjectHook:
      type: object
      description: Subset of vendor API_Entities_ProjectHook.
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        name: { type: string }
        description: { type: string }
        project_id: { type: integer, format: int64 }
        push_events: { type: boolean }
        issues_events: { type: boolean }
        confidential_issues_events: { type: boolean }
        merge_requests_events: { type: boolean }
        note_events: { type: boolean }
