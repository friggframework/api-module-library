  /{codebase}apis/3.0/company/contacts:
    parameters: *commonParameters
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List contacts
      parameters:
        - $ref: "#/components/parameters/ConditionsQuery"
      responses:
        "200":
          description: Contact list (shape UNVERIFIED)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Contacts]
      operationId: createContact
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Contact" }
      responses:
        "200":
          description: Created contact (shape UNVERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/company/contacts/{id}:
    parameters:
      - $ref: "#/components/parameters/Codebase"
      - $ref: "#/components/parameters/AcceptHeader"
      - $ref: "#/components/parameters/ClientIdHeader"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Get contact by id
      responses:
        "200":
          description: Contact (shape UNVERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Contacts]
      operationId: updateContact
      summary: Patch contact by id (JSON Patch from FormatPatchBody)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
