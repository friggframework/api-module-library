        default:
          description: An error generated by the Mailchimp API.
          content:
            application/json:
              schema:
                type: object
                description: An error generated by the Mailchimp API. Conforms to IETF draft 'draft-nottingham-http-problem-06'.
                title: Problem Detail Document
                required:
                - type
                - title
                - status
                - detail
                - instance
                properties:
                  type:
                    type: string
                    description: An absolute URI that identifies the problem type. When dereferenced,
                      it should provide human-readable documentation for the problem type.
                    title: Problem Type
                    example: https://mailchimp.com/developer/marketing/docs/errors/
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type. It shouldn't change
                      based on the occurrence of the problem, except for purposes of localization.
                    title: Error Title
                    example: Resource Not Found
                  status:
                    type: integer
                    description: The HTTP status code (RFC2616, Section 6) generated by the origin server
                      for this occurrence of the problem.
                    title: HTTP Status Code
                    example: 404
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence of the problem.
                      [Learn more about errors](/developer/guides/get-started-with-mailchimp-api-3/#Errors).
                    title: Error Message
                    example: The requested resource could not be found.
                  instance:
                    type: string
                    description: A string that identifies this specific occurrence of the problem. Please
                      provide this ID when contacting support.
                    title: Instance ID
                    example: 995c5cb0-3280-4a6e-808b-3b096d0bb219
      parameters:
      - name: fields
        in: query
        required: false
        description: A comma-separated list of fields to return. Reference parameters of sub-objects with
          dot notation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: exclude_fields
        in: query
        required: false
        description: A comma-separated list of fields to exclude. Reference parameters of sub-objects
          with dot notation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: count
        in: query
        required: false
        description: The number of records to return. Default value is 10. Maximum value is 1000
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        required: false
        description: Used for [pagination](https://mailchimp.com/developer/marketing/docs/methods-parameters/#pagination),
          this is the number of records from a collection to skip. Default value is 0.
        schema:
          type: integer
          default: 0
      - name: list_id
        in: path
        required: true
        description: The unique ID for the list.
        schema:
          type: string
      - name: email_type
        in: query
        required: false
        description: The email type.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: The subscriber's status.
        schema:
          type: string
          enum:
          - subscribed
          - unsubscribed
          - cleaned
          - pending
          - transactional
          - archived
      - name: since_timestamp_opt
        in: query
        required: false
        description: 'Restrict results to subscribers who opted-in after the set timeframe. Uses ISO 8601
          time format: 2015-10-21T15:41:36+00:00.'
        schema:
          type: string
      - name: before_timestamp_opt
        in: query
        required: false
        description: 'Restrict results to subscribers who opted-in before the set timeframe. Uses ISO
          8601 time format: 2015-10-21T15:41:36+00:00.'
        schema:
          type: string
      - name: since_last_changed
        in: query
        required: false
        description: 'Restrict results to subscribers whose information changed after the set timeframe.
          Uses ISO 8601 time format: 2015-10-21T15:41:36+00:00.'
        schema:
          type: string
      - name: before_last_changed
        in: query
        required: false
        description: 'Restrict results to subscribers whose information changed before the set timeframe.
          Uses ISO 8601 time format: 2015-10-21T15:41:36+00:00.'
        schema:
          type: string
      - name: unique_email_id
        in: query
        required: false
        description: A unique identifier for the email address across all Mailchimp lists.
        schema:
          type: string
      - name: vip_only
        in: query
        required: false
        description: A filter to return only the list's VIP members. Passing `true` will restrict results
          to VIP list members, passing `false` will return all list members.
        schema:
          type: boolean
      - name: interest_category_id
        in: query
        required: false
        description: The unique id for the interest category.
        schema:
          type: string
      - name: interest_ids
        in: query
        required: false
        description: Used to filter list members by interests. Must be accompanied by interest_category_id
          and interest_match. The value must be a comma separated list of interest ids present for any
          supplied interest categories.
        schema:
          type: string
      - name: interest_match
        in: query
        required: false
        description: Used to filter list members by interests. Must be accompanied by interest_category_id
          and interest_ids. "any" will match a member with any of the interest supplied, "all" will only
          match members with every interest supplied, and "none" will match members without any of the
          interest supplied.
        schema:
          type: string
          enum:
          - any
          - all
          - none
      - name: sort_field
        in: query
        required: false
        description: Returns files sorted by the specified field.
        schema:
          type: string
          enum:
          - timestamp_opt
          - timestamp_signup
          - last_changed
      - name: sort_dir
        in: query
        required: false
        description: Determines the order direction for sorted results.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: since_last_campaign
        in: query
        required: false
        description: Filter subscribers by those subscribed/unsubscribed/pending/cleaned since last email
          campaign send. Member status is required to use this filter.
        schema:
          type: boolean
      - name: unsubscribed_since
        in: query
        required: false
        description: Filter subscribers by those unsubscribed since a specific date. Using any status
          other than unsubscribed with this filter will result in an error.
        schema:
          type: string
