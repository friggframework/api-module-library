# Slack Platform - Fenestra Specification
fenestra: "1.0.0"
platform:
  name: Slack
  description: All varieties of available Slack UI extensibility, from Bot interactions to Block Kit interfaces, Workflow steps, and App Home experiences
  version: "1.7"
  baseUrl: "https://slack.com/api"
  documentation: "https://api.slack.com"
  marketplace: "https://slack.com/apps"
  support: "https://api.slack.com/support"

extensionTypes:
  bot-interaction:
    name: Bot Interactions
    description: Conversational interfaces that respond to user messages and interactions
    contexts: 
      - direct-message
      - channel
      - group-message
      - thread
    rendering: 
      - text-response
      - block-kit-message
      - rich-media
      - ephemeral-message
    communication: 
      - events-api
      - web-api
      - socket-mode
      - webhooks
    capabilities: 
      - message-posting
      - file-sharing
      - user-lookup
      - channel-management
      - conversation-history
    triggers: 
      - mention
      - direct-message
      - keyword
      - reaction
      - app-mention
    examples:
      - name: Support Bot
        description: Handles customer support requests and ticket creation
        responseType: "interactive-blocks"
      - name: Standup Bot
        description: Collects daily standup responses from team members
        responseType: "ephemeral-forms"
        
  block-kit-ui:
    name: Block Kit Interfaces
    description: Rich interactive interfaces using Slack's Block Kit framework
    contexts: 
      - message
      - modal
      - home-tab
      - workflow-step
      - app-mention-response
    rendering: 
      - block-kit-schema
      - interactive-components
      - form-elements
    communication: 
      - interactive-components
      - view-submissions
      - block-actions
    capabilities: 
      - form-collection
      - data-display
      - user-interaction
      - conditional-logic
      - dynamic-content
    triggers: 
      - button-click
      - dropdown-select
      - modal-open
      - date-picker
      - overflow-menu
    examples:
      - name: Project Creation Modal
        description: Complex form for creating new projects with multiple fields
        blockTypes: ["input", "section", "actions", "datepicker"]
        
  slash-command:
    name: Slash Commands
    description: Custom commands triggered by typing / in the message input
    contexts: 
      - message-composer
      - any-channel
      - direct-message
    rendering: 
      - ephemeral-response
      - in-channel-response
      - delayed-response
      - modal-trigger
    communication: 
      - command-webhook
      - response-url
      - follow-up-messages
    capabilities: 
      - command-processing
      - response-posting
      - parameter-parsing
      - help-text
    triggers: 
      - slash-command-invocation
      - command-with-parameters
    examples:
      - name: "/standup"
        description: Starts daily standup process for team
        responseType: "modal"
        parameters: ["team", "date"]
        
  workflow-step:
    name: Workflow Steps
    description: Custom steps that can be added to Slack Workflow Builder
    contexts: 
      - workflow-builder
      - automation-workflows
      - scheduled-workflows
    rendering: 
      - step-configuration
      - step-execution
      - step-results
    communication: 
      - step-webhook
      - completion-callback
      - error-handling
    capabilities: 
      - data-transformation
      - external-integration
      - conditional-branching
      - input-validation
    triggers: 
      - workflow-execution
      - scheduled-trigger
      - event-trigger
    examples:
      - name: Approval Step
        description: Sends approval request to manager before proceeding
        stepType: "approval"
        inputFields: ["approver", "message", "timeout"]
        
  home-tab:
    name: App Home
    description: Dedicated space for app interaction accessible from App Home
    contexts: 
      - app-home
      - user-personal-space
    rendering: 
      - block-kit-view
      - dynamic-content
      - personalized-interface
    communication: 
      - app-home-events
      - interactive-components
      - view-updates
    capabilities: 
      - personalized-content
      - persistent-state
      - user-onboarding
      - dashboard-display
    triggers: 
      - home-tab-open
      - user-interaction
      - periodic-refresh
    examples:
      - name: Task Dashboard
        description: Personal task management interface
        features: ["task-list", "quick-actions", "progress-tracking"]
        
  shortcuts:
    name: Shortcuts
    description: Quick actions accessible from various contexts in Slack
    contexts: 
      - message-action
      - global-shortcut
      - message-composer
    rendering: 
      - modal-dialog
      - direct-action
      - in-place-edit
    communication: 
      - shortcut-webhook
      - interactive-response
      - action-completion
    capabilities: 
      - context-access
      - quick-actions
      - message-processing
      - bulk-operations
    triggers: 
      - shortcut-invocation
      - context-menu-selection
    examples:
      - name: "Create Task from Message"
        description: Converts any message into a task
        shortcutType: "message"
        modalRequired: true
        
  events-subscription:
    name: Events Subscription
    description: Real-time notifications for workspace events
    contexts: 
      - workspace-events
      - user-events
      - channel-events
      - message-events
    rendering: 
      - webhook-payload
      - event-processing
    communication: 
      - events-api
      - webhook-delivery
      - retry-mechanism
    capabilities: 
      - real-time-monitoring
      - event-filtering
      - batch-processing
      - custom-reactions
    triggers: 
      - user-action
      - system-event
      - scheduled-event
    examples:
      - name: Onboarding Tracker
        description: Monitors new user activity and sends welcome messages
        events: ["team_join", "first_message", "profile_change"]
        
  calls-integration:
    name: Calls Integration
    description: Custom calling experiences within Slack
    contexts: 
      - call-interface
      - video-call
      - screen-share
    rendering: 
      - call-ui
      - controls-overlay
      - call-preview
    communication: 
      - calls-api
      - real-time-media
      - call-events
    capabilities: 
      - call-initiation
      - call-control
      - recording-access
      - screen-sharing
    triggers: 
      - call-button-click
      - slash-command
      - workflow-step
    examples:
      - name: Custom Video Provider
        description: Integration with third-party video calling service
        provider: "custom-webrtc"

communication:
  events-api:
    description: Real-time event notifications via HTTP webhooks
    delivery: 
      - webhook
      - request-url
    events: 
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - team_join
      - channel_created
      - reaction_added
    retryPolicy: "exponential-backoff"
    verification: "request-signing"
    
  web-api:
    description: RESTful API for Slack operations and data access
    baseUrl: "https://slack.com/api"
    authentication: 
      - bot-token
      - user-token
      - app-token
    rateLimit: "tier-based limits"
    methods:
      - chat.postMessage
      - conversations.list
      - users.info
      - files.upload
      - views.open
      - workflows.stepCompleted
    
  socket-mode:
    description: WebSocket connection for real-time events without public endpoints
    authentication: 
      - app-token
    benefits: 
      - no-public-endpoint
      - real-time-delivery
      - reduced-latency
    events: "same as Events API"
    connection: "websocket"
    
  interactive-components:
    description: Handles user interactions with Block Kit elements
    delivery: "webhook"
    interactions:
      - button-clicks
      - select-menus
      - datepickers
      - modal-submissions
      - view-closed
    verification: "request-signing"

authentication:
  oauth2:
    authorizationUrl: "https://slack.com/oauth/v2/authorize"
    tokenUrl: "https://slack.com/api/oauth.v2.access"
    scopes:
      bot:
        - app_mentions:read
        - channels:history
        - channels:read
        - chat:write
        - commands
        - files:read
        - groups:history
        - im:history
        - reactions:read
        - users:read
        - workflows:read
      user:
        - channels:read
        - chat:write
        - files:read
        - users:read
    flow: "authorization_code"
    
  bot-token:
    format: "xoxb-*"
    description: "Bot-level permissions for app functionality"
    scope: "bot-scoped permissions"
    usage: "server-to-server API calls"
    
  user-token:
    format: "xoxp-*"
    description: "User-level permissions for on-behalf-of actions"
    scope: "user-scoped permissions"
    usage: "user-context API calls"
    
  app-token:
    format: "xapp-*"
    description: "App-level token for Socket Mode connections"
    scope: "app-level permissions"
    usage: "websocket connections"

deployment:
  app-directory:
    name: "Slack App Directory"
    url: "https://slack.com/apps"
    reviewProcess: true
    categories:
      - productivity
      - developer-tools
      - communication
      - project-management
      - analytics
      - social-fun
    distribution: "public"
    installation: "oauth-flow"
    
  enterprise-grid:
    name: "Enterprise Grid"
    distribution: "organization-wide"
    adminApproval: "required"
    policies: "org-level-control"
    installation: "admin-managed"
    
  direct-install:
    name: "Direct Install"
    distribution: "workspace-specific"
    oauth: "required"
    scope: "single-workspace"
    
  custom-integration:
    name: "Custom Integration"
    description: "Legacy integration method"
    status: "deprecated"
    recommendation: "migrate-to-apps"

sdks:
  bolt-javascript:
    name: "Bolt Framework for JavaScript"
    url: "https://github.com/slackapi/bolt-js"
    language: "javascript"
    features:
      - event-handling
      - interactive-components
      - slash-commands
      - middleware-support
      - typescript-support
    
  bolt-python:
    name: "Bolt Framework for Python"
    url: "https://github.com/slackapi/bolt-python"
    language: "python"
    features:
      - async-support
      - flask-integration
      - django-integration
      - middleware-system
    
  web-api-clients:
    name: "Web API Client Libraries"
    languages:
      - javascript: "@slack/web-api"
      - python: "slack-sdk"
      - java: "slack-api-client"
      - csharp: "SlackAPI"
    features:
      - method-calls
      - error-handling
      - rate-limiting
      - type-safety
    
  block-kit-builder:
    name: "Block Kit Builder"
    url: "https://app.slack.com/block-kit-builder"
    type: "visual-designer"
    features:
      - drag-drop-interface
      - code-generation
      - preview-mode
      - template-library
    
  slack-cli:
    name: "Slack CLI"
    url: "https://api.slack.com/automation/cli"
    features:
      - app-scaffolding
      - local-development
      - deployment-tools
      - function-testing

examples:
  productivity-bot:
    name: "Team Productivity Bot"
    description: "Helps teams track goals and manage daily standups"
    types: 
      - bot-interaction
      - slash-command
      - home-tab
      - workflow-step
    features:
      - daily-standup-collection
      - goal-tracking
      - team-analytics
      - reminder-notifications
    
  approval-workflow:
    name: "Approval Workflow Steps"
    description: "Custom approval steps for various business processes"
    types:
      - workflow-step
      - block-kit-ui
    features:
      - multi-level-approval
      - timeout-handling
      - notification-escalation
      - audit-trail
    
  customer-support:
    name: "Customer Support Integration"
    description: "Connects Slack with external support ticket systems"
    types:
      - events-subscription
      - shortcuts
      - bot-interaction
    features:
      - ticket-creation
      - status-updates
      - customer-context
      - team-notifications

tags:
  - messaging
  - collaboration
  - automation
  - productivity
  - workflow
  - real-time
  - notifications

x-slack-manifest-version: "1.7"
x-slack-distribution-method: "app-directory"
x-slack-socket-mode-supported: true