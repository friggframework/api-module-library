    Transform:
      type: array
      items:
        type: array
        items:
          type: number
        maxItems: 3
        minItems: 3
      maxItems: 2
      minItems: 2
      description: "A transformation matrix is standard way in computer graphics to represent translation\
        \ and rotation. These are the top two rows of a 3x3 matrix. The bottom row of the matrix is assumed\
        \ to be [0, 0, 1]. This is known as an affine transform and is enough to represent translation,\
        \ rotation, and skew.\n\nThe identity transform is [[1, 0, 0], [0, 1, 0]].\n\nA translation matrix\
        \ will typically look like:\n\n```\n[[1, 0, tx],\n  [0, 1, ty]]\n```\n\nand a rotation matrix\
        \ will typically look like:\n\n```\n[[cos(angle), sin(angle), 0],\n  [-sin(angle), cos(angle),\
        \ 0]]\n```\n\nAnother way to think about this transform is as three vectors:\n\n- The x axis (t[0][0],\
        \ t[1][0])\n- The y axis (t[0][1], t[1][1])\n- The translation offset (t[0][2], t[1][2])\n\nThe\
        \ most common usage of the Transform matrix is the `relativeTransform property`. This particular\
        \ usage of the matrix has a few additional restrictions. The translation offset can take on any\
        \ value but we do enforce that the axis vectors are unit vectors (i.e. have length 1). The axes\
        \ are not required to be at 90° angles to each other."
    TransformGroupNode:
      allOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - TRANSFORM_GROUP
            description: The type of this node, represented by the string literal "TRANSFORM_GROUP"
        required:
        - type
      - $ref: '#/components/schemas/FrameTraits'
      - $ref: '#/components/schemas/TransformModifiersTrait'
    TransformModifiersTrait:
      type: object
      properties: {}
    Transition:
      oneOf:
      - $ref: '#/components/schemas/SimpleTransition'
      - $ref: '#/components/schemas/DirectionalTransition'
    TransitionSourceTrait:
      type: object
      properties:
        transitionNodeID:
          type: string
          description: Node ID of node to transition to in prototyping
        transitionDuration:
          type: number
          description: The duration of the prototyping transition on this node (in milliseconds). This
            will override the default transition duration on the prototype, for this node.
        transitionEasing:
          $ref: '#/components/schemas/EasingType'
          description: The easing curve used in the prototyping transition on this node.
        interactions:
          type: array
          items:
            $ref: '#/components/schemas/Interaction'
            description: An array of the interactions on this node, each containing a trigger and one
              or more actions.
    Trigger:
      type: object
      description: "The `\"ON_HOVER\"` and `\"ON_PRESS\"` trigger types revert the navigation when the\
        \ trigger is finished (the result is temporary). \n`\"MOUSE_ENTER\"`, `\"MOUSE_LEAVE\"`, `\"MOUSE_UP\"\
        ` and `\"MOUSE_DOWN\"` are permanent, one-way navigation.\nThe `delay` parameter requires the\
        \ trigger to be held for a certain duration of time before the action occurs.\nBoth `timeout`\
        \ and `delay` values are in milliseconds.\nThe `\"ON_MEDIA_HIT\"` and `\"ON_MEDIA_END\"` trigger\
        \ types can only trigger from a video. \nThey fire when a video reaches a certain time or ends.\
        \ The `timestamp` value is in seconds."
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - ON_CLICK
            - ON_HOVER
            - ON_PRESS
            - ON_DRAG
        required:
        - type
      - $ref: '#/components/schemas/AfterTimeoutTrigger'
      - type: object
        properties:
          type:
            type: string
            enum:
            - MOUSE_ENTER
            - MOUSE_LEAVE
            - MOUSE_UP
            - MOUSE_DOWN
          delay:
            type: number
          deprecatedVersion:
            description: 'Whether this is a [deprecated version](https://help.figma.com/hc/en-us/articles/360040035834-Prototype-triggers#h_01HHN04REHJNP168R26P1CMP0A)
              of the trigger that was left unchanged for backwards compatibility.

              If not present, the trigger is the latest version.'
            type: boolean
        required:
        - type
        - delay
      - $ref: '#/components/schemas/OnKeyDownTrigger'
      - $ref: '#/components/schemas/OnMediaHitTrigger'
      - type: object
        properties:
          type:
            type: string
            enum:
            - ON_MEDIA_END
        required:
        - type
    TypePropertiesTrait:
      type: object
      properties:
        characters:
          type: string
          description: The raw characters in the text node.
        style:
          $ref: '#/components/schemas/TypeStyle'
          description: Style of text including font family and weight.
        characterStyleOverrides:
          type: array
          items:
            type: number
          description: The array corresponds to characters in the text box, where each element references
            the 'styleOverrideTable' to apply specific styles to each character. The array's length can
            be less than or equal to the number of characters due to the removal of trailing zeros. Elements
            with a value of 0 indicate characters that use the default type style. If the array is shorter
            than the total number of characters, the characters beyond the array's length also use the
            default style.
        layoutVersion:
          type: number
          description: Internal property, preserved for backward compatibility. Avoid using this value.
        styleOverrideTable:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TypeStyle'
          description: Map from ID to TypeStyle for looking up style overrides.
        lineTypes:
          type: array
          items:
            type: string
            enum:
            - NONE
            - ORDERED
            - UNORDERED
          description: 'An array with the same number of elements as lines in the text node, where lines
            are delimited by newline or paragraph separator characters. Each element in the array corresponds
            to the list type of a specific line. List types are represented as string enums with one of
            these possible values:


            - `NONE`: Not a list item.

            - `ORDERED`: Text is an ordered list (numbered).

            - `UNORDERED`: Text is an unordered list (bulleted).'
        lineIndentations:
          type: array
          items:
            type: number
          description: An array with the same number of elements as lines in the text node, where lines
            are delimited by newline or paragraph separator characters. Each element in the array corresponds
            to the indentation level of a specific line.
      required:
      - characters
      - style
      - characterStyleOverrides
      - styleOverrideTable
      - lineTypes
      - lineIndentations
    TypeStyle:
      allOf:
      - type: object
        description: Metadata for character formatting.
        properties:
          paragraphSpacing:
            type: number
            description: Space between paragraphs in px, 0 if not present.
            default: 0
          paragraphIndent:
            type: number
            description: Paragraph indentation in px, 0 if not present.
            default: 0
          listSpacing:
            type: number
            description: Space between list items in px, 0 if not present.
            default: 0
          textDecoration:
            type: string
            description: Text decoration applied to the node, default is none.
            enum:
            - NONE
            - STRIKETHROUGH
            - UNDERLINE
            default: NONE
          textAutoResize:
            type: string
            description: Dimensions along which text will auto resize, default is that the text does not
              auto-resize. TRUNCATE means that the text will be shortened and trailing text will be replaced
              with "…" if the text contents is larger than the bounds. `TRUNCATE` as a return value is
              deprecated and will be removed in a future version. Read from `textTruncation` instead.
            enum:
            - NONE
            - WIDTH_AND_HEIGHT
            - HEIGHT
            - TRUNCATE
            default: NONE
          textTruncation:
            type: string
            description: Whether this text node will truncate with an ellipsis when the text contents
              is larger than the text node.
            enum:
            - DISABLED
            - ENDING
            default: DISABLED
          maxLines:
            type: number
            description: 'When `textTruncation: "ENDING"` is set, `maxLines` determines how many lines
              a text node can grow to before it truncates.'
          lineHeightPx:
            type: number
            description: Line height in px.
          lineHeightPercent:
            type: number
            default: 100
            description: Line height as a percentage of normal line height. This is deprecated; in a future
              version of the API only lineHeightPx and lineHeightPercentFontSize will be returned.
          lineHeightPercentFontSize:
            type: number
            description: Line height as a percentage of the font size. Only returned when `lineHeightPercent`
              (deprecated) is not 100.
          lineHeightUnit:
            type: string
            description: The unit of the line height value specified by the user.
            enum:
            - PIXELS
            - FONT_SIZE_%
            - INTRINSIC_%
          isOverrideOverTextStyle:
            type: boolean
            description: Whether or not this style has overrides over a text style. The possible fields
              to override are semanticWeight, semanticItalic, hyperlink, and textDecoration. If this is
              true, then those fields are overrides if present.
          boundVariables:
            type: object
            description: The variables bound to a particular field on this style
            properties:
              fontFamily:
                $ref: '#/components/schemas/VariableAlias'
              fontSize:
                $ref: '#/components/schemas/VariableAlias'
              fontStyle:
                $ref: '#/components/schemas/VariableAlias'
              fontWeight:
                $ref: '#/components/schemas/VariableAlias'
              letterSpacing:
                $ref: '#/components/schemas/VariableAlias'
              lineHeight:
                $ref: '#/components/schemas/VariableAlias'
              paragraphSpacing:
                $ref: '#/components/schemas/VariableAlias'
              paragraphIndent:
                $ref: '#/components/schemas/VariableAlias'
      - $ref: '#/components/schemas/BaseTypeStyle'
    UpdateMediaRuntimeAction:
      type: object
      description: An action that affects a video node in the Figma viewer. For example, to play, pause,
        or skip.
      oneOf:
      - type: object
        description: "An action that updates the runtime of a media node by playing, pausing, toggling\
          \ play/pause, \nmuting, unmuting, or toggling mute/unmute.\n\nThe `destinationId` is the node\
          \ ID of the media node to update. If `destinationId` is `null`, the action will \nupdate the\
          \ media node that contains the action.\n\nThe `mediaAction` is the action to perform on the\
          \ media node."
        properties:
          type:
            type: string
            enum:
            - UPDATE_MEDIA_RUNTIME
          destinationId:
            type:
            - string
            - 'null'
          mediaAction:
            type: string
            enum:
            - PLAY
            - PAUSE
            - TOGGLE_PLAY_PAUSE
            - MUTE
            - UNMUTE
            - TOGGLE_MUTE_UNMUTE
        required:
        - type
        - destinationId
        - mediaAction
      - type: object
        description: "An action that updates the runtime of a media node by skipping forward or backward.\n\
          \nThe `destinationId` is the node ID of the media node to update. If `destinationId` is `null`,\
          \ the action will \nupdate the media node that contains the action.\n\nThe `mediaAction` is\
          \ the action to perform on the media node.\n\nThe `amountToSkip` is the amount of time to skip\
          \ in seconds."
        properties:
          type:
            type: string
            enum:
            - UPDATE_MEDIA_RUNTIME
          destinationId:
            type:
            - string
            - 'null'
          mediaAction:
            type: string
            enum:
            - SKIP_FORWARD
            - SKIP_BACKWARD
          amountToSkip:
            type: number
        required:
        - type
        - mediaAction
        - amountToSkip
      - type: object
        description: "An action that updates the runtime of a media node by skipping to a specific time.\n\
          \nThe `destinationId` is the node ID of the media node to update. If `destinationId` is `null`,\
          \ the action will \nupdate the media node that contains the action.\n\nThe `mediaAction` is\
          \ the action to perform on the media node.\n\nThe `newTimestamp` is the new time to skip to\
          \ in seconds."
        properties:
          type:
            type: string
            enum:
            - UPDATE_MEDIA_RUNTIME
          destinationId:
            type:
            - string
            - 'null'
          mediaAction:
            type: string
            enum:
            - SKIP_TO
          newTimestamp:
            type: number
        required:
        - type
        - mediaAction
        - newTimestamp
    User:
      type: object
      description: A description of a user.
      properties:
        id:
          type: string
          description: Unique stable id of the user.
        handle:
          type: string
          description: Name of the user.
        img_url:
          type: string
          description: URL link to the user's profile image.
      required:
      - id
      - handle
      - img_url
    VariableAlias:
      type: object
      description: Contains a variable alias
      properties:
        type:
          type: string
          enum:
          - VARIABLE_ALIAS
        id:
          type: string
          description: The id of the variable that the current variable is aliased to. This variable can
            be a local or remote variable, and both can be retrieved via the GET /v1/files/:file_key/variables/local
            endpoint.
      required:
      - type
      - id
    VariableData:
      type: object
      description: A value to set a variable to during prototyping.
      properties:
        type:
          $ref: '#/components/schemas/VariableDataType'
        resolvedType:
          $ref: '#/components/schemas/VariableResolvedDataType'
        value:
          oneOf:
          - type: boolean
          - type: number
          - type: string
          - $ref: '#/components/schemas/RGB'
          - $ref: '#/components/schemas/RGBA'
          - $ref: '#/components/schemas/VariableAlias'
          - $ref: '#/components/schemas/Expression'
    VariableDataType:
      type: string
      description: Defines the types of data a VariableData object can hold
      enum:
      - BOOLEAN
      - FLOAT
      - STRING
      - COLOR
      - VARIABLE_ALIAS
      - EXPRESSION
    VariableResolvedDataType:
      type: string
      description: Defines the types of data a VariableData object can eventually equal
      enum:
      - BOOLEAN
      - FLOAT
      - STRING
      - COLOR
    VariableWidthStrokesTrait:
      type: object
      properties: {}
    Vector:
      type: object
      description: A 2d vector.
      properties:
        x:
          type: number
          description: X coordinate of the vector.
        y:
          type: number
          description: Y coordinate of the vector.
      required:
      - x
      - y
    VectorNode:
      allOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - VECTOR
            description: The type of this node, represented by the string literal "VECTOR"
        required:
        - type
      - $ref: '#/components/schemas/CornerRadiusShapeTraits'
      - $ref: '#/components/schemas/AnnotationsTrait'
    WashiTapeNode:
      allOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - WASHI_TAPE
            description: The type of this node, represented by the string literal "WASHI_TAPE"
        required:
        - type
      - $ref: '#/components/schemas/DefaultShapeTraits'
    WebhookV2:
      type: object
      description: A description of an HTTP webhook (from Figma back to your application)
      properties:
        id:
          type: string
          description: The ID of the webhook
        event_type:
          $ref: '#/components/schemas/WebhookV2Event'
          description: The event this webhook triggers on
        team_id:
          type: string
          description: The team id you are subscribed to for updates. This is deprecated, use context
            and context_id instead
          deprecated: true
        context:
          type: string
          description: The type of context this webhook is attached to. The value will be "PROJECT", "TEAM",
            or "FILE"
        context_id:
          type: string
          description: The ID of the context this webhook is attached to
        plan_api_id:
          type: string
          description: The plan API ID of the team or organization where this webhook was created
        status:
          $ref: '#/components/schemas/WebhookV2Status'
          description: The current status of the webhook
        client_id:
          type:
          - string
          - 'null'
          description: The client ID of the OAuth application that registered this webhook, if any
        passcode:
          type: string
          description: The passcode that will be passed back to the webhook endpoint. For security, when
            using the GET endpoints, the value is an empty string
        endpoint:
          type: string
          description: The endpoint that will be hit when the webhook is triggered
        description:
          type:
          - string
          - 'null'
          description: Optional user-provided description or name for the webhook. This is provided to
            help make maintaining a number of webhooks more convenient. Max length 140 characters.
      required:
      - id
      - event_type
      - team_id
      - context
      - context_id
      - plan_api_id
      - status
      - client_id
      - passcode
      - endpoint
      - description
    WebhookV2Event:
      type: string
      description: An enum representing the possible events that a webhook can subscribe to
      enum:
      - PING
      - FILE_UPDATE
      - FILE_VERSION_UPDATE
      - FILE_DELETE
      - LIBRARY_PUBLISH
      - FILE_COMMENT
      - DEV_MODE_STATUS_UPDATE
    WebhookV2Request:
      type: object
      description: Information regarding the most recent interactions sent to a webhook endpoint
      properties:
        webhook_id:
          type: string
          description: The ID of the webhook the requests were sent to
        request_info:
          $ref: '#/components/schemas/WebhookV2RequestInfo'
        response_info:
          $ref: '#/components/schemas/WebhookV2ResponseInfo'
        error_msg:
          type:
          - string
          - 'null'
          description: Error message for this request. NULL if no error occurred
      required:
      - webhook_id
      - request_info
      - response_info
      - error_msg
    WebhookV2RequestInfo:
      type: object
      description: Information regarding the request sent to a webhook endpoint
      properties:
        id:
          type: string
          description: The ID of the webhook
        endpoint:
          type: string
          description: The actual endpoint the request was sent to
        payload:
          type: object
          description: The contents of the request that was sent to the endpoint
        sent_at:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp of when the request was sent
      required:
      - id
      - endpoint
      - payload
      - sent_at
    WebhookV2ResponseInfo:
      type:
      - object
      - 'null'
      description: Information regarding the reply sent back from a webhook endpoint
      properties:
        status:
          type: string
          description: HTTP status code of the response
        received_at:
          type: string
          format: date-time
          description: UTC ISO 8601 timestamp of when the response was received
      required:
      - status
      - received_at
    WebhookV2Status:
      type: string
      description: 'An enum representing the possible statuses you can set a webhook to:

        - `ACTIVE`: The webhook is healthy and receive all events

        - `PAUSED`: The webhook is paused and will not receive any events'
      enum:
      - ACTIVE
      - PAUSED
    WidgetNode:
      allOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - WIDGET
            description: The type of this node, represented by the string literal "WIDGET"
        required:
        - type
      - $ref: '#/components/schemas/IsLayerTrait'
      - $ref: '#/components/schemas/HasExportSettingsTrait'
      - $ref: '#/components/schemas/HasChildrenTrait'
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://www.figma.com/oauth
          tokenUrl: https://api.figma.com/v1/oauth/token
          refreshUrl: https://api.figma.com/v1/oauth/refresh
          scopes:
            current_user:read: Read your name, email, and profile image.
            file_comments:read: Read the comments for files.
            file_comments:write: Post and delete comments and comment reactions in files.
            file_content:read: Read the contents of files, such as nodes and the editor type.
            file_dev_resources:read: Read dev resources in files.
            file_dev_resources:write: Write to dev resources in files.
            file_metadata:read: Read metadata of files.
            file_variables:read: 'Read variables in Figma file. Note: this is only available to members
              in Enterprise organizations.'
            file_variables:write: 'Write to variables in Figma file. Note: this is only available to members
              in Enterprise organizations.'
            file_versions:read: Read the version history for files you can access.
            files:read: Deprecated. Read files, projects, users, versions, comments, components & styles,
              and webhooks.
            library_analytics:read: Read library analytics data.
            library_assets:read: Read data of individual published components and styles.
            library_content:read: Read published components and styles of files.
            project_metadata:read: Read metadata of projects.
            projects:read: List projects and files in projects.
            folders:read: List folders and files in folders.
            folder_metadata:read: Read metadata of folders.
            team_library_content:read: Read published components and styles of teams.
            webhooks:read: Read metadata of webhooks.
            webhooks:write: Create and manage webhooks.
    PersonalAccessToken:
      type: apiKey
      name: X-Figma-Token
      in: header
    PlanAccessToken:
      type: apiKey
      name: X-Figma-Token
      in: header
