# HubSpot Platform - Fenestra Specification
fenestra: "1.0.0"
platform:
  name: HubSpot
  description: All varieties of available HubSpot UI extensibility, from their CRM UI extensions to their webhooks, timeline events, workflow steps, and marketing site templates
  version: "v3"
  baseUrl: "https://api.hubapi.com"
  documentation: "https://developers.hubspot.com"
  marketplace: "https://ecosystem.hubspot.com/marketplace"
  support: "https://developers.hubspot.com/community"

extensionTypes:
  crm-card:
    name: CRM Cards
    description: Custom cards displayed on contact, company, deal, and ticket records providing additional context and actions
    contexts: 
      - contact-record
      - company-record 
      - deal-record
      - ticket-record
      - custom-object-record
    rendering: 
      - iframe
      - react-component
      - serverless-function
    communication: 
      - http-api
      - serverless-functions
      - webhooks
    capabilities: 
      - crm-data-access
      - timeline-events
      - property-updates
      - file-attachments
    triggers: 
      - record-view
      - property-change
      - tab-activation
    examples:
      - name: LinkedIn Profile Card
        description: Shows LinkedIn profile data and mutual connections
        renderingMode: react-component
        apiEndpoint: "https://api.example.com/hubspot/linkedin-card"
      - name: Support Ticket History
        description: Displays related support tickets from external system
        renderingMode: iframe
        
  timeline-event:
    name: Timeline Events
    description: Custom events displayed on CRM record timelines to show interaction history
    contexts: 
      - contact-timeline
      - company-timeline
      - deal-timeline
      - ticket-timeline
    rendering: 
      - event-template
      - custom-html
      - markdown
    communication: 
      - timeline-api
      - webhooks
      - batch-api
    capabilities: 
      - timeline-write
      - event-creation
      - custom-properties
      - event-associations
    triggers: 
      - api-call
      - webhook-event
      - scheduled-task
    examples:
      - name: Meeting Notes
        description: Automatically creates timeline events from meeting transcripts
        eventType: "meeting_notes"
        
  workflow-action:
    name: Workflow Actions
    description: Custom actions that can be used in HubSpot workflows for automation
    contexts: 
      - workflows
      - sequences
      - lists
    rendering: 
      - serverless-function
      - webhook-endpoint
    communication: 
      - webhook-callback
      - platform-api
      - batch-processing
    capabilities: 
      - workflow-execution
      - data-manipulation
      - external-api-calls
      - conditional-logic
    triggers: 
      - workflow-step
      - property-trigger
      - enrollment-trigger
    examples:
      - name: Lead Scoring
        description: Calculate custom lead scores based on external data
        functionType: "data_enrichment"
        
  ui-extension:
    name: UI Extensions
    description: Custom React components for settings pages and configuration panels
    contexts: 
      - settings-page
      - configuration-panel
      - property-settings
      - app-configuration
    rendering: 
      - react-component
      - vue-component
      - angular-component
    communication: 
      - platform-api
      - local-storage
      - session-storage
    capabilities: 
      - settings-management
      - user-preferences
      - configuration-persistence
      - validation-rules
    triggers: 
      - page-load
      - user-navigation
      - settings-change
    examples:
      - name: Integration Settings
        description: Configuration panel for third-party integrations
        framework: "react"
        
  website-template:
    name: Website Templates
    description: Custom templates for HubSpot CMS including pages, emails, and modules
    contexts: 
      - cms-pages
      - landing-pages
      - email-templates
      - blog-templates
      - custom-modules
    rendering: 
      - hubl-template
      - html-css
      - drag-drop-module
    communication: 
      - cms-api
      - content-delivery
      - personalization-tokens
    capabilities: 
      - content-management
      - seo-optimization
      - personalization
      - responsive-design
    triggers: 
      - page-request
      - content-publish
      - template-selection
    examples:
      - name: Product Showcase
        description: Dynamic product display module with filtering
        moduleType: "custom_module"
        
  calling-extension:
    name: Calling Extensions
    description: Custom calling experiences within HubSpot's calling tool
    contexts: 
      - calling-widget
      - call-interface
      - post-call-workflow
    rendering: 
      - iframe
      - sdk-integration
    communication: 
      - calling-sdk
      - call-events
      - recording-api
    capabilities: 
      - call-control
      - recording-access
      - call-logging
      - screen-sharing
    triggers: 
      - call-initiation
      - call-events
      - post-call-actions
    examples:
      - name: Custom Dialer
        description: Integration with third-party calling service
        sdkType: "calling_extensions"
        
  reporting-extension:
    name: Reporting Extensions
    description: Custom reports and analytics dashboards
    contexts: 
      - reports-dashboard
      - analytics-view
      - custom-reports
    rendering: 
      - chart-library
      - data-visualization
      - table-component
    communication: 
      - analytics-api
      - data-export
      - real-time-updates
    capabilities: 
      - custom-metrics
      - data-aggregation
      - export-functionality
      - scheduled-reports
    triggers: 
      - report-generation
      - data-refresh
      - user-interaction
    examples:
      - name: ROI Dashboard
        description: Custom ROI tracking across marketing campaigns
        chartLibrary: "d3js"

communication:
  http-api:
    description: RESTful API endpoints for CRM operations
    baseUrl: "https://api.hubapi.com"
    authentication: 
      - oauth2
      - api-key
    rateLimit: "100 requests per 10 seconds"
    versioning: "v3"
    
  serverless-functions:
    description: AWS Lambda-style functions for custom logic
    runtime: 
      - nodejs14
      - nodejs16
      - python39
    triggers: 
      - webhook
      - scheduled
      - api-call
      - workflow-action
    timeout: "30 seconds"
    memoryLimit: "128MB"
    
  webhooks:
    description: Event-driven HTTP callbacks for real-time notifications
    events: 
      - contact.creation
      - contact.propertyChange
      - deal.update
      - company.creation
      - workflow.completion
      - email.opened
      - form.submission
    security: 
      - hmac-signature
      - ip-whitelist
    retryPolicy: "exponential-backoff"
    
  timeline-api:
    description: API for creating and managing timeline events
    baseUrl: "https://api.hubapi.com/crm/v3/timeline"
    authentication: 
      - oauth2
    capabilities:
      - event-creation
      - event-templates
      - custom-properties
      - bulk-operations

authentication:
  oauth2:
    authorizationUrl: "https://app.hubspot.com/oauth/authorize"
    tokenUrl: "https://api.hubapi.com/oauth/v1/token"
    refreshUrl: "https://api.hubapi.com/oauth/v1/token"
    scopes:
      - crm.objects.contacts.read
      - crm.objects.contacts.write
      - crm.objects.companies.read
      - crm.objects.companies.write
      - crm.objects.deals.read
      - crm.objects.deals.write
      - timeline
      - oauth
      - settings.users.write
      - automation
    flow: "authorization_code"
    
  api-key:
    description: "Deprecated - use private apps instead"
    location: "header"
    parameter: "authorization"
    format: "Bearer {token}"
    
  private-app:
    description: "Recommended authentication method for server-to-server"
    location: "header" 
    parameter: "authorization"
    format: "Bearer {token}"
    scopes: "configurable"

deployment:
  marketplace:
    name: "HubSpot App Marketplace"
    url: "https://ecosystem.hubspot.com/marketplace"
    reviewProcess: true
    categories:
      - sales
      - marketing
      - service
      - operations
      - productivity
    pricingModels:
      - free
      - freemium
      - subscription
      - one-time
    
  private-app:
    name: "Private Apps"
    url: "https://developers.hubspot.com/docs/api/private-apps"
    selfService: true
    scope: "account-specific"
    installation: "admin-only"
    
  public-app:
    name: "Public Apps"
    distribution: "multi-account"
    oauthRequired: true
    marketplaceApproval: true

sdks:
  javascript:
    name: "HubSpot JavaScript SDK"
    url: "https://www.npmjs.com/package/@hubspot/api-client"
    languages: 
      - javascript
      - typescript
    features:
      - api-client
      - type-definitions
      - error-handling
    
  ui-extensions:
    name: "HubSpot UI Extensions SDK"
    url: "https://github.com/HubSpot/ui-extensions-examples"
    frameworks:
      - react
      - vue
      - angular
    features:
      - component-library
      - development-tools
      - testing-utilities
    
  calling-extensions:
    name: "HubSpot Calling Extensions SDK"
    url: "https://github.com/HubSpot/calling-extensions-sdk"
    capabilities:
      - call-control
      - recording-management
      - event-handling
    
  cli:
    name: "HubSpot CLI"
    url: "https://www.npmjs.com/package/@hubspot/cli"
    commands:
      - project-creation
      - file-upload
      - log-streaming
      - function-deployment
    
  cms-cli:
    name: "HubSpot CMS CLI"
    url: "https://designers.hubspot.com/docs/tools/local-development"
    capabilities:
      - theme-development
      - template-creation
      - asset-management

examples:
  crm-card-example:
    name: "Customer Health Score Card"
    description: "Displays customer health metrics on company records"
    type: "crm-card"
    implementation:
      framework: "react"
      apiEndpoint: "https://api.example.com/health-score"
      dataSourceType: "external-api"
    
  workflow-action-example:
    name: "Slack Notification Action"
    description: "Sends Slack notifications when deals reach certain stages"
    type: "workflow-action"
    implementation:
      runtime: "serverless-function"
      triggerType: "property-change"
      externalIntegration: "slack-api"

tags:
  - crm
  - marketing-automation
  - sales-enablement
  - customer-service
  - content-management
  - analytics
  - integrations

x-hubspot-api-version: "v3"
x-hubspot-environment: "production"
x-hubspot-supported-portals: "all"