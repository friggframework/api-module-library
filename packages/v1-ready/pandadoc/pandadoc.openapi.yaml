    DocumentUpdateRequestField:
      type: object
      description: 'Set specific values to the fields. This object maps merge field names to their corresponding
        values.


        Each key represents a merge field name, and each value is an object containing the data to populate
        that field with. The structure allows you to pre-populate various field types including text inputs,
        checkboxes, dropdowns, and date fields.


        **Key Points:**

        - Keys must match the exact merge field names from your template or file.

        - Values must be wrapped in an object with a `value` property.

        - Supported value types: string, number, boolean.

        - Date fields should use RFC 3339 format (e.g., ''2019-12-31T00:00:00.000Z'').

        - Signature fields cannot be pre-filled.


        **Example Usage:**

        - Text field: `"CustomerName": {"value": "John Doe"}`

        - Checkbox: `"AgreeToTerms": {"value": true}`

        - Date field: `"DeliveryDate": {"value": "2019-12-31T00:00:00.000Z"}`

        '
      example:
        Like:
          value: true
        Delivery:
          value: Same Day Delivery
        Date:
          value: '2019-12-31T00:00:00.000Z'
      additionalProperties:
        type: object
        properties:
          value:
            description: 'The value to pre-fill the field with. The type of the value depends on the field
              type in the template.

              For example, for a checkbox field, you can pass a boolean value, and for a date field, you
              can pass a date string in RFC 3339 format (e.g., 2019-12-31T00:00:00.000Z).

              '
            oneOf:
            - type: boolean
            - type: string
            - type: number
        required:
        - value
