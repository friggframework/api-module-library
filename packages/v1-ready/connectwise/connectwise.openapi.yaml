        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Callbacks]
      operationId: createCallback
      summary: Create a system callback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Callback" }
      responses:
        "200":
          description: Created callback (shape UNVERIFIED)
          content:
