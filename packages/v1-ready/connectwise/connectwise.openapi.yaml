  /{codebase}apis/3.0/procurement/catalog:
    parameters: *commonParameters
    get:
      tags: [Procurement]
      operationId: listCatalogItems
      summary: List catalog items
      parameters:
        - $ref: "#/components/parameters/ConditionsQuery"
      responses:
        "200":
          description: Catalog list (shape UNVERIFIED)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Procurement]
      operationId: createCatalogItem
      summary: Create a catalog item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogItemCreate" }
      responses:
        "200":
          description: Created catalog item (shape UNVERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/procurement/types:
    parameters: *commonParameters
    get:
      tags: [Procurement]
      operationId: listProductTypes
      summary: List product types
      parameters:
        - $ref: "#/components/parameters/ConditionsQuery"
      responses:
        "200":
          description: Product type list (shape UNVERIFIED)
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Procurement]
      operationId: createProductType
      summary: Create a product type
      requestBody:
        required: true
