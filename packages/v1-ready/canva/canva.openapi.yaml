  /v1/oauth/token:
    post:
      description: 'This endpoint implements the OAuth 2.0 `token` endpoint, as part of the Authorization
        Code flow with Proof Key for Code Exchange (PKCE). For more information, see [Authentication](https://www.canva.dev/docs/apps/rest-apis/authentication/).


        To generate an access token, you must provide one of the following:


        - An authorization code

        - A refresh token


        Generating a token using either an authorization code or a refresh token allows your app to act
        on behalf of a user. You must first [obtain user authorization and get an authorization code](https://www.canva.dev/docs/apps/rest-apis/authentication/#obtain-user-authorization).


        Access tokens may be up to 4 KB in size, and are only valid for a specified period of time. The
        expiry time (currently 4 hours) is shown in the endpoint response and is subject to change.


        **Endpoint authentication**


        Requests to this endpoint require authentication with your client ID and client secret, using
        _one_ of the following methods:


        - **Basic access authentication** (Recommended): For [basic access authentication](https://en.wikipedia.org/wiki/Basic_access_authentication),
        the `{credentials}` string must be a Base64 encoded value of `{client id}:{client secret}`.

        - **Body parameters**: Provide your app''s credentials using the `client_id` and `client_secret`
        body parameters.


        This endpoint can''t be called from a user''s web-browser client because it uses client authentication
        with client secrets. Requests must come from your app''s backend, otherwise they''ll be blocked
        by Canva''s [Cross-Origin Resource Sharing (CORS)](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS)
        policy.


        **Generate an access token using an authorization code**


        To generate an access token with an authorization code, you must:


        - Set `grant_type` to `authorization_code`.

        - Provide the `code_verifier` value that you generated when creating the user authorization URL.

        - Provide the authorization code you received after the user authorized the app.


        **Generate an access token using a refresh token**


        Using the `refresh_token` value from a previous user token request, you can get a new access token
        with the same or smaller scope as the previous one, but with a refreshed expiry time. You will
        also receive a new refresh token that you can use to refresh the access token again.


        To refresh an existing access token, you must:


        - Set `grant_type` to `refresh_token`.

        - Provide the `refresh_token` from a previous token request.'
      operationId: exchangeAccessToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExchangeAccessTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeAccessTokenResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                client_id_body_param_multiple_values:
                  $ref: '#/components/examples/ClientIdBodyParamMultipleValues'
                client_id_body_param_blank:
                  $ref: '#/components/examples/ClientIdBodyParamBlank'
                client_secret_body_param_multiple_values:
                  $ref: '#/components/examples/ClientSecretBodyParamMultipleValues'
                client_id_basic_auth_param_blank:
                  $ref: '#/components/examples/ClientIdBasicAuthParamBlank'
                secret_basic_auth_param_blank:
                  $ref: '#/components/examples/SecretBasicAuthParamBlank'
                bad_request_body_too_large:
                  $ref: '#/components/examples/BadRequestBodyTooLarge'
                invalid_refresh_token:
                  $ref: '#/components/examples/InvalidRefreshToken'
                unauthorized_client:
                  $ref: '#/components/examples/UnauthorizedClientError'
                token_exchange_invalid_request:
                  $ref: '#/components/examples/TokenExchangeInvalidRequest'
                token_exchange_invalid_grant:
                  $ref: '#/components/examples/TokenExchangeInvalidGrant'
                token_exchange_unauthorized_client:
                  $ref: '#/components/examples/TokenExchangeUnauthorizedClient'
                token_exchange_unsupported_grant_type:
                  $ref: '#/components/examples/TokenExchangeUnsupportedGrantType'
                token_exchange_invalid_scope:
                  $ref: '#/components/examples/TokenExchangeInvalidScope'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '401':
          content:
            application/json:
              examples:
                client_secret_invalid:
                  $ref: '#/components/examples/ClientSecretInvalid'
                access_token_missing:
                  $ref: '#/components/examples/AccessTokenMissing'
                token_exchange_invalid_client:
                  $ref: '#/components/examples/TokenExchangeInvalidClient'
                token_exchange_unauthorized_user:
                  $ref: '#/components/examples/TokenExchangeUnauthorizedUser'
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        '429':
          content:
            application/json:
              examples:
                too_many_token_exchange_requests:
                  $ref: '#/components/examples/TooManyTokenExchangeRequests'
              schema:
                $ref: '#/components/schemas/Error'
          description: Too Many Requests
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
          description: Error Response
      security:
      - {}
      - basicAuth: []
      tags:
      - oauth
  /v1/oauth/introspect:
    post:
      description: 'Introspect an access token to see whether it is valid and active. You can also verify
        some token properties, such as its claims, scopes, and validity times.


        Requests to this endpoint require authentication with your client ID and client secret, using
        _one_ of the following methods:


        - **Basic access authentication** (Recommended): For [basic access authentication](https://en.wikipedia.org/wiki/Basic_access_authentication),
        the `{credentials}` string must be a Base64 encoded value of `{client id}:{client secret}`.

