      description: '## Available Template Statuses


        The following is a complete list of all possible template statuses returned:


        | Template Status      | Status Description                                                                                                                      |

        | :------------------- | :--------------------------------------------------------------------------------------------------------------------------------------
        |

        | `template.UPLOADED`  | The template upload process has been initiated and is currently in progress.
        It will soon transition to the `template.PROCESSED` state. |

        | `template.PROCESSED` | The template has been successfully uploaded and created. At this stage,
        all aspects of the template are editable.                       |

        | `template.ERROR`     | The template upload process has failed. Please refer to the error details
        in the response for more information.                         |

        '
      operationId: statusTemplate
