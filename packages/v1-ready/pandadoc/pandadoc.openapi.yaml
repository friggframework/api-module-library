  /public/v1/documents/{id}/send:
    post:
      tags:
      - Documents
      summary: Send Document
      operationId: sendDocument
      description: "> \U0001F6A7 Using the Sandbox Key\n> \n> When you use a [sandbox API key](https://developers.pandadoc.com/reference/sandbox-key)\
        \ during the free trial period, the sender and recipient email addresses must be from the same\
        \ organisation (email domain).\n\n## Document State\n\n- You can only send a document in the `document.draft`\
        \ status.\n- After creating a new document, it usually retains a `document.uploaded` status for\
        \ 3-5 seconds while the document syncs across PandaDoc servers. When the document is available\
        \ for further API calls, it moves to the `document.draft` state. Use [Document Status](/reference/document-status)\
        \ or [Webhooks](/reference/on-document-status-change) to check document status.\n- Moving a document\
        \ to the `document.sent` status finalizes the document structure, before recipients can complete\
        \ it.\n- If a template used for the document creation has an approval workflow turned on, the\
        \ sent document moves to the `document.waiting_approval` status. Once the document is approved,\
        \ you need to make the call again to move the document to `document.sent` status.\n\n## Send and\
        \ Silence Notifications\n\n- By default, PandaDoc sends a notification email to the recipient,\
        \ as well as notifications the sender has configured. You may disable all notifications for recipients\
        \ by passing `silent: true`. This is useful when you are using alternative delivery methods such\
        \ as linking to the document or embedding the document.\n- The `silent: true` parameter disables\
        \ sent, viewed, comment and completed document email notifications. \"Document Approval\" notification\
        \ won't be affected by this parameter.\n- If you pass `silent: false`, the document is going to\
        \ be delivered by email and/or SMS. \n\n![Example email. Branding can be changed in workspace\
        \ settings](https://files.readme.io/cc5a03e-email2.png)\n\n## Select Approver from Group\n\nIf\
        \ you have previously set up an approval workflow with selectable groups on the UI, you can select\
        \ a particular approver from this group. Learn more about [selectable groups](https://support.pandadoc.com/en/articles/9714799-approval-workflow#h_01H4GNY5GSGG38BPYY46XV7GB4).\
        \  \nTo set an approver, we recommend to follow these steps:\n\n1. Run the [Document Details](https://developers.pandadoc.com/reference/document-details)\
        \ request.\n2. Copy the `steps` part from the `approval_execution` section of the response into\
        \ the `selected_approvers` field of the Send Document payload.\n3. Modify your payload according\
        \ to business needs: set `is_selected` to true for one approver.\n\n> \U0001F4D8 **Note**: You\
        \ can change the selected approver only if you revert your document back to the `document.draft`\
        \ status.\n"
      parameters:
      - name: id
        description: Document ID
        in: path
        schema:
          type: string
        required: true
        example: ZPeAfcpzr9aiVs5vqUf6jg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSendRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentSendResponse'
              examples:
                default:
                  value:
                    id: qhHUDZkpyTwqoxjfsJdeVP
                    name: Purchase Order
                    status: document.sent
                    date_created: '2026-07-31T12:34:39.545645Z'
                    date_modified: '2026-07-31T12:38:15.189891Z'
