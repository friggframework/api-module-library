            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRecordResponse'

  /api/now/attachment:
    get:
      tags: [Attachment]
      operationId: listAttachments
      summary: List attachment metadata
