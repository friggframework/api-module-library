      type: string
      x-enum-descriptions:
      - Capability required to call the Design analytics APIs. Users that are members of a [Canva Enterprise](https://www.canva.com/enterprise/)
        organization have this capability.
      - Capability required to call autofill APIs. Users on a Canva plan with access to autofill (such
        as Canva Pro, Canva Teams, or Canva Enterprise) have this capability.
      - Capability required to apply the `background_removal` transformation using the Image transformation
        APIs. Users on a Canva plan with premium features (such as Canva Pro) have this capability.
      - Capability required to use brand template APIs. Users on a Canva plan with access to brand templates
        (such as Canva Pro, Canva Teams, or Canva Enterprise) have this capability.
      - Capability required to call the Design Generation APIs. Users whose feature eligibility and team
        permissions allow design generation have this capability.
      - Capability required to export designs in PNG with a transparent background. Users on a paid Canva
        plan (such as Canva Pro) have this capability.
      - Capability required to call the Image to Design Import APIs. Users whose [team permission settings](https://www.canva.com/en_au/help/setting-up-team-permissions/)
        allow "[Magic Layers](https://www.canva.com/magic-layers/)" have this capability.
      - Capability required to create design resize jobs. Users on a Canva plan with premium features
        (such as Canva Pro) have this capability.
      - Capability required to create a team-restricted app. Users that are members of the [Canva Enterprise](https://www.canva.com/enterprise/)
        or the [Canva for Education](https://www.canva.com/education/) organization have this capability.
