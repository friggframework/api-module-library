        '429':
          $ref: '#/components/responses/429'
    patch:
      tags:
      - Templates
      summary: Template Update
      operationId: updateTemplate
      description: "Update a template. Currently supports updating template variables (`tokens`) and managing\
        \ template roles.\n\n> \U0001F6A7 Template status\n> \n> You can only update a template in the\
        \ PROCESSED status (`template.PROCESSED`). \n> \n> After creating a new template, it usually retains\
        \ a `template.uploaded` status for 3-5 seconds while the template syncs across PandaDoc servers.\
        \ When the template is available for further API calls, the template moves to the `template.PROCESSED`\
        \ state. Use [Template Status](https://developers.pandadoc.com/reference/template-status) or Webhooks\
        \ to check template status.\n\n## Managing template roles\n\nPass a `roles` array to replace the\
        \ full set of template roles in a single request:\n\n  - Items with an existing `id` update that\
        \ role (`name`, `signing_order`).\n  - Items without an `id` create a new role.\n  - Existing\
        \ roles whose `id` is not in the array are deleted.\n\nRole names must be unique within a template.\
        \ Preassigned contacts and contact groups attached to roles in the template editor are preserved\
        \ on updates and removed together with their role on deletion — they are not managed by this endpoint.\n"
      parameters:
      - examples:
          Update template:
            value: BhVzRcxH9Z2LgfPPGXFUBa
        name: id
        description: Template ID
        in: path
        schema:
          type: string
        required: true
      requestBody:
        description: Partial template update. All fields are optional.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUpdateRequest'
            examples:
              Update variables:
                summary: Update template variables
                value:
                  tokens:
                  - name: Favorite.Pet
                    value: Panda
              Batch update template roles:
                summary: Batch update template roles (rename one, add a new one, delete the rest)
                value:
                  roles:
                  - id: BqL3PVsB2tPLfaSqUiQQRf
                    name: Client
                    signing_order: 1
                  - name: Manager
                    signing_order: 2
              Update variables and roles together:
                summary: Update variables and batch update roles in a single request
                value:
                  tokens:
                  - name: Favorite.Pet
                    value: Panda
                  roles:
                  - name: Client
                    signing_order: 1
                  - name: Manager
                    signing_order: 2
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/400RequestError'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
