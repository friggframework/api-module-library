    ComponentPropertyDefinition:
      type: object
      description: A property of a component.
      properties:
        type:
          $ref: '#/components/schemas/ComponentPropertyType'
          description: Type of this component property.
        defaultValue:
          oneOf:
          - type: boolean
          - type: string
          - $ref: '#/components/schemas/SlotContentId'
