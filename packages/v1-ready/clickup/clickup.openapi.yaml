                                    type: integer
                                  username:
                                    type: string
                                  email:
                                    type: string
                                  color:
                                    type: string
                                  profilePicture:
                                    type: string
                                  initials:
                                    type: string
                                  week_start_day:
                                    type: integer
                                    description: The user's preferred start of the calendar week setting. \ `0` is Sunday.
