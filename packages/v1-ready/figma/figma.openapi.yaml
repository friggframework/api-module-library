        strokeWeight:
          type: number
          description: The weight of strokes on the node.
          default: 1
        strokeAlign:
          type: string
          description: 'Position of stroke relative to vector outline, as a string enum


            - `INSIDE`: stroke drawn inside the shape boundary

            - `OUTSIDE`: stroke drawn outside the shape boundary

            - `CENTER`: stroke drawn centered along the shape boundary'
          enum:
          - INSIDE
          - OUTSIDE
          - CENTER
        strokeJoin:
          type: string
          description: A string enum with value of "MITER", "BEVEL", or "ROUND", describing how corners
            in vector paths are rendered.
          enum:
          - MITER
          - BEVEL
          - ROUND
          default: MITER
        strokeDashes:
          type: array
          items:
            type: number
          description: 'An array of floating point numbers describing the pattern of dash length and gap
            lengths that the vector stroke will use when drawn.


            For example a value of [1, 2] indicates that the stroke will be drawn with a dash of length
            1 followed by a gap of length 2, repeated.'
    MonotoneNoiseEffect:
