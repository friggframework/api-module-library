  /cards:
    post:
      tags:
      - Cards
      operationId: createCard
      summary: Create a new Card
      description: 'Official operationId: post-cards.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized
      parameters:
      - name: name
        in: query
        description: The name for the card
        schema:
          type: string
      - name: desc
        in: query
        description: The description for the card
        schema:
          type: string
      - name: pos
        in: query
        description: The position of the new card. `top`, `bottom`, or a positive float
        schema:
          oneOf:
          - type: string
            enum:
            - top
            - bottom
          - type: number
            format: float
            minimum: 0
      - name: due
        in: query
        description: A due date for the card
        schema:
          type: string
          format: date
      - name: start
        in: query
        description: The start date of a card, or `null`
        schema:
          nullable: true
          type: string
          format: date
      - name: dueComplete
        in: query
        description: Whether the status of the card is complete
        schema:
          type: boolean
      - name: idList
        in: query
        required: true
        description: The ID of the list the card should be created in
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: idMembers
        in: query
        description: Comma-separated list of member IDs to add to the card
        schema:
          type: array
          items:
            oneOf:
            - type: string
              pattern: ^[0-9a-fA-F]{24}$
      - name: idLabels
        in: query
        description: Comma-separated list of label IDs to add to the card
        schema:
          type: array
          items:
            oneOf:
            - type: string
              pattern: ^[0-9a-fA-F]{24}$
      - name: urlSource
        in: query
        description: A URL starting with `http://` or `https://`. The URL will be attached to the card
          upon creation.
        schema:
          type: string
          format: url
      - name: fileSource
        in: query
        schema:
          type: string
          format: binary
      - name: mimeType
        in: query
        description: The mimeType of the attachment. Max length 256
        schema:
          type: string
      - name: idCardSource
        in: query
        description: The ID of a card to copy into the new card
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: keepFromSource
        in: query
        description: 'If using `idCardSource` you can specify which properties to copy over. `all` or
          comma-separated list of: `attachments,checklists,customFields,comments,due,start,labels,members,start,stickers`'
        schema:
          type: string
          default: all
          enum:
          - all
          - attachments
          - checklists
          - comments
          - customFields
          - due
          - start
          - labels
          - members
          - start
          - stickers
      - name: address
        in: query
        description: For use with/by the Map View
        schema:
          type: string
      - name: locationName
        in: query
        description: For use with/by the Map View
        schema:
          type: string
      - name: coordinates
        in: query
        description: For use with/by the Map View. Should take the form latitude,longitude
        schema:
          type: string
      - name: cardRole
        in: query
        description: For displaying cards in different ways based on the card name. Board cards must have
          a name that is a link to a Trello board. Mirror cards must have a name that is a link to a Trello
          card.
        schema:
          type: string
          enum:
          - separator
          - board
          - mirror
          - link
          nullable: true
  /cards/{id}:
    get:
      tags:
      - Cards
      operationId: getCard
      summary: Get a Card
      description: 'Official operationId: get-cards-id.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: fields
        in: query
        description: '`all` or a comma-separated list of [fields](/cloud/trello/guides/rest-api/object-definitions/).
          **Defaults**: `badges, checkItemStates, closed, dateLastActivity, desc, descData, due, start,
          idBoard, idChecklists, idLabels, idList, idMembers, idShort, idAttachmentCover, manualCoverAttachment,
          labels, name, pos, shortUrl, url`'
        schema:
          type: string
      - name: actions
        in: query
        description: See the [Actions Nested Resource](/cloud/trello/guides/rest-api/nested-resources/#actions-nested-resource)
        schema:
          type: string
      - name: attachments
        in: query
        description: '`true`, `false`, or `cover`'
        schema:
          type: string
          oneOf:
          - type: string
            enum:
            - cover
          - type: boolean
          default: false
      - name: attachment_fields
        in: query
        description: '`all` or a comma-separated list of attachment [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        schema:
          type: string
          default: all
      - name: members
        in: query
        description: Whether to return member objects for members on the card
        schema:
          type: boolean
          default: false
      - name: member_fields
        in: query
        description: '`all` or a comma-separated list of member [fields](/cloud/trello/guides/rest-api/object-definitions/).
          **Defaults**: `avatarHash, fullName, initials, username`'
        schema:
          type: string
      - name: membersVoted
        in: query
        description: Whether to return member objects for members who voted on the card
        schema:
          type: boolean
          default: false
      - name: memberVoted_fields
        in: query
        description: '`all` or a comma-separated list of member [fields](/cloud/trello/guides/rest-api/object-definitions/).
          **Defaults**: `avatarHash, fullName, initials, username`'
        schema:
          type: string
      - name: checkItemStates
        in: query
        schema:
          type: boolean
          default: false
      - name: checklists
        in: query
        description: Whether to return the checklists on the card. `all` or `none`
        schema:
          type: string
          default: none
      - name: checklist_fields
        in: query
        description: '`all` or a comma-separated list of `idBoard,idCard,name,pos`'
        schema:
          type: string
          default: all
      - name: board
        in: query
        description: Whether to return the board object the card is on
        schema:
          type: boolean
          default: false
      - name: board_fields
        in: query
        description: '`all` or a comma-separated list of board [fields](/cloud/trello/guides/rest-api/object-definitions/#board-object).
          **Defaults**: `name, desc, descData, closed, idOrganization, pinned, url, prefs`'
        schema:
          type: string
      - name: list
        in: query
        description: See the [Lists Nested Resource](/cloud/trello/guides/rest-api/nested-resources/)
        schema:
          type: boolean
          default: false
      - name: pluginData
        in: query
        description: Whether to include pluginData on the card with the response
        schema:
          type: boolean
          default: false
      - name: stickers
        in: query
        description: Whether to include sticker models with the response
        schema:
          type: boolean
          default: false
      - name: sticker_fields
        in: query
        description: '`all` or a comma-separated list of sticker [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        schema:
          type: string
          default: all
      - name: customFieldItems
        in: query
        description: Whether to include the customFieldItems
        schema:
          type: boolean
          default: false
    put:
      tags:
      - Cards
      operationId: updateCard
      summary: Update a Card
      description: 'Official operationId: put-cards-id.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: name
        in: query
        description: The new name for the card
        schema:
          type: string
      - name: desc
        in: query
        description: The new description for the card
        schema:
          type: string
      - name: closed
        in: query
        description: 'Whether the card should be archived (closed: true)'
        schema:
          type: boolean
      - name: idMembers
        in: query
        description: Comma-separated list of member IDs
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: idAttachmentCover
        in: query
        description: The ID of the image attachment the card should use as its cover, or null for none
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: idList
        in: query
        description: The ID of the list the card should be in
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: idLabels
        in: query
        description: Comma-separated list of label IDs
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: idBoard
        in: query
        description: The ID of the board the card should be on
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: pos
        in: query
        description: The position of the card in its list. `top`, `bottom`, or a positive float
        schema:
          oneOf:
          - type: string
            enum:
            - top
            - bottom
          - type: number
            format: float
      - name: due
        in: query
        description: When the card is due, or `null`
        schema:
          nullable: true
          type: string
          format: date
      - name: start
        in: query
        description: The start date of a card, or `null`
        schema:
          nullable: true
          type: string
          format: date
      - name: dueComplete
        in: query
        description: Whether the status of the card is complete
        schema:
          type: boolean
      - name: subscribed
        in: query
        description: Whether the member is should be subscribed to the card
        schema:
          type: boolean
      - name: address
        in: query
        description: For use with/by the Map View
        schema:
          type: string
      - name: locationName
        in: query
        description: For use with/by the Map View
        schema:
          type: string
      - name: coordinates
        in: query
        description: For use with/by the Map View. Should be latitude,longitude
        schema:
          type: string
      - name: cover
        in: query
        description: "Updates the card's cover\n | Option | Values | About |\n |--------|--------|-------|\n\
          \ | color | `pink`, `yellow`, `lime`, `blue`, `black`, `orange`, `red`, `purple`, `sky`, `green`\
          \ | Makes the cover a solid color . |\n | brightness | `dark`, `light` | Determines whether\
          \ the text on the cover should be dark or light.\n | url | An unsplash URL: https://images.unsplash.com\
          \ | Used if making an image the cover. Only Unsplash URLs work.\n | idAttachment | ID of an\
          \ attachment on the card | Used if setting an attached image as the cover. |\n | size | `normal`,\
          \ `full` | Determines whether to show the card name on the cover, or below it. |\n \n `brightness`\
          \ can be sent alongside any of the other parameters, but all of the other parameters are mutually\
          \ exclusive; you can not have the cover be a `color` and an `idAttachment` at the same time.\
          \ \n \n On the brightness options, setting it to light will make the text on the card cover\
          \ dark:\n ![](/cloud/trello/images/rest/cards/cover-brightness-dark.png)\n \n And vice versa,\
          \ setting it to dark will make the text on the card cover light: \n ![](/cloud/trello/images/rest/cards/cover-brightness-light.png) "
        schema:
          type: object
          properties:
            value:
              type: object
              description: "An object containing information regarding the card's cover \n `brightness`\
                \ can be sent alongside any of the other parameters, but all of the other parameters are\
                \ mutually exclusive; you can not have the cover be a color and an `idAttachment` at the\
                \ same time."
              properties:
                color:
                  type: string
                  enum:
                  - pink
                  - yellow
                  - lime
                  - blue
                  - black
                  - orange
                  - red
                  - purple
                  - sky
                  - green
                  description: 'One of: `pink, yellow, lime, blue, black, orange, red, purple, sky, green`'
                brightness:
                  type: string
                  enum:
                  - dark
                  - light
                  description: Determines whether the text on the cover should be dark or light. Setting
                    it to `light` will make the text on the card cover dark. And vice versa, setting it
                    to dark will make the text on the card cover light
                url:
                  type: string
                  format: url
                  description: Used if making an image the cover. Only Unsplash URLs (https://images.unsplash.com/)
                    work.
