openapi: 3.0.3
info:
  title: Frigg Scale Test Mock CRM
  version: 0.1.0
  description: Hybrid mock CRM for Frigg scale testing: stateless synthetic base + small persisted change-log.
servers:
  - url: https://mock.local
tags:
  - name: Health
  - name: Config
  - name: Contacts
  - name: Activities
  - name: Bulk
  - name: State
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /config/{accountId}:
    get:
      tags: [Config]
      summary: Get per-account config
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
    put:
      tags: [Config]
      summary: Upsert per-account config
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Config"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
  /contacts:
    get:
      tags: [Contacts]
      summary: List contacts (cursor pagination; optional delta)
      parameters:
        - in: query
          name: accountId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: updatedSince
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            Retry-After:
              schema:
                type: integer
              description: Present when throttled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPage"
        "429":
          description: Throttled
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /activities:
    get:
      tags: [Activities]
      summary: List activities (cursor pagination; filter by type/contactId; delta)
      parameters:
        - in: query
          name: accountId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [phone_call, email, sms]
        - in: query
          name: contactId
          schema:
            type: string
        - in: query
          name: updatedSince
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
    post:
      tags: [Activities]
      summary: Create an activity (writes to hybrid change-log)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityWrite"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /bulk/exports/contacts:
    post:
      tags: [Bulk]
      summary: Request contacts export (NDJSON/CSV)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, format]
              properties:
                accountId:
                  type: string
                format:
                  type: string
                  enum: [ndjson, csv]
                  default: ndjson
                fields:
                  type: array
                  items:
                    type: string
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobAccepted"
  /bulk/exports/activities:
    post:
      tags: [Bulk]
      summary: Request activities export (NDJSON/CSV)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, format]
              properties:
                accountId:
                  type: string
                format:
                  type: string
                  enum: [ndjson, csv]
                  default: ndjson
                fields:
                  type: array
                  items:
                    type: string
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobAccepted"
  /bulk/exports/{jobId}:
    get:
      tags: [Bulk]
      summary: Get export job status (and download URL if complete)
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "404":
          description: Not found
  /state/mutations:
    get:
      tags: [State]
      summary: List hybrid change-log mutations (testing/admin)
      parameters:
        - in: query
          name: accountId
          required: true
          schema:
            type: string
        - in: query
          name: since
          schema:
            type: string
            format: date-time
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationPage"
components:
  schemas:
    Health:
      type: object
      properties:
        ok:
          type: boolean
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    Config:
      type: object
      properties:
        pageSizeDefault:
          type: integer
          default: 100
        pageSizeMax:
          type: integer
          default: 1000
        rpsLimit:
          type: number
          default: 10
        latencyMs:
          type: integer
          default: 0
        jitterMs:
          type: integer
          default: 0
        errorRatePct:
          type: number
          default: 0
        throttleRatePct:
          type: number
          default: 0
        supportsDelta:
          type: boolean
          default: true
        bulkMaxCount:
          type: integer
          default: 1000000
        features:
          type: array
          items:
            type: string
    Contact:
      type: object
      required: [id, email, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        company:
          type: string
        address:
          type: string
        city:
          type: string
        region:
          type: string
        country:
          type: string
        postalCode:
          type: string
        updatedAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    ContactPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
        nextCursor:
          type: string
          nullable: true
    Activity:
      type: object
      required: [id, type, updatedAt, subject, contactId]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [phone_call, email, sms]
        contactId:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        subject:
          type: string
        body:
          type: string
        from:
          type: string
        to:
          type: string
        status:
          type: string
          enum: [queued, sent, delivered, failed, completed]
        durationSec:
          type: number
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    ActivityWrite:
      type: object
      required: [accountId, type, contactId, subject]
      properties:
        accountId:
          type: string
        type:
          type: string
          enum: [phone_call, email, sms]
        contactId:
          type: string
        direction:
          type: string
          enum: [inbound, outbound]
        subject:
          type: string
        body:
          type: string
        from:
          type: string
        to:
          type: string
        status:
          type: string
        durationSec:
          type: number
        sentAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        nextCursor:
          type: string
          nullable: true
    ExportJobAccepted:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [PENDING]
        format:
          type: string
          enum: [ndjson, csv]
    ExportJob:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [PENDING, RUNNING, COMPLETE, FAILED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
        downloadUrl:
          type: string
          format: uri
          nullable: true
        format:
          type: string
          enum: [ndjson, csv]
    Mutation:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        entity:
          type: string
          enum: [contact, activity]
        op:
          type: string
          enum: [create, update, delete]
        refId:
          type: string
        at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    MutationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Mutation"
        nextCursor:
          type: string
          nullable: true
