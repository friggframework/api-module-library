openapi: 3.0.3
info:
  title: ServiceNow Table API (Frigg curated subset)
  version: "1.0.0"
  description: >-
    ServiceNow REST Table API and Attachment API. Official references:
    Table API — https://developer.servicenow.com/print_page.do?category=null&identifier=c_TableAPI&module=api&release=yokohama
    Attachment API — https://developer.servicenow.com/print_page.do?category=null&identifier=c_AttachmentAPI&module=api&release=yokohama
    OAuth — https://www.servicenow.com/docs/r/yokohama/platform-security/authentication/c_OAuthAuthorizationCodeFlow.html
    OpenAPI may be exported per instance from REST API Explorer (no single public
    static Table API OpenAPI URL). This file is Left Hook's curated subset covering
    exactly the endpoints `@friggframework/api-module-servicenow` implements in
    api.js (one method per operationId). Paths use `/api/now/table/{table}` and
    `/api/now/attachment`. Host template: `https://{instance}.service-now.com`.
    Auth: OAuth2 bearer (primary) or HTTP Basic (alternate).
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
  - url: https://{instance}.service-now.com
    description: ServiceNow instance host (official product hostname pattern)
    variables:
      instance:
        default: example
        description: Instance subdomain (dev12345 from https://dev12345.service-now.com)
security:
  - bearerAuth: []
  - basicAuth: []
tags:
  - name: Incident
  - name: ServiceCatalog
  - name: Problem
  - name: Change
  - name: User
  - name: Company
  - name: CSM
  - name: Attachment
paths:
  /api/now/table/incident:
    get:
      tags: [Incident]
      operationId: listIncidents
      summary: List incidents
      description: >-
        Official Table API GET /now/table/{tableName} with tableName=incident.
        https://developer.servicenow.com/print_page.do?category=null&identifier=c_TableAPI&module=api&release=yokohama
      parameters:
        - $ref: '#/components/parameters/sysparm_query'
        - $ref: '#/components/parameters/sysparm_limit'
        - $ref: '#/components/parameters/sysparm_offset'
        - $ref: '#/components/parameters/sysparm_fields'
        - $ref: '#/components/parameters/sysparm_display_value'
      responses:
        "200":
          description: List of incident records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'
    post:
      tags: [Incident]
      operationId: createIncident
      summary: Create an incident
      description: Official Table API POST /now/table/incident.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRecordResponse'

  /api/now/table/incident/{sys_id}:
    get:
      tags: [Incident]
      operationId: getIncident
      summary: Get an incident
      parameters:
        - $ref: '#/components/parameters/sys_id'
        - $ref: '#/components/parameters/sysparm_fields'
        - $ref: '#/components/parameters/sysparm_display_value'
      responses:
        "200":
          description: Incident record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRecordResponse'
    patch:
      tags: [Incident]
      operationId: updateIncident
      summary: Update an incident (partial)
      parameters:
        - $ref: '#/components/parameters/sys_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRecordResponse'

  /api/now/table/sc_request:
    get:
      tags: [ServiceCatalog]
      operationId: listScRequests
      summary: List service catalog requests
      description: Table API GET with tableName=sc_request.
      parameters:
