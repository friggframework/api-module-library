openapi: 3.0.3
info:
  title: GitLab REST API (Frigg curated subset)
  version: "1.0.0"
  description: >-
    GitLab (gitlab.com / Self-Managed / Dedicated) DevOps platform REST API v4.
    Official docs: https://docs.gitlab.com/api/rest/. Official autogenerated
    OpenAPI lives at https://gitlab.com/gitlab-org/gitlab/-/tree/master/doc/api/openapi.
    This file is Left Hook's curated subset covering exactly the endpoints the
    @friggframework/api-module-gitlab client in api.js implements — auth identity,
    projects, issues, merge requests, and project webhook CRUD. It is the source
    of truth the hand-written client mirrors 1:1 (one method per operationId).
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
  - url: https://gitlab.com/api/v4
    description: GitLab.com API v4 (override host for Self-Managed)
security:
  - bearerAuth: []
tags:
  - name: Users
  - name: Projects
  - name: Issues
  - name: Merge Requests
  - name: Project Hooks
paths:
  /user:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Retrieve the current user
      description: >-
        Returns the authenticated user. Requires a token with `read_user` or
        broader API scopes.
        https://docs.gitlab.com/api/users/#retrieve-the-current-user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      description: >-
        Lists projects accessible to the authenticated user.
        https://docs.gitlab.com/api/projects/#list-all-projects
      parameters:
        - in: query
          name: membership
          schema: { type: boolean }
        - in: query
          name: owned
          schema: { type: boolean }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: simple
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer, maximum: 100 }
        - in: query
          name: order_by
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: Array of projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: >-
        Creates a project owned by the authenticated user. Provide `name` and/or
        `path`. https://docs.gitlab.com/api/projects/#create-a-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                path: { type: string }
                description: { type: string }
                visibility: { type: string, enum: [private, internal, public] }
                initialize_with_readme: { type: boolean }
                namespace_id: { type: integer }
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a single project
      description: https://docs.gitlab.com/api/projects/#get-a-single-project
      parameters:
        - in: query
          name: statistics
          schema: { type: boolean }
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
    put:
      tags: [Projects]
      operationId: updateProject
      summary: Edit a project
      description: https://docs.gitlab.com/api/projects/#edit-a-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                path: { type: string }
                description: { type: string }
                visibility: { type: string, enum: [private, internal, public] }
                default_branch: { type: string }
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /projects/{id}/issues:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Issues]
      operationId: listIssues
      summary: List project issues
      description: https://docs.gitlab.com/api/issues/#list-project-issues
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [opened, closed, all] }
        - in: query
          name: labels
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer }
      responses:
        "200":
          description: Array of issues
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Issue" }
    post:
      tags: [Issues]
      operationId: createIssue
      summary: Create an issue
      description: >-
        Required: `title`. https://docs.gitlab.com/api/issues/#create-an-issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                labels: { type: string }
                assignee_ids:
                  type: array
                  items: { type: integer }
                confidential: { type: boolean }
                due_date: { type: string, format: date }
                issue_type:
                  type: string
                  enum: [issue, incident, test_case, task]
      responses:
        "201":
          description: Created issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /projects/{id}/issues/{issue_iid}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - in: path
        name: issue_iid
        required: true
        schema: { type: integer }
        description: Internal ID of the issue within the project
    get:
      tags: [Issues]
      operationId: getIssue
      summary: Get a single project issue
      description: https://docs.gitlab.com/api/issues/#single-project-issue
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
    put:
      tags: [Issues]
      operationId: updateIssue
      summary: Edit an issue
      description: https://docs.gitlab.com/api/issues/#edit-an-issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                state_event: { type: string, enum: [close, reopen] }
                labels: { type: string }
                assignee_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }

  /projects/{id}/merge_requests:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Merge Requests]
      operationId: listMergeRequests
      summary: List project merge requests
      description: https://docs.gitlab.com/api/merge_requests/#list-project-merge-requests
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [opened, closed, locked, merged, all] }
        - in: query
          name: labels
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer }
      responses:
        "200":
          description: Array of merge requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MergeRequest" }
    post:
      tags: [Merge Requests]
      operationId: createMergeRequest
      summary: Create a merge request
      description: >-
        Required: `source_branch`, `target_branch`, `title`.
        https://docs.gitlab.com/api/merge_requests/#create-mr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_branch, target_branch, title]
              properties:
                source_branch: { type: string }
                target_branch: { type: string }
                title: { type: string }
                description: { type: string }
                labels: { type: string }
                assignee_ids:
                  type: array
                  items: { type: integer }
                reviewer_ids:
                  type: array
                  items: { type: integer }
                remove_source_branch: { type: boolean }
                squash: { type: boolean }
      responses:
        "201":
          description: Created merge request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeRequest" }

  /projects/{id}/merge_requests/{merge_request_iid}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - in: path
        name: merge_request_iid
        required: true
        schema: { type: integer }
    get:
      tags: [Merge Requests]
      operationId: getMergeRequest
      summary: Get a single merge request
      description: https://docs.gitlab.com/api/merge_requests/#get-single-mr
      responses:
        "200":
          description: Merge request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeRequest" }
    put:
      tags: [Merge Requests]
      operationId: updateMergeRequest
      summary: Update a merge request
      description: https://docs.gitlab.com/api/merge_requests/#update-mr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                state_event: { type: string, enum: [close, reopen] }
                target_branch: { type: string }
                labels: { type: string }
                assignee_ids:
                  type: array
                  items: { type: integer }
                reviewer_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: Updated merge request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MergeRequest" }

  /projects/{id}/hooks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Project Hooks]
      operationId: listProjectHooks
      summary: List project webhooks
      description: https://docs.gitlab.com/api/project_webhooks/#list-webhooks-for-a-project
      responses:
        "200":
          description: Array of hooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectHook" }
    post:
      tags: [Project Hooks]
      operationId: createProjectHook
      summary: Add a project webhook
      description: >-
        Required: `url`. Prefer `signing_token` (whsec_…) over legacy `token`.
        https://docs.gitlab.com/api/project_webhooks/#add-a-webhook-to-a-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                name: { type: string }
                description: { type: string }
                token: { type: string }
                signing_token: { type: string }
                push_events: { type: boolean }
                issues_events: { type: boolean }
                merge_requests_events: { type: boolean }
                note_events: { type: boolean }
                tag_push_events: { type: boolean }
                pipeline_events: { type: boolean }
                wiki_page_events: { type: boolean }
                deployment_events: { type: boolean }
                job_events: { type: boolean }
                releases_events: { type: boolean }
                enable_ssl_verification: { type: boolean }
      responses:
        "201":
          description: Created hook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectHook" }

  /projects/{id}/hooks/{hook_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - in: path
        name: hook_id
        required: true
        schema: { type: integer }
    get:
      tags: [Project Hooks]
      operationId: getProjectHook
      summary: Get a project webhook
      description: https://docs.gitlab.com/api/project_webhooks/#get-a-project-hook
      responses:
        "200":
          description: Hook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectHook" }
    put:
      tags: [Project Hooks]
      operationId: updateProjectHook
      summary: Edit a project webhook
      description: https://docs.gitlab.com/api/project_webhooks/#edit-a-project-hook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                name: { type: string }
                description: { type: string }
                token: { type: string }
                signing_token: { type: string }
                push_events: { type: boolean }
                issues_events: { type: boolean }
                merge_requests_events: { type: boolean }
                enable_ssl_verification: { type: boolean }
      responses:
        "200":
          description: Updated hook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectHook" }
    delete:
      tags: [Project Hooks]
      operationId: deleteProjectHook
      summary: Delete a project webhook
      description: https://docs.gitlab.com/api/project_webhooks/#delete-a-project-hook
      responses:
        "204":
          description: Deleted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        OAuth 2.0 access token (or PAT) as `Authorization: Bearer <token>`.
        https://docs.gitlab.com/api/rest/authentication/
  parameters:
    ProjectId:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Project ID or URL-encoded path (group%2Fproject)
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        state: { type: string }
        web_url: { type: string, format: uri }
        avatar_url: { type: string, format: uri }
    Project:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        path: { type: string }
        path_with_namespace: { type: string }
        description: { type: string }
        visibility: { type: string }
        default_branch: { type: string }
        web_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
    Issue:
      type: object
      properties:
        id: { type: integer }
        iid: { type: integer }
        project_id: { type: integer }
        title: { type: string }
        description: { type: string }
        state: { type: string }
        labels:
          type: array
          items: { type: string }
        web_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        author:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            name: { type: string }
    MergeRequest:
      type: object
      properties:
        id: { type: integer }
        iid: { type: integer }
        project_id: { type: integer }
        title: { type: string }
        description: { type: string }
        state: { type: string }
        source_branch: { type: string }
        target_branch: { type: string }
        web_url: { type: string, format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        author:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            name: { type: string }
    ProjectHook:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        name: { type: string }
        description: { type: string }
        project_id: { type: integer }
        push_events: { type: boolean }
        issues_events: { type: boolean }
        merge_requests_events: { type: boolean }
        enable_ssl_verification: { type: boolean }
        created_at: { type: string, format: date-time }
