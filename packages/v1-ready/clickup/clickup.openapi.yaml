                          - time_tracking
                          - tags
                          - time_estimates
                          - checklists
                          type: object
                          properties:
                            due_dates:
                              title: DueDates
                              required:
                              - enabled
                              - start_date
                              - remap_due_dates
                              - remap_closed_due_date
                              type: object
                              properties:
                                enabled:
                                  type: boolean
                                start_date:
                                  type: boolean
                                remap_due_dates:
                                  type: boolean
                                remap_closed_due_date:
                                  type: boolean
                            time_tracking:
                              title: TimeTracking
                              required:
                              - enabled
                              type: object
                              properties:
                                enabled:
                                  type: boolean
                            tags:
                              title: Tags
                              required:
                              - enabled
                              type: object
                              properties:
                                enabled:
                                  type: boolean
                            time_estimates:
                              title: TimeEstimates
                              required:
