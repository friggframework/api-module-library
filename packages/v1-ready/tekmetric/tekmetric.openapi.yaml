openapi: 3.0.3
info:
  title: Tekmetric Partner API (Frigg curated subset)
  version: "1.0.0"
  description: >-
    Tekmetric (tekmetric.com) is a cloud-based auto repair shop management
    platform. This OpenAPI document is Left Hook's curated subset covering
    exactly the endpoints the @friggframework/api-module-tekmetric client in
    api.js implements. It is the source of truth the hand-written client
    mirrors 1:1 (one method per operationId).

    Official partner docs live at https://api.tekmetric.com/docs (gated SPA;
    no vendor-downloadable OpenAPI export was available at module authoring
    time). Paths and verbs below are taken from that documentation's API
    navigation (Access Token, Shops, Customers, Vehicles, Repair Orders, Jobs,
    Appointments, Employees) and cross-checked against publicly observable
    partner-client request shapes. Write request/response bodies are typed
    loosely where the gated docs do not expose a public schema dump.
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
  - url: https://shop.tekmetric.com/api/v1
    description: Tekmetric production (module default)
  - url: https://sandbox.tekmetric.com/api/v1
    description: Tekmetric sandbox (opt-in via TEKMETRIC_ENVIRONMENT=sandbox)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Shops
  - name: Customers
  - name: Vehicles
  - name: Repair Orders
  - name: Jobs
  - name: Appointments
  - name: Employees
paths:
  /oauth/token:
    post:
      tags: [Auth]
      operationId: getAccessToken
      summary: Obtain an OAuth 2.0 access token
      description: >-
        Client-credentials grant. Send HTTP Basic auth with the approved
        client_id:client_secret and form body grant_type=client_credentials.
        Docs: https://api.tekmetric.com/docs — Access Token.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer }
                  scope:
                    type: string
                    description: Space-separated authorized shop IDs
  /shops:
    get:
      tags: [Shops]
      operationId: listShops
      summary: List authorized shops
      description: >-
        Lists shop records the authenticated OAuth client is scoped to.
        Docs: https://api.tekmetric.com/docs — Shops
      responses:
        "200":
          description: Shop list
  /shops/{shopId}:
    get:
      tags: [Shops]
      operationId: getShop
      summary: Get a shop
      description: "Docs: https://api.tekmetric.com/docs — Shop"
      parameters:
        - $ref: '#/components/parameters/ShopId'
      responses:
        "200":
          description: Shop
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: List or search customers
      description: "Docs: https://api.tekmetric.com/docs — Customers"
      parameters:
        - $ref: '#/components/parameters/Shop'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: search
          schema: { type: string }
          description: Free-text search across name, email, and phone
      responses:
        "200":
          description: Paginated customers
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create a customer
      description: "Docs: https://api.tekmetric.com/docs — Create Customer"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Customer created
        "201":
          description: Customer created
  /customers/{customerId}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get a customer
      description: "Docs: https://api.tekmetric.com/docs — Customer"
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        "200":
          description: Customer
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Update a customer
      description: "Docs: https://api.tekmetric.com/docs — Update Customer"
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Customer updated
  /vehicles:
    get:
      tags: [Vehicles]
      operationId: listVehicles
      summary: List vehicles
      description: "Docs: https://api.tekmetric.com/docs — Vehicles"
      parameters:
        - $ref: '#/components/parameters/Shop'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: customerId
          schema: { type: integer }
      responses:
        "200":
          description: Paginated vehicles
    post:
      tags: [Vehicles]
      operationId: createVehicle
      summary: Create a vehicle
      description: "Docs: https://api.tekmetric.com/docs — Create Vehicle"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Vehicle created
        "201":
          description: Vehicle created
  /vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      operationId: getVehicle
      summary: Get a vehicle
      description: "Docs: https://api.tekmetric.com/docs — Vehicle"
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        "200":
          description: Vehicle
    patch:
      tags: [Vehicles]
      operationId: updateVehicle
      summary: Update a vehicle
      description: "Docs: https://api.tekmetric.com/docs — Update Vehicle"
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Vehicle updated
  /repair-orders:
    get:
      tags: [Repair Orders]
      operationId: listRepairOrders
      summary: List repair orders
      description: "Docs: https://api.tekmetric.com/docs — Repair Orders"
      parameters:
        - $ref: '#/components/parameters/Shop'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: customerId
          schema: { type: integer }
        - in: query
          name: vehicleId
          schema: { type: integer }
        - in: query
          name: repairOrderStatusId
          schema: { type: integer }
        - in: query
          name: repairOrderNumber
          schema: { type: integer }
        - in: query
          name: updatedDateStart
          schema: { type: string }
        - in: query
          name: updatedDateEnd
          schema: { type: string }
      responses:
        "200":
          description: Paginated repair orders
  /repair-orders/{repairOrderId}:
    get:
      tags: [Repair Orders]
      operationId: getRepairOrder
      summary: Get a repair order
      description: "Docs: https://api.tekmetric.com/docs — Repair Order"
      parameters:
        - $ref: '#/components/parameters/RepairOrderId'
      responses:
        "200":
          description: Repair order
    patch:
      tags: [Repair Orders]
      operationId: updateRepairOrder
      summary: Update a repair order
      description: "Docs: https://api.tekmetric.com/docs — Update Repair Order"
      parameters:
        - $ref: '#/components/parameters/RepairOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Repair order updated
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs
      description: "Docs: https://api.tekmetric.com/docs — Jobs"
      parameters:
        - $ref: '#/components/parameters/Shop'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: Paginated jobs
  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a job
      description: "Docs: https://api.tekmetric.com/docs — Job"
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        "200":
          description: Job
    patch:
      tags: [Jobs]
      operationId: updateJob
      summary: Update a job
      description: "Docs: https://api.tekmetric.com/docs — Update Job"
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Job updated
  /appointments:
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: List appointments
      description: "Docs: https://api.tekmetric.com/docs — Appointments"
      parameters:
        - $ref: '#/components/parameters/Shop'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: customerId
          schema: { type: integer }
        - in: query
          name: vehicleId
          schema: { type: integer }
        - in: query
          name: start
          schema: { type: string }
        - in: query
          name: end
          schema: { type: string }
        - in: query
          name: includeDeleted
          schema: { type: boolean }
      responses:
        "200":
          description: Paginated appointments
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Create an appointment
      description: "Docs: https://api.tekmetric.com/docs — Create Appointment"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Appointment created
        "201":
          description: Appointment created
  /appointments/{appointmentId}:
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: Get an appointment
      description: "Docs: https://api.tekmetric.com/docs — Appointment"
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        "200":
          description: Appointment
    patch:
      tags: [Appointments]
      operationId: updateAppointment
      summary: Update an appointment
      description: "Docs: https://api.tekmetric.com/docs — Update Appointment"
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Appointment updated
    delete:
      tags: [Appointments]
      operationId: deleteAppointment
      summary: Delete an appointment
      description: "Docs: https://api.tekmetric.com/docs — Delete Appointment"
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        "200":
          description: Appointment deleted
        "204":
          description: Appointment deleted
  /employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: List employees
      description: "Docs: https://api.tekmetric.com/docs — Employees"
      parameters:
        - $ref: '#/components/parameters/Shop'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Paginated employees
  /employees/{employeeId}:
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Get an employee
      description: "Docs: https://api.tekmetric.com/docs — Employee"
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        "200":
          description: Employee
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth access_token
      description: >-
        Bearer access token from POST /oauth/token (client_credentials).
  parameters:
    Shop:
      name: shop
      in: query
      required: false
      description: Shop ID to scope the request to
      schema: { type: integer }
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page number
      schema: { type: integer, default: 0 }
    Size:
      name: size
      in: query
      required: false
      description: Page size
      schema: { type: integer, default: 25 }
    ShopId:
      name: shopId
      in: path
      required: true
      schema: { type: integer }
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: integer }
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema: { type: integer }
    RepairOrderId:
      name: repairOrderId
      in: path
      required: true
      schema: { type: integer }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: integer }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: integer }
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: integer }
