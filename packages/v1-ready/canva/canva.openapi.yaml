          format: '#/components/schemas/FormatSuggestedEdit'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/AddSuggestedEdit'
      - $ref: '#/components/schemas/DeleteSuggestedEdit'
      - $ref: '#/components/schemas/FormatSuggestedEdit'
