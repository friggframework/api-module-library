    CreateOpportunity:
      title: CreateOpportunity
      type: object
      properties:
        attachments:
          title: Attachments
          default: null
          anyOf:
            - type: array
              items:
                $ref: '#/components/schemas/AttachmentIn'
            - type: 'null'
        confidence:
          title: Confidence
          default: null
          anyOf:
            - type: integer
            - type: 'null'
        contact_id:
          title: Contact ID
          default: null
          anyOf:
            - type: string
            - type: 'null'
