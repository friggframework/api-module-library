  requestBodies:
    BlogPostCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - spaceId
            properties:
              spaceId:
                type: string
                description: ID of the space
              status:
                enum:
                - current
                - draft
                type: string
                description: The status of the blog post, specifies if the blog post will be created as
                  a new blog post or a draft
              title:
                type: string
                description: Title of the blog post, required if creating non-draft.
              body:
                oneOf:
                - $ref: '#/components/schemas/BlogPostBodyWrite'
                - $ref: '#/components/schemas/BlogPostNestedBodyWrite'
              createdAt:
                type: string
                description: Created date of the blog post in the format of "yyyy-MM-ddTHH:mm:ss.SSSZ".
    BlogPostUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - status
            - title
            - body
            - version
            properties:
              id:
                type: string
                description: Id of the blog post.
              status:
                enum:
                - current
                - draft
                type: string
                description: |-
                  The updated status of the blog post.

                  Note, if you change the status of a blog post from 'current' to 'draft' and it has an existing draft, the existing draft will be deleted in favor of the updated draft.
                  Additionally, this endpoint can be used to restore a 'trashed' or 'deleted' blog post to 'current' status. For restoration, blog post contents will not be updated and only the blog post status will be changed.
              title:
                type: string
                description: Title of the blog post.
              spaceId:
                type: string
                description: |-
                  ID of the containing space.

                  This currently **does not support moving the blog post to a different space**.
              body:
                oneOf:
                - $ref: '#/components/schemas/BlogPostBodyWrite'
                - $ref: '#/components/schemas/BlogPostNestedBodyWrite'
              version:
                type: object
                properties:
                  number:
                    format: int32
                    type: integer
                    description: "The new version number of the updated blog post. \nSet this to the current\
                      \ version number plus one, unless you are updating the status to 'draft' which requires\
                      \ a version number of 1.\n\nIf you don't know the current version number, use Get\
                      \ blog post by id."
                  message:
                    type: string
                    description: An optional message to be stored with the version.
              createdAt:
                type: string
                description: Created date of the blog post in the format of "yyyy-MM-ddTHH:mm:ss.SSSZ".
    PageCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - spaceId
            properties:
              spaceId:
                type: string
                description: ID of the space.
              status:
                enum:
                - current
                - draft
                type: string
                description: The status of the page, published or draft.
              title:
                type: string
                description: Title of the page, required if page status is not draft.
              parentId:
                type: string
                description: "The parent content ID of the page. If the `root-level` query parameter is\
                  \ set to false and a value is \nnot supplied for this parameter, then the space homepage's\
                  \ ID will be used. If the `root-level` query \nparameter is set to true, then a value\
                  \ may not be supplied for this parameter."
              body:
                oneOf:
                - $ref: '#/components/schemas/PageBodyWrite'
                - $ref: '#/components/schemas/PageNestedBodyWrite'
              subtype:
                enum:
                - live
                type: string
                description: The subtype of the page. Provide the subtype live to create a live doc or
                  no subtype to create a page.
    PageUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            - status
            - title
            - body
            - version
            properties:
              id:
                type: string
                description: Id of the page.
              status:
                enum:
                - current
                - draft
                type: string
                description: |-
                  The updated status of the page.

                  Note, if you change the status of a page from 'current' to 'draft' and it has an existing draft, the existing draft will be deleted in favor of the updated draft.
                  Additionally, this endpoint can be used to restore a 'trashed' or 'deleted' page to 'current' status. For restoration, page contents will not be updated and only the page status will be changed.
              title:
                type: string
                description: Title of the page.
              spaceId:
                format: string
                description: |-
                  ID of the containing space.

                  This currently **does not support moving the page to a different space**.
              parentId:
                format: string
                description: |-
                  ID of the parent content.

                  This allows the page to be moved under a different parent within the same space.
              ownerId:
                format: string
                description: |-
                  Account ID of the page owner.

                  This allows page ownership to be transferred to another user.
              body:
                oneOf:
                - $ref: '#/components/schemas/PageBodyWrite'
                - $ref: '#/components/schemas/PageNestedBodyWrite'
              version:
                type: object
                properties:
                  number:
                    format: int32
                    type: integer
                    description: "The new version of the updated page. \nSet this to the current version\
                      \ number plus one, unless you are updating the status to 'draft' which requires\
                      \ a version number of 1.\n\nIf you don't know the current version number, use Get\
                      \ page by id."
                  message:
                    type: string
                    description: An optional message to be stored with the version.
    SpaceCreateRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            properties:
              name:
                type: string
                description: The name of the space to be created.
              key:
                type: string
                description: The key for the new space. See [Space Keys](https://support.atlassian.com/confluence-cloud/docs/create-a-space/).
                  If the key property is not provided, the alias property is required to be used instead.
              alias:
                type: string
                description: This field will be used as the new identifier for the space in confluence
                  page URLs. If the alias property is not provided, the key property is required to be
                  used instead. Maximum 255 alphanumeric characters in length.
              description:
                type: object
                description: The description of the new/updated space. Note, only the 'plain' representation
                  is currently supported.
                properties:
                  value:
                    type: string
                    description: The space description.
                  representation:
                    type: string
                    description: The format of the description.
              roleAssignments:
                type: array
                items:
                  description: The role assignments for the new space. If none are provided, the Default
                    Space Roles are applied. If roles are provided, the space is created with exactly
                    the provided set of roles. A private space is created if only the creator is assigned
                    to a role and it’s the Admin role. At least one Admin role assignment must be specified.
                  properties:
                    principal:
                      $ref: '#/components/schemas/Principal'
                    roleId:
                      type: string
                      description: The role to which the principal is assigned.
              copySpaceAccessConfiguration:
                type: integer
                description: The id of the space to copy the space access configuration from.
              createPrivateSpace:
                type: boolean
                description: Whether to create the space as private.
              templateKey:
                type: string
                description: The key of the template to use.
