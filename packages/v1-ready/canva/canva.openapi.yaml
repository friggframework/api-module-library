      - font_family
      - font_size
      - font_weight
      - font_style
      - color
      - background_color
      - decoration
      - strikethrough
      - link
      - letter_spacing
      - line_height
      - direction
      - text_align
      - list_marker
      - list_level
      - margin_inline_start
      - text_indent
      - font_size_modifier
      - vertical_align
      example: font_style
