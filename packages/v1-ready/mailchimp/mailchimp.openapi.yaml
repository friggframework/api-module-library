      parameters:
      - name: fields
        in: query
        required: false
        description: A comma-separated list of fields to return. Reference parameters of sub-objects with
          dot notation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: exclude_fields
        in: query
        required: false
        description: A comma-separated list of fields to exclude. Reference parameters of sub-objects
          with dot notation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: count
        in: query
        required: false
        description: The number of records to return. Default value is 10. Maximum value is 1000
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        required: false
        description: Used for [pagination](https://mailchimp.com/developer/marketing/docs/methods-parameters/#pagination),
          this is the number of records from a collection to skip. Default value is 0.
        schema:
          type: integer
          default: 0
      - name: before_date_created
        in: query
        required: false
        description: 'Restrict response to lists created before the set date. Uses ISO 8601 time format:
          2015-10-21T15:41:36+00:00.'
        schema:
          type: string
      - name: since_date_created
        in: query
        required: false
        description: 'Restrict results to lists created after the set date. Uses ISO 8601 time format:
          2015-10-21T15:41:36+00:00.'
        schema:
          type: string
      - name: before_campaign_last_sent
        in: query
        required: false
        description: 'Restrict results to lists created before the last campaign send date. Uses ISO 8601
          time format: 2015-10-21T15:41:36+00:00.'
        schema:
          type: string
      - name: since_campaign_last_sent
        in: query
        required: false
        description: 'Restrict results to lists created after the last campaign send date. Uses ISO 8601
          time format: 2015-10-21T15:41:36+00:00.'
        schema:
          type: string
      - name: email
        in: query
        required: false
        description: Restrict results to lists that include a specific subscriber's email address.
        schema:
          type: string
      - name: sort_field
        in: query
        required: false
        description: Returns files sorted by the specified field.
        schema:
          type: string
          enum:
          - date_created
      - name: sort_dir
        in: query
        required: false
        description: Determines the order direction for sorted results.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: has_ecommerce_store
        in: query
        required: false
        description: Restrict results to lists that contain an active, connected, undeleted ecommerce
          store.
        schema:
          type: boolean
      - name: include_total_contacts
        in: query
        required: false
        description: Deprecated. Return the total_contacts field in the stats response, which contains
          an approximate count of subscribed, unsubscribed, and transactional contacts. For a complete
          audience contact count, use the /audiences endpoint instead.
        schema:
          type: boolean
