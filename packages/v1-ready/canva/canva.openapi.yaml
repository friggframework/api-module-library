          type: string
        sub:
          description: 'The subject of the claim. This is the ID of the Canva user that the access token
            acts on behalf of.


            This is an obfuscated value, so a single user has a unique ID for each app. If the same user
            authorizes another app, their ID in that other app is different.

            '
          example: oBCdEF1Gh2i3jkLmno-pq
          type: string
      required:
      - active
      type: object
    JpgExportFormat:
      description: 'Export the design as a JPEG. Compression quality must be provided. Height or width
        (or both)

        may be specified, otherwise the file will be exported at it''s default size.


        If the user is on the Canva Free plan, the export height and width for a fixed-dimension design
        can''t be upscaled by more than a factor of `1.125`.'
      properties:
        type:
          enum:
          - jpg
          type: string
        export_quality:
          $ref: '#/components/schemas/ExportQuality'
        quality:
          description: For the `jpg` type, the `quality` of the exported JPEG determines how compressed
            the exported file should be. A _low_ `quality` value will create a file with a smaller file
            size, but the resulting file will have pixelated artifacts when compared to a file created
            with a _high_ `quality` value.
          example: 80
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        height:
          description: 'Specify the height in pixels of the exported image. Note the following behavior:


            - If no height or width is specified, the image is exported using the dimensions of the design.

            - If only one of height or width is specified, then the image is scaled to match that dimension,
            respecting the design''s aspect ratio.

            - If both the height and width are specified, but the values don''t match the design''s aspect
            ratio, the export defaults to the larger dimension.'
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        width:
          description: 'Specify the width in pixels of the exported image. Note the following behavior:


            - If no width or height is specified, the image is exported using the dimensions of the design.

            - If only one of width or height is specified, then the image is scaled to match that dimension,
            respecting the design''s aspect ratio.

            - If both the width and height are specified, but the values don''t match the design''s aspect
            ratio, the export defaults to the larger dimension.'
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        pages:
          description: 'To specify which pages to export in a multi-page design, provide the page numbers
            as

            an array. The first page in a design is page `1`.

            If `pages` isn''t specified, all the pages are exported.'
          example:
          - 2
          - 3
          - 4
          items:
            format: int32
            minimum: 1
            type: integer
          type: array
      required:
      - quality
      - type
      type: object
    ListFolderItemsResponse:
      description: 'A list of the items in a folder.

        If the success response contains a continuation token, the folder contains more items

        you can list. You can use this token as a query parameter and retrieve more

        items from the list, for example

        `/v1/folders/{folderId}/items?continuation={continuation}`.


        To retrieve all the items in a folder, you might need to make multiple requests.'
      properties:
        items:
          description: An array of items in the folder.
          items:
            $ref: '#/components/schemas/FolderItemSummary'
          type: array
        continuation:
          description: 'If the success response contains a continuation token, the folder contains more
            items

            you can list. You can use this token as a query parameter and retrieve more

            items from the list, for example

            `/v1/folders/{folderId}/items?continuation={continuation}`.


            To retrieve all the items in a folder, you might need to make multiple requests.'
          example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
          type: string
      required:
      - items
      type: object
    MoveFolderItemRequest:
      description: Body parameters for moving the folder.
      properties:
        to_folder_id:
          description: 'The ID of the folder you want to move the item to (the destination folder).

            If you want to move the item to the top level of a Canva user''s

            [projects](https://www.canva.com/help/find-designs-and-folders/), use the ID `root`.'
          example: FAF2lZtloor
          maxLength: 50
          minLength: 1
          type: string
        item_id:
          description: The ID of the item you want to move. Currently, video assets are not supported.
          example: Msd59349ff
          maxLength: 50
          minLength: 1
          type: string
      required:
      - item_id
      - to_folder_id
      type: object
    Mp4ExportFormat:
      description: Export the design as an MP4. You must specify the quality of the exported video.
      properties:
        type:
          enum:
          - mp4
          type: string
        export_quality:
          $ref: '#/components/schemas/ExportQuality'
        quality:
          $ref: '#/components/schemas/Mp4ExportQuality'
        pages:
          description: 'To specify which pages to export in a multi-page design, provide the page numbers
            as

            an array. The first page in a design is page `1`.

            If `pages` isn''t specified, all the pages are exported.'
          example:
          - 2
          - 3
          - 4
          items:
            format: int32
            minimum: 1
            type: integer
          type: array
      required:
      - quality
      - type
      type: object
    Mp4ExportQuality:
      description: "The resolution of the exported video, as a target number of pixels. The resolution\
        \ is one of\n`480p`, `720p`, `1080p` or `4k`.\n\nThe exported video always has the same aspect\
        \ ratio as the design, which matches creating a\ndownload from the Canva editor. The resolution\
        \ sets how many pixels to target, and the\ndesign's aspect ratio decides how they're split between\
        \ width and height, so the\n`horizontal` and `vertical` values of a given resolution produce the\
        \ same output:\n\n- A 2160x3840 portrait design exported as `horizontal_4k` is 2160x3840, not\
        \ 3840x2160. The\n  orientation in the value's name doesn't rotate or crop the design.\n- A 1000x2000\
        \ design exported as `horizontal_720p` is 678x1357, the 1:2 size closest to the\n  921,600 pixels\
        \ of 1280x720. Aspect ratios that don't match a standard video size aren't\n  rounded to one.\n\
        - A square design exported as `horizontal_4k` or `vertical_4k` is 2880x2880, the square with\n\
        \  the same number of pixels as 3840x2160."
      enum:
      - horizontal_480p
      - horizontal_720p
      - horizontal_1080p
      - horizontal_4k
      - vertical_480p
      - vertical_720p
      - vertical_1080p
      - vertical_4k
      type: string
    OauthError:
