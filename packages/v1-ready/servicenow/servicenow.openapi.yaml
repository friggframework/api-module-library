  /api/now/table/sc_req_item/{sys_id}:
    get:
      tags: [ServiceCatalog]
      operationId: getScReqItem
      summary: Get a requested item
      parameters:
        - $ref: '#/components/parameters/sys_id'
        - $ref: '#/components/parameters/sysparm_fields'
        - $ref: '#/components/parameters/sysparm_display_value'
      responses:
