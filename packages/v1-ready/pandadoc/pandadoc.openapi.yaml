            description: Existing role identifier. Omit to create a new role.
            example: BqL3PVsB2tPLfaSqUiQQRf
          name:
            type: string
            maxLength: 255
            description: Role name. Must be unique within the template.
            example: Client
          signing_order:
            type: integer
            minimum: 1
            nullable: true
            description: Signing order for the role. Set on every role as a contiguous sequence starting
              from `1` (duplicates allowed for parallel groups, e.g. `[1, 1, 2]`), or use `null` on every
              role for fully parallel signing.
            example: 1
        required:
        - name
      example:
      - id: BqL3PVsB2tPLfaSqUiQQRf
        name: Client
        signing_order: 1
      - name: Manager
        signing_order: 2
