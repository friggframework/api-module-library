        - $ref: '#/components/parameters/sysparm_fields'
        - $ref: '#/components/parameters/sysparm_display_value'
      responses:
        "200":
          description: List of change_request records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'

  /api/now/table/change_request/{sys_id}:
    get:
      tags: [Change]
      operationId: getChangeRequest
      summary: Get a change request
      parameters:
        - $ref: '#/components/parameters/sys_id'
        - $ref: '#/components/parameters/sysparm_fields'
        - $ref: '#/components/parameters/sysparm_display_value'
      responses:
        "200":
          description: change_request record
          content:
            application/json:
              schema:
