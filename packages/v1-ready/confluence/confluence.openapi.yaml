openapi: 3.0.3
info:
  title: Confluence Cloud REST API v2 (Frigg curated subset)
  version: 1.0.0
  description: 'Left Hook curated subset of the official Confluence Cloud REST API v2 OpenAPI (https://dac-static.atlassian.com/cloud/confluence/openapi-v2.v3.json).
    Paths, methods, parameters, request/response schemas, security, and the primary server URL are taken
    from that vendor document for the operations implemented by @friggframework/api-module-confluence.
    Official docs: https://developer.atlassian.com/cloud/confluence/rest/v2/intro/. OAuth 2.0 (3LO) callers
    must route via https://api.atlassian.com/ex/confluence/{cloudId}/wiki/api/v2 per https://developer.atlassian.com/cloud/confluence/oauth-2-3lo-apps/
    (the Api client does this when cloudId is set); the server entry below matches the vendor OpenAPI.'
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
- url: https://{your-domain}/wiki/api/v2
  variables:
    your-domain:
      default: no-default
      description: Specific domain of the Confluence site being used. Must be provided.
tags:
- name: Space
- name: Page
- name: Blog Post
paths:
  /spaces:
    get:
      tags:
      - Space
      operationId: getSpaces
      summary: Get spaces
      description: |-
        Returns all spaces. The results will be sorted by id ascending. The number of results is limited by the `limit` parameter and
        additional results (if available) will be available through the `next` URL present in the `Link` response header.

        **[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:
        Permission to access the Confluence site ('Can use' global permission).
        Only spaces that the user has permission to view will be returned.
      parameters:
      - name: ids
        in: query
        required: false
        description: Filter the results to spaces based on their IDs. Multiple IDs can be specified as
          a comma-separated list.
        schema:
          type: array
          maxItems: 250
          items:
            type: integer
            format: int64
      - name: keys
        in: query
        required: false
        description: Filter the results to spaces based on their keys. Multiple keys can be specified
          as a comma-separated list.
        schema:
          type: array
          maxItems: 250
          items:
            type: string
      - name: type
        in: query
        required: false
        description: Filter the results to spaces based on their type.
        schema:
          type: string
          enum:
          - global
          - collaboration
          - knowledge_base
          - personal
          - system
          - onboarding
          - xflow_sample_space
      - name: status
        in: query
        required: false
        description: Filter the results to spaces based on their status.
        schema:
          type: string
          enum:
          - current
          - archived
          - trashed
      - name: labels
        in: query
        required: false
        description: Filter the results to spaces based on their labels. Multiple labels can be specified
          as a comma-separated list.
        schema:
          type: array
          items:
            type: string
      - name: favorited-by
        in: query
        required: false
        description: Filter the results to spaces favorited by the user with the specified account ID.
        schema:
          type: string
      - name: not-favorited-by
        in: query
        required: false
        description: Filter the results to spaces NOT favorited by the user with the specified account
          ID.
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/SpaceSortOrder'
      - name: description-format
        in: query
        required: false
        description: The content format type to be returned in the `description` field of the response.
          If available, the representation will be available under a response field of the same name under
          the `description` field.
        schema:
          $ref: '#/components/schemas/SpaceDescriptionBodyRepresentation'
      - name: include-icon
        in: query
        required: false
        description: If the icon for the space should be fetched or not.
        schema:
          type: boolean
          default: false
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the
          `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set
          of results.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of spaces per result to return. If more results exist, use the `Link`
          response header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 25
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested spaces are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<Space>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SpaceBulk'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: |
                This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request's URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/spaces?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: |-
            Returned if the authentication credentials are incorrect or missing
            from the request.
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:space:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:space:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: READ
    post:
      tags:
      - Space
      operationId: createSpace
      summary: Create space
      description: "Creates a Space as specified in the payload.\n\nAvailable on tenants with [Role-Based\
        \ Access Control](https://support.atlassian.com/confluence-cloud/docs/manage-user-roles/). \n\n\
        **[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:\nPermission to create spaces."
      requestBody:
        $ref: '#/components/requestBodies/SpaceCreateRequest'
      responses:
        '201':
          description: Returned if the requested space is created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SpaceBulk'
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        base:
                          type: string
                          description: Base url of the Confluence site.
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: |-
            Returned if the authentication credentials are incorrect or missing
            from the request.
          content: {}
        '404':
          description: Returned if the calling user does not have permission to create spaces.
          content: {}
        '413':
          description: Returned if the request is too large in size (over 5 MB).
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:space:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:space:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: WRITE
  /spaces/{id}:
    get:
      tags:
      - Space
      operationId: getSpaceById
      summary: Get space by id
      description: |-
        Returns a specific space.

        **[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:
        Permission to view the space.
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the space to be returned.
        schema:
          format: int64
          type: integer
      - name: description-format
        in: query
        required: false
        description: The content format type to be returned in the `description` field of the response.
          If available, the representation will be available under a response field of the same name under
          the `description` field.
        schema:
          $ref: '#/components/schemas/SpaceDescriptionBodyRepresentation'
      - name: include-icon
        in: query
        required: false
        description: If the icon for the space should be fetched or not.
        schema:
          type: boolean
          default: false
      - name: include-operations
        in: query
        description: |-
          Includes operations associated with this space in the response, as defined in the `Operation` object.
          The number of results will be limited to 50 and sorted in the default sort order.
          A `meta` and `_links` property will be present to indicate if more results are available and a link to retrieve the rest of the results.
        schema:
          type: boolean
          default: false
      - name: include-properties
        in: query
        description: |-
          Includes space properties associated with this space in the response.
          The number of results will be limited to 50 and sorted in the default sort order.
          A `meta` and `_links` property will be present to indicate if more results are available and a link to retrieve the rest of the results.
        schema:
          type: boolean
          default: false
      - name: include-permissions
        in: query
        description: |-
          Includes space permissions associated with this space in the response.
          The number of results will be limited to 50 and sorted in the default sort order.
          A `meta` and `_links` property will be present to indicate if more results are available and a link to retrieve the rest of the results.
        schema:
          type: boolean
          default: false
      - name: include-role-assignments
        in: query
        description: |-
          Includes role assignments associated with this space in the response. This parameter is only accepted for EAP sites.
          The number of results will be limited to 50 and sorted in the default sort order.
          A `meta` and `_links` property will be present to indicate if more results are available and a link to retrieve the rest of the results.
        schema:
          type: boolean
          default: false
      - name: include-labels
        in: query
        description: |-
          Includes labels associated with this space in the response.
          The number of results will be limited to 50 and sorted in the default sort order.
          A `meta` and `_links` property will be present to indicate if more results are available and a link to retrieve the rest of the results.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Returned if the requested space is returned.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SpaceSingle'
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        base:
                          type: string
                          description: Base url of the Confluence site.
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: |-
            Returned if the authentication credentials are incorrect or missing
            from the request.
          content: {}
        '404':
          description: |-
            Returned if the calling user does not have permission to view the
            requested space or the space was not found.
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:space:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:space:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: READ
  /spaces/{id}/pages:
    get:
      tags:
      - Page
      operationId: getPagesInSpace
      summary: Get pages in space
      description: |-
        Returns all pages in a space. The number of results is limited by the `limit` parameter and additional results (if available)
        will be available through the `next` URL present in the `Link` response header.

        **[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:
        Permission to access the Confluence site ('Can use' global permission) and 'View' permission for the space.
        Only pages that the user has permission to view will be returned.
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the space for which pages should be returned.
        schema:
          format: int64
          type: integer
      - name: depth
        in: query
        required: false
        description: Filter the results to pages at the root level of the space or to all pages in the
          space.
        schema:
          type: string
          default: all
          enum:
          - all
          - root
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/PageSortOrder'
      - name: status
        in: query
        required: false
        description: Filter the results to pages based on their status. By default, `current` and `archived`
          are used.
        schema:
          type: array
          items:
            type: string
            enum:
            - current
            - archived
            - deleted
            - trashed
      - name: title
        in: query
        required: false
        description: Filter the results to pages based on their title.
        schema:
          type: string
      - name: body-format
        in: query
        description: The content format types to be returned in the `body` field of the response. If available,
          the representation will be available under a response field of the same name under the `body`
          field.
        schema:
          $ref: '#/components/schemas/PrimaryBodyRepresentation'
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the
          `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set
          of results.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of pages per result to return. If more results exist, use the `Link`
          header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 25
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested pages are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<Page>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PageBulk'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: |
                This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request's URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/spaces/<id>/pages?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: |-
            Returned if the authentication credentials are incorrect or missing
            from the request.
          content: {}
        '404':
          description: |-
            Returned if the calling user does not have permission to view the
            specified space or the space was not found.
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:page:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
  /spaces/{id}/blogposts:
    get:
      tags:
      - Blog Post
      operationId: getBlogPostsInSpace
      summary: Get blog posts in space
      description: |-
        Returns all blog posts in a space. The number of results is limited by the `limit` parameter and additional results (if available)
        will be available through the `next` URL present in the `Link` response header.

        **[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:
        Permission to access the Confluence site ('Can use' global permission) and view the space.
        Only blog posts that the user has permission to view will be returned.
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the space for which blog posts should be returned.
        schema:
          format: int64
          type: integer
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/BlogPostSortOrder'
      - name: status
        in: query
        required: false
        description: Filter the results to blog posts based on their status. By default, `current` is
          used.
        schema:
          type: array
          items:
            type: string
            enum:
            - current
            - deleted
            - trashed
      - name: title
        in: query
        required: false
        description: Filter the results to blog posts based on their title.
        schema:
          type: string
      - name: body-format
        in: query
        description: The content format types to be returned in the `body` field of the response. If available,
          the representation will be available under a response field of the same name under the `body`
          field.
        schema:
          $ref: '#/components/schemas/PrimaryBodyRepresentation'
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the
          `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set
          of results.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of blog posts per result to return. If more results exist, use the
          `Link` header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 25
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested blog posts are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<BlogPost>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlogPostBulk'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: |
                This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request's URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/spaces/<id>/blogposts?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: |-
            Returned if the authentication credentials are incorrect or missing
            from the request.
          content: {}
        '404':
          description: |-
            Returned if the calling user does not have permission to view the
            specified space or the space was not found.
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:page:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
  /pages:
    get:
      tags:
      - Page
      operationId: getPages
      summary: Get pages
      description: |-
        Returns all pages. The number of results is limited by the `limit` parameter and additional results (if available)
        will be available through the `next` URL present in the `Link` response header.

        **[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:
        Permission to access the Confluence site ('Can use' global permission).
        Only pages that the user has permission to view will be returned.
      parameters:
      - name: id
        in: query
        required: false
        description: Filter the results based on page ids. Multiple page ids can be specified as a comma-separated
          list.
        schema:
          type: array
          maxItems: 250
          items:
            type: integer
            format: int64
      - name: space-id
        in: query
        required: false
        description: Filter the results based on space ids. Multiple space ids can be specified as a comma-separated
          list.
        schema:
          type: array
          maxItems: 100
          items:
            type: integer
            format: int64
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/PageSortOrder'
      - name: status
        in: query
        required: false
        description: Filter the results to pages based on their status. By default, `current` and `archived`
          are used.
        schema:
          type: array
          items:
            type: string
            enum:
            - current
            - archived
            - deleted
            - trashed
      - name: title
        in: query
        required: false
        description: Filter the results to pages based on their title.
        schema:
          type: string
      - name: body-format
        in: query
        description: The content format types to be returned in the `body` field of the response. If available,
          the representation will be available under a response field of the same name under the `body`
          field.
        schema:
          $ref: '#/components/schemas/PrimaryBodyRepresentation'
      - name: subtype
        in: query
        required: false
        description: Filter the results to pages based on their subtype.
        schema:
          type: string
          enum:
          - live
          - page
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the
          `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set
          of results.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of pages per result to return. If more results exist, use the `Link`
          header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 25
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested pages are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<Page>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PageBulk'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: |
                This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request's URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/pages?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: |-
            Returned if the authentication credentials are incorrect or missing
            from the request.
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:page:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    post:
      tags:
      - Page
      operationId: createPage
      summary: Create page
      description: |-
        Creates a page in the space.

        Pages are created as published by default unless specified as a draft in the status field. If creating a published page, the title must be specified.

        **[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:
        Permission to view the corresponding space. Permission to create a page in the space.
      parameters:
      - name: embedded
        in: query
        description: Tag the content as embedded and content will be created in NCS.
        schema:
          type: boolean
          default: false
      - name: private
        in: query
        description: The page will be private. Only the user who creates this page will have permission
          to view and edit one.
        schema:
          type: boolean
          default: false
      - name: root-level
        in: query
        description: "The page will be created at the root level of the space (outside the space homepage\
          \ tree). If true, then a \nvalue may not be supplied for the `parentId` body parameter."
        schema:
          type: boolean
          default: false
      requestBody:
        $ref: '#/components/requestBodies/PageCreateRequest'
      responses:
        '200':
          description: Returned if the page was successfully created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageSingle'
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        base:
                          type: string
                          description: Base url of the Confluence site.
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request.
          content: {}
        '404':
          description: |-
            Returned if:
            - The space does not exist
            - The user does not have permissions to view the space
            - The user does not have the needed permissions to create a page in the provided space
        '413':
          description: Returned if the request is too large in size (over 5 MB).
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:page:confluence
      x-atlassian-connect-scope: WRITE
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
  /pages/{id}:
    get:
      tags:
      - Page
      operationId: getPageById
      summary: Get page by id
      description: |-
        Returns a specific page.

        **[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:
        Permission to view the page and its corresponding space.
      parameters:
      - name: id
        in: path
