    post:
      operationId: createCall
      tags:
        - activities.calls
      summary: Log an external Call activity
      description: >-
        Use this endpoint to log calls made outside of the Close built-in VoIP system.


        *status*: defaults to `completed`


        *direction* (optional): `outbound` or `inbound`


        *recording_url*: you can post a URL pointing to the MP3 recording of your call. For security
        reasons, we require the URL to be secure (i.e. starting with https://)


        Official Close operationId: `activities.calls_create`.

        Source: https://api.close.com/api/openapi.json
      requestBody:
        content:
          application/json:
            example:
              contact_id: cont_bulY73zoaAwTCLdjHrKzGkzZ942OwtEelJR7kNku9RK
              created_by: user_N6KhMpzHRCYQHdn4gRNIFNN5JExnsrprKA6ekxM63XA
