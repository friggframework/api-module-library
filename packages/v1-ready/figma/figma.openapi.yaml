  schemas:
    Action:
      type: object
      description: An action that is performed when a trigger is activated.
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - BACK
            - CLOSE
        required:
        - type
      - $ref: '#/components/schemas/OpenURLAction'
      - $ref: '#/components/schemas/UpdateMediaRuntimeAction'
      - $ref: '#/components/schemas/SetVariableAction'
      - $ref: '#/components/schemas/SetVariableModeAction'
      - $ref: '#/components/schemas/ConditionalAction'
      - $ref: '#/components/schemas/NodeAction'
    AfterTimeoutTrigger:
      type: object
      properties:
        type:
          type: string
          enum:
          - AFTER_TIMEOUT
        timeout:
          type: number
      required:
      - type
      - timeout
    AnnotationsTrait:
      type: object
      properties: {}
    ArcData:
      type: object
      description: Information about the arc properties of an ellipse. 0° is the x axis and increasing
        angles rotate clockwise.
      properties:
        startingAngle:
          type: number
          description: Start of the sweep in radians.
          default: 0
        endingAngle:
          type: number
          description: End of the sweep in radians.
          default: 0
        innerRadius:
          type: number
          description: Inner radius value between 0 and 1
          default: 0
          minimum: 0
          maximum: 1
      required:
      - startingAngle
      - endingAngle
      - innerRadius
    BaseBlurEffect:
      type: object
      description: Base properties shared by all blur effects
      properties:
        type:
          type: string
          description: A string literal representing the effect's type. Always check the type before reading
            other properties.
          enum:
          - LAYER_BLUR
          - BACKGROUND_BLUR
        visible:
          type: boolean
          description: Whether this blur is active.
        radius:
          type: number
          description: Radius of the blur effect
          minimum: 0
        boundVariables:
          type: object
          description: The variables bound to a particular field on this blur effect
          properties:
            radius:
              $ref: '#/components/schemas/VariableAlias'
      required:
      - type
      - visible
      - radius
    BaseNoiseEffect:
      type: object
      description: A noise effect
      properties:
        type:
          type: string
          description: The string literal 'NOISE' representing the effect's type. Always check the type
            before reading other properties.
          enum:
          - NOISE
        color:
          $ref: '#/components/schemas/RGBA'
          description: The color of the noise effect
        visible:
          type: boolean
          description: Whether the noise effect is visible.
        blendMode:
          $ref: '#/components/schemas/BlendMode'
          description: Blend mode of the noise effect
        noiseSize:
          type: number
          description: The size of the noise effect
        density:
          type: number
          description: The density of the noise effect
      required:
      - type
      - color
      - visible
      - noiseSize
      - density
      - blendMode
    BasePaint:
      type: object
      properties:
        visible:
          type: boolean
          description: Is the paint enabled?
          default: true
        opacity:
          type: number
          description: Overall opacity of paint (colors within the paint can also have opacity values
            which would blend with this)
          minimum: 0
          maximum: 1
          default: 1
        blendMode:
          $ref: '#/components/schemas/BlendMode'
          description: How this node blends with nodes behind it in the scene
      required:
      - blendMode
    BaseShadowEffect:
      type: object
      description: Base properties shared by all shadow effects
      properties:
        color:
          $ref: '#/components/schemas/RGBA'
          description: The color of the shadow
        blendMode:
          $ref: '#/components/schemas/BlendMode'
          description: Blend mode of the shadow
        offset:
          $ref: '#/components/schemas/Vector'
          description: How far the shadow is projected in the x and y directions
        radius:
          type: number
          description: Radius of the blur effect (applies to shadows as well)
          minimum: 0
        spread:
          type: number
          description: 'The distance by which to expand (or contract) the shadow.


            For drop shadows, a positive `spread` value creates a shadow larger than the node, whereas
            a negative value creates a shadow smaller than the node.


            For inner shadows, a positive `spread` value contracts the shadow. Spread values are only
            accepted on rectangles and ellipses, or on frames, components, and instances with visible
            fill paints and `clipsContent` enabled. When left unspecified, the default value is 0.'
          default: 0
        visible:
          type: boolean
          description: Whether this shadow is visible.
        boundVariables:
          type: object
          description: The variables bound to a particular field on this shadow effect
          properties:
            radius:
              $ref: '#/components/schemas/VariableAlias'
            spread:
              $ref: '#/components/schemas/VariableAlias'
            color:
              $ref: '#/components/schemas/VariableAlias'
            offsetX:
              $ref: '#/components/schemas/VariableAlias'
            offsetY:
              $ref: '#/components/schemas/VariableAlias'
      required:
      - color
      - blendMode
      - offset
      - radius
      - visible
    BaseTypeStyle:
      type: object
      properties:
        fontFamily:
          type: string
          description: Font family of text (standard name).
        fontPostScriptName:
          type:
          - string
          - 'null'
          description: PostScript font name.
        fontStyle:
          type: string
          description: Describes visual weight or emphasis, such as Bold or Italic.
        italic:
          type: boolean
          description: Whether or not text is italicized.
          default: false
        fontWeight:
          type: number
          description: Numeric font weight.
        fontSize:
          type: number
          description: Font size in px.
        textCase:
          type: string
          description: Text casing applied to the node, default is the original casing.
          enum:
          - ORIGINAL
          - UPPER
          - LOWER
          - TITLE
          - SMALL_CAPS
          - SMALL_CAPS_FORCED
        textAlignHorizontal:
          type: string
          description: Horizontal text alignment as string enum.
          enum:
          - LEFT
          - RIGHT
          - CENTER
          - JUSTIFIED
        textAlignVertical:
          type: string
          description: Vertical text alignment as string enum.
          enum:
          - TOP
          - CENTER
          - BOTTOM
        letterSpacing:
          type: number
          description: Space between characters in px.
        fills:
          type: array
          items:
            $ref: '#/components/schemas/Paint'
          description: An array of fill paints applied to the characters.
        hyperlink:
          $ref: '#/components/schemas/Hyperlink'
          description: Link to a URL or frame.
        opentypeFlags:
          type: object
          additionalProperties:
            type: number
          description: A map of OpenType feature flags to 1 or 0, 1 if it is enabled and 0 if it is disabled.
            Note that some flags aren't reflected here. For example, SMCP (small caps) is still represented
            by the `textCase` field.
        semanticWeight:
          type: string
          description: Indicates how the font weight was overridden when there is a text style override.
          enum:
          - BOLD
          - NORMAL
        semanticItalic:
          type: string
          description: Indicates how the font style was overridden when there is a text style override.
          enum:
          - ITALIC
          - NORMAL
    BlendMode:
      type: string
      description: 'This type is a string enum with the following possible values


        Normal blends:

        - `PASS_THROUGH` (only applicable to objects with children)

        - `NORMAL`


        Darken:

        - `DARKEN`

        - `MULTIPLY`

        - `LINEAR_BURN`

        - `COLOR_BURN`


        Lighten:

        - `LIGHTEN`

        - `SCREEN`

        - `LINEAR_DODGE`

        - `COLOR_DODGE`


        Contrast:

        - `OVERLAY`

        - `SOFT_LIGHT`

        - `HARD_LIGHT`


        Inversion:

        - `DIFFERENCE`

        - `EXCLUSION`


        Component:

        - `HUE`

        - `SATURATION`

        - `COLOR`

        - `LUMINOSITY`'
      enum:
      - PASS_THROUGH
      - NORMAL
      - DARKEN
      - MULTIPLY
      - LINEAR_BURN
      - COLOR_BURN
      - LIGHTEN
      - SCREEN
      - LINEAR_DODGE
