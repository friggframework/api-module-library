  /v1/oauth/revoke:
    post:
      description: 'Revoke an access token or a refresh token.


        If you revoke a _refresh token_, be aware that:


        - The refresh token''s lineage is also revoked. This means that access tokens created from that
        refresh token are also revoked.

        - The user''s consent for your app is also revoked. This means that the user must go through the
        OAuth process again to use your app.


        Requests to this endpoint require authentication with your client ID and client secret, using
        _one_ of the following methods:


        - **Basic access authentication** (Recommended): For [basic access authentication](https://en.wikipedia.org/wiki/Basic_access_authentication),
        the `{credentials}` string must be a Base64 encoded value of `{client id}:{client secret}`.

