# Asana Platform - Fenestra Specification
fenestra: "1.0.0"
platform:
  name: Asana
  description: All varieties of available Asana UI extensibility, from Custom Fields and Rules to App Components, Forms, Goals integration, and Project templates
  version: "1.0"
  baseUrl: "https://app.asana.com/api/1.0"
  documentation: "https://developers.asana.com"
  marketplace: "https://asana.com/apps"
  support: "https://developers.asana.com/docs"

extensionTypes:
  app-component:
    name: App Components
    description: Interactive UI components that appear in various locations within Asana
    contexts:
      - task-details
      - project-sidebar
      - inbox-sidebar
      - rule-builder
      - form-builder
    rendering:
      - iframe
      - web-component
      - react-component
    communication:
      - postmessage-api
      - rest-api
      - webhook-callbacks
    capabilities:
      - task-data-access
      - project-data-access
      - user-interaction
      - data-modification
    triggers:
      - task-open
      - project-view
      - user-action
      - data-change
    examples:
      - name: Time Tracking Widget
        description: Component for tracking time spent on tasks
        placement: "task-details"
      - name: Resource Planning Dashboard
        description: Project resource allocation component
        placement: "project-sidebar"
        
  custom-field:
    name: Custom Fields
    description: Extended data fields that can be added to tasks and projects
    contexts:
      - task-properties
      - project-properties
      - portfolio-properties
      - goal-properties
    rendering:
      - field-input
      - field-display
      - field-validation
    communication:
      - field-api
      - custom-field-settings
    capabilities:
      - data-storage
      - field-validation
      - conditional-logic
      - reporting-integration
    triggers:
      - field-creation
      - value-change
      - form-submission
    examples:
      - name: Priority Score Field
        description: Numeric field for task prioritization
        fieldType: "number"
      - name: Customer Segment
        description: Dropdown for customer categorization
        fieldType: "enum"
        
  rule-automation:
    name: Rules (Automation)
    description: Automated workflows that trigger based on conditions and perform actions
    contexts:
      - project-automation
      - task-automation
      - portfolio-automation
    rendering:
      - rule-builder-ui
      - trigger-configuration
      - action-configuration
    communication:
      - rule-engine
      - webhook-actions
      - api-actions
    capabilities:
      - conditional-logic
      - automated-actions
      - external-integration
      - notification-sending
    triggers:
      - task-completion
      - field-change
      - assignment-change
      - due-date-approaching
    examples:
      - name: Auto-assign by Priority
        description: Automatically assigns high priority tasks to specific team members
        triggerType: "field-change"
      - name: Slack Notification Rule
        description: Sends Slack messages when tasks are completed
        actionType: "webhook"
        
  form-integration:
    name: Forms
    description: Custom intake forms that create tasks and projects
    contexts:
      - external-websites
      - request-intake
      - project-creation
      - survey-collection
    rendering:
      - embedded-form
      - standalone-form
      - modal-form
    communication:
      - form-api
      - submission-webhooks
      - task-creation-api
    capabilities:
      - form-building
      - field-validation
      - conditional-fields
      - file-uploads
    triggers:
      - form-submission
      - field-validation
      - conditional-display
    examples:
      - name: Bug Report Form
        description: External form for collecting bug reports
        targetType: "task-creation"
      - name: Project Request Form
        description: Internal form for requesting new projects
        targetType: "project-creation"
        
  proofing-annotation:
    name: Proofing
    description: Visual annotation and feedback system for creative assets
    contexts:
      - task-attachments
      - project-assets
      - creative-review
    rendering:
      - annotation-overlay
      - comment-system
      - version-comparison
    communication:
      - proofing-api
      - comment-api
      - attachment-api
    capabilities:
      - visual-annotation
      - comment-threading
      - version-tracking
      - approval-workflow
    triggers:
      - asset-upload
      - annotation-creation
      - approval-request
    examples:
      - name: Design Review Tool
        description: Annotation system for design assets
        assetTypes: ["image", "pdf", "video"]
        
  portfolio-dashboard:
    name: Portfolio Dashboards
    description: Custom views and metrics for portfolio management
    contexts:
      - portfolio-overview
      - executive-dashboard
      - team-performance
    rendering:
      - dashboard-widgets
      - chart-components
      - metric-displays
    communication:
      - portfolio-api
      - project-data-api
      - reporting-api
    capabilities:
      - data-aggregation
      - custom-metrics
      - visualization
      - drill-down-analysis
    triggers:
      - portfolio-load
      - data-refresh
      - filter-change
    examples:
      - name: Project Health Dashboard
        description: Overview of all project statuses and health metrics
        metrics: ["completion", "timeline", "resource-allocation"]
        
  goal-tracking:
    name: Goals Integration
    description: Custom goal tracking and OKR management components
    contexts:
      - goal-pages
      - team-objectives
      - progress-tracking
    rendering:
      - progress-bars
      - metric-widgets
      - goal-hierarchy
    communication:
      - goals-api
      - progress-api
      - team-api
    capabilities:
      - goal-creation
      - progress-tracking
      - alignment-mapping
      - reporting
    triggers:
      - goal-creation
      - progress-update
      - milestone-achievement
    examples:
      - name: OKR Dashboard
        description: Quarterly objectives and key results tracking
        framework: "okr"
      - name: Sales Pipeline Tracker
        description: Revenue goal tracking with pipeline integration
        integrations: ["salesforce", "hubspot"]
        
  timeline-view:
    name: Timeline & Gantt Views
    description: Custom project timeline and dependency management
    contexts:
      - project-timeline
      - portfolio-timeline
      - resource-planning
    rendering:
      - gantt-chart
      - timeline-visualization
      - dependency-mapping
    communication:
      - timeline-api
      - task-dependencies-api
      - project-api
    capabilities:
      - dependency-management
      - critical-path-analysis
      - resource-allocation
      - milestone-tracking
    triggers:
      - timeline-change
      - dependency-update
      - milestone-completion
    examples:
      - name: Project Dependencies Visualizer
        description: Interactive dependency mapping for complex projects
        features: ["critical-path", "resource-conflicts"]

communication:
  rest-api:
    description: RESTful API for data access and manipulation
    baseUrl: "https://app.asana.com/api/1.0"
    authentication:
      - oauth2
      - personal-access-token
    rateLimit: "1500 requests per minute"
    features:
      - crud-operations
      - batch-requests
      - pagination
      - webhooks
    
  webhook-events:
    description: Real-time notifications for resource changes
    events:
      - task-added
      - task-changed
      - task-deleted
      - project-added
      - project-changed
      - story-added
    delivery: "https"
    verification: "hmac-sha256"
    
  app-components-api:
    description: API for building interactive app components
    features:
      - iframe-communication
      - context-data-access
      - user-authentication
      - action-callbacks
    authentication: "oauth2-context"
    
  custom-fields-api:
    description: API for managing custom field definitions and values
    features:
      - field-creation
      - value-management
      - validation-rules
      - reporting-integration
    
  attachment-api:
    description: API for file and asset management
    features:
      - file-upload
      - url-attachment
      - thumbnail-generation
      - version-control

authentication:
  oauth2:
    authorizationUrl: "https://app.asana.com/-/oauth_authorize"
    tokenUrl: "https://app.asana.com/-/oauth_token"
    scopes:
      - default: "Read access to most resources"
      - openid: "OpenID Connect access"
      - email: "Access to user email"
      - profile: "Access to user profile"
    flow: "authorization_code"
    
  personal-access-token:
    description: "Long-lived tokens for server-to-server access"
    location: "header"
    parameter: "Authorization"
    format: "Bearer {token}"
    usage: "api-access"
    
  app-authentication:
    description: "App-specific authentication for components"
    context: "iframe-embedded"
    verification: "signed-request"

deployment:
  app-directory:
    name: "Asana App Directory"
    url: "https://asana.com/apps"
    reviewProcess: true
    categories:
      - productivity
      - project-management
      - time-tracking
      - reporting
      - communication
      - integrations
    
  private-app:
    name: "Private Apps"
    scope: "organization-specific"
    installation: "admin-approved"
    distribution: "internal-only"
    
  webhook-integration:
    name: "Webhook-based Integration"
    deployment: "external-service"
    communication: "webhook-callbacks"
    hosting: "self-hosted"

sdks:
  javascript-sdk:
    name: "Asana JavaScript SDK"
    url: "https://github.com/Asana/node-asana"
    platforms:
      - nodejs
      - browser
    features:
      - api-client
      - oauth-helpers
      - webhook-verification
    
  python-sdk:
    name: "Asana Python SDK"
    url: "https://github.com/Asana/python-asana"
    features:
      - api-client
      - pagination-helpers
      - error-handling
    
  app-components-sdk:
    name: "App Components SDK"
    description: "JavaScript SDK for building app components"
    features:
      - iframe-communication
      - context-access
      - ui-helpers
      - authentication
    
  webhook-toolkit:
    name: "Webhook Development Toolkit"
    features:
      - webhook-verification
      - event-parsing
      - retry-logic
      - testing-utilities

examples:
  time-tracking-integration:
    name: "Time Tracking Integration"
    description: "Complete time tracking solution with timer and reporting"
    types:
      - app-component
      - custom-field
      - rule-automation
    features:
      - timer-widget
      - time-custom-fields
      - automated-time-reports
    
  crm-integration:
    name: "CRM Integration Suite"
    description: "Bidirectional sync with popular CRM systems"
    types:
      - app-component
      - custom-field
      - webhook-integration
    features:
      - contact-sync
      - deal-tracking
      - sales-pipeline-visibility
    
  creative-review-workflow:
    name: "Creative Review Workflow"
    description: "End-to-end creative asset review and approval process"
    types:
      - proofing-annotation
      - rule-automation
      - form-integration
    features:
      - visual-feedback
      - approval-routing
      - version-control
    
  okr-management:
    name: "OKR Management System"
    description: "Quarterly objectives and key results tracking"
    types:
      - goal-tracking
      - portfolio-dashboard
      - custom-field
    features:
      - goal-hierarchy
      - progress-tracking
      - alignment-reporting

tags:
  - project-management
  - task-management
  - team-collaboration
  - workflow-automation
  - productivity
  - goal-tracking

x-asana-api-version: "1.0"
x-asana-app-framework: "components"
x-asana-webhook-version: "1.0"