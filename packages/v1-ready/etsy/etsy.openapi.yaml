openapi: 3.0.2
info:
  title: Etsy Open API v3 (Frigg curated subset)
  version: 1.0.0
  description: >-
    Curated subset of the Etsy Open API v3 for @friggframework/api-module-etsy.
    Derived from the official OpenAPI at
    https://www.etsy.com/openapi/generated/oas/3.0.0.json and
    https://developers.etsy.com/documentation/reference/. operationIds match
    Frigg Api method names and the vendor operationIds. Server URL equals the
    client baseUrl (https://api.etsy.com/v3/application); paths are relative to
    that base (vendor OAS uses https://openapi.etsy.com with /v3/application
    prefixes).
  contact:
    name: Frigg Framework
    url: https://friggframework.org
servers:
  - url: https://api.etsy.com/v3/application
security:
  - api_key: []
  - oauth2: []
tags:
  - name: Other
  - name: User
  - name: Shop
  - name: ShopListing
  - name: Shop Receipt
  - name: Shop Receipt Transactions
  - name: Payment
paths:
  /openapi-ping:
    get:
      operationId: ping
      tags: [Other]
      summary: Check Open API availability
      description: >-
        Official operationId `ping`. Source:
        https://www.etsy.com/openapi/generated/oas/3.0.0.json
      security:
        - api_key: []
      responses:
        '200':
          description: API is reachable
  /users/me:
    get:
      operationId: getMe
      tags: [User]
      summary: Get the authenticated user (Self)
      description: >-
        Returns user_id and shop_id for the authorizing user. Scope: shops_r.
        Official operationId `getMe`.
      security:
        - api_key: []
          oauth2: [shops_r]
      responses:
        '200':
          description: Self
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Self'
  /users/{user_id}:
    get:
      operationId: getUser
      tags: [User]
      summary: Get a user by id
      description: "Official operationId `getUser`. Scope: email_r."
      security:
        - api_key: []
          oauth2: [email_r]
      parameters:
        - $ref: '#/components/parameters/user_id'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /users/{user_id}/shops:
    get:
      operationId: getShopByOwnerUserId
      tags: [Shop]
      summary: Get the shop owned by a user
      description: "Official operationId `getShopByOwnerUserId`."
      parameters:
        - $ref: '#/components/parameters/user_id'
      responses:
        '200':
          description: Shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
  /shops:
    get:
      operationId: findShops
      tags: [Shop]
      summary: Search shops
      description: "Official operationId `findShops`."
      parameters:
        - name: shop_name
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Shop list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shops'
  /shops/{shop_id}:
    get:
      operationId: getShop
      tags: [Shop]
      summary: Get a shop
      description: "Official operationId `getShop`."
      parameters:
        - $ref: '#/components/parameters/shop_id'
      responses:
        '200':
          description: Shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
    put:
      operationId: updateShop
      tags: [Shop]
      summary: Update a shop
      description: "Official operationId `updateShop`. Scopes: shops_r, shops_w."
      security:
        - api_key: []
          oauth2: [shops_r, shops_w]
      parameters:
        - $ref: '#/components/parameters/shop_id'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
  /shops/{shop_id}/listings:
    get:
      operationId: getListingsByShop
      tags: [ShopListing]
      summary: List listings for a shop
      description: "Official operationId `getListingsByShop`. Scope: listings_r."
      security:
        - api_key: []
          oauth2: [listings_r]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - name: state
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: sort_on
          in: query
          schema: { type: string }
        - name: sort_order
          in: query
          schema: { type: string }
        - name: includes
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Listing list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopListings'
    post:
      operationId: createDraftListing
      tags: [ShopListing]
      summary: Create a draft listing
      description: "Official operationId `createDraftListing`. Scope: listings_w."
      security:
        - api_key: []
          oauth2: [listings_w]
      parameters:
        - $ref: '#/components/parameters/shop_id'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [quantity, title, description, price, who_made, when_made, taxonomy_id]
              properties:
                quantity: { type: integer }
                title: { type: string }
                description: "{ type: string }"
                price: { type: number }
                who_made: { type: string }
                when_made: { type: string }
                taxonomy_id: { type: integer }
              additionalProperties: true
      responses:
        '201':
          description: Created draft listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopListing'
  /shops/{shop_id}/listings/active:
    get:
      operationId: findAllActiveListingsByShop
      tags: [ShopListing]
      summary: List active listings for a shop
      description: "Official operationId `findAllActiveListingsByShop`."
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Active listings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopListings'
  /shops/{shop_id}/listings/{listing_id}:
    patch:
      operationId: updateListing
      tags: [ShopListing]
      summary: Update a listing
      description: "Official operationId `updateListing`. Scope: listings_w."
      security:
        - api_key: []
          oauth2: [listings_w]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - $ref: '#/components/parameters/listing_id'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopListing'
  /listings/{listing_id}:
    get:
      operationId: getListing
      tags: [ShopListing]
      summary: Get a listing
      description: "Official operationId `getListing`."
      parameters:
        - $ref: '#/components/parameters/listing_id'
        - name: includes
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopListing'
    delete:
      operationId: deleteListing
      tags: [ShopListing]
      summary: Delete a listing
      description: "Official operationId `deleteListing`. Scope: listings_d."
      security:
        - api_key: []
          oauth2: [listings_d]
      parameters:
        - $ref: '#/components/parameters/listing_id'
      responses:
        '204':
          description: Deleted
  /shops/{shop_id}/receipts:
    get:
      operationId: getShopReceipts
      tags: [Shop Receipt]
      summary: List shop receipts (orders)
      description: "Official operationId `getShopReceipts`. Scope: transactions_r."
      security:
        - api_key: []
          oauth2: [transactions_r]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - name: min_created
          in: query
          schema: { type: integer }
        - name: max_created
          in: query
          schema: { type: integer }
        - name: min_last_modified
          in: query
          schema: { type: integer }
        - name: max_last_modified
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
        - name: sort_on
          in: query
          schema: { type: string }
        - name: sort_order
          in: query
          schema: { type: string }
        - name: was_paid
          in: query
          schema: { type: boolean }
        - name: was_shipped
          in: query
          schema: { type: boolean }
        - name: was_delivered
          in: query
          schema: { type: boolean }
        - name: was_canceled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Receipt list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopReceipts'
  /shops/{shop_id}/receipts/{receipt_id}:
    get:
      operationId: getShopReceipt
      tags: [Shop Receipt]
      summary: Get a shop receipt
      description: "Official operationId `getShopReceipt`. Scope: transactions_r."
      security:
        - api_key: []
          oauth2: [transactions_r]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - $ref: '#/components/parameters/receipt_id'
      responses:
        '200':
          description: Receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopReceipt'
    put:
      operationId: updateShopReceipt
      tags: [Shop Receipt]
      summary: Update a shop receipt
      description: "Official operationId `updateShopReceipt`. Scope: transactions_w."
      security:
        - api_key: []
          oauth2: [transactions_w]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - $ref: '#/components/parameters/receipt_id'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                was_shipped: { type: boolean }
                was_paid: { type: boolean }
              additionalProperties: true
      responses:
        '200':
          description: Updated receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopReceipt'
  /shops/{shop_id}/receipts/{receipt_id}/tracking:
    post:
      operationId: createReceiptShipment
      tags: [Shop Receipt]
      summary: Submit tracking for a receipt
      description: "Official operationId `createReceiptShipment`. Scope: transactions_w."
      security:
        - api_key: []
          oauth2: [transactions_w]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - $ref: '#/components/parameters/receipt_id'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                tracking_code: { type: string }
                carrier_name: { type: string }
                send_bcc: { type: boolean }
              additionalProperties: true
      responses:
        '200':
          description: Shipment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopReceipt'
  /shops/{shop_id}/receipts/{receipt_id}/transactions:
    get:
      operationId: getShopReceiptTransactionsByReceipt
      tags: [Shop Receipt Transactions]
      summary: List transactions for a receipt
      description: "Official operationId `getShopReceiptTransactionsByReceipt`. Scope: transactions_r."
      security:
        - api_key: []
          oauth2: [transactions_r]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - $ref: '#/components/parameters/receipt_id'
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopReceiptTransactions'
  /shops/{shop_id}/receipts/{receipt_id}/payments:
    get:
      operationId: getShopPaymentByReceiptId
      tags: [Payment]
      summary: Get payments for a receipt
      description: "Official operationId `getShopPaymentByReceiptId`. Scope: transactions_r."
      security:
        - api_key: []
          oauth2: [transactions_r]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - $ref: '#/components/parameters/receipt_id'
      responses:
        '200':
          description: Payment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments'
  /shops/{shop_id}/transactions:
    get:
      operationId: getShopReceiptTransactionsByShop
      tags: [Shop Receipt Transactions]
      summary: List transactions for a shop
      description: "Official operationId `getShopReceiptTransactionsByShop`. Scope: transactions_r."
      security:
        - api_key: []
          oauth2: [transactions_r]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopReceiptTransactions'
  /shops/{shop_id}/transactions/{transaction_id}:
    get:
      operationId: getShopReceiptTransaction
      tags: [Shop Receipt Transactions]
      summary: Get a shop receipt transaction
      description: "Official operationId `getShopReceiptTransaction`. Scope: transactions_r."
      security:
        - api_key: []
          oauth2: [transactions_r]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopReceiptTransaction'
  /shops/{shop_id}/payments:
    get:
      operationId: getPayments
      tags: [Payment]
      summary: Get payments by id for a shop
      description: >-
        Official operationId `getPayments`. Scope: transactions_r.
        Requires `payment_ids` query parameter.
      security:
        - api_key: []
          oauth2: [transactions_r]
      parameters:
        - $ref: '#/components/parameters/shop_id'
        - name: payment_ids
          in: query
          required: true
          schema:
            type: array
            items: { type: integer }
          style: form
          explode: true
      responses:
        '200':
          description: Payment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments'
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
      description: >-
        Format `keystring:shared_secret` per
        https://developers.etsy.com/documentation/essentials/authentication
    oauth2:
      type: oauth2
      description: OAuth 2.0 Authorization Code + PKCE (S256)
      flows:
        authorizationCode:
          authorizationUrl: https://www.etsy.com/oauth/connect
          tokenUrl: https://api.etsy.com/v3/public/oauth/token
          scopes:
            address_r: see billing and shipping addresses
            address_w: update billing and shipping addresses
            email_r: read a user profile
            listings_d: delete listings
            listings_r: see all listings (including expired etc)
            listings_w: create/edit listings
            profile_r: see all profile data
            profile_w: update user profile, avatar, etc
            shops_r: see private shop info
            shops_w: update shop
            transactions_r: see all checkout/payment data
            transactions_w: update receipts
  parameters:
    shop_id:
      name: shop_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    user_id:
      name: user_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    listing_id:
      name: listing_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    receipt_id:
      name: receipt_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    transaction_id:
      name: transaction_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  schemas:
    Self:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        shop_id: { type: integer, format: int64 }
    User:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        primary_email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        image_url_75x75: { type: string }
    Shop:
      type: object
      properties:
        shop_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        shop_name: { type: string }
        title: { type: string }
        currency_code: { type: string }
        url: { type: string }
    Shops:
      type: object
      properties:
        count: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/Shop' }
    ShopListing:
      type: object
      properties:
        listing_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        shop_id: { type: integer, format: int64 }
        title: { type: string }
        description: "{ type: string }"
        state: { type: string }
        url: { type: string }
        quantity: { type: integer }
    ShopListings:
      type: object
      properties:
        count: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/ShopListing' }
    Money:
      type: object
      properties:
        amount: { type: integer }
        divisor: { type: integer }
        currency_code: { type: string }
    ShopReceipt:
      type: object
      properties:
        receipt_id: { type: integer, format: int64 }
        receipt_type: { type: integer }
        seller_user_id: { type: integer, format: int64 }
        buyer_user_id: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string }
        is_paid: { type: boolean }
        is_shipped: { type: boolean }
        created_timestamp: { type: integer }
        updated_timestamp: { type: integer }
        grandtotal: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
    ShopReceipts:
      type: object
      properties:
        count: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/ShopReceipt' }
    ShopReceiptTransaction:
      type: object
      properties:
        transaction_id: { type: integer, format: int64 }
        title: { type: string }
        seller_user_id: { type: integer, format: int64 }
        buyer_user_id: { type: integer, format: int64 }
        receipt_id: { type: integer, format: int64 }
        listing_id: { type: integer, format: int64 }
        quantity: { type: integer }
        price: { $ref: '#/components/schemas/Money' }
    ShopReceiptTransactions:
      type: object
      properties:
        count: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/ShopReceiptTransaction' }
    Payment:
      type: object
      properties:
        payment_id: { type: integer, format: int64 }
        buyer_user_id: { type: integer, format: int64 }
        shop_id: { type: integer, format: int64 }
        receipt_id: { type: integer, format: int64 }
        status: { type: string }
        currency: { type: string }
        amount_gross: { $ref: '#/components/schemas/Money' }
        amount_fees: { $ref: '#/components/schemas/Money' }
        amount_net: { $ref: '#/components/schemas/Money' }
    Payments:
      type: object
      properties:
        count: { type: integer }
        results:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
