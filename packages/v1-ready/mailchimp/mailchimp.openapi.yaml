components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2 access token. Marketing API calls use `Authorization: Bearer <access_token>`
        per Mailchimp OAuth docs (https://mailchimp.com/developer/marketing/guides/access-user-data-oauth-2/).
        The OAuth metadata endpoint uses `Authorization: OAuth <token>` instead.'
    basicAuth:
      type: http
      scheme: basic
      description: 'API-key path from vendor swagger securityDefinitions.basicAuth: HTTP Basic with username
        `anystring` and password = API key. Used only when no OAuth access_token is present.'
