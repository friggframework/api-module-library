  /v1/oidc/userinfo:
    get:
      description: 'Fetches the current UserInfo claims for the authorized user. This is the same fields

        returned by a id_token returns during authorization.


        The claims returned depend on the granted scopes: `profile` claims (`name`, `given_name`,

        `family_name`) are only returned when the `profile` scope is granted, and `email` claims

        (`email`, `email_verified`) are only returned when the `email` scope is granted. The

        `openid` scope is always required.'
      operationId: userInfo
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - openid
        - profile
        - email
      - oauthAuthCode:
        - openid
        - profile
      - oauthAuthCode:
        - openid
        - email
      tags:
      - oidc
      x-rate-limit-per-client-user: 10
  /v1/users/me:
    get:
      description: 'Returns the User ID and Team ID of the user

        account associated with the provided access token.'
      operationId: usersMe
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersMeResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode: []
      tags:
      - user
      x-rate-limit-per-client-user: 10
  /v1/users/me/profile:
    get:
      description: Currently, this returns the display name of the user account associated with the provided
        access token. More user information is expected to be included in the future.
      operationId: getUserProfile
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
          description: OK
        '404':
          content:
            application/json:
              examples:
                user_not_found:
                  $ref: '#/components/examples/UserNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - profile:read
      tags:
      - user
      x-rate-limit-per-client-user: 10
components:
  securitySchemes:
    basicAuth:
      scheme: basic
      type: http
    oauthAuthCode:
      flows:
        authorizationCode:
          authorizationUrl: https://www.canva.com/api/oauth/authorize
          scopes:
            design:content:read: View the contents of the user's designs.
            design:meta:read: View the metadata of the user's designs.
            design:content:write: Create designs on the user's behalf.
            folder:read: 'View the metadata and contents of the user''s folders, including their **Projects**

              folder.'
            folder:write: 'Add, move, or remove the user''s folders. It also lets you edit folder metadata,

              such as the folder''s name.'
            folder:permission:write: Set, update, or remove permissions assigned to the user's folders.
            asset:read: View the metadata for the user's assets, such as uploaded images.
            asset:write: Upload, update, or delete assets on the user's behalf.
            comment:read: View the comments on the user's designs, and the associated metadata.
            comment:write: Create comments and replies on the user's designs.
            collaboration:event: Receive webhook notifications about events relevant to the user.
            brandtemplate:meta:read: View the metadata of the brand templates associated with the user's
              brand.
            brandtemplate:content:read: Read the content of the brand templates associated with the user's
              brand.
            brandtemplate:content:write: Publish brand templates associated with the user's brand.
            profile:read: Read a user's profile and account information.
            openid: Read user information through Open ID Connect (OIDC).
            profile: Read user profile information through OIDC.
            email: Read user email address through OIDC.
          tokenUrl: https://api.canva.com/rest/v1/oauth/token
      type: oauth2
  schemas:
    Asset:
      description: The asset object, which contains metadata about the asset.
      properties:
        type:
          $ref: '#/components/schemas/AssetType'
        id:
          description: The ID of the asset.
          example: Msd59349ff
          type: string
        name:
          description: The name of the asset.
          example: My Awesome Upload
          type: string
        tags:
          description: 'The user-facing tags attached to the asset.

            Users can add these tags to their uploaded assets, and they can search their uploaded

            assets in the Canva UI by searching for these tags. For information on how users use

            tags, see the

            [Canva Help Center page on asset tags](https://www.canva.com/help/add-edit-tags/).'
          example:
          - image
          - holiday
          - best day ever
          items:
            type: string
          type: array
        import_status:
          $ref: '#/components/schemas/ImportStatus'
        created_at:
          description: 'When the asset was added to Canva, as a Unix timestamp (in seconds since the Unix

            Epoch).'
          example: 1377396000
          format: int64
          type: integer
        updated_at:
          description: 'When the asset was last updated in Canva, as a Unix timestamp (in seconds since
            the

            Unix Epoch).'
          example: 1692928800
          format: int64
          type: integer
        owner:
          $ref: '#/components/schemas/TeamUserSummary'
        thumbnail:
          $ref: '#/components/schemas/Thumbnail'
        metadata:
          $ref: '#/components/schemas/AssetMetadata'
      required:
      - created_at
      - id
      - name
      - owner
      - tags
      - type
      - updated_at
      type: object
    AssetMetadata:
      description: Type-specific metadata for the asset.
      discriminator:
        mapping:
          image: '#/components/schemas/ImageMetadata'
          video: '#/components/schemas/VideoMetadata'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/ImageMetadata'
      - $ref: '#/components/schemas/VideoMetadata'
      type: object
    AssetSummary:
      description: An object representing an asset with associated metadata.
      properties:
        type:
          $ref: '#/components/schemas/AssetType'
        id:
          description: The ID of the asset.
          example: Msd59349ff
          type: string
        name:
          description: The name of the asset.
          example: My Awesome Upload
          type: string
        tags:
          description: 'The user-facing tags attached to the asset.

            Users can add these tags to their uploaded assets, and they can search their uploaded

            assets in the Canva UI by searching for these tags. For information on how users use

            tags, see the

            [Canva Help Center page on asset tags](https://www.canva.com/help/add-edit-tags/).'
          example:
          - image
          - holiday
          - best day ever
          items:
            type: string
          type: array
        created_at:
          description: 'When the asset was added to Canva, as a Unix timestamp (in seconds since the Unix

            Epoch).'
          example: 1377396000
          format: int64
          type: integer
        updated_at:
          description: 'When the asset was last updated in Canva, as a Unix timestamp (in seconds since
            the

            Unix Epoch).'
          example: 1692928800
          format: int64
          type: integer
        thumbnail:
          $ref: '#/components/schemas/Thumbnail'
      required:
      - created_at
      - id
      - name
      - tags
      - type
      - updated_at
      type: object
    AssetType:
      description: Type of an asset.
      enum:
      - image
      - video
      example: image
      type: string
    AssetUploadError:
      description: If the upload fails, this object provides details about the error.
      properties:
        code:
          $ref: '#/components/schemas/AssetUploadErrorCode'
        message:
          description: A human-readable description of what went wrong.
          example: Failed to import because the file is too big.
          type: string
      required:
      - code
      - message
      type: object
    AssetUploadErrorCode:
      description: 'A short string indicating why the upload failed. This field can be used to handle
        errors

        programmatically.'
      enum:
      - file_too_big
      - import_failed
      - fetch_failed
      example: file_too_big
      type: string
    AssetUploadJob:
      description: The status of the asset upload job.
      example:
        id: e08861ae-3b29-45db-8dc1-1fe0bf7f1cc8
        status: success
        asset:
          id: Msd59349ff
          type: image
          name: My Awesome Upload
          tags:
          - image
          - holiday
          - best day ever
          owner:
            user_id: oU123456AbCdE
            team_id: oB123456AbCdE
          created_at: 1377396000
          updated_at: 1692928800
          thumbnail:
            width: 595
            height: 335
            url: https://document-export.canva.com/Vczz9/zF9vzVtdADc/2/thumbnail/0001.png?<query-string>
      properties:
        id:
          description: The ID of the asset upload job.
          example: e08861ae-3b29-45db-8dc1-1fe0bf7f1cc8
          type: string
        status:
          $ref: '#/components/schemas/AssetUploadStatus'
        error:
          $ref: '#/components/schemas/AssetUploadError'
        asset:
          $ref: '#/components/schemas/Asset'
      required:
      - id
      - status
      type: object
    AssetUploadMetadata:
      description: Metadata for the asset being uploaded.
      properties:
        name_base64:
          description: 'The asset''s name, encoded in Base64.


            The maximum length of an asset name in Canva (unencoded) is 50 characters.


            Base64 encoding allows names containing emojis and other special

            characters to be sent using HTTP headers.

            For example, "My Awesome Upload 🚀" Base64 encoded

            is `TXkgQXdlc29tZSBVcGxvYWQg8J+agA==`.'
          example: TXkgQXdlc29tZSBVcGxvYWQg8J+agA==
          minLength: 1
          type: string
      required:
      - name_base64
      type: object
    AssetUploadStatus:
      description: Status of the asset upload job.
      enum:
      - failed
      - in_progress
      - success
      example: success
      type: string
    BrandTemplateCreateDesignRequest:
      description: '<Warning>


        Creating a copy from a brand template is currently provided as a preview. Be aware of the following:


        - There might be unannounced breaking changes.

        - Any breaking changes to preview features won''t produce a new [API version](https://www.canva.dev/docs/apps/rest-apis/versions/).

        - Public apps that use preview features will not pass the review process, and can''t be made available
        to all Canva users.


        </Warning>


        Body parameters for creating a copy from a brand template.'
      properties:
        type:
          enum:
          - brand_template
          type: string
        brand_template_id:
          description: The ID of the brand template used to create a design copy.
          example: EDMzWSwy3BI
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        page_numbers:
          description: 'The pages to copy from the brand template. If not specified, all pages are copied.

            Pages are indexed using one-based numbering.'
          items:
            format: int32
            minimum: 1
            type: integer
          minItems: 1
          type: array
      required:
      - brand_template_id
      - type
      type: object
    BrandTemplateItem:
      description: Details about the brand template.
      properties:
        type:
          enum:
          - brand_template
          type: string
        brand_template:
          $ref: '#/components/schemas/BrandTemplateSummary'
      required:
      - brand_template
      - type
      type: object
    BrandTemplateSummary:
      description: An object representing a brand template with associated metadata.
      properties:
        id:
          description: The brand template ID.
          example: DEMzWSwy3BI
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        title:
          description: The brand template title, as shown in the Canva UI.
          example: Advertisement Template
          type: string
        view_url:
          description: A URL Canva users can visit to view the brand template.
          example: https://www.canva.com/design/DAE35hE8FA4/view
          type: string
        create_url:
          description: A URL Canva users can visit to create a new design from the template.
          example: https://www.canva.com/design/DAE35hE8FA4/remix
          type: string
        thumbnail:
          $ref: '#/components/schemas/Thumbnail'
        created_at:
          description: 'When the brand template was created, as a Unix timestamp

            (in seconds since the Unix Epoch).'
          example: 1704110400
          format: int64
          type: integer
        updated_at:
          description: 'When the brand template was last updated, as a Unix timestamp

            (in seconds since the Unix Epoch).'
          example: 1719835200
          format: int64
          type: integer
      required:
      - create_url
      - created_at
      - id
      - title
      - updated_at
      - view_url
      type: object
    CreateAssetUploadJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/AssetUploadJob'
      required:
      - job
      type: object
    CreateDesignExportJobRequest:
      description: 'Body parameters for starting an export job for a design.

        It must include a design ID, and one of the supported export formats.'
      example:
        design_id: DAVZr1z5464
        format:
          type: pdf
          size: a4
          pages:
          - 2
          - 3
          - 4
      properties:
        design_id:
          description: The design ID.
          type: string
        format:
          $ref: '#/components/schemas/ExportFormat'
      required:
      - design_id
      - format
      type: object
    CreateDesignExportJobResponse:
      properties:
        job:
          $ref: '#/components/schemas/ExportJob'
      required:
      - job
      type: object
    CreateDesignRequest:
      description: 'Body parameters for creating a new design. Use the `type` discriminator to choose
        the creation mode:


        - Use `type_and_asset` to create a design by specifying the design type and/or an asset.

        - Use `design` to create a copy of an existing design (currently a [preview feature](https://www.canva.dev/docs/apps/rest-apis/#preview-apis)).

        - Use `brand_template` to create a design from a brand template (currently a [preview feature](https://www.canva.dev/docs/apps/rest-apis/#preview-apis)).


        NOTE: For backward compatibility, if `type` isn''t specified in the request,

        the request type will be assumed to be `type_and_asset`.'
      discriminator:
        mapping:
          type_and_asset: '#/components/schemas/DesignTypeCreateDesignRequest'
          design: '#/components/schemas/DesignCreateDesignRequest'
          brand_template: '#/components/schemas/BrandTemplateCreateDesignRequest'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/DesignTypeCreateDesignRequest'
      - $ref: '#/components/schemas/DesignCreateDesignRequest'
      - $ref: '#/components/schemas/BrandTemplateCreateDesignRequest'
      type: object
    CreateDesignResponse:
      description: Details about the new design.
      properties:
        design:
          $ref: '#/components/schemas/Design'
      required:
      - design
      type: object
    CreateFolderRequest:
      description: Body parameters for creating a new folder.
      properties:
        name:
          description: The name of the folder.
          example: My awesome holiday
          maxLength: 255
          minLength: 1
          type: string
        parent_folder_id:
          description: 'The folder ID of the parent folder. To create a new folder at the top level of
            a user''s

            [projects](https://www.canva.com/help/find-designs-and-folders/), use the ID `root`.

            To create it in their Uploads folder, use `uploads`.'
          example: FAF2lZtloor
          maxLength: 50
          minLength: 1
          type: string
      required:
      - name
      - parent_folder_id
      type: object
    CreateFolderResponse:
      description: Details about the new folder.
      properties:
        folder:
          $ref: '#/components/schemas/Folder'
      type: object
    CsvExportFormat:
      description: 'Export the design as a CSV file. CSV export is only available for designs that contain

        tabular data, such as Canva Sheets.'
      properties:
        type:
          enum:
          - csv
          type: string
        pages:
          description: 'To specify which pages to export in a multi-page design, provide the page numbers
            as

            an array. The first page in a design is page `1`.

            If `pages` isn''t specified, all the pages are exported.'
          example:
          - 2
          - 3
          - 4
          items:
            format: int32
            minimum: 1
            type: integer
          type: array
      required:
      - type
      type: object
    CustomDesignTypeInput:
      description: 'Provide the width and height to define a custom design type.


        Each dimension must be between 40 and 8000 pixels, and the

        total area (width × height) must not exceed 25,000,000 pixels

        squared. For example, a design with a width of 8000 pixels can

        have a maximum height of 3125 pixels.'
      properties:
        type:
          enum:
          - custom
          type: string
        width:
          description: The width of the design, in pixels.
          example: 320
          format: int32
          maximum: 8000
          minimum: 40
          type: integer
        height:
          description: The height of the design, in pixels.
          example: 200
          format: int32
          maximum: 8000
          minimum: 40
          type: integer
      required:
      - height
      - type
      - width
      type: object
    Design:
      description: The design object, which contains metadata about the design.
      properties:
        id:
          description: The design ID.
          example: DAFVztcvd9z
          type: string
        title:
          description: The design title.
          example: My summer holiday
          type: string
        owner:
          $ref: '#/components/schemas/TeamUserSummary'
        thumbnail:
          $ref: '#/components/schemas/Thumbnail'
        urls:
          $ref: '#/components/schemas/DesignLinks'
        created_at:
          description: 'When the design was created in Canva, as a Unix timestamp (in seconds since the
            Unix

            Epoch).'
          example: 1377396000
          format: int64
          type: integer
        updated_at:
          description: 'When the design was last updated in Canva, as a Unix timestamp (in seconds since
            the

            Unix Epoch).'
          example: 1692928800
          format: int64
          type: integer
        page_count:
          description: The total number of pages in the design. Some design types don't have pages (for
            example, Canva docs).
          example: 5
          format: int32
          minimum: 0
          type: integer
        design_types:
          description: The type of content a design or page contains. The list of design types may grow
            over time. The `unknown` value represents design types that haven't been added to the list.
          example:
          - presentation
          items:
            $ref: '#/components/schemas/DesignTypeOutputName'
          type: array
      required:
      - created_at
      - design_types
      - id
      - owner
      - updated_at
      - urls
      type: object
    DesignCreateDesignRequest:
      description: '<Warning>


        Creating a copy of an existing design is currently provided as a preview. Be aware of the following:


        - There might be unannounced breaking changes.

        - Any breaking changes to preview features won''t produce a new [API version](https://www.canva.dev/docs/apps/rest-apis/versions/).

        - Public apps that use preview features will not pass the review process, and can''t be made available
        to all Canva users.


        </Warning>


        Body parameters for creating a copy of an existing design.'
      properties:
        type:
          enum:
          - design
          type: string
        design_id:
          description: The ID of the design to copy.
          example: DAFVztcvetc
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        page_numbers:
          description: 'The pages to copy from the source design. If not specified, all pages are copied.

            Pages are indexed using one-based numbering.'
          items:
            format: int32
            minimum: 1
            type: integer
          minItems: 1
          type: array
      required:
      - design_id
      - type
      type: object
    DesignExportStatus:
      description: 'The export status of the job. A newly created job will be `in_progress` and will eventually

        become `success` or `failed`.'
      enum:
      - failed
      - in_progress
      - success
      type: string
    DesignItem:
      description: Details about the design.
      properties:
        type:
          enum:
          - design
          type: string
        design:
          $ref: '#/components/schemas/DesignSummary'
      required:
      - design
      - type
      type: object
    DesignLinks:
      description: A temporary set of URLs for viewing or editing the design.
      properties:
        edit_url:
          description: 'A temporary editing URL for the design. This URL is only accessible to the user
            that made the API request, and is designed to support [return navigation](https://www.canva.dev/docs/apps/rest-apis/return-navigation-guide/)
            workflows.


            NOTE: This is not a permanent URL, it is only valid for 30 days.'
          example: https://www.canva.com/api/design/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIiwiZXhwaXJ5IjoxNzQyMDk5NDAzMDc5fQ..GKLx2hrJa3wSSDKQ.hk3HA59qJyxehR-ejzt2DThBW0cbRdMBz7Fb5uCpwD-4o485pCf4kcXt_ypUYX0qMHVeZ131YvfwGPIhbk-C245D8c12IIJSDbZUZTS7WiCOJZQ.sNz3mPSQxsETBvl_-upMYA/edit
          type: string
        view_url:
          description: 'A temporary viewing URL for the design. This URL is only accessible to the user
            that made the API request, and is designed to support [return navigation](https://www.canva.dev/docs/apps/rest-apis/return-navigation-guide/)
            workflows.


            NOTE: This is not a permanent URL, it is only valid for 30 days.

            '
          example: https://www.canva.com/api/design/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIiwiZXhwaXJ5IjoxNzQyMDk5NDAzMDc5fQ..GKLx2hrJa3wSSDKQ.hk3HA59qJyxehR-ejzt2DThBW0cbRdMBz7Fb5uCpwD-4o485pCf4kcXt_ypUYX0qMHVeZ131YvfwGPIhbk-C245D8c12IIJSDbZUZTS7WiCOJZQ.sNz3mPSQxsETBvl_-upMYA/view
          type: string
      required:
      - edit_url
      - view_url
      type: object
    DesignSummary:
      description: Basic details about the design, such as the design's ID, title, and URL.
      properties:
        id:
          description: The design ID.
          example: DAFVztcvd9z
          type: string
        title:
          description: The design title.
          example: My summer holiday
          type: string
        url:
          description: URL of the design.
          example: https://www.canva.com/design/DAFVztcvd9z/edit
          type: string
        thumbnail:
          $ref: '#/components/schemas/Thumbnail'
        urls:
          $ref: '#/components/schemas/DesignLinks'
        created_at:
          description: 'When the design was created in Canva, as a Unix timestamp (in seconds since the
            Unix

            Epoch).'
          example: 1377396000
          format: int64
          type: integer
        updated_at:
          description: 'When the design was last updated in Canva, as a Unix timestamp (in seconds since
            the

            Unix Epoch).'
          example: 1692928800
          format: int64
          type: integer
        page_count:
          description: The total number of pages in the design. Some design types don't have pages (for
            example, Canva docs).
          example: 3
          format: int32
          minimum: 0
          type: integer
      required:
      - created_at
      - id
      - updated_at
      - urls
      type: object
    DesignTypeCreateDesignRequest:
      description: 'Create a design by specifying the design type and/or an asset.

        At least one of `design_type` or `asset_id` must be defined.'
      properties:
        type:
          description: For backward compatibility, if `type` isn't specified in the request, the request
            type will be assumed to be `type_and_asset`.
          enum:
          - type_and_asset
          type: string
        design_type:
          $ref: '#/components/schemas/DesignTypeInput'
        asset_id:
          description: The ID of an asset to insert into the created design. Currently, this only supports
            image assets.
          example: Msd59349ff
          type: string
        title:
          description: The name of the design.
          example: My Holiday Presentation
          maxLength: 255
          minLength: 1
          type: string
      required:
      - type
      type: object
    DesignTypeInput:
      description: The desired design type.
      discriminator:
        mapping:
          preset: '#/components/schemas/PresetDesignTypeInput'
          custom: '#/components/schemas/CustomDesignTypeInput'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/PresetDesignTypeInput'
      - $ref: '#/components/schemas/CustomDesignTypeInput'
      type: object
    DesignTypeOutputName:
      description: The type of content a design or page contains. The list of design types may grow over
        time. The `unknown` value represents design types that haven't been added to the list.
      enum:
      - doc
      - email
      - presentation
      - sheet
      - whiteboard
      - custom
      - unknown
      example: presentation
      type: string
    EdDsaJwk:
      description: 'A JSON Web Key Set (JWKS) using the Edwards-curve Digital Signature Algorithm (EdDSA),
        as

        described in [RFC-8037](https://www.rfc-editor.org/rfc/rfc8037.html#appendix-A).'
      properties:
        kid:
          description: 'The `kid` (key ID) is a unique identifier for a public key. When the keys used

            to sign webhooks are rotated, you can use this ID to select the correct key

            within a JWK Set during the key rollover. The `kid` value is case-sensitive.'
          type: string
        kty:
          description: 'The `kty` (key type) identifies the cryptographic algorithm family used with

            the key, such as "RSA" or "EC". Only Octet Key Pairs

            (`OKPs`) are supported.

            The `kty` value is case-sensitive. For more information on the `kty` property

            and OKPs, see [RFC-8037 — "kty" (Key Type)

            Parameter](https://www.rfc-editor.org/rfc/rfc8037.html#section-2).'
          type: string
        crv:
          description: 'The `crv` (curve) property identifies the curve used for elliptical curve

            encryptions. Only "Ed25519" is supported. For more information on the `crv`

            property, see [RFC-8037 — Key Type

            "OKP"](https://www.rfc-editor.org/rfc/rfc8037.html#section-2).'
          type: string
