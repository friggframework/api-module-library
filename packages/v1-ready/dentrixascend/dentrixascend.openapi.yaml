openapi: 3.0.3
info:
  title: Dentrix Ascend Public API (subset)
  version: "1.0.0"
  description: >-
    Curated subset of the Henry Schein One Dentrix Ascend Public API used by
    `@friggframework/api-module-dentrixascend`. Authored from the official
    Consumer Guide and published OpenAPI
    (https://papidocs.hs1api.com/publicapi/api-consumer-guide,
    https://papidocs.hs1api.com/publicapi/apispec). One `operationId` per
    hand-written `Api` method. Paths are relative to the Public API base
    (`…/ascend-gateway/api`) except OrgMapper `listLinkedOrganizations`, which
    is served from the API host root.
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
  - url: https://prod.hs1api.com/ascend-gateway/api
    description: Production Public API
  - url: https://test.hs1api.com/ascend-gateway/api
    description: Sandbox Public API
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Locations
  - name: Providers
  - name: Patients
  - name: Appointments
  - name: Transactions
  - name: Claims
  - name: FeeSchedules
  - name: Procedures
  - name: Statements
  - name: Insurance
paths:
  /orgmapper/LinkedOrgs:
    servers:
      - url: https://prod.hs1api.com
        description: Production API host
      - url: https://test.hs1api.com
        description: Sandbox API host
    get:
      tags: [Identity]
      operationId: listLinkedOrganizations
      summary: List OrgMapper organization ids for this client
      description: >-
        Returns plain JSON `{ organizations: [id, ...] }` (not the Public API
        statusCode/data envelope). Use an id as the Organization-ID header.
      responses:
        "200":
          description: Linked organization ids
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/organizations/{organizationId}:
    get:
      tags: [Identity]
      operationId: getOrganization
      summary: Get an organization by id
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: organizationId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ResponseFields"
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: List locations
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/ResponseFields"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/LastId"
      responses:
        "200": { $ref: "#/components/responses/EnvelopeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/locations/{locationId}:
    get:
      tags: [Locations]
      operationId: getLocation
      summary: Get a location by id
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: locationId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ResponseFields"
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Locations]
      operationId: updateLocation
      summary: Update a location
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: locationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/Envelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }

