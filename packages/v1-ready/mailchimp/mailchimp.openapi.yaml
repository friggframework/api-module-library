                            title: Reason
                            readOnly: true
                      to_non_clickers:
                        type: object
                        description: Determines if the campaign qualifies to be resent to non-clickers.
                        title: To Non-Clickers
                        properties:
                          is_eligible:
                            type: boolean
                            description: Determines if the campaign qualifies to be resent to this segment.
