components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description: 'OAuth 2.0 Authorization Code against Clockwork''s central account host. Scope: `read
        write`. Access token sent as Bearer on resource calls.'
      flows:
        authorizationCode:
          authorizationUrl: https://account.clockworkrecruiting.com/oauth/authorize
          tokenUrl: https://account.clockworkrecruiting.com/oauth/token
          scopes:
            read: Read firm data
            write: Write firm data
