openapi: 3.0.3
info:
  title: Huggg API
  version: "1.0.0"
  description: >-
    Huggg is an employee gifting and rewards platform. This file is Left Hook's
    curated subset of the public Huggg surface documented at
    https://docs.huggg.me/ (V2 wallets/transactions/hugggs/search/bank-payments)
    and the official V3 OpenAPI at https://documentation.huggg.me/ (products and
    brands). It covers exactly the endpoints the
    @friggframework/api-module-huggg client in api.js implements — one method
    per operationId.
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
  - url: https://api.huggg.me
    description: Huggg production API origin (V2 under /api/v2, V3 under /v3)
security:
  - ApiKeyAuth: []
  - BearerAuth: []
tags:
  - name: Products
  - name: Brands
  - name: Wallets
  - name: Transactions
  - name: Hugggs
  - name: Search
  - name: Bank Payments
paths:
  /v3/products/:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products
      description: >-
        Retrieves a list of products. Official V3 OpenAPI:
        https://documentation.huggg.me/
      parameters:
        - in: query
          name: pagination-limit
          schema: { type: integer }
        - in: query
          name: pagination-offset
          schema: { type: integer }
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: id
          schema: { type: string }
          description: Single product id filter (arrays also accepted by the API).
      responses:
        "200":
          description: Product list envelope
          content:
            application/json:
              schema:
                type: object

  /v3/products/{id}:
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product envelope
          content:
            application/json:
              schema:
                type: object

  /v3/brands/:
    get:
      tags: [Brands]
      operationId: listBrands
      summary: List brands
      parameters:
        - in: query
          name: pagination-limit
          schema: { type: integer }
        - in: query
          name: pagination-offset
          schema: { type: integer }
      responses:
        "200":
          description: Brand list envelope
          content:
            application/json:
              schema:
                type: object

  /v3/brands/{id}:
    get:
      tags: [Brands]
      operationId: getBrand
      summary: Get a brand by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Brand envelope
          content:
            application/json:
              schema:
                type: object

  /api/v2/products/{id}/segments:
    get:
      tags: [Products]
      operationId: getProductSegments
      summary: Get a product's segments
      description: https://docs.huggg.me/endpoints/product-segments/
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Segments for the product
          content:
            application/json:
              schema:
                type: object

  /api/v2/teams/{teamId}/wallets:
    get:
      tags: [Wallets]
      operationId: getTeamWallets
      summary: Get a team's wallet
      description: >-
        Returns an array of wallets; Huggg documents one wallet per team.
        https://docs.huggg.me/endpoints/get-team-wallet/
      parameters:
        - in: path
          name: teamId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Wallet array envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"

  /api/v2/transactions:
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Create a transaction (purchase hugggs)
      description: https://docs.huggg.me/endpoints/transactions/
      parameters:
        - in: query
          name: embed[]
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
          description: Pass `hugggs` to embed created hugggs in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment, purchase]
              properties:
                payment:
                  type: object
                  required: [method, reference]
                  properties:
                    method:
                      type: string
                      enum: [walletCommitment]
                    reference:
                      type: string
                      description: Wallet id
                purchase:
                  type: object
                  required: [type, reference]
                  properties:
                    type:
                      type: string
                      enum: [huggg, bulkHugggs]
                    reference:
                      type: string
                      description: Product id
                    quantity: { type: integer }
                    message: { type: string }
                    notes: { type: string }
                    reasonCode: { type: string }
                    expiry: { type: string, description: "YYYY-MM-DD" }
                    themeId: { type: string }
                    fromName: { type: string }
                    id:
                      type: string
                      description: Optional UUID idempotency key
                    receivers:
                      type: array
                      items:
                        type: object
                        properties:
                          phone_number: { type: string }
                          email: { type: string }
                          send_at: { type: string, format: date-time }
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                type: object

  /api/v2/transactions/{transactionId}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction by id
      description: https://docs.huggg.me/endpoints/get-transaction-by-id/
      parameters:
        - in: path
          name: transactionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transaction entity
          content:
            application/json:
              schema:
                type: object

  /api/v2/transactions/{transactionId}/cancel:
    post:
      tags: [Transactions]
      operationId: cancelTransaction
      summary: Cancel a transaction's cancelable hugggs
      description: https://docs.huggg.me/endpoints/transaction-cancel/
      parameters:
        - in: path
          name: transactionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                type: object

  /api/v2/transactions/{transactionId}/hugggs:
    get:
      tags: [Hugggs]
      operationId: getHugggsFromTransaction
      summary: List hugggs for a transaction
      description: https://docs.huggg.me/endpoints/transactions-ID-hugggs/
      parameters:
        - in: path
          name: transactionId
          required: true
          schema: { type: string }
        - in: query
          name: embed[]
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        "200":
          description: Paginated huggg list
          content:
            application/json:
              schema:
                type: object

  /api/v2/hugggs/{hugggId}:
    get:
      tags: [Hugggs]
      operationId: getHuggg
      summary: Get a huggg by id or shortcode
      description: https://docs.huggg.me/endpoints/hugggs-ID/
      parameters:
        - in: path
          name: hugggId
          required: true
          schema: { type: string }
        - in: query
          name: embed[]
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        "200":
          description: Huggg entity
          content:
            application/json:
              schema:
                type: object

  /api/v2/hugggs/{hugggId}/cancel:
    post:
      tags: [Hugggs]
      operationId: cancelHuggg
      summary: Cancel a huggg
      description: https://docs.huggg.me/endpoints/huggg-cancel/
      parameters:
        - in: path
          name: hugggId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancellation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }

  /v3/searches/hugggs:
    post:
      tags: [Search]
      operationId: searchHugggs
      summary: Search hugggs
      description: https://docs.huggg.me/endpoints/search/search-hugggs/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                index: { type: string, example: huggg }
                from: { type: integer }
                size: { type: integer }
                query: { type: string }
                fields:
                  type: array
                  items: { type: string }
                sort:
                  type: array
                  items: { type: object }
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                type: object

  /v3/bank-payments/orders:
    post:
      tags: [Bank Payments]
      operationId: createBankPaymentOrder
      summary: Create a bank-payment order
      description: https://docs.huggg.me/endpoints/bank-payments/create-order/
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idempotencyKey
                - walletId
                - autoClaim
                - requireNameOnAccount
                - sendingMethod
                - recipients
              properties:
                idempotencyKey: { type: string }
                walletId: { type: string }
                autoClaim: { type: boolean }
                requireNameOnAccount: { type: boolean }
                sendingMethod:
                  type: string
                  enum: [EMAIL, SMS, LINKS, BANK_PAYMENT]
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: object }
                name: { type: string }
                fromName: { type: string }
                message: { type: string }
                digitalCheque: { type: boolean }
                expiryDate: { type: string }
                sendDate: { type: string, format: date-time }
      responses:
        "200":
          description: Accepted order (async processing)
          content:
            application/json:
              schema:
                type: object

  /v3/bank-payments/orders/{orderId}:
    get:
      tags: [Bank Payments]
      operationId: getBankPaymentOrder
      summary: Get a bank-payment order by id
      description: https://docs.huggg.me/endpoints/bank-payments/get-order/
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bank-payment order
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Huggg-API-Key
      description: >-
        API key unique to a user within a team. Documented at
        https://docs.huggg.me/endpoints/authentication/api-keys/overview/
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        OAuth access token from POST /oauth/token (client_credentials or
        password grant). See https://docs.huggg.me/endpoints/authentication/overview/
  schemas:
    Wallet:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        balance: { type: number }
        available: { type: number }
        currency: { type: string, example: GBX }
        ownerId: { type: string }
        ownerType: { type: string }
        teamId: { type: string }
        referenceId: { type: string }
        dateCreated: { type: string, format: date-time }
        dateModified: { type: string, format: date-time }
