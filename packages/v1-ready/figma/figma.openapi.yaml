      - $ref: '#/components/schemas/CornerTrait'
    CornerTrait:
      type: object
      properties:
        cornerRadius:
          type: number
          description: Radius of each corner if a single radius is set for all corners
          default: 0
        cornerSmoothing:
          type: number
          description: A value that lets you control how "smooth" the corners are. Ranges from 0 to 1.
            0 is the default and means that the corner is perfectly circular. A value of 0.6 means the
            corner matches the iOS 7 "squircle" icon shape. Other values produce various other curves.
        rectangleCornerRadii:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
          description: 'Array of length 4 of the radius of each corner of the frame, starting in the top
            left and proceeding clockwise.


            Values are given in the order top-left, top-right, bottom-right, bottom-left.'
    DefaultShapeTraits:
      allOf:
      - $ref: '#/components/schemas/IsLayerTrait'
      - $ref: '#/components/schemas/HasBlendModeAndOpacityTrait'
      - $ref: '#/components/schemas/HasLayoutTrait'
      - $ref: '#/components/schemas/HasGeometryTrait'
      - $ref: '#/components/schemas/HasExportSettingsTrait'
      - $ref: '#/components/schemas/HasEffectsTrait'
      - $ref: '#/components/schemas/HasMaskTrait'
      - $ref: '#/components/schemas/TransitionSourceTrait'
      - $ref: '#/components/schemas/VariableWidthStrokesTrait'
      - $ref: '#/components/schemas/ComplexStrokesTrait'
    DevStatusTrait:
      type: object
      properties:
        devStatus:
          type: object
          description: Represents whether or not a node has a particular handoff (or dev) status applied
            to it.
          properties:
            type:
              type: string
              enum:
              - NONE
              - READY_FOR_DEV
              - COMPLETED
