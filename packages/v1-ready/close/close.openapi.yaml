openapi: 3.1.0
info:
  title: Close CRM API (Frigg curated subset)
  version: 1.0.0
  description: >-
    Curated subset of the Close CRM REST API v1 for @friggframework/api-module-close. Derived from
    the official experimental OpenAPI at https://api.close.com/api/openapi.json and
    https://developer.close.com/. operationIds are Frigg client method names; each description cites
    the official operationId. Base URL and security schemes match the vendor spec.
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
  - url: https://api.close.com/api/v1
security:
  - ApiKeyAuth: []
  - OAuth2: []
tags:
  - name: users
  - name: leads
  - name: contacts
  - name: opportunities
  - name: activities
  - name: custom_fields
  - name: webhooks
paths:
  /activity/:
    get:
      operationId: listActivities
      tags:
        - activities
      summary: List or filter all activity types
      description: >-
        To list only a specific activity type (e.g., only `Call` or `LeadStatusChange`), use the
        other resources listed separately. When querying activities for a single lead (using the
        `lead_id` parameter), you can ask for multiple activity types using `_type__in`.


        When listing [Custom
        Activities](https://developer.close.com/api/resources/activities/custom-activities), `_type`
        and `_type__in` can include Custom Activity Type ids (e.g.
        `actitype_1h5m6uHM9BZOpwVhyRJb4Y`) to filter by a specific custom activity type or `Custom`
        to list custom activities of any type.


        The following filtering parameters can only be used for listing activities on a single lead
        (using the `lead_id` parameter): `user_id`, `user_id__in`, `contact_id`, `contact_id__in`,
        `_type`, `_type__in`.


        All activities have two sortable datetime fields: `date_created` and `activity_at`.
        `date_created` denotes when an activity was created or synced into Close and `activity_at`
        denotes when that activity actually occurred. For example, on outgoing Email activities,
        `date_created` is equal to when the email was first created in Close, and `activity_at` is
        equal to when the email was actually sent. For Meeting activities, `activity_at` is equal to
        the scheduled time of the meeting. On custom activities, users are able to update the
        `activity_at` field at any time.


        Sorting by `-activity_at` can only be used when listing activities on a single lead using
        the `lead_id` parameter. In addition, you can only use the date-based filters of the field
        you're currently sorting on. This means that if you want to use `activity_at__lt` and
        `activity_at__gt` as filters, you need to include `_order_by=-activity_at` in your request.


        `thread_emails` parameter:

         - (Default) when this parameter is not present, `Email` objects will be returned for each email message.
         - A value of `true` will return `EmailThread` objects representing email conversations. Stripped-down version of `Email` objects will also be returned.
         - A value of `only` will return `EmailThread` objects representing email conversations. `Email` objects will not be returned.

        Official Close operationId: `activities_list`.

        Source: https://api.close.com/api/openapi.json
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SkipParam'
        - $ref: '#/components/parameters/ActivityFilters_IdInParam'
        - $ref: '#/components/parameters/ActivityFilters_LeadIdParam'
        - $ref: '#/components/parameters/ActivityFilters_ContactIdParam'
        - $ref: '#/components/parameters/ActivityFilters_UserIdParam'
        - $ref: '#/components/parameters/ActivityFilters_OrganizationIdParam'
        - $ref: '#/components/parameters/ActivityFilters_TypeParam'
        - $ref: '#/components/parameters/ActivityFilters_DateCreatedGteParam'
        - $ref: '#/components/parameters/ActivityFilters_DateCreatedLteParam'
        - $ref: '#/components/parameters/ActivityFilters_DateCreatedGtParam'
        - $ref: '#/components/parameters/ActivityFilters_DateCreatedLtParam'
        - $ref: '#/components/parameters/ActivityFilters_ActivityAtGteParam'
        - $ref: '#/components/parameters/ActivityFilters_ActivityAtLteParam'
        - $ref: '#/components/parameters/ActivityFilters_ActivityAtGtParam'
        - $ref: '#/components/parameters/ActivityFilters_ActivityAtLtParam'
        - in: query
          name: lead_id__in
          required: false
          schema:
            title: Lead ID (In)
            type: string
        - in: query
          name: user_id__in
          required: false
          schema:
            title: User ID (In)
            type: string
        - in: query
          name: contact_id__in
          required: false
          schema:
            title: Contact ID (In)
            type: string
        - in: query
          name: _type__in
          required: false
          schema:
            title: Type (In)
            type: string
        - $ref: '#/components/parameters/FieldsParam'
        - in: query
          name: _order_by
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              example:
                data:
                  - _type: Created
                    activity_at: '2013-02-20T05:44:35.636000+00:00'
                    contact_id: null
                    created_by: user_N6KhMpzHRCYQHdn4gRNIFNN5JExnsrprKA6ekxM63XA
                    created_by_name: Bruce Wayne
                    date_created: '2013-02-20T05:44:35.636000+00:00'
