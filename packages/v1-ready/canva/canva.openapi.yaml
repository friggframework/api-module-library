openapi: 3.0.0
info:
  title: Canva Connect API (Frigg curated subset)
  version: "2024-06-18"
  description: >-
    Curated subset of the official Canva Connect OpenAPI
    (https://www.canva.dev/sources/connect/api/latest/api.yml)
    covering exactly the endpoints @friggframework/api-module-canva implements.
    Path shapes, methods, query/body fields, and scopes are taken from the
    official description. PascalCase official operationIds CreateAssetUploadJob
    / GetAssetUploadJob are aliased to camelCase createAssetUploadJob /
    getAssetUploadJob so they match Api methods 1:1 (spec-sync enforced).
  contact:
    name: Canva Developer Community
    url: https://community.canva.dev/
  termsOfService: https://www.canva.com/trust/legal/
servers:
  - url: https://api.canva.com/rest
    description: Canva REST APIs
security:
  - oauthAuthCode: []
tags:
  - name: user
  - name: oidc
  - name: oauth
  - name: design
  - name: export
  - name: folder
  - name: asset
  - name: connect

paths:
  /v1/users/me:
    get:
      tags: [user]
      operationId: usersMe
      summary: Get the current user and team summary
      security:
        - oauthAuthCode: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersMeResponse"

  /v1/users/me/profile:
    get:
      tags: [user]
      operationId: getUserProfile
      summary: Get the current user's profile
      security:
        - oauthAuthCode: [profile:read]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"

  /v1/oidc/userinfo:
    get:
      tags: [oidc]
      operationId: userInfo
      summary: OIDC userinfo
      security:
        - oauthAuthCode: [openid, profile, email]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"

  /v1/oauth/token:
    post:
      tags: [oauth]
      operationId: exchangeAccessToken
      summary: Exchange an authorization code or refresh token for tokens
      security:
        - {}
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                code:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
                redirect_uri:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeAccessTokenResponse"

  /v1/oauth/introspect:
    post:
      tags: [oauth]
      operationId: introspectToken
      summary: Introspect an access or refresh token
      security:
        - {}
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: OK

  /v1/oauth/revoke:
    post:
      tags: [oauth]
      operationId: revokeTokens
      summary: Revoke an access or refresh token
      security:
        - {}
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: OK

  /v1/designs:
    get:
      tags: [design]
      operationId: listDesigns
      summary: List the user's designs
      security:
        - oauthAuthCode: [design:meta:read]
      parameters:
        - in: query
          name: query
          schema: { type: string, maxLength: 255 }
        - in: query
          name: continuation
          schema: { type: string }
        - in: query
          name: ownership
          schema:
            type: string
            enum: [any, owned, shared]
            default: any
        - in: query
          name: sort_by
          schema:
            type: string
            enum:
              - relevance
              - modified_descending
              - modified_ascending
              - title_descending
              - title_ascending
            default: relevance
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetListDesignResponse"
    post:
      tags: [design]
      operationId: createDesign
      summary: Create a design
      security:
        - oauthAuthCode: [design:content:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDesignRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDesignResponse"

  /v1/designs/{designId}:
    get:
      tags: [design]
      operationId: getDesign
      summary: Get design metadata
      security:
        - oauthAuthCode: [design:meta:read]
      parameters:
        - in: path
          name: designId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDesignResponse"

  /v1/exports:
    post:
      tags: [export]
      operationId: createDesignExportJob
      summary: Create a design export job
      security:
        - oauthAuthCode: [design:content:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDesignExportJobRequest"
      responses:
        "200":
          description: OK

  /v1/exports/{exportId}:
    get:
      tags: [export]
      operationId: getDesignExportJob
      summary: Get a design export job
      security:
        - oauthAuthCode: [design:content:read]
      parameters:
        - in: path
          name: exportId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /v1/folders:
    post:
      tags: [folder]
      operationId: createFolder
      summary: Create a folder
      security:
        - oauthAuthCode: [folder:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "200":
          description: OK

  /v1/folders/move:
    post:
      tags: [folder]
      operationId: moveFolderItem
      summary: Move a folder item
      security:
        - oauthAuthCode: [folder:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderItemRequest"
      responses:
        "204":
          description: No Content

  /v1/folders/{folderId}:
    get:
      tags: [folder]
      operationId: getFolder
      summary: Get a folder
      security:
        - oauthAuthCode: [folder:read]
      parameters:
        - in: path
          name: folderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
    patch:
      tags: [folder]
      operationId: updateFolder
      summary: Update a folder
      security:
        - oauthAuthCode: [folder:write]
      parameters:
        - in: path
          name: folderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequest"
      responses:
        "200":
          description: OK
    delete:
      tags: [folder]
      operationId: deleteFolder
      summary: Delete a folder
      security:
        - oauthAuthCode: [folder:write]
      parameters:
        - in: path
          name: folderId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No Content

  /v1/folders/{folderId}/items:
    get:
      tags: [folder]
      operationId: listFolderItems
      summary: List folder items
      security:
        - oauthAuthCode: [folder:read]
      parameters:
        - in: path
          name: folderId
          required: true
          schema: { type: string }
        - in: query
          name: continuation
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: item_types
          schema: { type: string }
          description: Comma-delimited list of design, folder, image, brand_template
        - in: query
          name: sort_by
          schema: { type: string }
        - in: query
          name: pin_status
          schema: { type: string, enum: [any, pinned, unpinned] }
      responses:
        "200":
          description: OK

  /v1/assets/{assetId}:
    get:
      tags: [asset]
      operationId: getAsset
      summary: Get asset metadata
      security:
        - oauthAuthCode: [asset:read]
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
    patch:
      tags: [asset]
      operationId: updateAsset
      summary: Update asset name/tags
      security:
        - oauthAuthCode: [asset:write]
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetRequest"
      responses:
        "200":
          description: OK
    delete:
      tags: [asset]
      operationId: deleteAsset
      summary: Delete an asset
      security:
        - oauthAuthCode: [asset:write]
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: No Content

  /v1/asset-uploads:
    post:
      tags: [asset]
      operationId: createAssetUploadJob
      summary: Create an asset upload job
      security:
        - oauthAuthCode: [asset:write]
      parameters:
        - in: header
          name: Asset-Upload-Metadata
          required: true
          schema: { type: string }
          description: JSON metadata (name_base64, parent_folder_id, …)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: OK

  /v1/asset-uploads/{jobId}:
    get:
      tags: [asset]
      operationId: getAssetUploadJob
      summary: Get an asset upload job
      security:
        - oauthAuthCode: [asset:read]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK

  /v1/connect/keys:
    get:
      tags: [connect]
      operationId: getSigningPublicKeys
      summary: Get public keys for verifying webhook signatures
      security: []
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    oauthAuthCode:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://www.canva.com/api/oauth/authorize
          tokenUrl: https://api.canva.com/rest/v1/oauth/token
          scopes:
            design:content:read: View the contents of the user's designs.
            design:meta:read: View the metadata of the user's designs.
            design:content:write: Create designs on the user's behalf.
            folder:read: View the metadata and contents of the user's folders.
            folder:write: Add, move, or remove the user's folders.
            asset:read: View the metadata for the user's assets.
            asset:write: Upload, update, or delete assets on the user's behalf.
            comment:read: View comments on the user's designs.
            comment:write: Create comments and replies on the user's designs.
            collaboration:event: Receive webhook notifications about events relevant to the user.
            profile:read: Read a user's profile and account information.
            openid: Read user information through Open ID Connect (OIDC).
            profile: Read user profile information through OIDC.
            email: Read user email address through OIDC.

  schemas:
    TeamUserSummary:
      type: object
      required: [user_id, team_id]
      properties:
        user_id: { type: string }
        team_id: { type: string }

    UsersMeResponse:
      type: object
      required: [team_user]
      properties:
        team_user:
          $ref: "#/components/schemas/TeamUserSummary"

    UserProfile:
      type: object
      properties:
        display_name: { type: string }

    UserProfileResponse:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/UserProfile"

    UserInfoResponse:
      type: object
      properties:
        sub: { type: string }
        name: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }

    ExchangeAccessTokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, format: int64 }
        scope: { type: string }

    Design:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
        page_count: { type: integer }
        urls:
          type: object
          additionalProperties: true
        thumbnail:
          type: object
          additionalProperties: true
        owner:
          $ref: "#/components/schemas/TeamUserSummary"

    GetListDesignResponse:
      type: object
      required: [items]
      properties:
        continuation: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/Design"

    GetDesignResponse:
      type: object
      properties:
        design:
          $ref: "#/components/schemas/Design"

    CreateDesignRequest:
      type: object
      description: >-
        Discriminated CreateDesignRequest from the official OpenAPI
        (type_and_asset | design | brand_template). At least design_type or
        asset_id is required for type_and_asset.
      additionalProperties: true
      properties:
        type:
          type: string
          enum: [type_and_asset, design, brand_template]
        title: { type: string }
        asset_id: { type: string }
        design_type:
          type: object
          additionalProperties: true

    CreateDesignResponse:
      type: object
      properties:
        design:
          $ref: "#/components/schemas/Design"

    CreateDesignExportJobRequest:
      type: object
      required: [design_id, format]
      properties:
        design_id: { type: string }
        format:
          type: object
          additionalProperties: true

    CreateFolderRequest:
      type: object
      required: [name, parent_folder_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        parent_folder_id: { type: string, minLength: 1, maxLength: 50 }

    UpdateFolderRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }

    MoveFolderItemRequest:
      type: object
      required: [to_folder_id, item_id]
      properties:
        to_folder_id: { type: string }
        item_id: { type: string }

    UpdateAssetRequest:
      type: object
      properties:
        name: { type: string, maxLength: 50 }
        tags:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 50 }
