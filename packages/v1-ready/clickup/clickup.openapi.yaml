  /v2/list/{list_id}/task:
    get:
      summary: Get Tasks
      tags:
      - Tasks
      description: "View the tasks in a List. Responses are limited to 100 tasks per page. You can only view task information\
        \ of tasks you can access. \\\n \\\nThis endpoint only includes tasks where the specified `list_id` is their home\
        \ List. Tasks added to the `list_id` with a different home List are not included in the response by default. To include\
        \ tasks that exist in multiple lists, use the `include_timl` parameter. \\\n \\\nThe `time_spent` field displays time\
        \ tracked in milliseconds, and is only included in the response for tasks with time entries.\\\n \\\nEach task's `custom_fields`\
        \ array only includes Custom Fields applicable to that task's `custom_item_id`.\n\nOfficial operationId: `GetTasks`.\
        \ Source: https://developer.clickup.com/openapi/clickup-api-v2-reference.json"
      operationId: getTasks
      parameters:
      - name: list_id
        in: path
        description: 'To find the list_id: \ 1. In the Sidebar, hover over the List and click the **ellipsis ...** menu. \
          2. Select **Copy link.** \ 3. Use the copied URL to find the list_id. The list_id is the number that follows /li
          in the URL.'
        required: true
        style: simple
        schema:
          type: number
      - name: archived
        in: query
        description: ''
        style: form
        explode: true
        schema:
          type: boolean
      - name: include_markdown_description
        in: query
        description: To return task descriptions in Markdown format, use `?include_markdown_description=true`.
        style: form
        explode: true
        schema:
          type: boolean
      - name: page
        in: query
        description: Page to fetch (starts at 0).
        style: form
        explode: true
        schema:
          type: integer
      - name: order_by
        in: query
        description: "Order by a particular field. By default, tasks are ordered by `created`.\\\n \\\nOptions include: `id`,\
          \ `created`, `updated`, and `due_date`."
        style: form
        explode: true
        schema:
          type: string
      - name: reverse
        in: query
        description: Tasks are displayed in reverse order.
        style: form
        explode: true
        schema:
          type: boolean
      - name: subtasks
        in: query
        description: Include or exclude subtasks. By default, subtasks are excluded.
        style: form
        explode: true
        schema:
          type: boolean
      - name: statuses
        in: query
        description: "Filter by statuses. To include closed tasks, use the `include_closed` parameter. \\\n \\\nFor example:\
          \ \\\n \\\n`?statuses[]=to%20do&statuses[]=in%20progress`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: include_closed
        in: query
        description: "Include or excluse closed tasks. By default, they are excluded.\\\n \\\nTo include closed tasks, use\
          \ `include_closed: true`."
        style: form
        explode: true
        schema:
          type: boolean
      - name: include_timl
        in: query
        description: "Include Tasks in Multiple Lists. By default, tasks that exist in multiple lists are excluded from the\
          \ response.\\\n \\\nTo include tasks that exist in multiple lists, use `include_timl: true`."
        style: form
        explode: true
        schema:
          type: boolean
      - name: assignees
        in: query
        description: "Filter by Assignees. For example: \\\n \\\n`?assignees[]=1234&assignees[]=5678`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: watchers
        in: query
        description: Filter by watchers.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tags
        in: query
        description: "Filter by tags. For example: \\\n \\\n`?tags[]=tag1&tags[]=this%20tag`"
        style: form
        explode: true
        schema:
          type: array
