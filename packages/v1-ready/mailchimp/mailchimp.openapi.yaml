                  _links:
                    type: array
                    description: A list of link types and descriptions for the API schema documents.
                    title: Links
                    readOnly: true
                    items:
                      type: object
                      description: This object represents a link from the resource where it is found to
                        another resource or action that may be performed.
                      title: Resource Link
                      properties:
                        rel:
                          type: string
                          description: As with an HTML 'rel' attribute, this describes the type of link.
                          title: Rel
                          readOnly: true
                        href:
                          type: string
                          description: This property contains a fully-qualified URL that can be called
                            to retrieve the linked resource or perform the linked action.
                          title: Href
                          readOnly: true
                        method:
                          type: string
                          description: The HTTP method that should be used when accessing the URL defined
                            in 'href'.
                          title: Method
                          enum:
                          - GET
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                          - OPTIONS
                          - HEAD
                          readOnly: true
                        targetSchema:
                          type: string
                          description: For GETs, this is a URL representing the schema that the response
                            should conform to.
                          title: Target Schema
                          readOnly: true
                        schema:
                          type: string
                          description: For HTTP methods that can receive bodies (POST and PUT), this is
                            a URL representing the schema that the body should conform to.
                          title: Schema
                          readOnly: true
        default:
          description: An error generated by the Mailchimp API.
          content:
            application/json:
              schema:
                type: object
                description: An error generated by the Mailchimp API. Conforms to IETF draft 'draft-nottingham-http-problem-06'.
                title: Problem Detail Document
                required:
                - type
                - title
                - status
                - detail
                - instance
                properties:
                  type:
                    type: string
                    description: An absolute URI that identifies the problem type. When dereferenced,
                      it should provide human-readable documentation for the problem type.
                    title: Problem Type
                    example: https://mailchimp.com/developer/marketing/docs/errors/
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type. It shouldn't change
                      based on the occurrence of the problem, except for purposes of localization.
                    title: Error Title
                    example: Resource Not Found
                  status:
                    type: integer
                    description: The HTTP status code (RFC2616, Section 6) generated by the origin server
                      for this occurrence of the problem.
                    title: HTTP Status Code
                    example: 404
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence of the problem.
                      [Learn more about errors](/developer/guides/get-started-with-mailchimp-api-3/#Errors).
                    title: Error Message
                    example: The requested resource could not be found.
                  instance:
                    type: string
                    description: A string that identifies this specific occurrence of the problem. Please
                      provide this ID when contacting support.
                    title: Instance ID
                    example: 995c5cb0-3280-4a6e-808b-3b096d0bb219
      parameters:
      - name: campaign_id
        in: path
        required: true
        description: The unique id for the campaign.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A summary of an individual campaign's settings and content.
              title: Campaign
              required:
              - settings
              properties:
                recipients:
                  type: object
                  description: List settings for the campaign.
                  title: List
                  required:
                  - list_id
                  properties:
                    list_id:
                      type: string
                      description: The unique list id.
                      title: List ID
                    segment_opts:
                      type: object
                      description: An object representing all segmentation options. This object should
                        contain a `saved_segment_id` to use an existing segment, or you can create a new
                        segment by including both `match` and `conditions` options.
                      title: Segment Options
                      properties:
                        saved_segment_id:
                          type: integer
                          description: The id for an existing saved segment.
                          title: Saved Segment ID
                        prebuilt_segment_id:
                          type: string
                          description: The prebuilt segment id, if a prebuilt segment has been designated
                            for this campaign.
                          title: Prebuilt Segment Id
                          example: subscribers-female
                        match:
                          type: string
                          description: Segment match type.
                          title: Match Type
                          enum:
                          - any
                          - all
                        conditions:
                          type: array
                          description: Segment match conditions. There are multiple possible types, see
                            the [condition types documentation](https://mailchimp.com/developer/marketing/docs/alternative-schemas/#segment-condition-schemas).
                          title: Segment Type
                          items: {}
                settings:
                  type: object
                  description: The settings for your campaign, including subject, from name, reply-to
                    address, and more.
                  title: Campaign Settings
                  required:
                  - subject_line
                  - from_name
                  - reply_to
                  properties:
                    subject_line:
                      type: string
                      description: The subject line for the campaign.
                      title: Campaign Subject Line
                    preview_text:
                      type: string
                      description: The preview text for the campaign.
                      title: Campaign Preview Text
                    title:
                      type: string
                      description: The title of the campaign.
                      title: Campaign Title
                    from_name:
                      type: string
                      description: The 'from' name on the campaign (not an email address).
                      title: From Name
                    reply_to:
                      type: string
                      description: The reply-to email address for the campaign.
                      title: Reply To Address
                    use_conversation:
                      type: boolean
                      description: Use Mailchimp Conversation feature to manage out-of-office replies.
                      title: Conversation
                    to_name:
                      type: string
                      description: The campaign's custom 'To' name. Typically the first name [audience
                        field](https://mailchimp.com/help/getting-started-with-merge-tags/).
                      title: To Name
                    folder_id:
                      type: string
                      description: If the campaign is listed in a folder, the id for that folder.
                      title: Folder ID
                    authenticate:
                      type: boolean
                      description: Whether Mailchimp [authenticated](https://mailchimp.com/help/about-email-authentication/)
                        the campaign. Defaults to `true`.
                      title: Authentication
                    auto_footer:
                      type: boolean
                      description: Automatically append Mailchimp's [default footer](https://mailchimp.com/help/about-campaign-footers/)
                        to the campaign.
                      title: Auto-Footer
                    inline_css:
                      type: boolean
                      description: Automatically inline the CSS included with the campaign content.
                      title: Inline CSS
                    auto_tweet:
                      type: boolean
                      description: Automatically tweet a link to the [campaign archive](https://mailchimp.com/help/about-email-campaign-archives-and-pages/)
                        page when the campaign is sent.
                      title: Auto-Tweet
                    auto_fb_post:
                      type: array
                      description: An array of [Facebook](https://mailchimp.com/help/connect-or-disconnect-the-facebook-integration/)
                        page ids to auto-post to.
                      title: Auto Post to Facebook
                      items:
                        type: string
                    fb_comments:
                      type: boolean
                      description: Allows Facebook comments on the campaign (also force-enables the Campaign
                        Archive toolbar). Defaults to `true`.
                      title: Facebook Comments
                    template_id:
                      type: integer
                      description: The id of the template to use.
                      title: Template ID
                variate_settings:
                  type: object
                  description: The settings specific to A/B test campaigns.
                  title: A/B Test Options
                  required:
                  - winner_criteria
                  properties:
                    winner_criteria:
                      type: string
                      description: The combination that performs the best. This may be determined automatically
                        by click rate, open rate, or total revenue -- or you may choose manually based
                        on the reporting data you find the most valuable. For Multivariate Campaigns testing
                        send_time, winner_criteria is ignored. For Multivariate Campaigns with 'manual'
                        as the winner_criteria, the winner must be chosen in the Mailchimp web application.
                      title: Winning Criteria
                      enum:
                      - opens
                      - clicks
                      - manual
                      - total_revenue
                    wait_time:
                      type: integer
                      description: The number of minutes to wait before choosing the winning campaign.
                        The value of wait_time must be greater than 0 and in whole hours, specified in
                        minutes.
                      title: Wait Time
                    test_size:
                      type: integer
                      description: The percentage of recipients to send the test combinations to, must
                        be a value between 10 and 100.
                      title: Test Size
                    subject_lines:
                      type: array
                      description: The possible subject lines to test. If no subject lines are provided,
                        settings.subject_line will be used.
                      title: Subject Lines
                      items:
                        type: string
                    send_times:
                      type: array
                      description: The possible send times to test. The times provided should be in the
                        format YYYY-MM-DD HH:MM:SS. If send_times are provided to test, the test_size
                        will be set to 100% and winner_criteria will be ignored.
                      title: Send Times
                      items:
                        type: string
                        format: date-time
                    from_names:
                      type: array
                      description: The possible from names. The number of from_names provided must match
                        the number of reply_to_addresses. If no from_names are provided, settings.from_name
                        will be used.
                      title: From Names
                      items:
                        type: string
                    reply_to_addresses:
                      type: array
                      description: The possible reply-to addresses. The number of reply_to_addresses provided
                        must match the number of from_names. If no reply_to_addresses are provided, settings.reply_to
                        will be used.
                      title: Reply To Addresses
                      items:
                        type: string
                tracking:
                  type: object
                  description: The tracking options for a campaign.
                  title: Campaign Tracking Options
                  properties:
                    opens:
                      type: boolean
                      description: Whether to [track opens](https://mailchimp.com/help/about-open-tracking/).
                        Defaults to `true`. Cannot be set to false for variate campaigns.
                      title: Opens
                    html_clicks:
                      type: boolean
                      description: Whether to [track clicks](https://mailchimp.com/help/enable-and-view-click-tracking/)
                        in the HTML version of the campaign. Defaults to `true`. Cannot be set to false
                        for variate campaigns.
                      title: HTML Click Tracking
                    text_clicks:
                      type: boolean
                      description: Whether to [track clicks](https://mailchimp.com/help/enable-and-view-click-tracking/)
                        in the plain-text version of the campaign. Defaults to `true`. Cannot be set to
                        false for variate campaigns.
                      title: Plain-Text Click Tracking
                    goal_tracking:
                      type: boolean
                      description: Deprecated
                      title: Mailchimp Goal Tracking
                    ecomm360:
                      type: boolean
                      description: Whether to enable e-commerce tracking.
                      title: E-commerce Tracking
                    google_analytics:
                      type: string
                      description: The custom slug for [Google Analytics](https://mailchimp.com/help/integrate-google-analytics-with-mailchimp/)
                        tracking (max of 50 bytes).
                      title: Google Analytics Tracking
                    clicktale:
                      type: string
                      description: The custom slug for [ClickTale](https://mailchimp.com/help/additional-tracking-options-for-campaigns/)
                        tracking (max of 50 bytes).
                      title: ClickTale Analytics Tracking
                    salesforce:
                      type: object
                      description: Deprecated
                      title: Salesforce CRM Tracking
                      properties:
                        campaign:
                          type: boolean
                          description: Create a campaign in a connected Salesforce account.
                          title: Salesforce Campaign
                        notes:
                          type: boolean
                          description: Update contact notes for a campaign based on subscriber email addresses.
                          title: Salesforce Note
                    capsule:
                      type: object
                      description: Deprecated
                      title: Capsule CRM Tracking
                      properties:
                        notes:
                          type: boolean
                          description: Update contact notes for a campaign based on subscriber email addresses.
                          title: Capsule Note
                rss_opts:
                  type: object
                  description: '[RSS](https://mailchimp.com/help/share-your-blog-posts-with-mailchimp/)
                    options for a campaign.'
                  title: RSS Options
                  required:
                  - feed_url
                  - frequency
                  properties:
                    feed_url:
                      type: string
                      format: uri
                      description: The URL for the RSS feed.
                      title: Feed URL
                    frequency:
                      type: string
                      description: The frequency of the RSS Campaign.
                      title: Frequency
                      enum:
                      - daily
                      - weekly
                      - monthly
                    schedule:
                      type: object
                      description: The schedule for sending the RSS Campaign.
                      title: Sending Schedule
                      properties:
                        hour:
                          type: integer
                          description: The hour to send the campaign in local time. Acceptable hours are
                            0-23. For example, '4' would be 4am in [your account's default time zone](https://mailchimp.com/help/set-account-defaults/).
                          title: Sending Hour
                          minimum: 0
                          maximum: 23
                        daily_send:
                          type: object
                          description: The days of the week to send a daily RSS Campaign.
                          title: Daily Sending Days
                          properties:
                            sunday:
                              type: boolean
                              description: Sends the daily RSS Campaign on Sundays.
                              title: Sunday
                            monday:
                              type: boolean
                              description: Sends the daily RSS Campaign on Mondays.
                              title: Monday
                            tuesday:
                              type: boolean
                              description: Sends the daily RSS Campaign on Tuesdays.
                              title: tuesday
                            wednesday:
                              type: boolean
                              description: Sends the daily RSS Campaign on Wednesdays.
                              title: Monday
                            thursday:
                              type: boolean
                              description: Sends the daily RSS Campaign on Thursdays.
                              title: Thursday
                            friday:
                              type: boolean
                              description: Sends the daily RSS Campaign on Fridays.
                              title: Friday
                            saturday:
                              type: boolean
                              description: Sends the daily RSS Campaign on Saturdays.
                              title: Saturday
                        weekly_send_day:
                          type: string
                          description: The day of the week to send a weekly RSS Campaign.
                          title: Weekly Sending Day
                          enum:
                          - sunday
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                        monthly_send_date:
                          type: number
                          description: The day of the month to send a monthly RSS Campaign. Acceptable
                            days are 0-31, where '0' is always the last day of a month. Months with fewer
                            than the selected number of days will not have an RSS campaign sent out that
                            day. For example, RSS Campaigns set to send on the 30th will not go out in
                            February.
                          title: Monthly Sending Day
                          minimum: 0
                          maximum: 31
                    constrain_rss_img:
                      type: boolean
                      description: Whether to add CSS to images in the RSS feed to constrain their width
                        in campaigns.
                      title: Constrain RSS Images
                social_card:
                  type: object
                  description: The preview for the campaign, rendered by social networks like Facebook
                    and Twitter. [Learn more](https://mailchimp.com/help/enable-and-customize-social-cards/).
                  title: Campaign Social Card
                  properties:
                    image_url:
                      type: string
                      description: The url for the header image for the card.
                      title: Image URL
                    description:
                      type: string
                      description: A short summary of the campaign to display.
                      title: Campaign Description
                    title:
                      type: string
                      description: The title for the card. Typically the subject line of the campaign.
                      title: Title
  /lists/{list_id}/webhooks:
    get:
      operationId: getListsIdWebhooks
      summary: List webhooks
      description: Get information about all webhooks for a specific list.
      tags:
      - lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Manage webhooks for a specific list.
                title: List Webhooks
                properties:
                  webhooks:
                    type: array
                    description: An array of objects, each representing a specific list member.
                    title: Webhooks
                    items:
                      type: object
                      description: Webhook configured for the given list.
                      title: List Webhooks
                      properties:
                        id:
                          type: string
                          description: An string that uniquely identifies this webhook.
                          title: Unique ID
                          example: 5d9a5e3f7b
                          readOnly: true
                        url:
                          type: string
                          description: A valid URL for the Webhook.
                          title: URL
                          example: http://yourdomain.com/webhook
                          readOnly: true
                        events:
                          type: object
                          description: The events that can trigger the webhook and whether they are enabled.
                          title: Events
                          readOnly: true
                          properties:
                            subscribe:
                              type: boolean
                              description: Whether the webhook is triggered when a list subscriber is
                                added.
                              title: Subscribed
                              example: true
                            unsubscribe:
                              type: boolean
                              description: Whether the webhook is triggered when a list member unsubscribes.
                              title: Unsubscribed
                              example: true
                            profile:
                              type: boolean
                              description: Whether the webhook is triggered when a contact's profile is
                                updated. This includes email subscribers and SMS-only contacts [BETA].
                              title: Profile Updated
                              example: true
                            cleaned:
                              type: boolean
                              description: Whether the webhook is triggered when a subscriber's email
                                address is cleaned from the list.
                              title: Cleaned
                              example: true
                            upemail:
                              type: boolean
                              description: Whether the webhook is triggered when a subscriber's email
                                address is changed.
                              title: Email Address Updated
                              example: true
                            campaign:
                              type: boolean
                              description: Whether the webhook is triggered when a campaign is sent or
                                cancelled.
                              title: Campaign Sent
                              example: true
                            sms_subscribe:
                              type: boolean
                              description: '[BETA] Whether the webhook is triggered when a contact subscribes
                                to SMS.'
                              title: SMS Subscribed [BETA]
                              example: true
                            sms_unsubscribe:
                              type: boolean
                              description: '[BETA] Whether the webhook is triggered when a contact unsubscribes
                                from SMS.'
                              title: SMS Unsubscribed [BETA]
                              example: true
                            upsms:
                              type: boolean
                              description: '[BETA] Whether the webhook is triggered when a contact''s
                                SMS phone number is updated.'
                              title: SMS Phone Number Updated [BETA]
                              example: true
                            sms_campaign:
                              type: boolean
                              description: '[BETA] Whether the webhook is triggered when an SMS campaign
