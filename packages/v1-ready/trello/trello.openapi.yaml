openapi: 3.0.0
info:
  title: Trello REST API (subset)
  version: 1.0.0
  description: Left Hook curated subset of the official Trello REST OpenAPI (https://developer.atlassian.com/cloud/trello/swagger.v3.json)
    covering exactly the endpoints implemented by @friggframework/api-module-trello. Parameters and schemas
    are taken from that vendor document. One method per operationId — keep in sync with api.js. Global
    security matches the vendor document (APIKey + APIToken query params). Operation-level OAuth2-only
    security entries in the full vendor swagger are omitted here because the Authorization and Webhooks
    guides document classic key+token for these same routes.
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
- url: https://api.trello.com/1
security:
- APIKey: []
  APIToken: []
tags:
- name: Members
- name: Boards
- name: Lists
- name: Cards
- name: Organizations
- name: Labels
- name: Webhooks
paths:
  /members/{id}:
    get:
      tags:
      - Members
      operationId: getMember
      summary: Get a Member
      description: 'Official operationId: get-members=id.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        description: The ID or username of the member
        schema:
          oneOf:
          - type: string
            pattern: ^[0-9a-fA-F]{24}$
          - type: string
      - name: actions
        in: query
        description: See the [Actions Nested Resource](/cloud/trello/guides/rest-api/nested-resources/#actions-nested-resource)
        schema:
          type: string
      - name: boards
        in: query
        description: See the [Boards Nested Resource](/cloud/trello/guides/rest-api/nested-resources/#boards-nested-resource)
        schema:
          type: string
      - name: boardBackgrounds
        in: query
        description: 'One of: `all`, `custom`, `default`, `none`, `premium`'
        schema:
          type: string
          enum:
          - all
          - custom
          - default
          - none
          - premium
          default: none
      - name: boardsInvited
        in: query
        description: '`all` or a comma-separated list of: closed, members, open, organization, pinned,
          public, starred, unpinned'
        schema:
          enum:
          - closed
          - members
          - open
          - organization
          - pinned
          - public
          - starred
          - unpinned
          type: string
      - name: boardsInvited_fields
        in: query
        description: '`all` or a comma-separated list of board [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        schema:
          type: string
          enum: &id002
          - id
          - name
          - desc
          - descData
          - closed
          - idMemberCreator
          - idOrganization
          - pinned
          - url
          - shortUrl
          - prefs
          - labelNames
          - starred
          - limits
          - memberships
          - enterpriseOwned
      - name: boardStars
        in: query
        description: Whether to return the boardStars or not
        schema:
          type: boolean
          default: false
      - name: cards
        in: query
        description: See the [Cards Nested Resource](/cloud/trello/guides/rest-api/nested-resources/#cards-nested-resource)
          for additional options
        schema:
          type: string
          default: none
      - name: customBoardBackgrounds
        in: query
        description: '`all` or `none`'
        schema:
          type: string
          enum:
          - all
          - none
          default: none
      - name: customEmoji
        in: query
        description: '`all` or `none`'
        schema:
          type: string
          enum:
          - all
          - none
          default: none
      - name: customStickers
        in: query
        description: '`all` or `none`'
        schema:
          type: string
          enum:
          - all
          - none
          default: none
      - name: fields
        in: query
        description: '`all` or a comma-separated list of member [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        schema:
          type: string
          enum:
          - id
      - name: notifications
        in: query
        description: See the [Notifications Nested Resource](/cloud/trello/guides/rest-api/nested-resources/#notifications-nested-resource)
        schema:
          type: string
      - name: organizations
        in: query
        description: 'One of: `all`, `members`, `none`, `public`'
        schema:
          type: string
          enum:
          - all
          - members
          - none
          - public
          default: none
      - name: organization_fields
        in: query
        description: '`all` or a comma-separated list of organization [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        schema:
          type: string
          enum: &id001
          - id
          - name
      - name: organization_paid_account
        in: query
        description: Whether or not to include paid account information in the returned workspace object
        schema:
          type: boolean
          default: false
      - name: organizationsInvited
        in: query
        description: 'One of: `all`, `members`, `none`, `public`'
        schema:
          type: string
          enum:
          - all
          - members
          - none
          - public
          default: none
      - name: organizationsInvited_fields
        in: query
        description: '`all` or a comma-separated list of organization [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        schema:
          type: string
          enum: *id001
      - name: paid_account
        in: query
        description: Whether or not to include paid account information in the returned member object
        schema:
          type: boolean
          default: false
      - name: savedSearches
        in: query
        schema:
          type: boolean
          default: false
      - name: tokens
        in: query
        description: '`all` or `none`'
        schema:
          type: string
          enum:
          - all
          - none
          default: none
  /members/{id}/boards:
    get:
      tags:
      - Members
      operationId: listBoards
      summary: Get Boards that Member belongs to
      description: 'Official operationId: get-members-id-boards.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Board'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        description: The ID or username of the member
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: filter
        in: query
        description: '`all` or a comma-separated list of: `closed`, `members`, `open`, `organization`,
          `public`, `starred`'
        schema:
          enum:
          - all
          - closed
          - members
          - open
          - organization
          - public
          - starred
          type: string
          default: all
      - name: fields
        in: query
        description: '`all` or a comma-separated list of board [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        schema:
          type: string
          enum: *id002
      - name: lists
        in: query
        description: 'Which lists to include with the boards. One of: `all`, `closed`, `none`, `open`'
        schema:
          enum:
          - all
          - closed
          - none
          - open
          type: string
          default: none
      - name: organization
        in: query
        description: Whether to include the Organization object with the Boards
        schema:
          type: boolean
          default: false
      - name: organization_fields
        in: query
        description: '`all` or a comma-separated list of organization [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        schema:
          type: string
          enum: *id001
  /boards/{id}:
    get:
      tags:
      - Boards
      operationId: getBoard
      summary: Get a Board
      description: 'Official operationId: get-boards-id.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: actions
        in: query
        description: This is a nested resource. Read more about actions as nested resources [here](/cloud/trello/guides/rest-api/nested-resources/).
        schema:
          type: string
          default: all
      - name: boardStars
        in: query
        description: 'Valid values are one of: `mine` or `none`.'
        schema:
          type: string
          default: none
      - name: cards
        in: query
        description: This is a nested resource. Read more about cards as nested resources [here](/cloud/trello/guides/rest-api/nested-resources/).
        schema:
          type: string
          default: none
      - name: card_pluginData
        in: query
        description: Use with the `cards` param to include card pluginData with the response
        schema:
          type: boolean
          default: false
      - name: checklists
        in: query
        description: This is a nested resource. Read more about checklists as nested resources [here](/cloud/trello/guides/rest-api/nested-resources/).
        schema:
          type: string
          default: none
      - name: customFields
        in: query
        description: This is a nested resource. Read more about custom fields as nested resources [here](#custom-fields-nested-resource).
        schema:
          type: boolean
          default: false
      - name: fields
        in: query
        description: 'The fields of the board to be included in the response. Valid values: all or a comma-separated
          list of: closed, dateLastActivity, dateLastView, desc, descData, idMemberCreator, idOrganization,
          invitations, invited, labelNames, memberships, name, pinned, powerUps, prefs, shortLink, shortUrl,
          starred, subscribed, url'
        schema:
          type: string
          default: name,desc,descData,closed,idOrganization,pinned,url,shortUrl,prefs,labelNames
      - name: labels
        in: query
        description: This is a nested resource. Read more about labels as nested resources [here](/cloud/trello/guides/rest-api/nested-resources/).
        schema:
          type: string
      - name: lists
        in: query
        description: This is a nested resource. Read more about lists as nested resources [here](/cloud/trello/guides/rest-api/nested-resources/).
        schema:
          type: string
          default: open
      - name: members
        in: query
        description: This is a nested resource. Read more about members as nested resources [here](/cloud/trello/guides/rest-api/nested-resources/).
        schema:
          type: string
          default: none
      - name: memberships
        in: query
        description: This is a nested resource. Read more about memberships as nested resources [here](/cloud/trello/guides/rest-api/nested-resources/).
        schema:
          type: string
          default: none
      - name: pluginData
        in: query
        description: 'Determines whether the pluginData for this board should be returned. Valid values:
          true or false.'
        schema:
          type: boolean
          default: false
      - name: organization
        in: query
        description: This is a nested resource. Read more about organizations as nested resources [here](/cloud/trello/guides/rest-api/nested-resources/).
        schema:
          type: boolean
          default: false
      - name: organization_pluginData
        in: query
        description: Use with the `organization` param to include organization pluginData with the response
        schema:
          type: boolean
          default: false
      - name: myPrefs
        in: query
        schema:
          type: boolean
          default: false
      - name: tags
        in: query
        description: Also known as collections, tags, refer to the collection(s) that a Board belongs
          to.
        schema:
          type: boolean
          default: false
    put:
      tags:
      - Boards
      operationId: updateBoard
      summary: Update a Board
      description: 'Official operationId: put-boards-id.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: name
        in: query
        description: The new name for the board. 1 to 16384 characters long.
        schema:
          type: string
      - name: desc
        in: query
        description: A new description for the board, 0 to 16384 characters long
        schema:
          type: string
      - name: closed
        in: query
        description: Whether the board is closed
        schema:
          type: boolean
      - name: subscribed
        in: query
        description: Whether the acting user is subscribed to the board
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: idOrganization
        in: query
        description: The id of the Workspace the board should be moved to
        schema:
          type: string
      - name: prefs/permissionLevel
        in: query
        description: 'One of: org, private, public'
        schema:
          type: string
      - name: prefs/selfJoin
        in: query
        description: Whether Workspace members can join the board themselves
        schema:
          type: boolean
      - name: prefs/cardCovers
        in: query
        description: Whether card covers should be displayed on this board
        schema:
          type: boolean
      - name: prefs/hideVotes
        in: query
        description: Determines whether the Voting Power-Up should hide who voted on cards or not.
        schema:
          type: boolean
      - name: prefs/invitations
        in: query
        description: 'Who can invite people to this board. One of: admins, members'
        schema:
          type: string
      - name: prefs/voting
        in: query
        description: Who can vote on this board. One of disabled, members, observers, org, public
        schema:
          type: string
      - name: prefs/comments
        in: query
        description: 'Who can comment on cards on this board. One of: disabled, members, observers, org,
          public'
        schema:
          type: string
      - name: prefs/background
        in: query
        description: 'The id of a custom background or one of: blue, orange, green, red, purple, pink,
          lime, sky, grey'
        schema:
          type: string
      - name: prefs/cardAging
        in: query
        description: 'One of: pirate, regular'
        schema:
          type: string
      - name: prefs/calendarFeedEnabled
        in: query
        description: Determines whether the calendar feed is enabled or not.
        schema:
          type: boolean
  /boards/:
    post:
      tags:
      - Boards
      operationId: createBoard
      summary: Create a Board
      description: 'Official operationId: post-boards.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          description: Unauthorized
      parameters:
      - name: name
        in: query
        required: true
        description: The new name for the board. 1 to 16384 characters long.
        schema:
          type: string
          maxLength: 16384
          minLength: 1
      - name: defaultLabels
        in: query
        description: Determines whether to use the default set of labels.
        schema:
          type: boolean
          default: true
      - name: defaultLists
        in: query
        description: Determines whether to add the default set of lists to a board (To Do, Doing, Done).
          It is ignored if `idBoardSource` is provided.
        schema:
          type: boolean
          default: true
      - name: desc
        in: query
        description: A new description for the board, 0 to 16384 characters long
        schema:
          type: string
          minLength: 0
          maxLength: 16384
      - name: idOrganization
        in: query
        description: The id or name of the Workspace the board should belong to.
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: idBoardSource
        in: query
        description: The id of a board to copy into the new board.
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: keepFromSource
        in: query
        description: To keep cards from the original board pass in the value `cards`
        schema:
          type: string
          default: none
          enum:
          - cards
          - none
      - name: powerUps
        in: query
        description: 'The Power-Ups that should be enabled on the new board. One of: `all`, `calendar`,
          `cardAging`, `recap`, `voting`.'
        schema:
          type: string
          enum:
          - all
          - calendar
          - cardAging
          - recap
          - voting
      - name: prefs_permissionLevel
        in: query
        description: 'The permissions level of the board. One of: `org`, `private`, `public`.'
        schema:
          type: string
          default: private
          enum:
          - org
          - private
          - public
      - name: prefs_voting
        in: query
        description: Who can vote on this board. One of `disabled`, `members`, `observers`, `org`, `public`.
        schema:
          type: string
          default: disabled
          enum:
          - disabled
          - members
          - observers
          - org
          - public
      - name: prefs_comments
        in: query
        description: 'Who can comment on cards on this board. One of: `disabled`, `members`, `observers`,
          `org`, `public`.'
        schema:
          type: string
          default: members
          enum:
          - disabled
          - members
          - observers
          - org
          - public
      - name: prefs_invitations
        in: query
        description: 'Determines what types of members can invite users to join. One of: `admins`, `members`.'
        schema:
          type: string
          default: members
          enum:
          - members
          - admins
      - name: prefs_selfJoin
        in: query
        description: Determines whether users can join the boards themselves or whether they have to be
          invited.
        schema:
          type: boolean
          default: true
      - name: prefs_cardCovers
        in: query
        description: Determines whether card covers are enabled.
        schema:
          type: boolean
          default: true
      - name: prefs_background
        in: query
        description: 'The id of a custom background or one of: `blue`, `orange`, `green`, `red`, `purple`,
          `pink`, `lime`, `sky`, `grey`.'
        schema:
          type: string
          default: blue
          enum:
          - blue
          - orange
          - green
          - red
          - purple
          - pink
          - lime
          - sky
          - grey
      - name: prefs_cardAging
        in: query
        description: 'Determines the type of card aging that should take place on the board if card aging
          is enabled. One of: `pirate`, `regular`.'
        schema:
          type: string
          default: regular
          enum:
          - pirate
          - regular
  /boards/{id}/lists:
    get:
      tags:
      - Boards
      operationId: listLists
      summary: Get Lists on a Board
      description: 'Official operationId: get-boards-id-lists.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrelloList'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: cards
        in: query
        description: Filter to apply to Cards.
        schema:
          type: string
          enum: &id003
          - all
          - closed
          - none
          - open
      - name: card_fields
        in: query
        description: '`all` or a comma-separated list of card [fields](/cloud/trello/guides/rest-api/object-definitions/#card-object)'
        schema:
          type: string
          default: all
      - name: filter
        in: query
        description: Filter to apply to Lists
        schema:
          type: string
          enum: *id003
      - name: fields
        in: query
        description: '`all` or a comma-separated list of list [fields](/cloud/trello/guides/rest-api/object-definitions/)'
        schema:
          type: string
          default: all
  /boards/{id}/cards:
    get:
      tags:
      - Boards
      operationId: listCards
      summary: Get Cards on a Board
      description: 'Official operationId: get-boards-id-cards.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /boards/{id}/labels:
    get:
      tags:
      - Boards
      operationId: listLabels
      summary: Get Labels on a Board
      description: 'Official operationId: get-boards-id-labels.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Label'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the Board.
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: fields
        in: query
        description: The fields to be returned for the Labels.
        schema:
          type: object
          properties:
            id:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
            idBoard:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
            name:
              type: string
              description: The name displayed for the label.
              nullable: true
              minLength: 0
              maxLength: 16384
            color:
              type: string
              nullable: true
              enum:
              - yellow
              - purple
              - blue
              - red
              - green
              - orange
              - black
              - sky
              - pink
              - lime
      - name: limit
        in: query
        description: The number of Labels to be returned.
        schema:
          type: integer
          format: int32
          default: 50
          minimum: 0
          maximum: 1000
  /lists:
    post:
      tags:
      - Lists
      operationId: createList
      summary: Create a new List
      description: 'Official operationId: post-lists.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloList'
        '401':
          description: Unauthorized
      parameters:
      - name: name
        in: query
        required: true
        description: Name for the list
        schema:
          type: string
      - name: idBoard
        in: query
        required: true
        description: The long ID of the board the list should be created on
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: idListSource
        in: query
        description: ID of the List to copy into the new List
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: pos
        in: query
        description: Position of the list. `top`, `bottom`, or a positive floating point number
        schema:
          oneOf:
          - type: number
            format: float
          - type: string
            enum:
            - top
            - bottom
  /lists/{id}:
    get:
      tags:
      - Lists
      operationId: getList
      summary: Get a List
      description: 'Official operationId: get-lists-id.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloList'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: fields
        in: query
        description: '`all` or a comma separated list of List field names.'
        schema:
          type: string
          default: name,closed,idBoard,pos
    put:
      tags:
      - Lists
      operationId: updateList
      summary: Update a List
      description: 'Official operationId: put-lists-id.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrelloList'
        '401':
          description: Unauthorized
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: name
        in: query
        description: New name for the list
        schema:
          type: string
      - name: closed
        in: query
        description: Whether the list should be closed (archived)
        schema:
          type: boolean
      - name: idBoard
        in: query
        description: ID of a board the list should be moved to
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: pos
        in: query
        description: 'New position for the list: `top`, `bottom`, or a positive floating point number'
        schema:
          oneOf:
          - type: number
            format: float
          - type: string
            enum:
            - top
            - bottom
      - name: subscribed
        in: query
        description: Whether the active member is subscribed to this list
        schema:
          type: boolean
  /lists/{id}/cards:
    get:
      tags:
      - Lists
      operationId: listListCards
      summary: Get Cards in a List
      description: 'Official operationId: get-lists-id-cards.'
      responses:
