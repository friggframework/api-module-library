name: Release
on: 
  push:
    branches-ignore:
      - gitbook-updates
jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Ensure that git uses your token with admin access to the repo
        token: ${{ secrets.ADMIN_TOKEN }}
        fetch-depth: 0
    - run: git fetch --tags --depth=1 origin +refs/tags/*:refs/tags/*
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    - name: Auto release
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
      run: |
        if [ "${{ github.ref }}" = "refs/heads/next" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
          # Real release: lockfile must be in sync
          npm ci
        else
          # Canary/PR branches: tolerate new workspace packages missing from root package-lock.json
          npm ci || npm install --no-audit --no-fund --no-save
        fi
        npx auto shipit
