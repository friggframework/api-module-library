      responses:
        "200":
          description: Created product type (shape UNVERIFIED)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/procurement/products:
    parameters: *commonParameters
    post:
      tags: [Procurement]
      operationId: addProductToInvoice
      summary: Add a catalog product line to an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceProductCreate" }
      responses:
        "200":
          description: Created invoice product (shape UNVERIFIED)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/system/callbacks:
    parameters: *commonParameters
    get:
      tags: [Callbacks]
      operationId: listCallbacks
      summary: List system callbacks
      responses:
        "200":
          description: Callback list (shape UNVERIFIED)
          content:
