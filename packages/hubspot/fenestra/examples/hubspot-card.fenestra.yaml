# HubSpot CRM Card - Fenestra Specification Example
fenestra: 1.0.0
info:
  title: LinkedIn Sales Intelligence
  version: 1.8.7
  description: |
    LinkedIn integration for HubSpot CRM that enriches contact and company records
    with professional insights, social selling opportunities, and connection
    recommendations. Displays LinkedIn profiles, mutual connections, and engagement history.
  contact:
    name: LinkedIn CRM Team
    email: crm-support@linkedin-tools.example
    url: https://linkedin-tools.example/support
  license:
    name: Commercial
    url: https://linkedin-tools.example/license

extension:
  type: embedded
  rendering:
    mode: component
    components:
      framework: react
      registry: https://cdn.linkedin-tools.example/hubspot-components
      entry: LinkedInCRMCard
      version: "1.8.7"
      components:
        - name: ProfileCard
          props:
            contactId:
              type: string
              required: true
            showConnections:
              type: boolean
              default: true
            compactView:
              type: boolean
              default: false
          events:
            - onProfileLoad
            - onConnectionClick
            - onInMailSend
        
        - name: CompanyInsights
          props:
            companyId:
              type: string
              required: true
            includeEmployees:
              type: boolean
              default: true
            maxEmployees:
              type: number
              default: 10
          events:
            - onCompanyLoad
            - onEmployeeClick
        
        - name: SalesInsights
          props:
            contactId:
              type: string
              required: true
            dealId:
              type: string
            showRecommendations:
              type: boolean
              default: true
          events:
            - onRecommendationClick
            - onOpportunityIdentified

  communication:
    channels:
      - type: http
        config:
          baseUrl: https://api.linkedin-tools.example
          auth:
            type: oauth2
            tokenUrl: https://api.linkedin-tools.example/oauth/token
          endpoints:
            - path: /hubspot/webhook
              method: POST
              description: HubSpot webhook handler
            - path: /linkedin/profile/{profileId}
              method: GET
              description: Get LinkedIn profile data
            - path: /linkedin/company/{companyId}
              method: GET
              description: Get LinkedIn company data
            - path: /recommendations/{contactId}
              method: GET
              description: Get sales recommendations
      
      - type: serverless
        config:
          provider: aws-lambda
          functions:
            - name: enrich-contact
              trigger: hubspot-webhook
              runtime: nodejs18
            - name: sync-linkedin-data
              trigger: schedule
              schedule: "rate(6 hours)"
    
    events:
      - name: contact.viewed
        direction: incoming
        description: Contact record is being viewed
        payload:
          type: object
          properties:
            contactId:
              type: string
            userId:
              type: string
            portal:
              type: string
            timestamp:
              type: string
              format: date-time
      
      - name: contact.enriched
        direction: outgoing
        description: Contact has been enriched with LinkedIn data
        payload:
          type: object
          properties:
            contactId:
              type: string
            linkedinProfile:
              type: object
              properties:
                profileUrl:
                  type: string
                headline:
                  type: string
                currentCompany:
                  type: string
                connections:
                  type: number
                mutualConnections:
                  type: array
                  items:
                    type: object
            recommendations:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum: [connection, inmail, content_share, meeting_request]
                  priority:
                    type: string
                    enum: [low, medium, high]
                  message:
                    type: string
      
      - name: opportunity.identified
        direction: outgoing
        description: Sales opportunity identified through LinkedIn insights
        payload:
          type: object
          properties:
            contactId:
              type: string
            opportunityType:
              type: string
              enum: [job_change, company_growth, mutual_connection, content_engagement]
            confidence:
              type: number
              minimum: 0
              maximum: 1
            details:
              type: object
            actionable:
              type: boolean

  capabilities:
    storage:
      platform: true
      userSettings: true
      quota: "20MB"
    api:
      platformData:
        - contacts
        - companies
        - deals
        - timeline
        - settings
      externalRequests: true
      serverlessFunctions: true
      webhooks: true
    ui:
      crmCards: true
      propertyPanels: true
      workflows: true
      customObjects: true
    compute:
      backgroundJobs: true
      scheduledTasks: true

  triggers:
    - type: contextual
      config:
        crmObjects:
          - contact
          - company
        placements:
          - middle-panel
          - right-sidebar
        conditions:
          - property: email
            operator: has_value
    
    - type: event
      config:
        webhooks:
          - contact.propertyChange
          - company.creation
          - deal.propertyChange
        properties:
          - email
          - company
          - jobtitle
    
    - type: scheduled
      config:
        interval: "6h"
        tasks:
          - enrichment-sync
          - opportunity-detection

  context:
    required:
      - portalId
      - userId
      - objectId
      - objectType
    optional:
      - dealId
      - ownerId
      - userRole
      - timeZone
      - locale
    
    hubspotApi:
      version: "v3"
      scopes:
        - crm.objects.contacts.read
        - crm.objects.contacts.write
        - crm.objects.companies.read
        - crm.objects.companies.write
        - crm.objects.deals.read
        - timeline
        - oauth

  lifecycle:
    install:
      oauth:
        clientId: "${HUBSPOT_CLIENT_ID}"
        clientSecret: "${HUBSPOT_CLIENT_SECRET}"
        scopes:
          - crm.objects.contacts.read
          - crm.objects.contacts.write
          - crm.objects.companies.read
          - crm.objects.companies.write
          - timeline
        redirectUri: https://api.linkedin-tools.example/hubspot/oauth/callback
      
      webhook:
        targetUrl: https://api.linkedin-tools.example/hubspot/webhook
        events:
          - contact.propertyChange
          - company.creation
      
      customProperties:
        - name: linkedin_profile_url
          label: LinkedIn Profile URL
          type: string
          fieldType: text
        - name: linkedin_connections
          label: LinkedIn Connections
          type: number
          fieldType: number
        - name: last_linkedin_sync
          label: Last LinkedIn Sync
          type: datetime
          fieldType: date
    
    configure:
      settings:
        - name: linkedin_account
          label: LinkedIn Account
          type: oauth
          required: true
        - name: auto_enrich
          label: Auto-enrich new contacts
          type: boolean
          default: true
        - name: sync_frequency
          label: Sync Frequency
          type: enumeration
          options:
            - label: Real-time
              value: realtime
            - label: Every 6 hours
              value: 6h
            - label: Daily
              value: 24h
          default: 6h
    
    uninstall:
      cleanup:
        - customProperties
        - webhooks
        - serverlessFunctions
      webhook: https://api.linkedin-tools.example/hubspot/uninstall

security:
  - hubspot-oauth:
      flows:
        authorizationCode:
          authorizationUrl: https://app.hubspot.com/oauth/authorize
          tokenUrl: https://api.hubapi.com/oauth/v1/token
          scopes:
            crm.objects.contacts.read: "Read contact records"
            crm.objects.contacts.write: "Update contact records"
            crm.objects.companies.read: "Read company records"
            crm.objects.companies.write: "Update company records"
            crm.objects.deals.read: "Read deal records"
            timeline: "Create timeline events"
  
  - linkedin-oauth:
      flows:
        authorizationCode:
          authorizationUrl: https://www.linkedin.com/oauth/v2/authorization
          tokenUrl: https://www.linkedin.com/oauth/v2/accessToken
          scopes:
            r_liteprofile: "Read lite profile"
            r_emailaddress: "Read email address"
            w_member_social: "Write social actions"

deployment:
  hosting: cdn
  distribution:
    platform: hubspot-marketplace
    appId: 987654321
    manifest:
      name: LinkedIn Sales Intelligence
      description: Enrich CRM records with LinkedIn professional insights
      logoUrl: https://cdn.linkedin-tools.example/logo.png
      categories:
        - sales
        - social-media
        - data-enrichment
      pricing:
        - tier: free
          monthlyFee: 0
          features:
            - Basic profile enrichment
            - 100 lookups per month
        - tier: pro
          monthlyFee: 29
          features:
            - Advanced insights
            - Unlimited lookups
            - Sales recommendations
        - tier: enterprise
          monthlyFee: 99
          features:
            - Team analytics
            - Custom integrations
            - Priority support
      
      permissions:
        - crm.objects.contacts.read
        - crm.objects.contacts.write
        - crm.objects.companies.read
        - crm.objects.companies.write
        - timeline
      
      extensions:
        crm:
          cards:
            - objectTypes: [CONTACT]
              title: LinkedIn Profile
              fetch:
                targetUrl: https://api.linkedin-tools.example/hubspot/cards/contact
                objectTypes: [CONTACT]
              actions:
                - type: IFRAME
                  width: 800
                  height: 600
                  uri: https://app.linkedin-tools.example/hubspot/profile-modal
                  label: View Full Profile
            
            - objectTypes: [COMPANY]
              title: LinkedIn Company Insights
              fetch:
                targetUrl: https://api.linkedin-tools.example/hubspot/cards/company
                objectTypes: [COMPANY]
              actions:
                - type: ACTION_HOOK
                  uri: https://api.linkedin-tools.example/hubspot/sync-employees
                  label: Sync Employees

externalDocs:
  description: LinkedIn CRM Integration Documentation
  url: https://docs.linkedin-tools.example/hubspot
  sdkReference: https://developers.hubspot.com/docs/api/overview
  uiKit: https://www.hubspot.com/products/cms/themes

tags:
  - name: linkedin
  - name: sales-intelligence
  - name: crm-enhancement
  - name: social-selling

x-hubspot-app-id: 987654321
x-hubspot-api-version: v3
x-linkedin-api-version: v2