openapi: 3.0.3
info:
  title: Mailchimp Marketing API (subset)
  version: 3.0.91
  description: 'Curated subset of the official Mailchimp Marketing API Swagger 2.0 spec (v3.0.91) used
    by @friggframework/api-module-mailchimp. Source: https://raw.githubusercontent.com/mailchimp/mailchimp-client-lib-codegen/main/spec/marketing.json.
    operationIds match the vendor spec 1:1 with Api methods in api.js. Host `server.api.mailchimp.com`
    uses `server` as the data-center placeholder (replace with e.g. us6 when known).'
  contact:
    name: Left Hook
    url: https://lefthook.com
  externalDocs:
    description: Official codegen Swagger (Marketing API)
    url: https://github.com/mailchimp/mailchimp-client-lib-codegen/blob/main/spec/marketing.json
servers:
- url: https://server.api.mailchimp.com/3.0
  description: Vendor swagger host (`server.api.mailchimp.com`) + basePath `/3.0`. Replace the `server`
    subdomain with the account data center (e.g. us6) from OAuth metadata `dc` or the API-key suffix.
security:
- BearerAuth: []
- basicAuth: []
tags:
- name: root
- name: ping
- name: lists
- name: listMembers
- name: campaigns
- name: listWebhooks
paths:
  /:
    get:
      operationId: getRoot
      summary: List api root resources
      description: Get links to all other resources available in the API.
      tags:
      - root
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: The API root resource links to all other resources available in the API.
                title: API Root
                properties:
                  account_id:
                    type: string
                    description: The Mailchimp account ID.
                    title: Account ID
                    readOnly: true
                  login_id:
                    type: string
                    description: The ID associated with the user who owns this API key. If you can login
                      to multiple accounts, this ID will be the same for each account.
                    title: Login ID
                    readOnly: true
                  account_name:
                    type: string
                    description: The name of the account.
                    title: Account Name
                    readOnly: true
                  email:
                    type: string
                    description: The account email address.
                    title: Account Email
                    readOnly: true
                  first_name:
                    type: string
                    description: The first name tied to the account.
                    title: First Name
                    readOnly: true
                  last_name:
                    type: string
                    description: The last name tied to the account.
                    title: Last Name
                    readOnly: true
                  username:
                    type: string
                    description: The username tied to the account.
                    title: User Name
                    example: freddie2000
                    readOnly: true
                  avatar_url:
                    type: string
                    description: URL of the avatar for the user.
                    title: Avatar URL
                    readOnly: true
                  role:
                    type: string
                    description: The [user role](https://mailchimp.com/help/manage-user-levels-in-your-account/)
                      for the account.
                    title: Role
                    readOnly: true
                  member_since:
                    type: string
                    format: date-time
                    description: The date and time that the account was created in ISO 8601 format.
                    title: Account Creation Date
                    example: '2010-01-01T23:59:59+00:00'
                    readOnly: true
                  pricing_plan_type:
                    type: string
                    description: The type of pricing plan the account is on.
                    title: Account Pricing Plan
                    enum:
                    - monthly
                    - pay_as_you_go
                    - forever_free
                    readOnly: true
                  first_payment:
                    type: string
                    format: date-time
                    description: Date of first payment for monthly plans.
                    title: First Payment
                    example: '2010-01-01T23:59:59+00:00'
                    readOnly: true
                  account_timezone:
                    type: string
                    description: The timezone currently set for the account.
                    title: Account Timezone
                    readOnly: true
                  account_industry:
                    type: string
                    description: The user-specified industry associated with the account.
                    title: Account Industry
                    readOnly: true
                  contact:
                    type: object
                    description: Information about the account contact.
                    title: Account Contact
                    readOnly: true
                    properties:
                      company:
                        type: string
                        description: The company name for the account.
                        title: Company
                        readOnly: true
                      addr1:
                        type: string
                        description: The street address for the account contact.
                        title: Address Line 1
                        readOnly: true
                      addr2:
                        type: string
                        description: The street address for the account contact.
                        title: Address Line 2
                        readOnly: true
                      city:
                        type: string
                        description: The city for the account contact.
                        title: City
                        readOnly: true
                      state:
                        type: string
                        description: The state for the account contact.
                        title: State
                        readOnly: true
                      zip:
                        type: string
                        description: The zip code for the account contact.
                        title: Zip Code
                        readOnly: true
                      country:
                        type: string
                        description: The country for the account contact.
                        title: Country
                        readOnly: true
                  pro_enabled:
                    type: boolean
                    description: Legacy - whether the account includes [Mailchimp Pro](https://mailchimp.com/help/about-mailchimp-pro/).
                    title: Mailchimp Pro
                    readOnly: true
                  last_login:
                    type: string
                    format: date-time
                    description: The date and time of the last login for this account in ISO 8601 format.
                    title: Last Login Date
                    readOnly: true
                  total_subscribers:
                    type: integer
                    description: The total number of subscribers across all lists in the account.
                    title: Total Subscribers
                    readOnly: true
                  industry_stats:
                    type: object
                    description: The [average campaign statistics](https://mailchimp.com/resources/research/email-marketing-benchmarks/?utm_source=mc-api&utm_medium=docs&utm_campaign=apidocs)
                      for all campaigns in the account's specified industry.
                    title: Industry Stats
                    readOnly: true
                    properties:
                      open_rate:
                        type: number
                        description: The average unique open rate for all campaigns in the account's specified
                          industry.
                        title: Open Rate
                        readOnly: true
                      bounce_rate:
                        type: number
                        description: The average bounce rate for all campaigns in the account's specified
                          industry.
                        title: Bounce Rate
                        readOnly: true
                      click_rate:
                        type: number
                        description: The average unique click rate for all campaigns in the account's
                          specified industry.
                        title: Click Rate
                        readOnly: true
                  _links:
                    type: array
                    description: A list of link types and descriptions for the API schema documents.
                    title: Links
                    readOnly: true
                    items:
                      type: object
                      description: This object represents a link from the resource where it is found to
                        another resource or action that may be performed.
                      title: Resource Link
                      properties:
                        rel:
                          type: string
                          description: As with an HTML 'rel' attribute, this describes the type of link.
                          title: Rel
                          readOnly: true
                        href:
                          type: string
                          description: This property contains a fully-qualified URL that can be called
                            to retrieve the linked resource or perform the linked action.
                          title: Href
                          readOnly: true
                        method:
                          type: string
                          description: The HTTP method that should be used when accessing the URL defined
                            in 'href'.
                          title: Method
                          enum:
                          - GET
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                          - OPTIONS
                          - HEAD
                          readOnly: true
                        targetSchema:
                          type: string
                          description: For GETs, this is a URL representing the schema that the response
                            should conform to.
                          title: Target Schema
                          readOnly: true
                        schema:
                          type: string
                          description: For HTTP methods that can receive bodies (POST and PUT), this is
                            a URL representing the schema that the body should conform to.
                          title: Schema
                          readOnly: true
        default:
          description: An error generated by the Mailchimp API.
          content:
            application/json:
              schema:
                type: object
                description: An error generated by the Mailchimp API. Conforms to IETF draft 'draft-nottingham-http-problem-06'.
                title: Problem Detail Document
                required:
                - type
                - title
                - status
                - detail
                - instance
                properties:
                  type:
                    type: string
                    description: An absolute URI that identifies the problem type. When dereferenced,
                      it should provide human-readable documentation for the problem type.
                    title: Problem Type
                    example: https://mailchimp.com/developer/marketing/docs/errors/
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type. It shouldn't change
                      based on the occurrence of the problem, except for purposes of localization.
                    title: Error Title
                    example: Resource Not Found
                  status:
                    type: integer
                    description: The HTTP status code (RFC2616, Section 6) generated by the origin server
                      for this occurrence of the problem.
                    title: HTTP Status Code
                    example: 404
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence of the problem.
                      [Learn more about errors](/developer/guides/get-started-with-mailchimp-api-3/#Errors).
                    title: Error Message
                    example: The requested resource could not be found.
                  instance:
                    type: string
                    description: A string that identifies this specific occurrence of the problem. Please
                      provide this ID when contacting support.
                    title: Instance ID
                    example: 995c5cb0-3280-4a6e-808b-3b096d0bb219
      parameters:
      - name: fields
        in: query
        required: false
        description: A comma-separated list of fields to return. Reference parameters of sub-objects with
          dot notation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: exclude_fields
        in: query
        required: false
        description: A comma-separated list of fields to exclude. Reference parameters of sub-objects
          with dot notation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
  /ping:
    get:
      operationId: getPing
      summary: Ping
      description: A health check for the API that won't return any account-specific information.
      tags:
      - ping
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: API health status.
                title: API health status
                properties:
                  health_status:
                    type: string
                    description: This will return a constant string value if the request is successful.
                      Ex. "Everything's Chimpy!"
                    title: API health status
                    example: '"Everything''s Chimpy!"'
                    readOnly: true
        default:
          description: An error generated by the Mailchimp API.
          content:
            application/json:
              schema:
                type: object
                description: An error generated by the Mailchimp API. Conforms to IETF draft 'draft-nottingham-http-problem-06'.
                title: Problem Detail Document
                required:
                - type
                - title
                - status
                - detail
                - instance
                properties:
                  type:
                    type: string
                    description: An absolute URI that identifies the problem type. When dereferenced,
                      it should provide human-readable documentation for the problem type.
                    title: Problem Type
                    example: https://mailchimp.com/developer/marketing/docs/errors/
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type. It shouldn't change
                      based on the occurrence of the problem, except for purposes of localization.
                    title: Error Title
                    example: Resource Not Found
                  status:
                    type: integer
                    description: The HTTP status code (RFC2616, Section 6) generated by the origin server
                      for this occurrence of the problem.
                    title: HTTP Status Code
                    example: 404
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence of the problem.
                      [Learn more about errors](/developer/guides/get-started-with-mailchimp-api-3/#Errors).
                    title: Error Message
                    example: The requested resource could not be found.
                  instance:
                    type: string
                    description: A string that identifies this specific occurrence of the problem. Please
                      provide this ID when contacting support.
                    title: Instance ID
                    example: 995c5cb0-3280-4a6e-808b-3b096d0bb219
  /lists:
    get:
      operationId: getLists
      summary: Get lists info
      description: Get information about all lists in the account.
      tags:
      - lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: A collection of subscriber lists for this account. Lists contain subscribers
                  who have opted-in to receive correspondence from you or your organization.
                title: Subscriber Lists
                required:
                - lists
                properties:
                  lists:
                    type: array
                    description: An array of objects, each representing a list.
                    title: Lists
                    items:
                      type: object
                      description: Information about a specific list.
                      title: Subscriber List
                      properties:
                        id:
                          type: string
                          description: A string that uniquely identifies this list.
                          title: List ID
                          readOnly: true
                        web_id:
                          type: integer
                          description: The ID used in the Mailchimp web application. View this list in
                            your Mailchimp account at `https://{dc}.admin.mailchimp.com/lists/members/?id={web_id}`.
                          title: List Web ID
                          readOnly: true
                        name:
                          type: string
                          description: The name of the list.
                          title: List Name
                        contact:
                          type: object
                          description: '[Contact information displayed in campaign footers](https://mailchimp.com/help/about-campaign-footers/)
                            to comply with international spam laws.'
                          title: List Contact
                          properties:
                            company:
                              type: string
                              description: The company name for the list.
                              title: Company Name
                            address1:
                              type: string
                              description: The street address for the list contact.
                              title: Address
                            address2:
                              type: string
                              description: The street address for the list contact.
                              title: Address
                            city:
                              type: string
                              description: The city for the list contact.
                              title: City
                            state:
                              type: string
                              description: The state for the list contact.
                              title: State
                            zip:
                              type: string
                              description: The postal or zip code for the list contact.
                              title: Postal Code
                            country:
                              type: string
                              description: A two-character ISO3166 country code. Defaults to US if invalid.
                              title: Country Code
                            phone:
                              type: string
                              description: The phone number for the list contact.
                              title: Phone Number
                        permission_reminder:
                          type: string
                          description: The [permission reminder](https://mailchimp.com/help/edit-the-permission-reminder/)
                            for the list.
                          title: Permission Reminder
                        use_archive_bar:
                          type: boolean
                          description: Whether campaigns for this list use the [Archive Bar](https://mailchimp.com/help/about-email-campaign-archives-and-pages/)
                            in archives by default.
                          title: Use Archive Bar
                          default: false
                        campaign_defaults:
                          type: object
                          description: '[Default values for campaigns](https://mailchimp.com/help/edit-your-emails-subject-preview-text-from-name-or-from-email-address/)
                            created for this list.'
                          title: Campaign Defaults
                          properties:
                            from_name:
                              type: string
                              description: The default from name for campaigns sent to this list.
                              title: Sender's Name
                            from_email:
                              type: string
                              description: The default from email for campaigns sent to this list.
                              title: Sender's Email Address
                            subject:
                              type: string
                              description: The default subject line for campaigns sent to this list.
                              title: Subject
                            language:
                              type: string
                              description: The default language for this lists's forms.
                              title: Language
                        notify_on_subscribe:
                          type: string
                          description: The email address to send [subscribe notifications](https://mailchimp.com/help/change-subscribe-and-unsubscribe-notifications/)
                            to.
                          title: Notify on Subscribe
                          default: false
                        notify_on_unsubscribe:
                          type: string
                          description: The email address to send [unsubscribe notifications](https://mailchimp.com/help/change-subscribe-and-unsubscribe-notifications/)
                            to.
                          title: Notify on Unsubscribe
                          default: false
                        date_created:
                          type: string
                          format: date-time
                          description: The date and time that this list was created in ISO 8601 format.
                          title: Creation Date
                          readOnly: true
                        list_rating:
                          type: integer
                          description: An auto-generated activity score for the list (0-5).
                          title: List Rating
                          readOnly: true
                        email_type_option:
                          type: boolean
                          description: Whether the list supports [multiple formats for emails](https://mailchimp.com/help/change-audience-name-defaults/).
                            When set to `true`, subscribers can choose whether they want to receive HTML
                            or plain-text emails. When set to `false`, subscribers will receive HTML emails,
                            with a plain-text alternative backup.
                          title: Email Type Option
                        subscribe_url_short:
                          type: string
                          description: Our [url shortened](https://mailchimp.com/help/share-your-signup-form/)
                            version of this list's subscribe form.
                          title: Subscribe URL Short
                          readOnly: true
                        subscribe_url_long:
                          type: string
                          description: The full version of this list's subscribe form (host will vary).
                          title: Subscribe URL Long
                          readOnly: true
                        beamer_address:
                          type: string
                          description: The list's [Email Beamer](https://mailchimp.com/help/use-email-beamer-to-create-a-campaign/)
                            address.
                          title: Beamer Address
                          readOnly: true
                        visibility:
                          type: string
                          description: Legacy - visibility settings are no longer used
                          title: Visibility
                          enum:
                          - pub
                          - prv
                        double_optin:
                          type: boolean
                          description: Whether or not to require the subscriber to confirm subscription
                            via email.
                          title: Double Opt In
                          default: false
                        has_welcome:
                          type: boolean
                          description: 'Whether or not this list has a welcome automation connected. Welcome
                            Automations: welcomeSeries, singleWelcome, emailFollowup.'
                          title: Has Welcome
                          default: false
                          example: false
                        marketing_permissions:
                          type: boolean
                          description: Whether or not the list has marketing permissions (eg. GDPR) enabled.
                          title: Marketing Permissions
                          default: false
                        modules:
                          type: array
                          description: Any list-specific modules installed for this list.
                          title: Modules
                          readOnly: true
                          items:
                            type: string
                        stats:
                          type: object
                          description: Stats for the list. Many of these are cached for at least five
                            minutes.
                          title: Statistics
                          readOnly: true
                          properties:
                            member_count:
                              type: integer
                              description: The number of active members in the list.
                              title: Member Count
                              readOnly: true
                            total_contacts:
                              type: integer
                              description: An approximate count of subscribed, unsubscribed, and transactional
                                contacts in the list. Does not include cleaned, archived, pending, or
                                contacts that need to be reconfirmed. Requires the (deprecated) include_total_contacts
                                query parameter to be included; for a complete audience contact count,
                                use the /audiences endpoint instead.
                              title: Total Contacts
                              readOnly: true
                            unsubscribe_count:
                              type: integer
                              description: The number of members who have unsubscribed from the list.
                              title: Unsubscribe Count
                              readOnly: true
                            cleaned_count:
                              type: integer
                              description: The number of members cleaned from the list.
                              title: Cleaned Count
                              readOnly: true
                            member_count_since_send:
                              type: integer
                              description: The number of active members in the list since the last campaign
                                was sent.
                              title: Member Count Since Send
                              readOnly: true
                            unsubscribe_count_since_send:
                              type: integer
                              description: The number of members who have unsubscribed since the last
                                campaign was sent.
                              title: Unsubscribe Count Since Send
                              readOnly: true
                            cleaned_count_since_send:
                              type: integer
                              description: The number of members cleaned from the list since the last
                                campaign was sent.
                              title: Cleaned Count Since Send
                              readOnly: true
                            campaign_count:
                              type: integer
                              description: The number of campaigns in any status that use this list.
                              title: Campaign Count
                              readOnly: true
                            campaign_last_sent:
                              type: string
                              format: date-time
                              description: The date and time the last campaign was sent to this list in
                                ISO 8601 format. This is updated when a campaign is sent to 10 or more
                                recipients.
                              title: Campaign Last Sent
                              readOnly: true
                            merge_field_count:
                              type: integer
                              description: The number of merge fields ([audience field](https://mailchimp.com/help/getting-started-with-merge-tags/))
                                for this list (doesn't include EMAIL).
                              title: Merge Field Count
                              readOnly: true
                            avg_sub_rate:
                              type: number
                              description: The average number of subscriptions per month for the list
                                (not returned if we haven't calculated it yet).
                              title: Average Subscription Rate
                              readOnly: true
                            avg_unsub_rate:
                              type: number
                              description: The average number of unsubscriptions per month for the list
                                (not returned if we haven't calculated it yet).
                              title: Average Unsubscription Rate
                              readOnly: true
                            target_sub_rate:
                              type: number
                              description: The target number of subscriptions per month for the list to
                                keep it growing (not returned if we haven't calculated it yet).
                              title: Average Subscription Rate
                              readOnly: true
                            open_rate:
                              type: number
                              description: The average open rate (a percentage represented as a number
                                between 0 and 100) per campaign for the list (not returned if we haven't
                                calculated it yet).
                              title: Open Rate
                              readOnly: true
                            click_rate:
                              type: number
                              description: The average click rate (a percentage represented as a number
                                between 0 and 100) per campaign for the list (not returned if we haven't
                                calculated it yet).
                              title: Click Rate
                              readOnly: true
                            last_sub_date:
                              type: string
                              format: date-time
                              description: The date and time of the last time someone subscribed to this
                                list in ISO 8601 format.
                              title: Date of Last List Subscribe
                              readOnly: true
                            last_unsub_date:
                              type: string
                              format: date-time
                              description: The date and time of the last time someone unsubscribed from
                                this list in ISO 8601 format.
                              title: Date of Last List Unsubscribe
                              readOnly: true
                        _links:
                          type: array
                          description: A list of link types and descriptions for the API schema documents.
                          title: Links
                          readOnly: true
                          items:
                            type: object
                            description: This object represents a link from the resource where it is found
                              to another resource or action that may be performed.
                            title: Resource Link
                            properties:
                              rel:
                                type: string
                                description: As with an HTML 'rel' attribute, this describes the type
                                  of link.
                                title: Rel
                                readOnly: true
                              href:
                                type: string
                                description: This property contains a fully-qualified URL that can be
                                  called to retrieve the linked resource or perform the linked action.
                                title: Href
                                readOnly: true
                              method:
                                type: string
                                description: The HTTP method that should be used when accessing the URL
                                  defined in 'href'.
                                title: Method
                                enum:
                                - GET
                                - POST
                                - PUT
                                - PATCH
                                - DELETE
                                - OPTIONS
                                - HEAD
                                readOnly: true
                              targetSchema:
                                type: string
                                description: For GETs, this is a URL representing the schema that the
                                  response should conform to.
                                title: Target Schema
                                readOnly: true
                              schema:
                                type: string
                                description: For HTTP methods that can receive bodies (POST and PUT),
                                  this is a URL representing the schema that the body should conform to.
                                title: Schema
                                readOnly: true
                  total_items:
                    type: integer
                    description: The total number of items matching the query regardless of pagination.
                    title: Item Count
                    readOnly: true
                  constraints:
                    type: object
                    description: Do particular authorization constraints around this collection limit
                      creation of new instances?
                    title: Collection Authorization
                    required:
                    - may_create
                    - max_instances
                    properties:
                      may_create:
                        type: boolean
                        description: May the user create additional instances of this resource?
                        title: Resource creation authorization
                      max_instances:
                        type: integer
                        description: How many total instances of this resource are allowed? This is independent
                          of any filter conditions applied to the query. As a special case, -1 indicates
                          unlimited.
                        title: Max instances
                      current_total_instances:
                        type: integer
                        description: How many total instances of this resource are already in use? This
                          is independent of any filter conditions applied to the query. Value may be larger
                          than max_instances. As a special case, -1 is returned when access is unlimited.
                        title: Current total instances
                  _links:
                    type: array
                    description: A list of link types and descriptions for the API schema documents.
                    title: Links
                    readOnly: true
                    items:
                      type: object
                      description: This object represents a link from the resource where it is found to
                        another resource or action that may be performed.
                      title: Resource Link
                      properties:
                        rel:
                          type: string
                          description: As with an HTML 'rel' attribute, this describes the type of link.
                          title: Rel
                          readOnly: true
                        href:
                          type: string
                          description: This property contains a fully-qualified URL that can be called
                            to retrieve the linked resource or perform the linked action.
                          title: Href
                          readOnly: true
                        method:
                          type: string
                          description: The HTTP method that should be used when accessing the URL defined
                            in 'href'.
                          title: Method
                          enum:
                          - GET
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                          - OPTIONS
                          - HEAD
                          readOnly: true
                        targetSchema:
                          type: string
                          description: For GETs, this is a URL representing the schema that the response
                            should conform to.
                          title: Target Schema
                          readOnly: true
                        schema:
                          type: string
                          description: For HTTP methods that can receive bodies (POST and PUT), this is
                            a URL representing the schema that the body should conform to.
                          title: Schema
                          readOnly: true
