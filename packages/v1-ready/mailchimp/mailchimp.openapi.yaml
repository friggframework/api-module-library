                          that need to be reconfirmed. Requires the (deprecated) include_total_contacts
                          query parameter to be included; for a complete audience contact count, use the
                          /audiences endpoint instead.
                        title: Total Contacts
                        readOnly: true
                      unsubscribe_count:
                        type: integer
                        description: The number of members who have unsubscribed from the list.
                        title: Unsubscribe Count
                        readOnly: true
                      cleaned_count:
                        type: integer
                        description: The number of members cleaned from the list.
                        title: Cleaned Count
                        readOnly: true
                      member_count_since_send:
                        type: integer
                        description: The number of active members in the list since the last campaign
