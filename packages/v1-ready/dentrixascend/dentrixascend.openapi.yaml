components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        OAuth 2.0 access token from
        POST {apiHost}/oauth/client_credential/accesstoken?grant_type=client_credentials
        with x-www-form-urlencoded client_id and client_secret.
  parameters:
    OrganizationIdHeader:
      name: Organization-ID
      in: header
      required: true
      schema: { type: string }
      description: Organization context; must be authorized for the access token.
    Filter:
      name: filter
      in: query
      required: false
      schema: { type: string }
      description: Ascend filter expression (e.g. lastModified>=2025-01-01).
    FilterRequired:
      name: filter
      in: query
      required: true
      schema: { type: string }
      description: Ascend filter expression (required on this endpoint).
    ResponseFields:
      name: responseFields
      in: query
      required: false
      schema: { type: string }
      description: Comma-delimited field names, or ALL.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer }
    LastId:
      name: lastId
      in: query
      required: false
      schema: { type: string }
      description: Cursor — largest id from the previous page.
  responses:
    Envelope:
      description: Public API success envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode: { type: integer }
              data: { type: object }
              warnings: { type: array, items: { type: object } }
              errors: { type: array, items: { type: object } }
    EnvelopeList:
      description: Public API success envelope (list)
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode: { type: integer }
              data:
                type: array
                items: { type: object }
              meta:
                type: object
                properties:
                  pagination:
                    type: object
                    properties:
                      limit: { type: integer }
                      offset: { type: integer }
                      total: { type: integer }
    Unauthorized:
      description: Authentication failed or missing
    NotFound:
      description: Resource missing or not accessible in organization context
