  version: '2024-06-18'
  description: 'Curated subset of the official Canva Connect OpenAPI (https://www.canva.dev/sources/connect/api/latest/api.yml)
    covering endpoints @friggframework/api-module-canva implements, including ports from Left Hook v1
    canva-connect (imports, comments, generations, brand templates). Paths/methods/params/schemas/security/servers
    are copied from the vendor file. Aliases: CreateAssetUploadJob→createAssetUploadJob, GetAssetUploadJob→getAssetUploadJob.'
  contact:
    name: Canva Developer Community
    url: https://community.canva.dev/
  termsOfService: https://www.canva.com/trust/legal/
  license:
    name: ©2023 All Rights Reserved
servers:
- description: Canva REST APIs
  url: https://api.canva.com/rest
