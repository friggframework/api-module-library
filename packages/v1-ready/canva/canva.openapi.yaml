    Mp4ExportQuality:
      description: "The resolution of the exported video, as a target number of pixels. The resolution\
        \ is one of\n`480p`, `720p`, `1080p` or `4k`.\n\nThe exported video always has the same aspect\
        \ ratio as the design, which matches creating a\ndownload from the Canva editor. The resolution\
        \ sets how many pixels to target, and the\ndesign's aspect ratio decides how they're split between\
        \ width and height, so the\n`horizontal` and `vertical` values of a given resolution produce the\
        \ same output:\n\n- A 2160x3840 portrait design exported as `horizontal_4k` is 2160x3840, not\
        \ 3840x2160. The\n  orientation in the value's name doesn't rotate or crop the design.\n- A 1000x2000\
        \ design exported as `horizontal_720p` is 678x1357, the 1:2 size closest to the\n  921,600 pixels\
        \ of 1280x720. Aspect ratios that don't match a standard video size aren't\n  rounded to one.\n\
        - A square design exported as `horizontal_4k` or `vertical_4k` is 2880x2880, the square with\n\
        \  the same number of pixels as 3840x2160."
      enum:
      - horizontal_480p
      - horizontal_720p
      - horizontal_1080p
      - horizontal_4k
      - vertical_480p
      - vertical_720p
      - vertical_1080p
      - vertical_4k
      type: string
