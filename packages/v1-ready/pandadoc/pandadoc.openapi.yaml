components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: Authorization
      in: header
      description: 'The `Authorization` header must contain the API key. The value should be prefixed
        with `API-Key` followed by a space and the actual API key.

        '
      x-default: API-Key 3039ba033eb1410caa0a2227158d63c9d6502cd8
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.pandadoc.com/oauth2/authorize
          tokenUrl: https://api.pandadoc.com/oauth2/access_token
          refreshUrl: https://api.pandadoc.com/oauth2/access_token
          scopes:
            read: View templates and document details.
            write: Create, send, delete, and download documents.
            read+write: Deprecated. Use space-separated `read write` instead.
      description: 'Send the authenticating user to the PandaDoc OAuth2 request URL. We recommend a button
        or a link titled

        "Connect to PandaDoc" if you are connecting users from a custom application. Users will see the
        "Authorize Application" screen.

        When the user clicks "Authorize", PandaDoc redirects the user back to your site with an authorization
        code inside the URL.


        https://app.pandadoc.com/oauth2/authorize?client_id={client_id}&redirect_uri={redirect_uri}&scope=read%20write&response_type=code


        Request `read`, `write`, or both as space-separated `read write`. `read+write` is deprecated.


        `client_id` and `redirect_uri` values should match your application settings.

        '
  schemas:
    ContactListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContactDetailsResponse'
    ContactDetailsResponse:
      type: object
      properties:
        id:
          type: string
          example: BCUWJhZm3k7grUNFAz6cD2
          description: A unique identifier of the contact
        email:
          type: string
          nullable: true
          example: user01@pandadoc.com
          description: An email address of the contact
        first_name:
          type: string
          nullable: true
          example: John
          description: Contact's first name
        last_name:
          type: string
          nullable: true
          example: Doe
          description: Contact's last name
        company:
          type: string
          nullable: true
          example: John Doe Inc.
          description: Contact's company name
        job_title:
          type: string
          nullable: true
          example: CTO
          description: Contact's job title
        phone:
          type: string
          nullable: true
          example: '+14842634627'
          description: A phone number
        country:
          type: string
          nullable: true
          example: USA
          description: A country name
        state:
          type: string
          nullable: true
          example: Texas
          description: A state name
        street_address:
          type: string
          nullable: true
          example: 1313 Mockingbird Lane
          description: A street address
        city:
          type: string
          nullable: true
          example: Austin
          description: A city name
        postal_code:
          type: string
          nullable: true
          example: '75001'
          description: A postal code
    DocumentCreateRequest:
      oneOf:
      - $ref: '#/components/schemas/DocumentCreateByTemplateRequest'
      - $ref: '#/components/schemas/DocumentCreateByPdfUrlRequest'
    DocumentCreateByTemplateRequest:
      title: From PandaDoc Template
      type: object
      required:
      - template_uuid
      - recipients
      properties:
        template_uuid:
          type: string
          description: The ID of a template you want to use. You can copy it from an in app template url
            such as `https://app.pandadoc.com/a/#/templates/{ID}/content`. A template ID is also obtained
            by listing templates.
          example: hryJY9mqYZHjQCYQuSjRQg
        fields:
          type: object
          description: 'Set specific values to the fields. This object maps merge field names to their
            corresponding values.


            Each key represents a merge field name, and each value is an object containing the data to
            populate that field with. The structure allows you to pre-populate various field types including
            text inputs, checkboxes, dropdowns, and date fields.


            **Key Points:**

            - Keys must match the exact merge field names from your template or file.

            - Values must be wrapped in an object with a `value` property.

            - Supported value types: string, number, boolean.

            - Date fields should use RFC 3339 format (e.g., ''2019-12-31T00:00:00.000Z'').

            - Signature fields cannot be pre-filled.


            **Example Usage:**

            - Text field: `"CustomerName": {"value": "John Doe"}`

            - Checkbox: `"AgreeToTerms": {"value": true}`

            - Date field: `"DeliveryDate": {"value": "2019-12-31T00:00:00.000Z"}`

            '
          example:
            Like:
              value: true
            Delivery:
              value: Same Day Delivery
            Date:
              value: '2019-12-31T00:00:00.000Z'
          additionalProperties:
            type: object
            properties:
              value:
                description: 'The value to pre-fill the field with. The type of the value depends on the
                  field type in the template.

                  For example, for a checkbox field, you can pass a boolean value, and for a date field,
                  you can pass a date string in RFC 3339 format (e.g., 2019-12-31T00:00:00.000Z).

                  '
                oneOf:
                - type: boolean
                - type: string
                - type: number
              role:
                type: string
                description: 'Assign this field to a recipient role. The role must be present in the `recipients`
                  list.

                  '
                example: user
            required:
            - value
        images:
          type: array
          description: You can pass a list of images to image blocks (one image in one block) for replacement.
          items:
            type: object
            nullable: true
            properties:
              urls:
                type: array
                items:
                  type: string
                example:
                - https://s3.amazonaws.com/pd-static-content/public-docs/pandadoc-panda-bear.png
              name:
                type: string
                example: Image 1
            required:
            - urls
            - name
        pricing_tables:
          type: array
          description: Information to construct or populate a pricing table can be passed when creating
            a document. All product information must be passed when creating a new document. Products
            stored in PandaDoc cannot be used to populate table rows at this time. Keep in mind that this
            is an array, so multiple table objects can be passed to a document. Make sure that "Automatically
            add products to this table" is enabled in the PandaDoc template pricing tables you wish to
            populate via API.
          items:
            $ref: '#/components/schemas/PricingTableRequest'
        tables:
          type: array
          description: Information to construct or populate a table can be passed when creating a document.
            Keep in mind that this is an array, so multiple table objects can be passed to a document.
          items:
            $ref: '#/components/schemas/TableRequest'
        texts:
          type: array
          description: You can pass a list of rich text values to pre-fill text blocks in a template.
            This is useful for inserting dynamic content like introductions or terms and conditions. Markdown
            is supported.
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the Text Block to update. This name is defined in the template.
                example: Legal Terms Section
              data:
                type: string
                description: The text content to be inserted into the block. Supports markdown.
                example: '## Terms of Service

                  This document outlines the terms and conditions.

                  - **Acceptance:** By using our service, you agree to these terms.

                  - **Changes:** We may update these terms at any time.

                  '
            required:
            - name
            - data
        detect_title_variables:
          type: boolean
          description: Set this parameter as true if you want to detect title variables in the document.
          example: true
        content_placeholders:
          type: array
          description: You may replace Content Library Item Placeholders with a few content library items
            each and pre-fill fields/variables values, pricing table items, and assign recipients to roles
            from there.
          items:
            type: object
            properties:
              content_library_items:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Content library item id
                      example: hryJY9mqYZHjQCYQuSjRQg
                    fields:
                      type: object
                    pricing_tables:
                      type: array
                      items:
                        $ref: '#/components/schemas/PricingTableRequest'
                    recipients:
                      type: array
                      items:
                        type: object
                        properties:
                          email:
                            type: string
                            nullable: true
                            example: josh@example.com
                          phone:
                            type: string
                            nullable: true
                            example: '+14842634627'
                          delivery_methods:
                            $ref: '#/components/schemas/RecipientDeliveryMethods'
                          first_name:
                            type: string
                            example: Josh
                          last_name:
                            type: string
                            example: Ron
                          role:
                            type: string
                            example: user
                          signing_order:
                            type: integer
                            example: 1
                            nullable: true
                          redirect:
                            $ref: '#/components/schemas/RecipientRedirect'
                  required:
                  - id
              block_id:
                type: string
                description: Content placeholder block id
                example: Content Placeholder 1
            required:
            - block_id
        name:
          type: string
          description: Name the document you are creating.
          example: API Sample Document from PandaDoc Template
        folder_uuid:
          type: string
          example: QMDSzwabfFzTgjW4kUijqQ
          description: ID of the folder where the created document should be stored.
        owner:
          type: object
          properties:
            email:
              type: string
              example: john.doe@example.com
            membership_id:
              type: string
              example: QMDSzwabfFzTgjW6KijHyu
          description: The owner of the document. Pass either `email` or `membership_id` of the user in
            the workspace.
          example:
            membership_id: QMDSzwabfFzTgjW6KijHyu
        recipients:
          type: array
          description: The list of recipients to whom the document will be sent. Either `email` or `phone`
            is required. Specifying the `role` assigns all matching fields to the recipient or group.
            If `first_name` and `last_name` are not specified, the system looks them up in the workspace
            contacts list using the `email` or `phone number`. If `first_name` and `last_name` are provided,
            they override the existing contact's data.
          items:
            $ref: '#/components/schemas/CreateDocumentActor'
        tokens:
          type: array
          description: Also known as variables. Pass values for the variables in the template to render
            them into the created document or make them available for insertion later.
          items:
            type: object
            properties:
              name:
                type: string
                example: Client.CompanyName
              value:
                type: string
                example: PandaDoc
            required:
            - name
            - value
        metadata:
          type: object
          nullable: true
          description: You can pass any data in a key-value format to associate it with a document. Searching
            by metadata is available in the List Documents endpoint and is also included in the Document
            Details response.
          example:
            lead_id: '1234567'
            lead_source: PandaDoc
        tags:
          type: array
          description: Mark your document with one or more tags. Tags are displayed in the UI, and you
            can filter by tags in the List Documents endpoint.
          items:
            type: string
          example:
          - created_via_api
          - test_document
          - created_from_source
    PricingTableRequest:
      type: object
      properties:
        name:
          type: string
          example: Pricing Table 1
        data_merge:
          type: boolean
          description: When set to true all field names in data rows must be passed as external names
            defined in the template.
        options:
          type: object
          example:
            currency: USD
            Discount:
              type: absolute
              name: Global Discount
              value: 10
            Tax:
              type: percent
              name: Tax First
              value: 15
        sections:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
                example: Sample Section
              default:
                type: boolean
              multichoice_enabled:
                type: boolean
                default: false
              rows:
                type: array
                items:
                  type: object
                  properties:
                    options:
                      type: object
                      title: Pricing Table Request Row Options
                      properties:
                        qty_editable:
                          type: boolean
                        optional_selected:
                          type: boolean
                        optional:
                          type: boolean
                    data:
                      type: object
                      title: Pricing Table Request Row Data
                      example:
                        Name: Toy Panda
                        Description: Fluffy
                        Price: 10
                        Cost: 8.5
                        QTY: 3
                        SKU: toy_panda
                        Discount:
                          value: 10
                          type: percent
                        Tax:
                          value: 10
                          type: percent
                    custom_fields:
                      type: object
                      example:
                        Fluffiness: 5/5
                  required:
                  - options
                  - data
            required:
            - title
            - default
      required:
      - name
      - sections
    TableRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the table.
        data:
          type: object
          properties:
            sections:
              type: array
              items:
                type: object
                properties:
                  header:
                    type: array
                    items:
                      $ref: '#/components/schemas/TableCell'
                  rows:
                    type: array
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/TableCell'
                required:
                - header
                - rows
          required:
          - sections
      required:
      - name
      - data
    TableCell:
      type: object
      description: Defines a single cell in the table, which can appear in either the header or the rows.
      properties:
        text:
          type: string
          description: Cell text.
        col_span:
          type: integer
          description: Represents how many columns the cell occupies.
          nullable: true
        row_span:
          type: integer
          description: Represents the number of rows the cell occupies.
          nullable: true
      required:
      - text
    CreateDocumentActor:
      anyOf:
      - $ref: '#/components/schemas/CreateDocumentRecipient'
      - $ref: '#/components/schemas/CreateDocumentRecipientGroup'
      discriminator:
        propertyName: type
        mapping:
          recipient: '#/components/schemas/CreateDocumentRecipient'
          recipient_group: '#/components/schemas/CreateDocumentRecipientGroup'
    CreateDocumentRecipient:
      title: Recipient
      allOf:
      - $ref: '#/components/schemas/BaseActor'
      - $ref: '#/components/schemas/BaseIdentity'
      - type: object
        properties:
          delivery_methods:
            $ref: '#/components/schemas/RecipientDeliveryMethods'
          redirect:
            $ref: '#/components/schemas/RecipientRedirect'
          type:
            type: string
            example: recipient
            enum:
            - recipient
          verification_settings:
            $ref: '#/components/schemas/RecipientVerificationSettings'
    BaseActor:
      type: object
      properties:
        role:
          type: string
          nullable: true
          example: user
          description: A recipient's role in the document from the template. A recipient will be added
            in CC if a role parameter is not provided.
        signing_order:
          type: integer
          nullable: true
          example: 1
          description: 'Set a signing order for a recipient. Learn more: https://developers.pandadoc.com/docs/set-signing-order

            '
    BaseIdentity:
      type: object
      properties:
        email:
          type: string
          nullable: true
          example: josh@example.com
          description: A recipient's email address.
        phone:
          type: string
          nullable: true
          example: '+14842634627'
          description: A recipient's phone number.
        first_name:
          type: string
          nullable: true
          example: Josh
          description: A recipient's first name. We automatically take the first name from contact data
            if this field is missed.
        last_name:
          type: string
          nullable: true
          example: Ron
          description: A recipient's last name. We automatically take the last name from contact data
            if this field is missed.
    RecipientVerificationSettings:
      type: object
      description: 'To set up recipient verification, provide verification_place (required) and exactly
        one verification type: passcode_verification, phone_verification, kba_verification, id_verification,
        or email_otp_verification. All other verification type fields must be null. Providing more than
        one verification type returns a 400 error.

        - For passcode_verification, provide the passcode.

        - For phone_verification, provide the phone_number.

        - For email_otp_verification, provide the email.

        - For kba_verification and id_verification, set the enabled parameter to true.

        '
      example:
        verification_place: before_open
        email_otp_verification:
          email: user@example.com
      properties:
        verification_place:
          $ref: '#/components/schemas/RecipientVerificationPlaceEnum'
        passcode_verification:
          type: object
          description: Sets the passcode.
          properties:
            passcode:
              type: string
              pattern: ^(?=(?:.*[a-zA-Z]){1,})(?=(?:.*[0-9]){1,})^[\S]{6,100}$
              example: SimpleCode1
              description: Document passcode.
          required:
          - passcode
          nullable: true
        phone_verification:
          type: object
          nullable: true
          description: Sets the phone number to send a passcode to.
          properties:
            phone_number:
              type: string
              pattern: ^\+[1-9]\d{0,4}\d{2,14}$
              example: '+1234567890'
              description: A phone number to send a passcode to.
          required:
          - phone_number
        kba_verification:
          type: object
          nullable: true
          description: Sets the KBA verification.
          properties:
            time_limit_sec:
              type: integer
              example: 120
            score_threshold:
              type: integer
              example: 80
            max_attempts_count:
              type: integer
              example: 2
        id_verification:
          type: object
          nullable: true
          description: Sets the ID verification.
          properties:
            enabled:
              type: boolean
              example: true
        email_otp_verification:
          type: object
          description: Sets the email address to send a one-time passcode to.
          properties:
            email:
              type: string
              format: email
              example: user@example.com
              description: An email address to send a one-time passcode to.
          required:
          - email
          nullable: true
    RecipientVerificationPlaceEnum:
      description: 'Specifies when a recipient must complete the verification process:

        - `before_open` (before opening the document),

        - `before_sign` (before signing the document).

        '
      type: string
      enum:
      - before_open
      - before_sign
    RecipientDeliveryMethods:
      type: object
      nullable: true
      properties:
        email:
          type: boolean
        sms:
          type: boolean
    RecipientRedirect:
      type: object
      properties:
        is_enabled:
          type: boolean
          default: false
        url:
          type: string
          nullable: true
          default: null
          example: https://example.com
          description: A URL to redirect to after the document is signed.
      required:
      - is_enabled
      - url
    CreateDocumentRecipientGroup:
      title: RecipientGroup
      allOf:
      - $ref: '#/components/schemas/BaseActor'
      - type: object
        properties:
          name:
            type: string
            maxLength: 120
          type:
            type: string
            example: recipient_group
            enum:
            - recipient_group
          members:
            type: array
            minLength: 1
            items:
              $ref: '#/components/schemas/BaseIdentity'
        required:
        - name
        - type
    DocumentCreateByPdfUrlRequest:
      title: From File By Url
      allOf:
      - type: object
        description: Use a URL to create a document.
        properties:
          url:
            type: string
            example: https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf
            description: Secure (HTTPS) and publicly accessible URL to the PDF document.
