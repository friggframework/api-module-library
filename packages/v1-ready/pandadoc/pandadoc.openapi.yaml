    get:
      tags:
      - Documents
      summary: Document Download
      operationId: downloadDocument
      description: 'Download documents as a PDF.

        > ❗️ Downloading completed and signed documents

        >

        > To download completed and signed documents, you should use the [Download Protected Document](https://developers.pandadoc.com/reference/download-protected-document)
        endpoint instead. See the [How to download a completed document](https://developers.pandadoc.com/docs/how-to-download-completed-document)
