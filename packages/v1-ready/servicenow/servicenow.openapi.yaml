          description: List of attachment metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'

  /api/now/attachment/{sys_id}:
    get:
      tags: [Attachment]
      operationId: getAttachment
      summary: Get attachment metadata
      description: >-
        Official Attachment API GET /now/attachment/{sys_id}. File bytes are at
        /now/attachment/{sys_id}/file (not wrapped by this module).
      parameters:
        - $ref: '#/components/parameters/sys_id'
      responses:
        "200":
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRecordResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'OAuth 2.0 access token (Authorization: Bearer)'
    basicAuth:
      type: http
      scheme: basic
      description: Instance username/password (alternate to OAuth)
  parameters:
    sys_id:
      name: sys_id
      in: path
      required: true
      schema:
        type: string
      description: sys_id of the record
    sysparm_query:
      name: sysparm_query
      in: query
      schema:
        type: string
      description: Encoded query string (mutually exclusive with name-value filters)
    sysparm_limit:
      name: sysparm_limit
      in: query
      schema:
        type: integer
      description: Maximum number of records (default 10000)
    sysparm_offset:
      name: sysparm_offset
      in: query
      schema:
        type: integer
      description: Starting record index (default 0)
    sysparm_fields:
      name: sysparm_fields
      in: query
      schema:
        type: string
      description: Comma-separated list of fields to return
    sysparm_display_value:
      name: sysparm_display_value
      in: query
      schema:
        type: string
        enum: ['true', 'false', 'all']
      description: Return display values (true), actual values (false), or both (all)
  schemas:
    TableListResponse:
      type: object
      properties:
        result:
          type: array
          items:
            type: object
            additionalProperties: true
    TableRecordResponse:
      type: object
      properties:
        result:
          type: object
          additionalProperties: true
