      operationId: getCallbackId
      summary: Get callback by id
      responses:
        "200":
          description: Callback (shape UNVERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Callback" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Callbacks]
      operationId: deleteCallbackId
      summary: Delete callback by id
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: >-
        `Authorization: Basic base64(<companyId>+<publicKey>:<privateKey>)`.
    ClientIdHeader:
      type: apiKey
      in: header
      name: clientId
      description: Required ConnectWise clientId on every API call.
  parameters:
    Codebase:
      name: codebase
      in: path
      required: true
      description: >-
        PSA codebase path segment including trailing slash. This module pins
        `v4_6_release/`. Guide form is `<codebase>apis/3.0` (no extra slash).
      schema:
        type: string
        default: v4_6_release/
    AcceptHeader:
      name: Accept
      in: header
      required: true
      description: >-
        PSA REST model version. Module default
        `application/vnd.connectwise.com+json; version=2019.1`.
      schema:
        type: string
        default: "application/vnd.connectwise.com+json; version=2019.1"
    ClientIdHeader:
      name: clientId
      in: header
      required: true
      description: Registered ConnectWise clientId (required on all calls).
      schema:
        type: string
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
          - type: string
    ConditionsQuery:
      name: conditions
      in: query
      required: false
      description: >-
        ConnectWise conditions filter (and other query keys the client forwards).
        Exact query param catalog UNVERIFIED against login-gated docs.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing/invalid Basic auth or clientId.
  schemas:
    Company:
      type: object
      description: Company resource (fields UNVERIFIED)
      additionalProperties: true
      properties:
        id: { type: integer }
        name: { type: string }
        identifier: { type: string }
    CompanyType:
      type: object
      description: Company type (fields UNVERIFIED)
      additionalProperties: true
      properties:
        id: { type: integer }
        name: { type: string }
    Contact:
      type: object
      description: Contact resource (fields UNVERIFIED)
      additionalProperties: true
      properties:
        id: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
    Invoice:
      type: object
      description: Invoice resource (fields UNVERIFIED)
      additionalProperties: true
      properties:
        id: { type: integer }
        type: { type: string }
    CatalogItem:
      type: object
      description: Catalog item (fields UNVERIFIED)
      additionalProperties: true
      properties:
        id: { type: integer }
        identifier: { type: string }
        description: { type: string }
    CatalogItemCreate:
      type: object
      description: Body built by Api.createCatalogItem (field requirements UNVERIFIED)
      additionalProperties: true
      properties:
        identifier: { type: string }
        description: { type: string }
        inactiveFlag: { type: boolean }
        productClass: { type: string }
        price: { type: number }
        cost: { type: number }
        customerDescription: { type: string }
        subcategory:
          type: object
          properties:
            id: {}
        type:
          type: object
          properties:
            id: {}
        unitOfMeasure:
          type: object
          properties:
            id: {}
        category:
          type: object
          properties:
            id: {}
    InvoiceProductCreate:
      type: object
      description: Body built by Api.addProductToInvoice (field requirements UNVERIFIED)
      additionalProperties: true
      properties:
        catalogItem:
          type: object
          properties:
            id: {}
            identifier: { type: string }
        quantity: { type: number }
        price: { type: number }
        cost: { type: number }
        discount: { type: number }
        billableOption: { type: string }
        customerDescription: { type: string }
        listPrice: { type: number }
        invoice:
          type: object
          properties:
            id: {}
    Callback:
      type: object
      description: System callback (fields UNVERIFIED)
      additionalProperties: true
      properties:
        id: { type: integer }
        url: { type: string }
        type: { type: string }
    PatchOperation:
      type: object
      description: JSON Patch operation produced by FormatPatchBody (op/path/value UNVERIFIED vs PSA)
      additionalProperties: true
      properties:
        op: { type: string }
        path: { type: string }
        value: {}
