        \ name |\n| `last_name` | A user's last name |\n| `is_active` | A boolean value that identifies\
        \ if a member is active and not blocked |\n| `workspace` | A unique identifier of the user's current\
        \ active workspace |\n| `workspace_name` | A name of the user's current active workspace |\n|\
        \ `email_verified` | A boolean value that identifies if the email is verified |\n| `role` | A\
        \ member's role in the workspace |\n| `user_license` | A user license in the organization:  <br/>`Full\
        \ (Standard)`;  <br/>`Read-only`;  <br/>`eSignature`;  <br/>`Guest`;  <br/>`Creator` |\n| `date_created`\
        \ | A date when a member was added to the workspace |\n| `date_modified` | Last modified date\
        \ of a member |\n"
