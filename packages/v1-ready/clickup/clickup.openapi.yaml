                            properties:
                              priority:
                                type: string
                              color:
                                type: string
                          - type:
                            - string
                            - 'null'
                          - {}
                        assignee:
                          type:
                          - string
                          - 'null'
                        task_count:
                          type:
                          - string
                          - 'null'
                        due_date:
                          type:
                          - string
                          - 'null'
                        start_date:
                          type:
                          - string
                          - 'null'
                        folder:
                          title: Folder3
                          required:
                          - id
                          - name
                          - hidden
                          - access
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            hidden:
                              type: boolean
                            access:
                              type: boolean
                        space:
                          title: Space2
                          required:
                          - id
                          - name
                          - access
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            access:
                              type: boolean
                        archived:
                          type: boolean
                        override_statuses:
                          type: boolean
                        permission_level:
                          type: string
                    description: ''
      deprecated: false
