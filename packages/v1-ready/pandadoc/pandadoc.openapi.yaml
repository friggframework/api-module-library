                  value:
                    id: vibuun3DXG8QDDLfXm27Ne
                    name: API Sample PandaDoc Template
                    date_created: '2024-07-15T17:44:07.524617Z'
                    date_modified: '2024-07-15T17:44:07.613821Z'
                    version: '2'
                    status: template.PROCESSED
