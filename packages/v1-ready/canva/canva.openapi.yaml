# Generated curated subset from official Canva Connect OpenAPI
# Source: https://www.canva.dev/sources/connect/api/latest/api.yml
# Only operationId aliases: CreateAssetUploadJob→createAssetUploadJob,
# GetAssetUploadJob→getAssetUploadJob (Api method parity / spec-sync).

openapi: 3.0.0
info:
  title: Canva Connect API (Frigg curated subset)
  version: '2024-06-18'
  description: Curated subset of the official Canva Connect OpenAPI (https://www.canva.dev/sources/connect/api/latest/api.yml)
    covering exactly the endpoints @friggframework/api-module-canva implements. Paths, methods, parameters,
    request/response schemas, security, and server URL are copied from the official description. Official
    PascalCase operationIds CreateAssetUploadJob / GetAssetUploadJob are aliased to camelCase createAssetUploadJob
    / getAssetUploadJob so they match Api methods 1:1 (spec-sync enforced).
  contact:
    name: Canva Developer Community
    url: https://community.canva.dev/
  termsOfService: https://www.canva.com/trust/legal/
  license:
    name: ©2023 All Rights Reserved
servers:
- description: Canva REST APIs
  url: https://api.canva.com/rest
tags:
- name: asset
- name: brand_template
- name: comment
- name: connect
- name: design
- name: export
- name: folder
- name: oauth
- name: oidc
- name: user
paths:
  /v1/assets/{assetId}:
    delete:
      description: 'You can delete an asset by specifying its `assetId`. This operation mirrors the behavior

        in the Canva UI. Deleting an item moves it to the trash.

        Deleting an asset doesn''t remove it from designs that already use it.'
      operationId: deleteAsset
      parameters:
      - description: The ID of the asset.
        explode: false
        in: path
        name: assetId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '204':
          description: OK
        '403':
          content:
            application/json:
              examples:
                asset_delete_not_allowed:
                  $ref: '#/components/examples/AssetDeleteNotAllowedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              examples:
                asset_not_found:
                  $ref: '#/components/examples/AssetNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - asset:write
      tags:
      - asset
      x-rate-limit-per-client-user: 30
    get:
      description: You can retrieve the metadata of an asset by specifying its `assetId`.
      operationId: getAsset
      parameters:
      - description: The ID of the asset.
        explode: false
        in: path
        name: assetId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAssetResponse'
          description: OK
        '403':
          content:
            application/json:
              examples:
                asset_access_not_allowed:
                  $ref: '#/components/examples/AssetAccessNotAllowedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              examples:
                asset_not_found:
                  $ref: '#/components/examples/AssetNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - asset:read
      tags:
      - asset
      x-rate-limit-per-client-user: 100
    patch:
      description: 'You can update the name and tags of an asset by specifying its `assetId`. Updating
        the tags

        replaces all existing tags of the asset.'
      operationId: updateAsset
      parameters:
      - description: The ID of the asset.
        explode: false
        in: path
        name: assetId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAssetResponse'
          description: OK
        '403':
          content:
            application/json:
              examples:
                asset_update_not_allowed:
                  $ref: '#/components/examples/AssetUpdateNotAllowedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              examples:
                asset_not_found:
                  $ref: '#/components/examples/AssetNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - asset:write
      tags:
      - asset
      x-rate-limit-per-client-user: 30
  /v1/asset-uploads:
    post:
      description: 'Starts a new [asynchronous job](https://www.canva.dev/docs/apps/rest-apis/requests-responses/#asynchronous-job-endpoints)
        to upload an asset to the user''s content library. Supported file types for assets are listed
        in the [Assets API overview](https://www.canva.dev/docs/apps/rest-apis/reference/assets/).


        The request format for this endpoint is an `application/octet-stream` body of bytes. Attach

        information about the upload using an `Asset-Upload-Metadata` header.



        <Note>


        For more information on the workflow for using asynchronous jobs, see [API requests and responses](https://www.canva.dev/docs/apps/rest-apis/requests-responses/#asynchronous-job-endpoints).
        You can check the status and get the results of asset upload jobs created with this API using
        the [Get asset upload job API](https://www.canva.dev/docs/apps/rest-apis/reference/assets/get-asset-upload-job/).


        </Note>'
      operationId: createAssetUploadJob
      parameters:
      - content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUploadMetadata'
        in: header
        name: Asset-Upload-Metadata
        required: true
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        description: Binary of the asset to upload.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                in_progress:
                  $ref: '#/components/examples/InProgressAssetUploadJobExample'
                success:
                  $ref: '#/components/examples/SuccessAssetUploadJobExample'
                failed:
                  $ref: '#/components/examples/FailedAssetUploadJobExample'
              schema:
                $ref: '#/components/schemas/CreateAssetUploadJobResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - asset:write
      tags:
      - asset
      x-rate-limit-per-client-user: 30
  /v1/asset-uploads/{jobId}:
    get:
      description: 'Get the result of an asset upload job that was created using the [Create asset upload
        job API](https://www.canva.dev/docs/apps/rest-apis/reference/assets/create-asset-upload-job/).


        You might need to make multiple requests to this endpoint until you get a `success` or `failed`
        status. For more information on the workflow for using asynchronous jobs, see [API requests and
        responses](https://www.canva.dev/docs/apps/rest-apis/requests-responses/#asynchronous-job-endpoints).'
      operationId: getAssetUploadJob
      parameters:
      - description: The asset upload job ID.
        explode: false
        in: path
        name: jobId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              examples:
                in_progress:
                  $ref: '#/components/examples/InProgressAssetUploadJobExample'
                success:
                  $ref: '#/components/examples/SuccessAssetUploadJobExample'
                failed:
                  $ref: '#/components/examples/FailedAssetUploadJobExample'
              schema:
                $ref: '#/components/schemas/GetAssetUploadJobResponse'
          description: OK
        '403':
          content:
            application/json:
              examples:
                asset_access_not_allowed:
                  $ref: '#/components/examples/AssetAccessNotAllowedError'
                asset_upload_job_not_creator:
                  $ref: '#/components/examples/AssetUploadJobNotCreatorError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              examples:
                asset_not_found:
                  $ref: '#/components/examples/AssetNotFoundError'
                asset_upload_job_not_found:
                  $ref: '#/components/examples/AssetUploadJobNotFoundError'
                job_id_not_found:
                  $ref: '#/components/examples/AssetJobIdNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - asset:read
      tags:
      - asset
      x-rate-limit-per-client-user: 180
  /v1/connect/keys:
    get:
      description: '<Warning>


        This API is currently provided as a preview. Be aware of the following:


        - There might be unannounced breaking changes.

        - Any breaking changes to preview APIs won''t produce a new [API version](https://www.canva.dev/docs/apps/rest-apis/versions/).

        - Public apps that use preview APIs will not pass the review process, and can''t be made available
        to all Canva users.


        </Warning>


        The Keys API (`connect/keys`) is a security measure you can use to verify the authenticity

        of webhooks you receive from the Canva REST APIs. The Keys API returns a

        [JSON Web Key (JWK)](https://www.rfc-editor.org/rfc/rfc7517#section-2), which you can use to

        decrypt the webhook signature and verify it came from Canva and not a potentially malicious

        actor. This helps to protect your systems from

        [Replay attacks](https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/).


        The keys returned by the Keys API can rotate. We recommend you cache the keys you receive

        from this API where possible, and only access this API when you receive a webhook signed

        with an unrecognized key. This allows you to verify webhooks quicker than accessing this API

        every time you receive a webhook.'
      operationId: getSigningPublicKeys
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSigningPublicKeysResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      tags:
      - connect
  /v1/designs:
    get:
      description: 'Lists metadata for all the designs in a Canva user''s

        [projects](https://www.canva.com/help/find-designs-and-folders/). You can also:


        - Use search terms to filter the listed designs.

        - Show designs either created by, or shared with the user.

        - Sort the results.'
      operationId: listDesigns
      parameters:
      - description: Lets you search the user's designs, and designs shared with the user, using a search
          term or terms.
        example: party invites
        explode: true
        in: query
        name: query
        required: false
        schema:
          maxLength: 255
          type: string
        style: form
      - description: 'If the success response contains a continuation token, the list contains more designs

          you can list. You can use this token as a query parameter and retrieve more

          designs from the list, for example

          `/v1/designs?continuation={continuation}`.


          To retrieve all of a user''s designs, you might need to make multiple requests.'
        example: RkFGMgXlsVTDbMd:MR3L0QjiaUzycIAjx0yMyuNiV0OildoiOwL0x32G4NjNu4FwtAQNxowUQNMMYN
        explode: true
        in: query
        name: continuation
        required: false
        schema:
          type: string
        style: form
      - description: Filter the list of designs based on the user's ownership of the designs.
        example: any
        explode: true
        in: query
        name: ownership
        required: false
        schema:
          $ref: '#/components/schemas/OwnershipType'
        style: form
      - description: Sort the list of designs.
        example: relevance
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          $ref: '#/components/schemas/SortByType'
        style: form
      - description: The number of designs to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetListDesignResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                invalid_continuation:
                  $ref: '#/components/examples/InvalidContinuationError'
                invalid_ownership:
                  $ref: '#/components/examples/InvalidOwnershipError'
                invalid_sort_by:
                  $ref: '#/components/examples/InvalidSortByError'
                design_type_not_available:
                  $ref: '#/components/examples/DesignTypeNotAvailableError'
                unable_to_fetch_designs:
                  $ref: '#/components/examples/UnableToFetchDesignsError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '403':
          content:
            application/json:
              examples:
                not_allowed_to_access_design_list:
                  $ref: '#/components/examples/ListDesignsForbiddenError'
                find_documents_forbidden:
                  $ref: '#/components/examples/FindDocumentsForbiddenError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - design:meta:read
      tags:
      - design
      x-rate-limit-per-client-user: 100
    post:
      description: "Creates a new Canva design. To create a new design, you can:\n\n- Use a preset design\
        \ type.\n- Set height and width dimensions for a custom design.\n\n  NOTE: Custom designs can\
        \ have a maximum area of 25,000,000 pixels squared (for example, 5000 × 5000 pixels). Each dimension\
        \ can be between 40 and 8000 pixels, but the total area must stay within this limit.\n- Create\
        \ a copy of an existing design (currently a [preview feature](https://www.canva.dev/docs/apps/rest-apis/#preview-apis)).\n\
        - Create a new design from a brand template (currently a [preview feature](https://www.canva.dev/docs/apps/rest-apis/#preview-apis)).\n\
        \nFor preset and custom designs, you can also provide the `asset_id` of an asset in the user's\
        \ [projects](https://www.canva.com/help/find-designs-and-folders/) to add to the new design. Currently,\
        \ this only supports image assets. To list the assets in a folder in the user's projects, use\
        \ the [List folder items API](https://www.canva.dev/docs/apps/rest-apis/reference/folders/list-folder-items/).\n\
        \nAn asset provided this way is placed in the design as a single flat image, which the user can\
        \ move, resize, or replace, but not edit as separate elements. If you want the elements of an\
        \ image to become separate editable layers in the design, use the [Create image-to-design import\
        \ job API](https://www.canva.dev/docs/apps/rest-apis/reference/design-imports/create-image-to-design-import-job/)\
        \ instead.\n\nNOTE: Blank designs created with this API are automatically deleted if they're not\
        \ edited within 7 days. These blank designs bypass the user's Canva trash and are permanently\
        \ deleted."
      operationId: createDesign
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDesignRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDesignResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                invalid_design_type:
                  $ref: '#/components/examples/InvalidDesignTypeError'
                missing_design_type_or_asset_id:
                  $ref: '#/components/examples/MissingDesignTypeOrAssetIdError'
                blank_design_id:
                  $ref: '#/components/examples/BlankDesignIdError'
                blank_brand_template_id:
                  $ref: '#/components/examples/BlankBrandTemplateIdError'
                asset_id_not_image:
                  $ref: '#/components/examples/AssetIdNotImageError'
                invalid_design_dimensions:
                  $ref: '#/components/examples/InvalidDesignDimensionsError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '403':
          content:
            application/json:
              examples:
                asset_access_not_allowed:
                  $ref: '#/components/examples/AssetAccessNotAllowedError'
                get_design_dataset_permission_denied:
                  $ref: '#/components/examples/GetDesignDatasetPermissionDeniedError'
                create_design_brand_template_access_denied:
                  $ref: '#/components/examples/CreateDesignBrandTemplateAccessDeniedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              examples:
                create_design_not_found:
                  $ref: '#/components/examples/CreateDesignNotFoundError'
                create_brand_template_not_found:
                  $ref: '#/components/examples/CreateBrandTemplateNotFoundError'
                asset_not_found:
                  $ref: '#/components/examples/AssetNotFoundError'
                design_id_not_found:
                  $ref: '#/components/examples/DesignIdNotFoundError'
                ref_design_type_not_found:
                  $ref: '#/components/examples/RefDesignTypeNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        '429':
          content:
            application/json:
              examples:
                design_creation_throttled:
                  $ref: '#/components/examples/CreateDesignThrottledError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Too Many Requests
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - design:content:write
      tags:
      - design
      x-rate-limit-per-client-user: 20
  /v1/designs/{designId}:
    get:
      description: Gets the metadata for a design. This includes owner information, URLs for editing and
        viewing, and thumbnail information.
      operationId: getDesign
      parameters:
      - description: The design ID.
        explode: false
        in: path
        name: designId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDesignResponse'
          description: OK
        '403':
          content:
            application/json:
              examples:
                design_access_forbidden:
                  $ref: '#/components/examples/DesignAccessForbiddenError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              examples:
                design_id_not_found:
                  $ref: '#/components/examples/DesignIdNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - design:meta:read
      tags:
      - design
      x-rate-limit-per-client-user: 100
  /v1/exports:
    post:
      description: "Starts a new [asynchronous job](https://www.canva.dev/docs/apps/rest-apis/requests-responses/#asynchronous-job-endpoints)\
        \ to export a file from Canva. Once the exported file is generated, you can download\nit using\
        \ the URL(s) provided. The download URLs are only valid for 24 hours.\n\nThe request requires\
        \ the design ID and the exported file format type.\n\nSupported file formats (and export file\
        \ type values): JPG (`jpg`), PNG (`png`), GIF (`gif`), Microsoft PowerPoint (`pptx`), MP4 (`mp4`),\
        \ PDF (`pdf`), CSV (`csv`), HTML bundle (`html_bundle`), and standalone HTML (`html_standalone`).\n\
        \n<Note>\n\nThis endpoint has the following additional rate limits:\n\n  - **App throttle:** Each\
        \ app can export a maximum of 750 times per 5-minute window, and 5,000 times per 24-hour window.\n\
        \  - **Document throttle:** Each document can be exported a maximum of 75 times per 5-minute window.\n\
        \  - **User throttle:** Each user can export a maximum of 75 times per 5-minute window, and 500\
        \ times per 24-hour window.\n\n</Note>\n<Note>\n\nFor more information on the workflow for using\
        \ asynchronous jobs, see [API requests and responses](https://www.canva.dev/docs/apps/rest-apis/requests-responses/#asynchronous-job-endpoints).\
        \ You can check the status and get the results of export jobs created with this API using the\
        \ [Get design export job API](https://www.canva.dev/docs/apps/rest-apis/reference/exports/get-design-export-job/).\n\
        \n</Note>"
      operationId: createDesignExportJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDesignExportJobRequest'
      responses:
        '200':
          content:
            application/json:
              examples:
                in_progress:
                  $ref: '#/components/examples/InProgressExportJobExample'
                success:
                  $ref: '#/components/examples/SuccessExportJobExample'
                failed:
                  $ref: '#/components/examples/FailedExportJobExample'
              schema:
                $ref: '#/components/schemas/CreateDesignExportJobResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                export_invalid_design_id:
                  $ref: '#/components/examples/ExportInvalidDesignIdError'
                export_design_type_not_supported:
                  $ref: '#/components/examples/UnsupportedDesignType'
                export_format_not_supported:
                  $ref: '#/components/examples/UnsupportedFormatError'
                invalid_page_range:
                  $ref: '#/components/examples/InvalidPageRangeError'
                transparent_background_not_allowed:
                  $ref: '#/components/examples/TransparentBackgroundNotAllowedError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
          x-http-status-code: 400
        '403':
          content:
            application/json:
              examples:
                design_permission_denied:
                  $ref: '#/components/examples/DesignPermissionDeniedError'
                license_required:
                  $ref: '#/components/examples/LicenseRequiredError'
                svg_export_unavailable:
                  $ref: '#/components/examples/SvgExportUnavailableError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
          x-http-status-code: 403
        '404':
          content:
            application/json:
              examples:
                export_design_not_found:
                  $ref: '#/components/examples/ExportDesignNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
          x-http-status-code: 404
        '429':
          content:
            application/json:
              examples:
                client_throttle:
                  $ref: '#/components/examples/ClientThrottleError'
                client_daily_throttle:
                  $ref: '#/components/examples/ClientDailyThrottleError'
                user_throttle:
                  $ref: '#/components/examples/UserThrottleError'
                user_daily_throttle:
                  $ref: '#/components/examples/UserDailyThrottleError'
                design_throttle:
                  $ref: '#/components/examples/DesignThrottleError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Too Many Requests
          x-http-status-code: 429
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - design:content:read
      tags:
      - export
      x-rate-limit-per-client-user: 20
  /v1/exports/{exportId}:
    get:
      description: 'Gets the result of a design export job that was created using the [Create design export
        job API](https://www.canva.dev/docs/apps/rest-apis/reference/exports/create-design-export-job/).


        If the job is successful, the response includes an array

        of download URLs. Depending on the design type and export format, there is a download URL for
        each page in the design. The download URLs are only valid for 24 hours.


        You might need to make multiple requests to this endpoint until you get a `success` or `failed`
        status. For more information on the workflow for using asynchronous jobs, see [API requests and
        responses](https://www.canva.dev/docs/apps/rest-apis/requests-responses/#asynchronous-job-endpoints).'
      operationId: getDesignExportJob
      parameters:
      - description: The export job ID.
        explode: false
        in: path
        name: exportId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              examples:
                in_progress:
