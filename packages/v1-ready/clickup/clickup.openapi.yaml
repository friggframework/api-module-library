openapi: 3.0.3
info:
  title: ClickUp API v2 (Frigg module subset)
  version: '2.0'
  description: Curated OpenAPI subset of the official ClickUp API v2 reference for `@friggframework/api-module-clickup`. Paths,
    methods, parameters, request/response fields, auth security scheme, and the server URL are taken from https://developer.clickup.com/openapi/clickup-api-v2-reference.json
    (not third-party mirrors). operationIds are camelCase to match Api methods; official PascalCase ids are noted on each
    operation. Only endpoints implemented by the client appear. $refs from the vendor document are inlined so this subset
    is self-contained.
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
- url: https://api.clickup.com/api
  description: ClickUp
security:
- Authorization_Token: []
tags:
- name: Authorization
- name: Workspaces
- name: Spaces
- name: Folders
- name: Lists
- name: Tasks
- name: Webhooks
paths:
  /v2/user:
    get:
      summary: Get Authorized User
      tags:
      - Authorization
      description: 'View the details of the authenticated user''s ClickUp account.


        Official operationId: `GetAuthorizedUser`. Source: https://developer.clickup.com/openapi/clickup-api-v2-reference.json'
      operationId: getAuthorizedUser
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetAuthorizedUserresponse
                type: object
                properties:
                  user:
                    title: User
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      color:
                        type: string
                      profilePicture:
                        type: string
                      initials:
                        type: string
                      week_start_day:
                        type: integer
                        description: The user's preferred start of the calendar week setting. \ `0` is Sunday. \ `1` is Monday.
                      global_font_support:
                        type: boolean
                      timezeone:
                        type: string
      deprecated: false
  /v2/team:
    get:
      summary: Get Authorized Workspaces
      tags:
      - Workspaces
      description: 'View the Workspaces available to the authenticated user.


        Official operationId: `GetAuthorizedTeams`. Source: https://developer.clickup.com/openapi/clickup-api-v2-reference.json'
      operationId: getAuthorizedTeams
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetAuthorizedTeamsresponse
                required:
                - teams
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      title: Team
                      required:
                      - id
                      - name
                      - color
                      - avatar
                      - members
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        color:
                          type: string
                        avatar:
                          type: string
                        members:
                          type: array
                          items:
                            title: Member
                            required:
                            - user
                            type: object
                            properties:
                              user:
                                title: User
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  username:
                                    type: string
                                  email:
                                    type: string
                                  color:
                                    type: string
                                  profilePicture:
                                    type: string
                                  initials:
                                    type: string
                                  week_start_day:
                                    type: integer
                                    description: The user's preferred start of the calendar week setting. \ `0` is Sunday.
                                      \ `1` is Monday.
                                  global_font_support:
                                    type: boolean
                                  timezeone:
                                    type: string
                          description: ''
                    description: ''
      deprecated: false
