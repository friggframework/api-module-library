    GetFileMetaResponse:
      description: Response from the GET /v1/files/{file_key}/meta endpoint.
      content:
        application/json:
          schema:
            type: object
            properties:
              file:
                type: object
                description: The file metadata.
                properties:
                  name:
                    type: string
                    description: The name of the file.
                  folder_name:
                    type: string
                    description: The name of the project containing the file.
                  last_touched_at:
                    type: string
                    format: date-time
                    description: The UTC ISO 8601 time at which the file content was last modified.
                  creator:
                    description: The user who created the file.
                    $ref: '#/components/schemas/User'
                  last_touched_by:
                    description: The user who last modified the file contents.
                    $ref: '#/components/schemas/User'
                  thumbnail_url:
                    type: string
                    description: A URL to a thumbnail image of the file.
                  editorType:
                    type: string
                    enum:
                    - figma
                    - figjam
                    - slides
                    - buzz
                    - sites
                    - make
                    description: The type of editor associated with this file.
                  role:
                    $ref: '#/components/schemas/Role'
                    description: The role of the user making the API request in relation to the file.
                  link_access:
                    $ref: '#/components/schemas/LinkAccess'
                    description: Access policy for users who have the link to the file.
                  url:
                    type: string
                    description: The URL of the file.
                  version:
                    type: string
                    description: The version number of the file. This number is incremented when a file
                      is modified and can be used to check if the file has changed between requests.
                required:
                - name
                - last_touched_at
                - creator
                - editorType
            required:
            - file
    GetFileResponse:
      description: Response from the GET /v1/files/{file_key} endpoint.
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: The name of the file as it appears in the editor.
              role:
                $ref: '#/components/schemas/Role'
                description: The role of the user making the API request in relation to the file.
              lastModified:
                type: string
                format: date-time
                description: The UTC ISO 8601 time at which the file was last modified.
              editorType:
                type: string
                enum:
                - figma
                - figjam
                description: The type of editor associated with this file.
              thumbnailUrl:
                type: string
                description: A URL to a thumbnail image of the file.
              version:
                type: string
                description: The version number of the file. This number is incremented when a file is
                  modified and can be used to check if the file has changed between requests.
              document:
                $ref: '#/components/schemas/DocumentNode'
              components:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Component'
                description: A mapping from component IDs to component metadata.
              componentSets:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/ComponentSet'
                description: A mapping from component set IDs to component set metadata.
              schemaVersion:
                type: number
                description: The version of the file schema that this file uses.
                default: 0
              styles:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Style'
                description: A mapping from style IDs to style metadata.
              linkAccess:
                type: string
                description: The share permission level of the file link.
              mainFileKey:
                type: string
                description: The key of the main file for this file. If present, this file is a component
                  or component set.
              branches:
                type: array
                description: A list of branches for this file.
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      description: The key of the branch.
                    name:
                      type: string
                      description: The name of the branch.
                    thumbnail_url:
                      type: string
                      description: A URL to a thumbnail image of the branch.
                    last_modified:
                      type: string
                      format: date-time
                      description: The UTC ISO 8601 time at which the branch was last modified.
                  required:
                  - key
                  - name
                  - thumbnail_url
                  - last_modified
            required:
            - name
            - role
            - lastModified
            - editorType
            - version
            - document
            - components
            - componentSets
            - schemaVersion
            - styles
    GetFolderFilesResponse:
