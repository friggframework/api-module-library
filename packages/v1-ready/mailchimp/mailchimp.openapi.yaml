                    readOnly: true
                  send_time:
                    type: string
                    format: date-time
                    description: The date and time a campaign was sent.
                    title: Send Time
                    readOnly: true
                  content_type:
                    type: string
                    description: How the campaign's content is put together.
                    title: Content Type
