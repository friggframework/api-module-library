# Shopify Platform - Fenestra Specification
fenestra: "1.0.0"
platform:
  name: Shopify
  description: All varieties of available Shopify UI extensibility, from Apps and Themes to Checkout Extensions, Scripts, Flow actions, and App Store integrations
  version: "2023-10"
  baseUrl: "https://shopify.dev"
  documentation: "https://shopify.dev/docs"
  marketplace: "https://apps.shopify.com"
  support: "https://shopify.dev/docs/apps/tools/cli"

extensionTypes:
  shopify-app:
    name: Shopify Apps
    description: Full-featured applications that extend Shopify store functionality
    contexts: 
      - admin-dashboard
      - storefront-integration
      - pos-integration
      - external-hosting
    rendering: 
      - embedded-app
      - standalone-app
      - app-bridge
    communication: 
      - admin-api
      - storefront-api
      - webhooks
      - app-bridge
    capabilities: 
      - store-data-access
      - order-management
      - product-management
      - customer-management
      - analytics-access
    triggers: 
      - app-installation
      - webhook-events
      - user-interaction
      - scheduled-tasks
    examples:
      - name: Inventory Management App
        description: Advanced inventory tracking with multi-location support
        type: "embedded"
      - name: Marketing Automation Suite
        description: Email marketing and customer segmentation platform
        
  checkout-extension:
    name: Checkout Extensions
    description: Custom UI components and functionality for the checkout process
    contexts: 
      - checkout-page
      - order-summary
      - payment-methods
      - delivery-options
    rendering: 
      - checkout-ui-extensions
      - react-components
      - vanilla-javascript
    communication: 
      - checkout-api
      - storefront-api
      - payment-apis
    capabilities: 
      - checkout-customization
      - payment-processing
      - delivery-options
      - order-modifications
    triggers: 
      - checkout-load
      - cart-update
      - payment-selection
      - address-change
    examples:
      - name: Custom Delivery Options
        description: Dynamic delivery date selection with real-time pricing
        
  theme-extension:
    name: Theme Extensions
    description: Customizable UI components that can be added to any theme
    contexts: 
      - storefront-pages
      - product-pages
      - collection-pages
      - theme-editor
    rendering: 
      - liquid-templates
      - theme-blocks
      - section-groups
    communication: 
      - storefront-api
      - liquid-context
      - theme-settings
    capabilities: 
      - storefront-customization
      - dynamic-content
      - responsive-design
      - theme-compatibility
    triggers: 
      - page-render
      - theme-installation
      - settings-update
    examples:
      - name: Product Comparison Block
        description: Interactive product comparison widget for any theme
        
  script-tag:
    name: Script Tags
    description: JavaScript code injection for storefront customization
    contexts: 
      - storefront-global
      - specific-pages
      - conditional-loading
    rendering: 
      - javascript-injection
      - async-loading
      - conditional-execution
    communication: 
      - storefront-api
      - ajax-requests
      - external-services
    capabilities: 
      - dom-manipulation
      - analytics-tracking
      - third-party-integration
      - user-behavior-tracking
    triggers: 
      - page-load
      - user-interaction
      - cart-events
    examples:
      - name: Advanced Analytics Tracker
        description: Comprehensive user behavior and conversion tracking
        
  flow-action:
    name: Flow Actions
    description: Custom automation actions for Shopify Flow workflows
    contexts: 
      - workflow-automation
      - trigger-responses
      - conditional-logic
    rendering: 
      - action-interface
      - configuration-ui
      - execution-logic
    communication: 
      - flow-api
      - webhook-triggers
      - external-apis
    capabilities: 
      - workflow-automation
      - data-transformation
      - external-integrations
      - conditional-execution
    triggers: 
      - flow-execution
      - workflow-triggers
      - scheduled-events
    examples:
      - name: Advanced Fraud Detection
        description: Custom fraud analysis with external data sources
        
  pos-extension:
    name: POS Extensions
    description: Custom functionality for Shopify Point of Sale systems
    contexts: 
      - pos-terminal
      - checkout-flow
      - inventory-management
      - customer-interaction
    rendering: 
      - pos-ui
      - mobile-interface
      - hardware-integration
    communication: 
      - pos-api
      - hardware-apis
      - inventory-sync
    capabilities: 
      - payment-processing
      - inventory-management
      - customer-lookup
      - receipt-customization
    triggers: 
      - transaction-events
      - inventory-updates
      - customer-actions
    examples:
      - name: Loyalty Program Integration
        description: Real-time loyalty points tracking at POS
        
  webhook-handler:
    name: Webhook Handlers
    description: Event-driven integrations that respond to Shopify events
    contexts: 
      - external-systems
      - real-time-processing
      - data-synchronization
    rendering: 
      - event-processors
      - api-endpoints
      - queue-handlers
    communication: 
      - webhook-delivery
      - external-apis
      - database-updates
    capabilities: 
      - real-time-events
      - data-synchronization
      - external-notifications
      - workflow-triggers
    triggers: 
      - store-events
      - order-events
      - customer-events
      - product-events
    examples:
      - name: ERP Integration Handler
        description: Real-time synchronization with enterprise systems
        
  storefront-component:
    name: Storefront Components
    description: Reusable UI components for storefront customization
    contexts: 
      - product-displays
      - navigation-elements
      - interactive-features
      - content-blocks
    rendering: 
      - web-components
      - liquid-snippets
      - javascript-modules
    communication: 
      - storefront-api
      - ajax-endpoints
      - third-party-apis
    capabilities: 
      - dynamic-content
      - user-interaction
      - responsive-design
      - accessibility-features
    triggers: 
      - component-load
      - user-interaction
      - data-updates
    examples:
      - name: Smart Product Recommendations
        description: AI-powered product recommendation widget

communication:
  admin-api:
    description: RESTful and GraphQL APIs for store administration
    baseUrl: "https://{shop}.myshopify.com/admin/api/2023-10"
    authentication: 
      - oauth2
      - private-app-tokens
    rateLimit: "2 calls per second"
    formats:
      - rest: "JSON-based REST API"
      - graphql: "GraphQL Admin API"
    
  storefront-api:
    description: GraphQL API for storefront data access
    baseUrl: "https://{shop}.myshopify.com/api/2023-10/graphql"
    authentication: 
      - storefront-access-token
    features:
      - product-catalog
      - cart-management
      - checkout-creation
      - customer-management
    
  webhooks:
    description: HTTP callbacks for real-time event notifications
    events: 
      - orders/create
      - orders/updated
      - orders/paid
      - customers/create
      - products/create
      - app/uninstalled
    delivery: "json-payload"
    security: 
      - hmac-verification
      - webhook-verification
    
  app-bridge:
    description: JavaScript library for embedded app communication
    features:
      - navigation-control
      - modal-management
      - toast-notifications
      - context-access
    version: "3.0"
    
  checkout-api:
    description: APIs for checkout extension functionality
    features:
      - cart-manipulation
      - delivery-options
      - payment-methods
      - order-attributes
    
  flow-api:
    description: API for Shopify Flow automation actions
    features:
      - action-registration
      - trigger-handling
      - data-processing

authentication:
  oauth2:
    authorizationUrl: "https://{shop}.myshopify.com/admin/oauth/authorize"
    tokenUrl: "https://{shop}.myshopify.com/admin/oauth/access_token"
    scopes:
      - read_products: "Read product data"
      - write_products: "Modify product data"
      - read_orders: "Read order data"
      - write_orders: "Modify order data"
      - read_customers: "Read customer data"
      - write_customers: "Modify customer data"
      - read_content: "Read content and pages"
      - write_content: "Modify content and pages"
      - read_analytics: "Access analytics data"
      - read_checkouts: "Read checkout data"
      - write_checkouts: "Modify checkout data"
    flow: "authorization_code"
    
  private-app-token:
    description: "Private app access tokens for custom apps"
    location: "header"
    parameter: "X-Shopify-Access-Token"
    scope: "configurable"
    
  storefront-token:
    description: "Storefront access tokens for public data"
    location: "header"
    parameter: "X-Shopify-Storefront-Access-Token"
    scope: "storefront-data"

deployment:
  app-store:
    name: "Shopify App Store"
    url: "https://apps.shopify.com"
    reviewProcess: true
    categories:
      - store-design
      - marketing
      - sales-conversion
      - inventory-management
      - customer-service
      - reporting
      - shipping-delivery
      - social-media
    pricing:
      - free
      - one-time-charge
      - recurring-charge
      - usage-charge
    
  partner-dashboard:
    name: "Shopify Partner Dashboard"
    url: "https://partners.shopify.com"
    capabilities:
      - app-development
      - store-creation
      - revenue-tracking
      - analytics-access
    
  custom-app:
    name: "Custom Apps"
    distribution: "store-specific"
    installation: "store-admin"
    scope: "single-store"
    
  public-app:
    name: "Public Apps"
    distribution: "app-store"
    installation: "oauth-flow"
    scope: "multi-store"

sdks:
  shopify-cli:
    name: "Shopify CLI"
    url: "https://shopify.dev/docs/apps/tools/cli"
    features:
      - app-scaffolding
      - local-development
      - theme-development
      - deployment-tools
    
  app-bridge:
    name: "Shopify App Bridge"
    url: "https://shopify.dev/docs/apps/tools/app-bridge"
    language: "javascript"
    features:
      - embedded-app-integration
      - navigation-control
      - ui-components
      - context-access
    
  storefront-api-js:
    name: "Storefront API JavaScript SDK"
    url: "https://github.com/Shopify/js-buy-sdk"
    language: "javascript"
    features:
      - product-fetching
      - cart-management
      - checkout-creation
    
  admin-api-libraries:
    name: "Admin API Libraries"
    languages:
      - ruby: "shopify_api"
      - python: "ShopifyAPI"
      - php: "shopify-php-api"
      - node: "@shopify/shopify-api"
    features:
      - api-client
      - authentication
      - webhook-verification
    
  theme-kit:
    name: "Theme Kit"
    url: "https://shopify.github.io/themekit/"
    features:
      - theme-development
      - file-synchronization
      - deployment-automation
    status: "legacy"
    
  liquid-template:
    name: "Liquid Template Language"
    url: "https://shopify.github.io/liquid/"
    features:
      - template-rendering
      - data-output
      - control-flow
      - filters

examples:
  advanced-subscription:
    name: "Subscription Management Platform"
    description: "Comprehensive subscription and recurring billing solution"
    types: 
      - shopify-app
      - checkout-extension
      - webhook-handler
    features:
      - subscription-management
      - billing-automation
      - customer-portal
      - analytics-dashboard
    
  omnichannel-inventory:
    name: "Omnichannel Inventory System"
    description: "Multi-location inventory with POS integration"
    types:
      - shopify-app
      - pos-extension
      - flow-action
    features:
      - multi-location-sync
      - real-time-tracking
      - automated-reordering
      - pos-integration
    
  personalization-engine:
    name: "AI-Powered Personalization"
    description: "Dynamic content personalization across storefront"
    types:
      - storefront-component
      - theme-extension
      - script-tag
    features:
      - behavioral-tracking
      - content-personalization
      - recommendation-engine
      - a-b-testing

tags:
  - e-commerce
  - retail
  - payments
  - inventory
  - marketing
  - analytics
  - mobile-commerce

x-shopify-api-version: "2023-10"
x-shopify-app-bridge: "3.0"
x-shopify-partner-program: "required"