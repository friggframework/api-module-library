        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/finance/invoices:
    parameters: *commonParameters
    get:
      tags: [Finance]
      operationId: listInvoices
      summary: List invoices
      parameters:
        - $ref: "#/components/parameters/ConditionsQuery"
      responses:
        "200":
          description: Invoice list (shape UNVERIFIED)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Finance]
      operationId: createInvoiceForCompany
      summary: Create an invoice for a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, company]
              properties:
                type: { type: string }
                company:
                  type: object
                  required: [id]
                  properties:
                    id: { type: integer }
      responses:
        "200":
          description: Created invoice (shape UNVERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/finance/invoices/{id}/payments:
    parameters:
      - $ref: "#/components/parameters/Codebase"
      - $ref: "#/components/parameters/AcceptHeader"
