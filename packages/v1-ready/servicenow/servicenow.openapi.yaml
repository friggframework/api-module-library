        - $ref: '#/components/parameters/sysparm_offset'
        - $ref: '#/components/parameters/sysparm_fields'
        - $ref: '#/components/parameters/sysparm_display_value'
      responses:
        "200":
          description: List of sc_request records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'

  /api/now/table/sc_request/{sys_id}:
    get:
      tags: [ServiceCatalog]
      operationId: getScRequest
      summary: Get a service catalog request
      parameters:
        - $ref: '#/components/parameters/sys_id'
        - $ref: '#/components/parameters/sysparm_fields'
        - $ref: '#/components/parameters/sysparm_display_value'
