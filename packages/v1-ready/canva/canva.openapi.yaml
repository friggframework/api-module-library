  /v1/asset-uploads:
    post:
      description: 'Starts a new [asynchronous job](https://www.canva.dev/docs/apps/rest-apis/requests-responses/#asynchronous-job-endpoints)
        to upload an asset to the user''s content library. Supported file types for assets are listed
        in the [Assets API overview](https://www.canva.dev/docs/apps/rest-apis/reference/assets/).


        The request format for this endpoint is an `application/octet-stream` body of bytes. Attach

        information about the upload using an `Asset-Upload-Metadata` header.



        <Note>


        For more information on the workflow for using asynchronous jobs, see [API requests and responses](https://www.canva.dev/docs/apps/rest-apis/requests-responses/#asynchronous-job-endpoints).
        You can check the status and get the results of asset upload jobs created with this API using
        the [Get asset upload job API](https://www.canva.dev/docs/apps/rest-apis/reference/assets/get-asset-upload-job/).


        </Note>'
      operationId: createAssetUploadJob
      parameters:
      - content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUploadMetadata'
        in: header
        name: Asset-Upload-Metadata
        required: true
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
        description: Binary of the asset to upload.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                in_progress:
                  $ref: '#/components/examples/InProgressAssetUploadJobExample'
                success:
                  $ref: '#/components/examples/SuccessAssetUploadJobExample'
                failed:
                  $ref: '#/components/examples/FailedAssetUploadJobExample'
              schema:
                $ref: '#/components/schemas/CreateAssetUploadJobResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - asset:write
      tags:
      - asset
      x-rate-limit-per-client-user: 30
  /v1/asset-uploads/{jobId}:
    get:
      description: 'Get the result of an asset upload job that was created using the [Create asset upload
        job API](https://www.canva.dev/docs/apps/rest-apis/reference/assets/create-asset-upload-job/).


        You might need to make multiple requests to this endpoint until you get a `success` or `failed`
        status. For more information on the workflow for using asynchronous jobs, see [API requests and
        responses](https://www.canva.dev/docs/apps/rest-apis/requests-responses/#asynchronous-job-endpoints).'
      operationId: getAssetUploadJob
      parameters:
      - description: The asset upload job ID.
        explode: false
        in: path
        name: jobId
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_-]{1,50}$
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              examples:
                in_progress:
                  $ref: '#/components/examples/InProgressAssetUploadJobExample'
                success:
                  $ref: '#/components/examples/SuccessAssetUploadJobExample'
                failed:
                  $ref: '#/components/examples/FailedAssetUploadJobExample'
              schema:
                $ref: '#/components/schemas/GetAssetUploadJobResponse'
          description: OK
        '403':
          content:
            application/json:
              examples:
                asset_access_not_allowed:
                  $ref: '#/components/examples/AssetAccessNotAllowedError'
                asset_upload_job_not_creator:
                  $ref: '#/components/examples/AssetUploadJobNotCreatorError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        '404':
          content:
            application/json:
              examples:
                asset_not_found:
                  $ref: '#/components/examples/AssetNotFoundError'
                asset_upload_job_not_found:
                  $ref: '#/components/examples/AssetUploadJobNotFoundError'
                job_id_not_found:
                  $ref: '#/components/examples/AssetJobIdNotFoundError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - asset:read
      tags:
      - asset
      x-rate-limit-per-client-user: 180
  /v1/brand-templates:
    get:
      description: 'AVAILABILITY: To use this API, your app must act on behalf of a user that''s on a
        Canva plan with access to brand templates (such as Canva Pro, Canva Teams, or Canva Enterprise).


        Get a list of the [brand templates](https://www.canva.com/help/publish-team-template/) the user
        has access to.'
      operationId: listBrandTemplates
      parameters:
      - description: Lets you search the brand templates available to the user using a search term or
          terms.
        explode: true
        in: query
        name: query
        required: false
        schema:
          type: string
        style: form
      - description: 'If the success response contains a continuation token, the user has access to more

          brand templates you can list. You can use this token as a query parameter and retrieve

          more templates from the list, for example

          `/v1/brand-templates?continuation={continuation}`.

          To retrieve all the brand templates available to the user, you might need to make

          multiple requests.'
        explode: true
        in: query
        name: continuation
        required: false
        schema:
          type: string
        style: form
      - description: The number of brand templates to return.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Filter the list of brand templates based on the user's ownership of the brand templates.
        explode: true
        in: query
        name: ownership
        required: false
        schema:
          $ref: '#/components/schemas/OwnershipType'
        style: form
      - description: Sort the list of brand templates.
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          $ref: '#/components/schemas/SortByType'
        style: form
      - description: 'Filter the list of brand templates based on the brand templates'' dataset definitions.

          Brand templates with dataset definitions are mainly used with the [Autofill APIs](https://www.canva.dev/docs/apps/rest-apis/reference/autofills/).'
        explode: true
        in: query
        name: dataset
        required: false
        schema:
          $ref: '#/components/schemas/DatasetFilter'
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBrandTemplatesResponse'
          description: OK
        '400':
          content:
            application/json:
              examples:
                invalid_continuation:
                  $ref: '#/components/examples/InvalidContinuationError'
                design_type_not_available:
                  $ref: '#/components/examples/DesignTypeNotAvailableError'
                unable_to_fetch_designs:
                  $ref: '#/components/examples/UnableToFetchDesignsError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Bad Request
        '403':
          content:
            application/json:
              examples:
                find_brand_templates_forbidden:
                  $ref: '#/components/examples/FindBrandTemplatesForbiddenError'
                not_allowed_to_access_design_list:
                  $ref: '#/components/examples/ListDesignsForbiddenError'
              schema:
                $ref: '#/components/schemas/Error'
          description: Forbidden
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error Response
      security:
      - oauthAuthCode:
        - brandtemplate:meta:read
      tags:
      - brand_template
      x-rate-limit-per-client-user: 100
  /v1/brand-templates/{brandTemplateId}:
    get:
      description: 'AVAILABILITY: To use this API, your app must act on behalf of a user that''s on a
        Canva plan with access to brand templates (such as Canva Pro, Canva Teams, or Canva Enterprise).


        Retrieves the metadata for a brand template.'
