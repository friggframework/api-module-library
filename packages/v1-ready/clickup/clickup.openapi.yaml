  /v2/space/{space_id}/folder:
    get:
      summary: Get Folders
      tags:
      - Folders
      description: 'View the Folders in a Space. Subfolders are returned in the same flat list as top-level Folders, each
        with a `parent_folder` field holding the ID of the Folder it is nested inside of. This endpoint does not nest them;
        to get a Folder''s subfolder tree, use [Get Folder](#tag/Folders/operation/GetFolder) with `include_subfolders=true`.



        Official operationId: `GetFolders`. Source: https://developer.clickup.com/openapi/clickup-api-v2-reference.json'
      operationId: getFolders
      parameters:
      - name: space_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: number
      - name: archived
        in: query
        description: ''
        style: form
        explode: true
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetFoldersresponse
                required:
                - folders
                type: object
                properties:
                  folders:
                    type: array
                    description: 'The Folders in the Space. Subfolders are included in this flat list alongside top-level
                      Folders, each with a `parent_folder` field identifying the Folder it is nested inside of. This endpoint
                      does not nest them; to get a Folder''s subfolder tree, use [Get Folder](#tag/Folders/operation/GetFolder)
                      with `include_subfolders=true`.

                      '
                    items:
                      title: Folder5
                      required:
                      - id
                      - name
                      - orderindex
                      - override_statuses
                      - hidden
                      - space
                      - task_count
                      - lists
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        orderindex:
                          type: integer
                        override_statuses:
                          type: boolean
                        hidden:
                          type: boolean
                        space:
                          title: Space2
                          required:
                          - id
                          - name
                          - access
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            access:
                              type: boolean
                        task_count:
                          type: string
                        archived:
                          type: boolean
                          description: Whether the Folder is archived.
                        statuses:
                          type: array
                          description: 'Statuses defined on this Folder. Only populated when `override_statuses` is `true`.
                            A Folder that inherits its statuses returns an empty array here; its effective statuses are those
                            of its nearest ancestor Folder that overrides them, or of the Space when no ancestor does. To
                            get the resolved statuses for a Folder, request it with [Get Folder](#tag/Folders/operation/GetFolder).

                            '
                          items:
                            title: FolderStatus
                            type: object
                            properties:
                              id:
                                type: string
                                description: 'Unique identifier of the status. Not returned on the Create Folder response.

                                  '
                              status:
                                type: string
                                description: Name of the status.
                              orderindex:
                                type: integer
                                description: Position of the status within its status group.
                              color:
                                type: string
                                description: Hex color code for the status.
                              type:
                                type: string
                                description: Type of the status (`open`, `custom`, `closed`, or `done`).
                        lists:
                          type: array
                          items:
                            type: string
                        parent_folder:
                          type: string
                          description: 'ID of the parent Folder if this Folder is a subfolder. Only present when the Folder
                            is nested inside another Folder.

                            '
      deprecated: false
  /v2/folder/{folder_id}/list:
