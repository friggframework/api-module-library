    PngExportFormat:
      description: 'Export the design as a PNG. Height or width (or both) may be specified, otherwise

        the file will be exported at it''s default size. You may also specify whether to export the

        file losslessly, and whether to export a multi-page design as a single image.


        If the user is on the Canva Free plan, the export height and width for a fixed-dimension design
        can''t be upscaled by more than a factor of `1.125`.'
      properties:
        type:
          enum:
          - png
          type: string
        export_quality:
          $ref: '#/components/schemas/ExportQuality'
        height:
          description: 'Specify the height in pixels of the exported image. Note the following behavior:


            - If no height or width is specified, the image is exported using the dimensions of the design.

            - If only one of height or width is specified, then the image is scaled to match that dimension,
            respecting the design''s aspect ratio.

            - If both the height and width are specified, but the values don''t match the design''s aspect
            ratio, the export defaults to the larger dimension.'
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        width:
          description: 'Specify the width in pixels of the exported image. Note the following behavior:


            - If no width or height is specified, the image is exported using the dimensions of the design.

            - If only one of width or height is specified, then the image is scaled to match that dimension,
            respecting the design''s aspect ratio.

            - If both the width and height are specified, but the values don''t match the design''s aspect
            ratio, the export defaults to the larger dimension.'
          example: 400
          format: int32
          maximum: 25000
          minimum: 40
          type: integer
        lossless:
          default: true
          description: 'If set to `true` (default), the PNG is exported without compression.


            If set to `false`, the PNG is compressed using a lossy compression algorithm.


            AVAILABILITY: Lossy PNG compression is only available to users on a Canva plan that has premium
            features, such as Canva Pro. If the user is on the Canva Free plan and this parameter is set
            to `false`, the export operation will fail.'
          type: boolean
        transparent_background:
          default: false
          description: 'If set to `true`, the PNG is exported with a transparent background.


            AVAILABILITY: This option is only available to users on a Canva plan that has premium features,
            such as Canva Pro. If the user is on the Canva Free plan and this parameter is set to `true`,
            the export operation will fail.'
          type: boolean
        as_single_image:
          default: false
          description: 'When `true`, multi-page designs are merged into a single image.

            When `false` (default), each page is exported as a separate image.'
          type: boolean
        pages:
          description: 'To specify which pages to export in a multi-page design, provide the page numbers
            as

            an array. The first page in a design is page `1`.

            If `pages` isn''t specified, all the pages are exported.'
          example:
          - 2
          - 3
          - 4
          items:
            format: int32
            minimum: 1
            type: integer
          type: array
      required:
      - type
      type: object
    PptxExportFormat:
      description: Export the design as a PPTX.
      properties:
        type:
          enum:
          - pptx
          type: string
        pages:
          description: 'To specify which pages to export in a multi-page design, provide the page numbers
            as

            an array. The first page in a design is page `1`.

            If `pages` isn''t specified, all the pages are exported.'
          example:
          - 2
          - 3
          - 4
          items:
            format: int32
            minimum: 1
            type: integer
          type: array
      required:
