          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Invoice list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createInvoice
      summary: Create an invoice
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice]
              properties:
                invoice:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/{invoiceId}:
    get:
      operationId: getInvoice
      summary: Get invoice details
      tags: [Invoices]
      parameters:
        - $ref: '#/components/parameters/invoiceId'
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
    put:
      operationId: updateInvoice
      summary: Update an invoice
      tags: [Invoices]
      parameters:
        - $ref: '#/components/parameters/invoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice]
              properties:
                invoice:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/{invoiceId}/approve:
    put:
      operationId: approveInvoice
      summary: Approve an invoice
      tags: [Invoices]
      parameters:
        - $ref: '#/components/parameters/invoiceId'
      responses:
        '200':
          description: Approved invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /invoices/{invoiceId}/reject:
    put:
      operationId: rejectInvoice
      summary: Reject an invoice
      tags: [Invoices]
      parameters:
        - $ref: '#/components/parameters/invoiceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Rejected invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /suppliers:
    get:
      operationId: listSuppliers
      summary: List suppliers
      tags: [Suppliers]
      parameters:
        - $ref: '#/components/parameters/page'
        - name: per_page
          in: query
          schema: { type: integer }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Supplier list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createSupplier
      summary: Create a supplier
      tags: [Suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier]
              properties:
                supplier:
                  $ref: '#/components/schemas/SupplierInput'
      responses:
        '200':
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'

  /suppliers/{supplierId}:
    get:
      operationId: getSupplier
      summary: Get supplier details
      tags: [Suppliers]
      parameters:
        - $ref: '#/components/parameters/supplierId'
      responses:
        '200':
          description: Supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
    put:
      operationId: updateSupplier
      summary: Update a supplier
      tags: [Suppliers]
      parameters:
        - $ref: '#/components/parameters/supplierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier]
              properties:
                supplier:
                  $ref: '#/components/schemas/SupplierInput'
      responses:
        '200':
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'

  /departments:
    get:
      operationId: listDepartments
      summary: List departments
      tags: [Departments]
      parameters:
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                type: object
