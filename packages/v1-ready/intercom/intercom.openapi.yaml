openapi: 3.0.3
info:
  title: Intercom REST API (Frigg curated subset)
  version: "2.15"
  description: >-
    Intercom is a customer messaging and support platform. This file is Left Hook's
    curated subset of Intercom's official OpenAPI 2.15
    (https://raw.githubusercontent.com/intercom/Intercom-OpenAPI/main/descriptions/2.15/api.intercom.io.yaml),
    covering exactly the endpoints `@friggframework/api-module-intercom` implements
    in api.js. It is the source of truth the hand-written client mirrors 1:1
    (one method per operationId). Official operationIds are noted in each
    operation description where they differ from the client method name.
    Docs: https://developers.intercom.com/docs/references/rest-api/api.intercom.io
  contact:
    name: Left Hook
    url: https://lefthook.com
servers:
  - url: https://api.intercom.io
    description: The production API server
  - url: https://api.eu.intercom.io
    description: The european API server
  - url: https://api.au.intercom.io
    description: The australian API server
security:
  - BearerAuth: []
tags:
  - name: Identity
  - name: Contacts
  - name: Conversations
  - name: Admins
  - name: Companies
  - name: Tags
paths:
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Identify an admin
      description: >-
        View the currently authorised admin along with the embedded app object
        (workspace). Official operationId: identifyAdmin.
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
      responses:
        "200":
          description: Admin + workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWithApp" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List all contacts
      description: >-
        Official operationId: ListContacts. Official 2.15 OpenAPI documents no
        query parameters on this operation; the response uses cursor_pages
        (`pages.next.starting_after`).
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
      responses:
        "200":
          description: Contact list page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Contacts]
      operationId: createContact
      summary: Create contact
      description: Official operationId CreateContact.
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContactRequest" }
      responses:
        "200":
          description: Created contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contacts/{contact_id}:
    parameters:
      - $ref: "#/components/parameters/contact_id"
      - $ref: "#/components/parameters/Intercom-Version"
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Get a contact
      description: Official operationId ShowContact.
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Contacts]
      operationId: updateContact
      summary: Update a contact
      description: Official operationId UpdateContact.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContactRequest" }
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contact" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List all conversations
      description: Official operationId listConversations.
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
        - in: query
          name: per_page
          schema: { type: integer, default: 20, maximum: 150 }
        - in: query
          name: starting_after
          schema: { type: string }
          description: Cursor from a previous response's pages.next.starting_after.
      responses:
        "200":
          description: Conversation list page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Creates a conversation
      description: Official operationId createConversation.
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversationRequest" }
      responses:
        "200":
          description: Created conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/conversation_id"
      - $ref: "#/components/parameters/Intercom-Version"
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Retrieve a conversation
      description: Official operationId retrieveConversation.
      parameters:
        - in: query
          name: display_as
          schema: { type: string }
          description: Set to plaintext to retrieve conversation parts in plain text.
        - in: query
          name: include_translations
          schema: { type: boolean }
      responses:
        "200":
          description: Conversation with parts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Conversations]
      operationId: updateConversation
      summary: Update a conversation
      description: Official operationId updateConversation.
      parameters:
        - in: query
          name: display_as
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateConversationRequest" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /conversations/{conversation_id}/reply:
    parameters:
      - $ref: "#/components/parameters/conversation_id_string"
      - $ref: "#/components/parameters/Intercom-Version"
    post:
      tags: [Conversations]
      operationId: replyConversation
      summary: Reply to a conversation
      description: >-
        Official operationId replyConversation. Request is oneOf admin reply or
        contact reply (see ReplyConversationRequest).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplyConversationRequest" }
      responses:
        "200":
          description: Conversation after reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admins:
    get:
      tags: [Admins]
      operationId: listAdmins
      summary: List all admins
      description: Official operationId listAdmins.
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
        - in: query
          name: display_avatar
          schema: { type: boolean }
          description: Whether to include avatar URLs in the response.
      responses:
        "200":
          description: Admin list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /admins/{admin_id}:
    parameters:
      - $ref: "#/components/parameters/admin_id"
      - $ref: "#/components/parameters/Intercom-Version"
    get:
      tags: [Admins]
      operationId: getAdmin
      summary: Retrieve an admin
      description: Official operationId retrieveAdmin.
      responses:
        "200":
          description: Admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /companies/list:
    post:
      tags: [Companies]
      operationId: listCompanies
      summary: List all companies
      description: >-
        Official operationId listAllCompanies. Pagination is via query params
        (page, per_page, order); no request body.
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
        - in: query
          name: page
          schema: { type: integer }
          description: Page of results to fetch. Defaults to first page.
        - in: query
          name: per_page
          schema: { type: integer }
          description: How many results to return per page. Defaults to 15.
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc] }
          description: Return companies in ascending or descending order. Defaults to desc.
      responses:
        "200":
          description: Company list page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /companies:
    post:
      tags: [Companies]
      operationId: createOrUpdateCompany
      summary: Create or Update a company
      description: Official operationId createOrUpdateCompany.
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrUpdateCompanyRequest" }
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /companies/{company_id}:
    parameters:
      - $ref: "#/components/parameters/company_id"
      - $ref: "#/components/parameters/Intercom-Version"
    get:
      tags: [Companies]
      operationId: getCompany
      summary: Retrieve a company by ID
      description: Official operationId RetrieveACompanyById.
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List all tags
      description: Official operationId listTags.
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Tags]
      operationId: createTag
      summary: Create or update a tag, Tag or untag companies, Tag contacts
      description: >-
        Official operationId createTag. Official request is oneOf create/update
        tag, tag companies, untag companies, or tag multiple users. This curated
        subset models the create/update-tag shape (name required).
      parameters:
        - $ref: "#/components/parameters/Intercom-Version"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTagRequest" }
      responses:
        "200":
          description: Tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/tag_id"
      - $ref: "#/components/parameters/Intercom-Version"
    get:
      tags: [Tags]
      operationId: getTag
      summary: Find a specific tag
      description: Official operationId findTag.
      responses:
        "200":
          description: Tag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tag" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Access Token or OAuth access_token sent as Authorization: Bearer <token>
        (official scheme name: bearerAuth). Also send Intercom-Version (2.15)
        to pin the API version.
  parameters:
    Intercom-Version:
      in: header
      name: Intercom-Version
      schema:
        type: string
        default: "2.15"
        enum:
          - "1.0"
          - "1.1"
          - "1.2"
          - "1.3"
          - "1.4"
          - "2.0"
          - "2.1"
          - "2.2"
          - "2.3"
          - "2.4"
          - "2.5"
          - "2.6"
          - "2.7"
          - "2.8"
          - "2.9"
          - "2.10"
          - "2.11"
          - "2.12"
          - "2.13"
          - "2.14"
          - "2.15"
      description: Intercom API version. Defaults to the version set on the app package.
    contact_id:
      in: path
      name: contact_id
      required: true
      schema: { type: string }
    conversation_id:
      in: path
      name: conversation_id
      required: true
      schema: { type: integer }
      description: >-
        Official 2.15 types conversation_id as integer on retrieve/update.
        Reply uses a string path param (see conversation_id_string).
    conversation_id_string:
      in: path
      name: conversation_id
      required: true
      schema: { type: string }
    admin_id:
      in: path
      name: admin_id
      required: true
      schema: { type: integer }
    company_id:
      in: path
      name: company_id
      required: true
      schema: { type: string }
    tag_id:
      in: path
      name: tag_id
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid Bearer token.
    NotFound:
      description: Resource not found.
  schemas:
    CursorPages:
      type: object
      nullable: true
      description: Cursor-based pagination object from Intercom list responses.
      properties:
        type: { type: string, enum: [pages], example: pages }
        page: { type: integer }
        next:
          type: object
          nullable: true
          properties:
            per_page: { type: integer }
            starting_after: { type: string, nullable: true }
        per_page: { type: integer }
        total_pages: { type: integer }
    App:
      type: object
      properties:
        type: { type: string, example: app }
        id_code: { type: string, description: Workspace id_code }
        name: { type: string }
        region: { type: string }
        created_at: { type: integer }
        secure: { type: boolean }
        identity_verification: { type: boolean }
        timezone: { type: string }
    Admin:
      type: object
      properties:
        type: { type: string, example: admin }
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        job_title: { type: string }
        away_mode_enabled: { type: boolean }
        away_mode_reassign: { type: boolean }
        away_status_reason_id: { type: integer, nullable: true }
        has_inbox_seat: { type: boolean }
        team_ids:
          type: array
          items: { type: integer }
        avatar: { type: string, nullable: true }
    AdminWithApp:
      allOf:
        - $ref: "#/components/schemas/Admin"
        - type: object
          properties:
            app: { $ref: "#/components/schemas/App" }
            email_verified: { type: boolean }
    AdminList:
      type: object
      properties:
        type: { type: string, example: admin.list }
        admins:
          type: array
          items: { $ref: "#/components/schemas/Admin" }
    Contact:
      type: object
      properties:
        type: { type: string, example: contact }
        id: { type: string }
        workspace_id: { type: string }
        external_id: { type: string, nullable: true }
        role: { type: string }
        email: { type: string, format: email, nullable: true }
        email_domain: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        name: { type: string, nullable: true }
        owner_id: { type: string, nullable: true }
        created_at: { type: integer }
        updated_at: { type: integer }
        signed_up_at: { type: integer, nullable: true }
        last_seen_at: { type: integer, nullable: true }
        custom_attributes: { type: object, additionalProperties: true }
        avatar: { type: string, nullable: true }
    ContactList:
      type: object
      properties:
        type: { type: string, example: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Contact" }
        total_count: { type: integer }
        pages: { $ref: "#/components/schemas/CursorPages" }
    CreateContactRequest:
      type: object
      description: Payload to create a contact (official create_contact_request).
      properties:
        role: { type: string }
        external_id: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        name: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        signed_up_at: { type: integer }
        last_seen_at: { type: integer }
        owner_id: { type: integer }
        unsubscribed_from_emails: { type: boolean }
        custom_attributes: { type: object, additionalProperties: true }
    UpdateContactRequest:
      type: object
      description: Payload to update a contact (official UpdateContact body).
      properties:
        role: { type: string }
        external_id: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        name: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        signed_up_at: { type: integer }
        last_seen_at: { type: integer }
        owner_id: { type: integer }
        unsubscribed_from_emails: { type: boolean }
        custom_attributes: { type: object, additionalProperties: true }
    Conversation:
      type: object
      properties:
        type: { type: string, example: conversation }
        id: { type: string }
        title: { type: string, nullable: true }
        created_at: { type: integer }
        updated_at: { type: integer }
        waiting_since: { type: integer, nullable: true }
        snoozed_until: { type: integer, nullable: true }
        open: { type: boolean }
        state: { type: string, enum: [open, closed, snoozed] }
        read: { type: boolean }
        priority: { type: string }
        admin_assignee_id: { type: integer, nullable: true }
        team_assignee_id: { type: integer, nullable: true }
        source: { type: object, additionalProperties: true }
        contacts: { type: object, additionalProperties: true }
        teammates: { type: object, additionalProperties: true }
        custom_attributes: { type: object, additionalProperties: true }
        conversation_parts: { type: object, additionalProperties: true }
        company: { type: object, additionalProperties: true, nullable: true }
        tags: { type: object, additionalProperties: true }
        ai_agent_participated: { type: boolean }
    ConversationList:
      type: object
      properties:
        type: { type: string, enum: [conversation.list], example: conversation.list }
        conversations:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
        total_count: { type: integer }
        pages: { $ref: "#/components/schemas/CursorPages" }
    CreateConversationRequest:
      type: object
      required: [from, body]
      description: Official create_conversation_request.
      properties:
        from:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [lead, user, contact] }
            id: { type: string }
        body: { type: string }
        subject: { type: string }
        created_at: { type: integer }
        attachment_urls:
          type: array
          items: { type: string, format: uri }
          maxItems: 10
    UpdateConversationRequest:
      type: object
      description: Official update_conversation_request.
      properties:
        read: { type: boolean }
        title: { type: string }
        custom_attributes: { type: object, additionalProperties: true }
        company_id: { type: string, nullable: true }
    ReplyConversationRequest:
      type: object
      description: >-
        Curated admin-reply shape from official admin_reply_conversation_request
        (full official request is oneOf admin | contact reply variants).
      required: [message_type, type, admin_id]
      properties:
        message_type:
          type: string
          enum: [comment, note, quick_reply]
        type:
          type: string
          enum: [admin]
        body: { type: string }
        admin_id: { type: string }
        created_at: { type: integer }
        attachment_urls:
          type: array
          items: { type: string, format: uri }
          maxItems: 10
        skip_notifications: { type: boolean }
        intercom_user_id: { type: string }
        email: { type: string }
        user_id: { type: string }
    Company:
      type: object
      properties:
        type: { type: string, example: company }
        id: { type: string }
        name: { type: string }
        company_id: { type: string }
        app_id: { type: string }
        created_at: { type: integer }
        updated_at: { type: integer }
        remote_created_at: { type: integer, nullable: true }
        website: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        size: { type: integer, nullable: true }
        plan: { type: string, nullable: true }
        monthly_spend: { type: integer }
        session_count: { type: integer }
        user_count: { type: integer }
        custom_attributes: { type: object, additionalProperties: true }
    CompanyList:
      type: object
      properties:
        type: { type: string, example: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Company" }
        pages: { $ref: "#/components/schemas/CursorPages" }
        total_count: { type: integer }
    CreateOrUpdateCompanyRequest:
      type: object
      nullable: true
      description: Official create_or_update_company_request.
      properties:
        company_id: { type: string }
        name: { type: string }
        website: { type: string }
        industry: { type: string }
        size: { type: integer }
        plan: { type: string }
        remote_created_at: { type: integer }
        monthly_spend: { type: integer }
        custom_attributes: { type: object, additionalProperties: true }
    Tag:
      type: object
      properties:
        type: { type: string, example: tag }
        id: { type: string }
        name: { type: string }
    TagList:
      type: object
      properties:
        type: { type: string, example: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
    CreateTagRequest:
      type: object
      required: [name]
      description: Official create_or_update_tag_request (subset of createTag oneOf).
      properties:
        name: { type: string }
        id: { type: string }
