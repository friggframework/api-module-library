              type: string
              description: An optional field where the designer can add more information about the design
                and what has changed.
          required:
          - type
    DirectionalTransition:
      type: object
      description: Describes an animation used when navigating in a prototype.
      properties:
        type:
          type: string
          enum:
          - MOVE_IN
          - MOVE_OUT
          - PUSH
          - SLIDE_IN
          - SLIDE_OUT
        direction:
          type: string
          enum:
          - LEFT
          - RIGHT
          - TOP
          - BOTTOM
        duration:
          type: number
          description: The duration of the transition in milliseconds.
        easing:
          $ref: '#/components/schemas/Easing'
          description: The easing curve of the transition.
        matchLayers:
          type: boolean
          description: When the transition `type` is `"SMART_ANIMATE"` or when `matchLayers` is `true`,
            then the transition will be performed using smart animate, which attempts to match corresponding
            layers an interpolate other properties during the animation.
      required:
      - type
      - direction
      - duration
      - easing
    DocumentNode:
      allOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - DOCUMENT
          children:
            type: array
            items:
              $ref: '#/components/schemas/CanvasNode'
        required:
        - type
        - children
      - $ref: '#/components/schemas/IsLayerTrait'
    DocumentationLink:
      type: object
      description: Represents a link to documentation for a component or component set.
      properties:
        uri:
          type: string
          description: Should be a valid URI (e.g. https://www.figma.com).
      required:
      - uri
    DropShadowEffect:
      allOf:
      - type: object
        description: A drop shadow effect
        properties:
          type:
            type: string
            description: A string literal representing the effect's type. Always check the type before
              reading other properties.
            enum:
            - DROP_SHADOW
          showShadowBehindNode:
            type: boolean
            description: Whether to show the shadow behind translucent or transparent pixels
            default: false
        required:
        - type
        - showShadowBehindNode
      - $ref: '#/components/schemas/BaseShadowEffect'
    DuotoneNoiseEffect:
      allOf:
      - type: object
        description: A duotone noise effect
        properties:
          noiseType:
            type: string
            description: The string literal 'DUOTONE' representing the noise type.
            enum:
            - DUOTONE
          secondaryColor:
            $ref: '#/components/schemas/RGBA'
            description: The secondary color of the noise effect
        required:
        - noiseType
        - secondaryColor
      - $ref: '#/components/schemas/BaseNoiseEffect'
    Easing:
      type: object
      description: Describes an easing curve.
      properties:
        type:
          $ref: '#/components/schemas/EasingType'
          description: The type of easing curve.
        easingFunctionCubicBezier:
          type: object
          description: A cubic bezier curve that defines the easing.
          properties:
            x1:
              type: number
              description: The x component of the first control point.
            y1:
              type: number
              description: The y component of the first control point.
            x2:
              type: number
              description: The x component of the second control point.
            y2:
              type: number
              description: The y component of the second control point.
          required:
          - x1
          - y1
          - x2
          - y2
        easingFunctionSpring:
          type: object
          description: A spring function that defines the easing.
          properties:
            mass:
              type: number
            stiffness:
              type: number
            damping:
              type: number
          required:
          - mass
          - stiffness
          - damping
      required:
      - type
    EasingType:
      type: string
      description: 'This type is a string enum with the following possible values:


        - `EASE_IN`: Ease in with an animation curve similar to CSS ease-in.

        - `EASE_OUT`: Ease out with an animation curve similar to CSS ease-out.

        - `EASE_IN_AND_OUT`: Ease in and then out with an animation curve similar to CSS ease-in-out.

        - `LINEAR`: No easing, similar to CSS linear.

        - `EASE_IN_BACK`: Ease in with an animation curve that moves past the initial keyframe''s value
        and then accelerates as it reaches the end.

        - `EASE_OUT_BACK`: Ease out with an animation curve that starts fast, then slows and goes past
        the ending keyframe''s value.

        - `EASE_IN_AND_OUT_BACK`: Ease in and then out with an animation curve that overshoots the initial
        keyframe''s value, then accelerates quickly before it slows and overshoots the ending keyframes
        value.

        - `CUSTOM_CUBIC_BEZIER`: User-defined cubic bezier curve.

        - `GENTLE`: Gentle animation similar to react-spring.

        - `QUICK`: Quick spring animation, great for toasts and notifications.

        - `BOUNCY`: Bouncy spring, for delightful animations like a heart bounce.

        - `SLOW`: Slow spring, useful as a steady, natural way to scale up fullscreen content.

        - `CUSTOM_SPRING`: User-defined spring animation.'
      enum:
      - EASE_IN
      - EASE_OUT
      - EASE_IN_AND_OUT
      - LINEAR
      - EASE_IN_BACK
      - EASE_OUT_BACK
      - EASE_IN_AND_OUT_BACK
      - CUSTOM_CUBIC_BEZIER
      - GENTLE
      - QUICK
      - BOUNCY
      - SLOW
      - CUSTOM_SPRING
    Effect:
