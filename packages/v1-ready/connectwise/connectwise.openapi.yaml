      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Finance]
      operationId: getPaymentsForInvoice
      summary: List payments for an invoice
      parameters:
        - $ref: "#/components/parameters/ConditionsQuery"
      responses:
