    Navigation:
      type: string
      description: "The method of navigation. The possible values are:\n- `\"NAVIGATE\"`: Replaces the\
        \ current screen with the destination, also closing all overlays.\n- `\"OVERLAY\"`: Opens the\
        \ destination as an overlay on the current screen.\n- `\"SWAP\"`: On an overlay, replaces the\
        \ current (topmost) overlay with the destination. On a top-level frame, \n  behaves the same as\
        \ `\"NAVIGATE\"` except that no entry is added to the navigation history.\n- `\"SCROLL_TO\"`:\
        \ Scrolls to the destination on the current screen.\n- `\"CHANGE_TO\"`: Changes the closest ancestor\
        \ instance of source node to the specified variant."
      enum:
      - NAVIGATE
      - SWAP
      - OVERLAY
      - SCROLL_TO
      - CHANGE_TO
    NodeAction:
      type: object
      description: An action that navigates to a specific node in the Figma viewer.
      properties:
        type:
          type: string
          enum:
          - NODE
        destinationId:
          type:
          - string
          - 'null'
        navigation:
          $ref: '#/components/schemas/Navigation'
        transition:
          oneOf:
          - $ref: '#/components/schemas/Transition'
          - type: 'null'
        preserveScrollPosition:
          type: boolean
          description: Whether the scroll offsets of any scrollable elements in the current screen or
            overlay are preserved when navigating to the destination. This is applicable only if the layout
            of both the current frame and its destination are the same.
        overlayRelativePosition:
          $ref: '#/components/schemas/Vector'
          description: Applicable only when `navigation` is `"OVERLAY"` and the destination is a frame
            with `overlayPosition` equal to `"MANUAL"`. This value represents the offset by which the
            overlay is opened relative to this node.
        resetVideoPosition:
          type: boolean
          description: When true, all videos within the destination frame will reset their memorized playback
            position to 00:00 before starting to play.
        resetScrollPosition:
          type: boolean
          description: Whether the scroll offsets of any scrollable elements in the current screen or
            overlay reset when navigating to the destination. This is applicable only if the layout of
            both the current frame and its destination are the same.
        resetInteractiveComponents:
          type: boolean
          description: Whether the state of any interactive components in the current screen or overlay
            reset when navigating to the destination. This is applicable if there are interactive components
            in the destination frame.
      required:
      - type
      - destinationId
      - navigation
      - transition
