openapi: 3.0.3
info:
  title: ConnectWise PSA REST API (curated Frigg subset)
  version: "1.0.4"
  description: |
    Curated OpenAPI contract for `@friggframework/api-module-connectwise`.
    Mirrors `api.js` 1:1 (one operationId per Api method that calls PSA REST).

    Official reference (login-gated / approval required):
      https://developer.connectwise.com/Products/ConnectWise_PSA/Developer_Guide

    URL shape (from PSA Developer Guide):
      `https://<site>/<codebase>apis/3.0/...`
    when codebase is not `v4_6_release`, cloud hosts may require an `API-` prefix
    on the site hostname. This module currently hardcodes codebase `v4_6_release/`.

    Required headers on every call:
      - `clientId: <registered client id>`
      - `Accept: application/vnd.connectwise.com+json; version=<pin>`
        (module default pin `2019.1`; override via `CONNECTWISE_API_VERSION` / `api_version`)
      - `Authorization: Basic base64(companyId+publicKey:privateKey)`

    OPEN QUESTIONS (response/request field shapes): public PSA REST reference is
    login-gated; schemas below are structural placeholders inferred from how
    `api.js` builds requests, not verified against a published vendor OpenAPI.
  contact:
    name: Frigg Framework
    url: https://friggframework.org
servers:
  - url: https://api-na.myconnectwise.net
    description: >-
      Example ConnectWise PSA cloud site (North America). The module's `baseUrl`
      is the authenticated `site` URL (same pattern for eu/au/za/custom hosts).
security:
  - BasicAuth: []
    ClientIdHeader: []
tags:
  - name: Companies
  - name: Contacts
  - name: CompanyTypes
  - name: CommunicationTypes
  - name: Countries
  - name: Finance
  - name: Procurement
  - name: Callbacks

# Shared path params reused on every path
x-common-parameters: &commonParameters
  - $ref: "#/components/parameters/Codebase"
  - $ref: "#/components/parameters/AcceptHeader"
  - $ref: "#/components/parameters/ClientIdHeader"

paths:
  /{codebase}apis/3.0/company/companies:
    parameters: *commonParameters
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: List companies
      parameters:
        - $ref: "#/components/parameters/ConditionsQuery"
      responses:
        "200":
          description: Company list (shape UNVERIFIED — login-gated docs)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Companies]
      operationId: createCompany
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Company" }
      responses:
        "200":
          description: Created company (shape UNVERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/company/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/Codebase"
      - $ref: "#/components/parameters/AcceptHeader"
      - $ref: "#/components/parameters/ClientIdHeader"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Companies]
      operationId: getCompanyById
      summary: Get company by id
      responses:
        "200":
          description: Company (shape UNVERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Companies]
      operationId: patchCompanyById
      summary: Patch company by id (JSON Patch from FormatPatchBody)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/PatchOperation" }
      responses:
        "200":
          description: Updated company (shape UNVERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Companies]
      operationId: deleteCompanyById
      summary: Delete company by id
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/company/companies/{id}/typeAssociations:
    parameters:
      - $ref: "#/components/parameters/Codebase"
      - $ref: "#/components/parameters/AcceptHeader"
      - $ref: "#/components/parameters/ClientIdHeader"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags: [CompanyTypes]
      operationId: addTypeToCompany
      summary: Associate a company type with a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: object
                  required: [id]
                  properties:
                    id: { type: integer }
      responses:
        "200":
          description: Association result (shape UNVERIFIED)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/company/companies/types:
    parameters: *commonParameters
    get:
      tags: [CompanyTypes]
      operationId: listCompanyTypes
      summary: List company types
      parameters:
        - $ref: "#/components/parameters/ConditionsQuery"
      responses:
        "200":
          description: Company type list (shape UNVERIFIED)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompanyType" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [CompanyTypes]
      operationId: createCompanyType
      summary: Create a company type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: Created company type (shape UNVERIFIED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/company/companies/types/{id}:
    parameters:
      - $ref: "#/components/parameters/Codebase"
      - $ref: "#/components/parameters/AcceptHeader"
      - $ref: "#/components/parameters/ClientIdHeader"
      - $ref: "#/components/parameters/ResourceId"
    delete:
      tags: [CompanyTypes]
      operationId: deleteCompanyType
      summary: Delete a company type
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /{codebase}apis/3.0/company/communicationTypes:
    parameters: *commonParameters
    get:
