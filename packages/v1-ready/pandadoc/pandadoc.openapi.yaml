openapi: 3.0.3
info:
  title: PandaDoc Public API (Frigg curated subset)
  version: 8.23.0
  description: 'PandaDoc Public API curated subset for @friggframework/api-module-pandadoc. Source of
    truth: https://developers.pandadoc.com/openapi/pandadoc-public-api.json (PandaDoc Public API v8.23.0).
    Also mirrored at https://github.com/PandaDoc/pandadoc-openapi-specification. Docs: https://developers.pandadoc.com/.
    One operationId per Api method in api.js.'
  contact:
    name: PandaDoc API Support
    url: https://developers.pandadoc.com/
    email: api-track@pandadoc.com
  license:
    name: MIT
    url: https://github.com/PandaDoc/pandadoc-openapi-specification/blob/main/LICENSE
servers:
- url: https://api.pandadoc.com
  description: Public API
security:
- apiKey: []
- oauth2: []
tags:
- name: Documents
  description: Operations for managing documents, including appending content library items and creating
    document sessions for embedded signing.
- name: Templates
  description: Operations for managing templates, including listing, creating, and deleting templates.
- name: Contacts
  description: Operations related to managing and retrieving contact details.
- name: Members
  description: Operations for managing and retrieving details about workspace members.
- name: Webhook subscriptions
  description: Operations for managing webhook subscriptions, including listing, retrieving details, and
    updating shared keys.
- name: Webhook events
  description: Operations related to webhook events.
paths:
  /public/v1/documents:
    get:
      tags:
      - Documents
      summary: List Documents
      description: 'This endpoint will let you list and search for the documents.

        ### [Here](https://developers.pandadoc.com/docs/list-search-documents-api) you can find how to
        filter, search and order documents.

        '
      operationId: listDocuments
      parameters:
      - name: template_id
        in: query
        schema:
          type: string
        description: Filters by parent template. This Parameter can't be used with form_id.
        example: BhVzRcxH9Z2LgfPPGXFUBa
      - name: form_id
        in: query
        schema:
          type: string
        description: Filters by parent form. This parameter can't be used with template_id.
        example: BhVzRcxH9Z2LgfPPGXFUBa
      - name: folder_uuid
        in: query
        schema:
          type: string
        description: Filters by the folder where the documents are stored.
        x-ignore-no-type: true
        example: BhVzRcxH9Z2LgfPPGXFUBa
      - name: contact_id
        in: query
        schema:
          type: string
        description: Filters by recipient or approver with this 'contact_id'.
        example: 9FeAY2NB3C9qDdtQRb4tTL
      - name: count
        in: query
        schema:
          type: integer
        description: Limits the size of the response. Default is 50 documents, maximum is 100 documents.
        example: 50
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
        description: Paginates the search result. Increase value to get the next page of results.
        example: 1
      - name: order_by
        in: query
        schema:
          $ref: '#/components/schemas/DocumentOrderingFieldsEnum'
        description: Defines the sorting of the result. Use `date_created` for ASC and `-date_created`
          for DESC sorting.
        examples:
          Default order by date_status_changed:
            value: date_status_changed
      - name: created_from
        in: query
        schema:
          type: string
          format: date-time
        description: Limits results to the documents with the `date_created` greater than or equal to
          this value.
        example: '2024-10-27T15:22:23.132757Z'
      - name: created_to
        in: query
        schema:
          type: string
          format: date-time
        description: Limits results to the documents with the `date_created` less than this value.
        example: '2024-10-27T15:22:23.132757Z'
      - name: deleted
        in: query
        schema:
          type: boolean
        description: Returns only the deleted documents.
        example: false
      - name: id
        in: query
        schema:
          type: string
          description: Searches for document by it's id.
        example: BhVzRcxH9Z2LgfPPGXFUBa
      - name: completed_from
        in: query
        schema:
          type: string
          format: date-time
        example: '2024-10-27T15:22:23.132757Z'
        description: Limits results to the documents with the `date_completed` greater than or equal to
          this value.
      - name: completed_to
        in: query
        schema:
          type: string
          format: date-time
        description: Limits results to the documents with the `date_completed` less than this value.
        example: '2024-10-27T15:22:23.132757Z'
      - name: membership_id
        in: query
        schema:
          type: string
        description: Filter documents by the owner's 'membership_id'.
        example: BhVzRcxH9Z2LgfPPGXFUBa
      - name: metadata
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        description: Filters documents by metadata. Pass metadata in the format of `metadata_{metadata-key}={metadata-value}`
          such as `metadata_opportunity_id=2181432`. The `metadata_` prefix is always required.
        example:
        - metadata_opportunity_id=2181432
        - metadata_custom_key=custom_value
      - name: modified_from
        in: query
        schema:
          type: string
          format: date-time
        description: Limits results to the documents with the `date_modified` greater than or equal to
          this value.
        example: '2024-10-27T15:22:23.132757Z'
      - name: modified_to
        in: query
        schema:
          type: string
          format: date-time
        description: Limits results to the documents with the `date_modified` less than this value.
        example: '2024-10-27T15:22:23.132757Z'
      - name: q
        in: query
        schema:
          type: string
        description: Filters documents by name or reference number (stored on the template level).
        example: Sample Document
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/DocumentStatusRequestEnum'
        description: "Filters documents by the status.\n  * 0: document.draft\n  * 1: document.sent\n\
          \  * 2: document.completed\n  * 3: document.uploaded\n  * 4: document.error\n  * 5: document.viewed\n\
          \  * 6: document.waiting_approval\n  * 7: document.approved\n  * 8: document.rejected\n  * 9:\
          \ document.waiting_pay\n  * 10: document.paid\n  * 11: document.voided\n  * 12: document.declined\n\
          \  * 13: document.external_review\n  * 14: document.scheduled\n"
        example: 5
      - name: status__ne
        x-ignore-snake-case: true
        in: query
        schema:
          $ref: '#/components/schemas/DocumentStatusRequestEnum'
        description: "Exludes documents with this status.\n  * 0: document.draft\n  * 1: document.sent\n\
          \  * 2: document.completed\n  * 3: document.uploaded\n  * 4: document.error\n  * 5: document.viewed\n\
          \  * 6: document.waiting_approval\n  * 7: document.approved\n  * 8: document.rejected\n  * 9:\
          \ document.waiting_pay\n  * 10: document.paid\n  * 11: document.voided\n  * 12: document.declined\n\
          \  * 13: document.external_review\n  * 14: document.scheduled\n"
        example: 5
      - name: tag
        in: query
        schema:
          type: string
        description: Filters documents by tag.
        example: tag_1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
              examples:
                Default order by date_status_changed:
                  value:
                    results:
                    - id: XjV64iXRJMerjSpk428QSF
                      name: Sample Document
                      status: document.draft
                      date_created: '2024-07-02T16:21:35.770196Z'
                      date_modified: '2024-07-02T16:21:37.696724Z'
                      date_sent: null
                      expiration_date: null
                      version: '2'
                    - id: 6NbHUUu6uuYN2tqJvgtf9h
                      name: Services Invoice
                      status: document.completed
                      date_created: '2024-01-25T15:35:27.186107Z'
                      date_modified: '2024-06-21T15:07:34.192101Z'
                      date_sent: '2024-01-25T15:40:12.482301Z'
                      expiration_date: '2024-08-20T15:07:32.869161Z'
                      version: '2'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                properties:
                  type:
                    type: string
                  detail:
                    type: object
              examples:
                Non field error:
                  value:
                    type: request_error
                    detail:
                      non_field_errors:
                      - Either template_id or form_id should be added to query.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
    post:
      tags:
      - Documents
      summary: Create Document
      description: '## Create from a template

        > See the [Create document from template](https://developers.pandadoc.com/docs/create-document-from-template)
        tutorial for details on how to use this endpoint, as well as a sample template.


        ## Create from a URL

        > See the [Create from public PDF](https://developers.pandadoc.com/docs/create-and-send-a-document-from-a-publicly-available-pdf)
        guide for info about roles and fields, as well as PDF examples.

        '
      operationId: createDocument
      parameters:
      - name: editor_ver
        in: query
        deprecated: true
        schema:
          type: string
        example: ev2
        description: Set this parameter as `ev1` if you want to create a document from PDF with Classic
          Editor when both editors are enabled for the workspace.
      - name: use_form_field_properties
        in: query
        schema:
          type: string
        example: 'true'
        description: Set this parameter as `yes` or `1` or `true` (only when upload pdf with form fields)
          if you want to  respect form fields properties, like `required`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreateRequest'
            examples:
              Simple API Sample:
                summary: Simple API Sample Document from PandaDoc Template
                value:
                  name: Simple API Sample Document from PandaDoc Template
                  template_uuid: onoznwTq4Y3EELMPyvucnc
                  recipients:
                  - email: josh@example.com
                    first_name: Josh
                    last_name: Ron
                    role: user
                    phone: 555-5555-5555
                    signing_order: 1
                    company: PandaDoc
                    default: false
                    delivery_methods:
                      sms: true
                      email: false
                    redirect:
                      is_enabled: true
                      url: https://super.redirect.url/1
                    verification_settings:
                      verification_place: before_open
                      passcode_verification: null
                      phone_verification: null
                      kba_verification: null
                      id_verification:
                        enabled: true
                      email_otp_verification: null
                  tokens:
                  - name: Favorite.Pet
                    value: Panda
                  fields:
                    Favorite.Color:
                      value: PandaDoc green
                    Delivery:
                      value: Same Day Delivery
                    Like:
                      value: true
                    Date:
                      value: '2019-12-31T00:00:00.000Z'
                  metadata:
                    my_favorite_pet: Panda
                  tags:
                  - created_via_api
                  - test_document
                  images:
                  - name: Image 1
                    urls:
                    - https://s3.amazonaws.com/pd-static-content/public-docs/pandadoc-panda-bear.png
                  pricing_tables:
                  - name: Pricing Table 1
                    data_merge: true
                    options:
                      Tax:
                        type: percent
                        name: Tax
                        value: 10
                      Fee:
                        type: percent
                        name: Fee
                        value: 5
                    sections:
                    - title: Sample Section
                      default: true
                      rows:
                      - options:
                          optional: true
                          optional_selected: true
                          qty_editable: true
                        data:
                          Name: Toy Panda
                          Description: Fluffy!
                          Price: 10
                          QTY: 3
                          Tax:
                            value: 20
                            type: percent
                          Fee:
                            value: 5
                            type: percent
                        custom_fields:
                          Fluffiness: 5 / 5
              Full API Sample:
                summary: Full API Sample Document from PandaDoc Template
                value:
                  name: Full API Sample Document from [PandaDoc] Template
                  detect_title_variables: true
                  template_uuid: hryJY9mqYZHjQCYQuSjRQg
                  folder_uuid: QMDSzwabfFzTgjW4kUijqQ
                  owner:
                    membership_id: QMDSzwabfFzTgjW6KijHyu
                  recipients:
                  - email: josh@example.com
                    first_name: Josh
                    last_name: Ron
                    role: user
                  tokens:
                  - name: Favorite.Pet
                    value: Panda
                  fields:
                    Favorite.Color:
                      value: PandaDoc green
                    Delivery:
                      value: Same Day Delivery
                    Like:
                      value: true
                    Date:
                      value: '2019-12-31T00:00:00.000Z'
                  texts:
                  - name: Legal Terms Section
                    data: "## Terms of Service\nThis document outlines the terms and conditions. \n- **Acceptance:**\
                      \ By using our service, you agree to these terms.\n- **Changes:** We may update\
                      \ these terms at any time.\n"
                  metadata:
                    my_favorite_pet: Panda
                  tags:
                  - created_via_api
                  - test_document
                  images:
                  - name: Image 1
                    urls:
                    - https://s3.amazonaws.com/pd-static-content/public-docs/pandadoc-panda-bear.png
                  pricing_tables:
                  - name: Pricing Table 1
                    data_merge: true
                    options:
                      Tax:
                        type: percent
                        name: Tax
                        value: 10
                      Fee:
                        type: percent
                        name: Fee
                        value: 15
                    sections:
                    - title: Sample Section
                      default: true
                      rows:
                      - options:
                          optional: true
                          optional_selected: true
                          qty_editable: true
                        data:
                          Name: Toy Panda
                          Description: Fluffy!
                          Price: 10
                          QTY: 3
                          Tax:
                            value: 20
                            type: percent
                          Fee:
                            value: 15
                            type: percent
                        custom_fields:
                          Fluffiness: 5 / 5
                  tables:
                  - name: Table 1
                    data:
                      sections:
                      - header:
                        - text: header 1
                        - text: header 2
                        rows:
                        - - text: value 1
                          - text: value 2
                        - - text: value 3
                          - text: value 4
                  content_placeholders:
                  - block_id: '{block_id}'
                    content_library_items:
                    - id: '{cli_id}'
                      pricing_tables:
                      - name: Pricing Table 1
                        data_merge: false
                        options:
                          discount:
                            type: absolute
                            name: Discount
                            value: 2.26
                        sections:
                        - title: Sample Section
                          default: true
                          rows:
                          - options:
                              optional: true
                              optional_selected: true
                              qty_editable: true
                            data:
                              name: Placeholder Panda
                              price: 10
                              qty: 3
                    - id: '{cli_id_2}'
                      recipients:
                      - email: john@example.com
                        first_name: John
                        last_name: Roe
                        role: Signer
                        signing_order: 2
                      fields:
                        Date:
                          value: '2019-12-31T00:00:00.000Z'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCreateResponse'
              examples:
                Document from Template:
                  value:
                    id: D3okRfgHRX7NEhavcACReB
                    name: Document from Template
                    status: document.uploaded
                    date_created: '2024-07-04T19:27:14.927317Z'
                    date_modified: '2024-07-04T19:27:14.927317Z'
                    expiration_date: null
                    version: null
                    uuid: D3okRfgHRX7NEhavcACReB
                    links:
                    - rel: status
                      href: https://api.pandadoc.com/public/v1/documents/D3okRfgHRX7NEhavcACReB
                      type: GET
                    info_message: You need to poll the Document Status method until the status will be
                      changed to document.draft
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
  /public/v1/documents/{id}:
    get:
      tags:
      - Documents
      summary: Document Status
      operationId: statusDocument
      description: "It is useful to request document status to ensure a document is in the expected state\
        \ before calling additional API methods. \n\n### Required Document Statuses\n\nHere are some common\
        \ methods and the `document.status` required to proceed:\n\n| API Method           | Required\
        \ Document State |\n| :------------------- | :---------------------- |\n| Send A Document    \
        \  | `document.draft`        |\n| Get Document Details | `document.draft`        |\n| Embed A\
        \ Document     | `document.sent`         |\n| Download A Document  | `document.completed`    |\n\
        \n> \U0001F4D8 Polling vs Webhooks\n> \n> If you are using the `GET` document status endpoint\
        \ for [**polling**](https://en.wikipedia.org/wiki/Polling_(computer_science)), we also support\
        \ and recommend using **webhooks** for event-driven needs: <https://developers.pandadoc.com/docs/listen-document-status-changes#/>\n\
        \n### Available Document Statuses\n\nThe following is a complete list of all possible document\
        \ statuses returned:\n\n| Document Status             | Status Description                   \
        \                                                                                            \
        \                                                                                            \
        \    |\n| :-------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\
        \ |\n| `document.uploaded`         | The document has just been created or uploaded. It is in\
        \ processing and will be in `document.draft` state soon.                                     \
        \                                                                      |\n| `document.error` \
        \           | The document creation has failed. This status is terminal, you should stop polling\
        \ after getting it.\n| `document.draft`            | The document is in a draft state. All aspects\
        \ of the document can be edited in this state. Our API does not support edits after the document\
        \ has been created, but it can still be edited manually on <https://app.pandadoc.com> |\n| `document.sent`\
        \             | The document has been \"sealed\" and optionally sent. No further document edits\
        \ can occur except for document recipient(s) filling out or signing the document.            \
        \                                                        |\n| `document.viewed`           | Document\
        \ recipient(s) have viewed the sent document.                                                \
        \                                                                                            \
        \                                 |\n| `document.waiting_approval` | The document has an [automatic\
        \ approval workflow](https://support.pandadoc.com/en/articles/9714799-approval-workflow) and has\
        \ not yet been approved.                                                      |\n| `document.rejected`\
        \         | The document has an [automatic approval workflow](https://support.pandadoc.com/en/articles/9714799-approval-workflow)\
        \ and was rejected.                                                                   |\n| `document.approved`\
        \         | The document has an [automatic approval workflow](https://support.pandadoc.com/en/articles/9714799-approval-workflow)\
        \ and was approved.                                                                   |\n| `document.waiting_pay`\
        \      | The document has a [Stripe payment](https://support.pandadoc.com/en/articles/9714942-stripe-checkout-payments)\
        \ option and is awaiting payment.                                                            \
        \                  |\n| `document.paid`             | The document has a [Stripe payment](https://support.pandadoc.com/en/articles/9714942-stripe-checkout-payments)\
        \ option and was paid.                                                                       \
        \                  |\n| `document.completed`        | The document has been completed by all recipients.\
        \                                                                                            \
        \                                                                                   |\n| `document.voided`\
        \           | The document expired and is no longer available for completion or signature.   \
        \                                                                                            \
        \                                                      |\n| `document.declined`         | The\
        \ document was [manually marked](https://support.pandadoc.com/en/articles/9714842-manually-change-document-status)\
        \ as \"Declined\"                                                                            \
        \        |\n| `document.external_review`  | The document is reviewed by it's recipient using Suggest\
        \ Edit feature                                                                               \
        \                                                                             |\n| `document.scheduled`\
        \        | The document is a draft scheduled to be sent automatically at a future time.      \
        \                                                                                            \
        \                                                   |\n"
      parameters:
      - examples:
          Document processing after create:
            value: fANp5wW5EwY7AkiTkTGekZ
          Document in draft:
            value: XjV64iXRJMerjSpk428QSF
        name: id
        in: path
        schema:
          type: string
        required: true
        description: Specify document ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStatusResponse'
              examples:
                Document processing after create:
                  value:
                    id: fANp5wW5EwY7AkiTkTGekZ
                    name: Document from file
                    status: document.uploaded
                    date_created: '2024-07-02T16:21:57.510203Z'
                    date_modified: '2024-07-02T16:21:57.708251Z'
                    expiration_date: null
                    version: null
                    uuid: fANp5wW5EwY7AkiTkTGekZ
                Document in draft:
                  value:
                    id: XjV64iXRJMerjSpk428QSF
                    name: Document from template
                    status: document.draft
                    date_created: '2024-03-19T12:59:52.848666Z'
                    date_modified: '2024-03-19T12:59:53.957830Z'
                    date_completed: null
                    expiration_date: null
                    version: '2'
                    uuid: XjV64iXRJMerjSpk428QSF
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
    delete:
      tags:
      - Documents
      summary: Delete Document
      operationId: deleteDocument
      description: 'Delete a document by ID.

        '
      parameters:
      - examples:
          Delete document:
            value: BhVzRcxH9Z2LgfPPGXFUBa
        name: id
        description: Document ID
        in: path
        schema:
          type: string
        required: true
      - name: forever
        description: 'Set to `false` to soft-delete the document (move it to the Trash Bin, where it can
          be restored) instead of deleting it permanently. Defaults to `true`.

          '
        in: query
        schema:
          type: boolean
          default: true
        example: false
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/404'
        '423':
          $ref: '#/components/responses/423'
    patch:
      tags:
      - Documents
      summary: Update Document
      operationId: updateDocument
      description: "Use the PATCH method to update a PandaDoc document.\n\n> \U0001F6A7 Document status\n\
        > \n> You can only update a document in the Draft status (`document.draft`). \n> \n> After creating\
        \ a new document, it usually retains a `document.uploaded` status for 3-5 seconds while the document\
        \ syncs across PandaDoc servers. When the document is available for further API calls, the document\
        \ moves to the `document.draft` state. Use [Document Status](https://developers.pandadoc.com/reference/document-status)\
        \ or Webhooks to check document status.\n"
      parameters:
      - examples:
          Update document:
            value: BhVzRcxH9Z2LgfPPGXFUBa
        name: id
        description: Document ID
        in: path
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdateRequest'
            examples:
              Update document text blocks:
                value:
                  texts:
                  - name: Legal Terms Section
                    data: "## Terms of Service\nThis document outlines the terms and conditions. \n- **Acceptance:**\
                      \ By using our service, you agree to these terms.\n"
                  - name: Product Description
                    data: '## Product Description

                      General description of the product.

                      '
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/400RequestError'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '423':
          $ref: '#/components/responses/423'
        '429':
          $ref: '#/components/responses/429'
  /public/v1/documents/{id}/status:
    patch:
      tags:
      - Documents
      summary: Document Status Change
      operationId: changeDocumentStatus
      description: 'PandaDoc has eight document statuses, but you can manually set your document status
        to only four:


        ### Document statuses


        - Completed - `document.completed` - API code `2`

        - Expired - `document.voided` - code `11`

        - Paid - `document.paid` - code `10`. **Important**: You can only set it if you have a payment
        app connected.

        - Declined - `document.declined` - code `12`


        > 🚧 Pass a numeric code for the corresponding document status, for example, `2` for `document.completed`.


        Find more details in [\[Editor 2.0\] Manually change document status](https://support.pandadoc.com/en/articles/9714842-manually-change-document-status)
        topic.


        | Current Status | To Completed: | To Expired: | To Paid: | To Declined: |

        |----------------|---------------|-------------|----------|--------------|

        | Draft          | YES           | NO          | YES      | YES          |

        | Approved       | NO            | NO          | NO       | NO           |

        | Sent           | YES           | YES         | NO       | YES          |

        | Viewed         | YES           | YES         | NO       | YES          |

        | Completed (Auto) | NO          | NO          | NO       | YES          |

        | Waithing for payment | NO      | NO          | YES      | YES          |

        | Paid           | NO            | NO          | NO       | NO           |

        | Expired        | YES           | NO          | YES      | YES          |

        | Declined       | YES           | NO          | YES      | NO           |


        > ✅ - from `document.voided` to `document.paid`

        >

        > ❌ - from `document.paid` to `document.voided`

        '
      parameters:
      - examples:
          Mark as Decline:
            value: iGsFiaV2hEEvQdhr2WAkMk
          Mark as Completed:
            value: iGsFiaV2hEEvQdhr2WAkMk
          Mark as Expired:
            value: iGsFiaV2hEEvQdhr2WAkMk
          Mark as Paid:
            value: iGsFiaV2hEEvQdhr2WAkMk
        name: id
        in: path
        schema:
          type: string
        required: true
        description: Specify document ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentStatusChangeRequest'
            examples:
              Mark as Decline:
                value:
                  status: 12
                  note: Change status to Decline
                  notify_recipients: false
              Mark as Completed:
