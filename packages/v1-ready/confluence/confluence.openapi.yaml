      - app-access-rule-exempt: false
    put:
      tags:
      - Page
      operationId: updatePage
      summary: Update page
      description: "Update a page by id.\n\nWhen the \"current\" version is updated, the provided body\
        \ content is considered as the latest version. This latest body content\nwill be attempted to\
        \ be merged into the draft version through a content reconciliation algorithm. If two versions\
        \ are significantly diverged, \nthe latest provided content may entirely override what was previously\
        \ in the draft. \n\n**[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:\nPermission\
        \ to view the page and its corresponding space. Permission to update pages in the space."
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the page to be updated. If you don't know the page ID, use Get Pages and
          filter the results.
        schema:
          format: int64
          type: integer
      requestBody:
        $ref: '#/components/requestBodies/PageUpdateRequest'
      responses:
        '200':
          description: Returned if the requested page is successfully updated.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageSingle'
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        base:
                          type: string
                          description: Base url of the Confluence site.
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: |-
            Returned if the authentication credentials are incorrect or missing
            from the request.
          content: {}
        '404':
          description: |-
            Returned if:
            - The provided page does not exist
            - The user does not have permissions to view the page
            - The user does not have the needed permissions to update a page in the space
            - The user provides a parentId for a page that does not exist or they do not have permission to view
            - There are no spaces associated with the given spaceId
        '409':
          description: |-
            Returned if content approvals are enabled for the site and the page's space is configured to require approval before publishing.
            Save the changes as a draft, then complete the approval workflow to publish.
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:page:confluence
      x-atlassian-connect-scope: WRITE
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    delete:
      tags:
      - Page
      operationId: deletePage
      summary: Delete page
      description: "Delete a page by id.\n\nBy default this will delete pages that are non-drafts. To\
        \ delete a page that is a draft, the endpoint must be called on a \ndraft with the following param\
        \ `draft=true`. Discarded drafts are not sent to the trash and are permanently deleted.\n\nDeleting\
        \ a page moves the page to the trash, where it can be restored later. To permanently delete a\
        \ page (or \"purge\" it),\nthe endpoint must be called on a **trashed** page with the following\
        \ param `purge=true`.\n\n**[Permissions](https://support.atlassian.com/confluence-cloud/docs/what-are-confluences-roles/)\
        \ required**:\nPermission to view the page and its corresponding space.\nPermission to delete\
        \ pages in the space.\n[`manage/content`](https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-space-permissions/#api-space-permissions-get)\
        \ permission for the space (if attempting to purge).\n\n**Note:** To find the display name for\
        \ each permission ID, call the [Get available space permissions](https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-space-permissions/#api-space-permissions-get)\
        \ API."
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the page to be deleted.
        schema:
          format: int64
          type: integer
      - name: purge
        in: query
        required: false
        description: If attempting to purge the page.
        schema:
          type: boolean
          default: false
      - name: draft
        in: query
        required: false
        description: If attempting to delete a page that is a draft.
        schema:
          type: boolean
          default: false
      responses:
        '204':
          description: Returned if the page was successfully deleted.
          content: {}
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: |-
            Returned if the authentication credentials are incorrect or missing
            from the request.
          content: {}
        '404':
          description: |-
            Returned if:
            - The provided page does not exist
            - The user does not have permissions to view the page
            - The user does not have the needed permissions to delete a page in the space
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - delete:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - delete:page:confluence
      x-atlassian-connect-scope: DELETE
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
  /blogposts:
    get:
      tags:
      - Blog Post
      operationId: getBlogPosts
      summary: Get blog posts
      description: |-
        Returns all blog posts. The number of results is limited by the `limit` parameter and additional results (if available)
        will be available through the `next` URL present in the `Link` response header.

        **[Permissions](https://confluence.atlassian.com/x/_AozKw) required**:
        Permission to access the Confluence site ('Can use' global permission).
        Only blog posts that the user has permission to view will be returned.
      parameters:
      - name: id
        in: query
        required: false
        description: Filter the results based on blog post ids. Multiple blog post ids can be specified
          as a comma-separated list.
        schema:
          type: array
          maxItems: 250
          items:
            type: integer
            format: int64
      - name: space-id
        in: query
        required: false
        description: Filter the results based on space ids. Multiple space ids can be specified as a comma-separated
          list.
        schema:
          type: array
          maxItems: 100
          items:
            type: integer
            format: int64
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/BlogPostSortOrder'
      - name: status
        in: query
        required: false
        description: Filter the results to blog posts based on their status. By default, `current` is
          used.
        schema:
          type: array
          items:
            type: string
            enum:
            - current
            - deleted
            - trashed
      - name: title
        in: query
        required: false
        description: Filter the results to blog posts based on their title.
        schema:
          type: string
      - name: body-format
        in: query
        description: The content format types to be returned in the `body` field of the response. If available,
          the representation will be available under a response field of the same name under the `body`
          field.
        schema:
          $ref: '#/components/schemas/PrimaryBodyRepresentation'
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the
          `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set
          of results.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of blog posts per result to return. If more results exist, use the
          `Link` response header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 25
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested blog posts are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<BlogPost>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlogPostBulk'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: |
                This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request's URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/blogposts?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: |-
            Returned if the authentication credentials are incorrect or missing
            from the request.
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:page:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    post:
      tags:
      - Blog Post
      operationId: createBlogPost
      summary: Create blog post
      description: |-
        Creates a new blog post in the space specified by the spaceId.

        By default this will create the blog post as a non-draft, unless the status is specified as draft.
        If creating a non-draft, the title must not be empty.

        Currently only supports the storage representation specified in the body.representation enums below
      parameters:
      - name: private
        in: query
        description: The blog post will be private. Only the user who creates this blog post will have
          permission to view and edit one.
        schema:
          type: boolean
          default: false
      requestBody:
        $ref: '#/components/requestBodies/BlogPostCreateRequest'
      responses:
        '200':
          description: Returned if the blog post was created successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BlogPostSingle'
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        base:
                          type: string
                          description: Base url of the Confluence site.
        '400':
          description: Returned if invalid values were passed in for any of the enums, a REQUIRED parameter
            was missing, or if the given title is a duplicate in the space
          content: {}
        '401':
          description: Returned if the authentication credentials are incorrect or missing from the request
          content: {}
        '404':
          description: |-
            Returned if:
            - The provided space does not exist
            - The user does not have permissions to view the space
            - The user does not have the needed permissions to create a blog post in the provided space
          content: {}
        '413':
          description: Returned if the request is too large in size (over 5 MB)
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
