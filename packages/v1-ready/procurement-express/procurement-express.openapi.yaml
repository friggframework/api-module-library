openapi: 3.0.3
info:
  title: ProcurementExpress API (curated Frigg module subset)
  description: |
    Curated OpenAPI subset for `@friggframework/api-module-procurement-express`.
    Written from the official docs at https://docs.procurementexpress.com/
    (the vendor publishes no downloadable OpenAPI). One operationId per Api method.

    Auth: `authentication_token` header; optional `app_company_id`.
    Server URL matches the module default base (`/api/v1`). Vendor examples often
    illustrate the same resource paths under `/api/v3/` — see module README.
  version: 1.0.0
  contact:
    url: https://docs.procurementexpress.com/
servers:
  - url: https://app.procurementexpress.com/api/v1
    description: Default module base (PROCUREMENT_EXPRESS_BASE_URL)
security:
  - AuthenticationToken: []
paths:
  /currentuser:
    get:
      operationId: getCurrentUser
      summary: Get current user
      tags: [Identity]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
    put:
      operationId: updateCurrentUser
      summary: Update current user
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'

  /companies:
    get:
      operationId: listCompanies
      summary: List companies
      tags: [Companies]
      parameters:
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Company list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createCompany
      summary: Create a company
      tags: [Companies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company]
              properties:
                company:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Created company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'

  /companies/{companyId}:
    get:
      operationId: getCompany
      summary: Get a company
      tags: [Companies]
      parameters:
        - $ref: '#/components/parameters/companyId'
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'

  /purchase_orders:
    get:
      operationId: listPurchaseOrders
      summary: List purchase orders
      tags: [PurchaseOrders]
      parameters:
        - $ref: '#/components/parameters/page'
        - name: status
          in: query
          schema: { type: string }
        - name: per_page
          in: query
          schema: { type: integer }
        - name: archived
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Purchase order list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createPurchaseOrder
      summary: Create a purchase order
      tags: [PurchaseOrders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commit:
                  type: string
                  description: Send or Draft
                purchase_order:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Created purchase order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'

  /purchase_orders/{purchaseOrderId}:
    get:
      operationId: getPurchaseOrder
      summary: Get purchase order details
      tags: [PurchaseOrders]
      parameters:
        - $ref: '#/components/parameters/purchaseOrderId'
      responses:
        '200':
          description: Purchase order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'

  /purchase_orders/{purchaseOrderId}/approve:
    get:
      operationId: approvePurchaseOrder
      summary: Approve a purchase order
      tags: [PurchaseOrders]
      parameters:
        - $ref: '#/components/parameters/purchaseOrderId'
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Approver accept token
      responses:
        '200':
          description: Approval result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }

  /purchase_orders/{purchaseOrderId}/reject:
    get:
      operationId: rejectPurchaseOrder
      summary: Reject a purchase order
      tags: [PurchaseOrders]
      parameters:
        - $ref: '#/components/parameters/purchaseOrderId'
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Approver reject token
      responses:
        '200':
          description: Rejection result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }

  /purchase_orders/{purchaseOrderId}/cancel:
    post:
      operationId: cancelPurchaseOrder
      summary: Cancel a purchase order
      tags: [PurchaseOrders]
      parameters:
        - $ref: '#/components/parameters/purchaseOrderId'
      responses:
        '200':
          description: Cancel result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }

  /purchase_orders/{purchaseOrderId}/archive:
    post:
      operationId: archivePurchaseOrder
      summary: Archive a purchase order
      tags: [PurchaseOrders]
      parameters:
        - $ref: '#/components/parameters/purchaseOrderId'
      responses:
        '200':
          description: Archive result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }

  /invoices:
