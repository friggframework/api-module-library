                        title: Member Count Since Send
                        readOnly: true
                      unsubscribe_count_since_send:
                        type: integer
                        description: The number of members who have unsubscribed since the last campaign
                          was sent.
                        title: Unsubscribe Count Since Send
                        readOnly: true
                      cleaned_count_since_send:
                        type: integer
                        description: The number of members cleaned from the list since the last campaign
                          was sent.
                        title: Cleaned Count Since Send
                        readOnly: true
                      campaign_count:
                        type: integer
                        description: The number of campaigns in any status that use this list.
                        title: Campaign Count
                        readOnly: true
                      campaign_last_sent:
                        type: string
                        format: date-time
                        description: The date and time the last campaign was sent to this list in ISO
                          8601 format. This is updated when a campaign is sent to 10 or more recipients.
                        title: Campaign Last Sent
                        readOnly: true
                      merge_field_count:
                        type: integer
                        description: The number of merge fields ([audience field](https://mailchimp.com/help/getting-started-with-merge-tags/))
                          for this list (doesn't include EMAIL).
                        title: Merge Field Count
                        readOnly: true
                      avg_sub_rate:
                        type: number
                        description: The average number of subscriptions per month for the list (not returned
                          if we haven't calculated it yet).
                        title: Average Subscription Rate
                        readOnly: true
                      avg_unsub_rate:
                        type: number
                        description: The average number of unsubscriptions per month for the list (not
                          returned if we haven't calculated it yet).
                        title: Average Unsubscription Rate
                        readOnly: true
                      target_sub_rate:
                        type: number
                        description: The target number of subscriptions per month for the list to keep
                          it growing (not returned if we haven't calculated it yet).
                        title: Average Subscription Rate
                        readOnly: true
                      open_rate:
                        type: number
                        description: The average open rate (a percentage represented as a number between
                          0 and 100) per campaign for the list (not returned if we haven't calculated
                          it yet).
                        title: Open Rate
                        readOnly: true
                      click_rate:
                        type: number
                        description: The average click rate (a percentage represented as a number between
                          0 and 100) per campaign for the list (not returned if we haven't calculated
                          it yet).
                        title: Click Rate
                        readOnly: true
                      last_sub_date:
                        type: string
                        format: date-time
                        description: The date and time of the last time someone subscribed to this list
                          in ISO 8601 format.
                        title: Date of Last List Subscribe
                        readOnly: true
                      last_unsub_date:
                        type: string
                        format: date-time
                        description: The date and time of the last time someone unsubscribed from this
                          list in ISO 8601 format.
                        title: Date of Last List Unsubscribe
                        readOnly: true
                  _links:
                    type: array
                    description: A list of link types and descriptions for the API schema documents.
