  /lists/{list_id}/members:
    get:
      operationId: getListsIdMembers
      summary: List members info
      description: Get information about members in a specific Mailchimp list.
      tags:
      - lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Manage members of a specific Mailchimp list, including currently subscribed,
                  unsubscribed, and bounced members.
                title: List Members
                properties:
                  members:
                    type: array
                    description: An array of objects, each representing a specific list member.
                    title: Members
                    items:
                      type: object
                      description: Individuals who are currently or have been previously subscribed to
                        this list, including members who have bounced or unsubscribed.
                      title: List Members
                      properties:
                        id:
                          type: string
                          description: The MD5 hash of the lowercase version of the list member's email
                            address.
                          title: Email ID
                          readOnly: true
                        email_address:
                          type: string
                          description: Email address for a subscriber.
                          title: Email Address
                        unique_email_id:
                          type: string
                          description: An identifier for the address across all of Mailchimp.
                          title: Unique Email ID
                          readOnly: true
                        contact_id:
                          type: string
                          description: As Mailchimp evolves beyond email, you may eventually have contacts
                            without email addresses. While the `id` is the MD5 hash of their email address,
                            this `contact_id` is agnostic of contact’s inclusion of an email address.
                          title: Contact ID
                          readOnly: true
                        full_name:
                          type: string
                          description: The contact's full name.
                          title: Full Name
                          readOnly: true
                        web_id:
                          type: integer
                          description: The ID used in the Mailchimp web application. View this member
                            in your Mailchimp account at `https://{dc}.admin.mailchimp.com/lists/members/view?id={web_id}`.
                          title: Member Web ID
                          readOnly: true
