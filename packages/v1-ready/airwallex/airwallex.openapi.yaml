components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Obtain a token via POST /api/v1/authentication/login with x-api-key and x-client-id
        headers. Pass Authorization: Bearer {{token}}. Tokens expire after ~30 minutes; see expires_at.'
    ApiKeyLogin:
      type: apiKey
      in: header
      name: x-api-key
      description: Used only on /api/v1/authentication/login together with x-client-id.
