# Slack App - Fenestra Specification Example
fenestra: 1.0.0
info:
  title: Task Manager for Slack
  version: 2.1.0
  description: |
    A comprehensive task management app for Slack teams. Create, assign, and track
    tasks directly within Slack using slash commands, interactive modals, and home tabs.
  contact:
    name: Task Manager Support
    email: support@taskmanager.example
    url: https://taskmanager.example/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

extension:
  type: embedded
  rendering:
    mode: schema
    schema:
      format: block-kit
      version: "1.0"
      endpoint: https://api.taskmanager.example/slack/ui
      templates:
        - name: task-modal
          description: Modal for creating/editing tasks
          schema:
            type: modal
            title:
              type: plain_text
              text: Create Task
            blocks:
              - type: input
                element:
                  type: plain_text_input
                  action_id: task_title
                label:
                  type: plain_text
                  text: Task Title
              - type: input
                element:
                  type: datepicker
                  action_id: due_date
                label:
                  type: plain_text
                  text: Due Date
        - name: home-tab
          description: App home tab showing user's tasks
          schema:
            type: home
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Your Tasks*"
              - type: divider
              - type: section
                text:
                  type: mrkdwn
                  text: "Loading tasks..."
  
  communication:
    channels:
      - type: http
        config:
          baseUrl: https://api.taskmanager.example
          endpoints:
            - path: /slack/events
              method: POST
              description: Slack Events API endpoint
            - path: /slack/interactive
              method: POST
              description: Interactive component endpoint
            - path: /slack/slash-commands
              method: POST
              description: Slash command endpoint
    
    events:
      - name: app_home_opened
        direction: incoming
        description: User opened the app home tab
        payload:
          type: object
          properties:
            user:
              type: string
            channel:
              type: string
            tab:
              type: string
              enum: [home, messages]
      
      - name: view_submission
        direction: incoming
        description: Modal form submitted
        payload:
          type: object
          properties:
            view:
              type: object
              properties:
                id:
                  type: string
                state:
                  type: object
                  description: Form state values
      
      - name: block_actions
        direction: incoming
        description: User interacted with a Block Kit element
        payload:
          type: object
          properties:
            actions:
              type: array
              items:
                type: object
                properties:
                  action_id:
                    type: string
                  value:
                    type: string

  capabilities:
    storage:
      platform: true
      quota: "10MB"
    api:
      platformData:
        - users.read
        - conversations.read
        - chat.write
      externalRequests: true
    ui:
      modals: true
      notifications: true
      shortcuts: true
      slashCommands:
        - /task
        - /tasks
    compute:
      serverless: true
      webhooks: true

  triggers:
    - type: manual
      config:
        slashCommands:
          - command: /task
            description: Create or manage tasks
            usageHint: "[create|list|assign]"
        shortcuts:
          - name: Create Task
            type: global
            callback_id: create_task_shortcut
    
    - type: contextual
      config:
        messageActions:
          - name: Create Task from Message
            callback_id: create_from_message
    
    - type: event
      config:
        events:
          - app_home_opened
          - app_mention
          - message.channels

  context:
    required:
      - workspace_id
      - user_id
      - channel_id
    optional:
      - team_id
      - enterprise_id
      - message_ts
    
  lifecycle:
    install:
      oauth:
        scopes:
          bot:
            - commands
            - chat:write
            - users:read
            - app_mentions:read
          user:
            - search:read
        redirectUrl: https://taskmanager.example/slack/oauth/callback
    
    uninstall:
      webhook: https://api.taskmanager.example/slack/uninstall
    
    update:
      automatic: true
      notification: true

security:
  - oauth2:
      - commands
      - chat:write
      - users:read

deployment:
  hosting: marketplace
  distribution:
    platform: slack-app-directory
    appId: A0123456789
    manifest:
      display_information:
        name: Task Manager
        description: Manage tasks within Slack
        background_color: "#1A1D21"
        long_description: |
          Task Manager helps teams stay organized by providing
          comprehensive task management directly within Slack.
      settings:
        org_deploy_enabled: true
        socket_mode_enabled: false
        token_rotation_enabled: true
      features:
        app_home:
          home_tab_enabled: true
          messages_tab_enabled: false
        bot_user:
          display_name: Task Manager
          always_online: true
        shortcuts:
          - name: Create Task
            type: global
            callback_id: create_task_shortcut
        slash_commands:
          - command: /task
            url: https://api.taskmanager.example/slack/slash-commands
            description: Create or manage tasks
            usage_hint: "[create|list|assign]"
            should_escape: false

externalDocs:
  description: Complete Task Manager documentation
  url: https://docs.taskmanager.example/slack-app

tags:
  - name: productivity
  - name: task-management
  - name: team-collaboration

x-slack-app-id: A0123456789
x-slack-verification-token: ${SLACK_VERIFICATION_TOKEN}
x-slack-signing-secret: ${SLACK_SIGNING_SECRET}