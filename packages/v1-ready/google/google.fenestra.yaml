# Fenestra Document: Google Workspace Add-ons
#
# Google exposes UI extension points via Google Workspace Add-ons (Gmail,
# Calendar, Drive, Docs, Sheets, Chat hosts) and Editors Add-ons (HTML service
# sidebars/dialogs). Documented at:
#   https://developers.google.com/workspace/add-ons/concepts/card-interfaces
#   https://developers.google.com/workspace/add-ons/editors
#   https://developers.google.com/apps-script/guides/dialogs
#
# Drafted against Fenestra 0.1.0
# (api-module-library branch claude/fenestra-spec-draft-Q367t).
# Google Workspace is not yet listed as a single row in specs/fenestra/PLATFORMS.md;
# this draft covers the published Workspace / Editors Add-on surface. The
# `@friggframework/api-module-google` package itself implements the multi-API
# OAuth REST client, not the Add-ons SDK.

fenestra: "0.1.0"

info:
  title: Google Workspace UI Extensions
  version: "1.0.0"
  description: |
    Google Workspace Add-ons and Editors Add-ons let developers extend Gmail,
    Calendar, Drive, Docs, Sheets, and related hosts with card-based sidebars,
    homepage/contextual triggers, dialogs, and custom menus.

    Surfaces covered (per Google docs):
    - Workspace Add-ons (Card Service UIs across hosts)
    - Editors Add-ons (HTML service sidebars/dialogs, custom menus)
    - Homepage and contextual triggers

platform:
  name: Google Workspace
  vendor: Google LLC
  documentation: https://developers.google.com/workspace/add-ons/concepts/card-interfaces
  appMarketplace: https://workspace.google.com/marketplace

sdks:
  apps-script-card-service:
    name: Google Apps Script Card Service
    packageManager: npm
    package: "@google/clasp"
    platform: web
    documentation: https://developers.google.com/apps-script/reference/card-service
    description: |
      Server-side Card Service used by Workspace Add-ons to render cards in
      host sidebars and other surfaces. Authored in Apps Script; clasp is the
      npm tooling commonly used to push projects.
    exports:
      CardService:
        type: utility
        description: Build card-based UIs for Workspace Add-ons
  apps-script-html-service:
    name: Google Apps Script HTML Service
    packageManager: npm
    package: "@google/clasp"
    platform: web
    documentation: https://developers.google.com/apps-script/guides/html
    description: |
      HTML Service for Editors Add-on sidebars and modal/modeless dialogs.
    exports:
      HtmlService:
        type: utility
        description: Serve HTML/JS/CSS UIs in Workspace sidebars and dialogs

extensionPoints:
  - id: workspace-homepage
    name: Workspace homepage trigger
    type: card
    extensionType: embeddedSdk
    description: |
      Workspace Add-on homepage that appears when a host app is open and no
      specific contextual trigger applies.
    documentation: https://developers.google.com/workspace/add-ons/concepts/workspace-triggers
    supportedComponents:
      - CardService

  - id: gmail-contextual
    name: Gmail contextual trigger
    type: card
    extensionType: embeddedSdk
    description: |
      Card UI shown when reading or composing Gmail messages (contextual).
    documentation: https://developers.google.com/workspace/add-ons/gmail
    supportedComponents:
      - CardService

  - id: calendar-event-open
    name: Calendar event open trigger
    type: card
    extensionType: embeddedSdk
    description: |
      Card UI when a Calendar event is opened.
    documentation: https://developers.google.com/workspace/add-ons/calendar
    supportedComponents:
      - CardService

  - id: drive-item-selected
    name: Drive items selected trigger
    type: card
    extensionType: embeddedSdk
    description: |
      Card UI when one or more Drive items are selected.
    documentation: https://developers.google.com/workspace/add-ons/drive
    supportedComponents:
      - CardService

  - id: editors-sidebar
    name: Editors sidebar
    type: sidebar
    extensionType: embeddedSdk
    description: |
      Editors Add-on sidebar opened via HtmlService (showSidebar) or Card
      Service for Docs/Sheets/Slides hosts.
    documentation: https://developers.google.com/apps-script/guides/dialogs
    supportedComponents:
      - HtmlService
      - CardService

  - id: editors-dialog
    name: Editors dialog
    type: modal
    extensionType: embeddedSdk
    description: |
      Modal or modeless dialog hosted via HtmlService in Docs/Sheets/Slides.
    documentation: https://developers.google.com/apps-script/guides/dialogs
    supportedComponents:
      - HtmlService

  - id: editors-custom-menu
    name: Editors custom menu
    type: toolbar
    extensionType: embeddedSdk
    description: |
      Custom menu entries added from an onOpen simple or installable trigger.
    documentation: https://developers.google.com/apps-script/guides/menus
    supportedComponents:
      - HtmlService
