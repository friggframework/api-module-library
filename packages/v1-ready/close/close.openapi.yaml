      summary: Create an opportunity
      description: >-
        Create an opportunity, optionally linked to an existing lead.


        **custom.FIELD_ID** (optional): Set custom fields by setting `custom.FIELD_ID` to the field
        value, where FIELD_ID is the ID of the custom field, e.g.:


        ```json

        { "custom.cf_v6S011I6MqcbVvB2FA5Nk8dr5MkL8sWuCiG8cUleO9c": "value",
        "custom.cf_8wtBWsdRU2Fur7GDnEeXQ7ra2Vu7R4hG1SNYdiEhh0F": "other value" }

        ```


        If a custom field has `accepts_multiple_values: true`, the entire value will be replaced.
        For example, given an Opportunity has a Custom Choice Field with value `["A", "B"]`, adding
        choice `"C"` would mean setting the value to `["A", "B", "C"]`.


        Note that using the `custom` field dict or the `custom.FIELD_NAME` syntax (instead of custom
        field IDs) is deprecated and will be removed from the API. See [Custom
        Fields](https://developer.close.com/api/resources/custom-fields) for more details.


        Official Close operationId: `opportunities_create`.

        Source: https://api.close.com/api/openapi.json
