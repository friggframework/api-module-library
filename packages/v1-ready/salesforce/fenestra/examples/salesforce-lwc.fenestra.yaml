# Salesforce Lightning Web Component - Fenestra Specification Example
fenestra: 1.0.0
info:
  title: Customer Analytics Dashboard
  version: 3.2.1
  description: |
    Advanced customer analytics dashboard built as a Lightning Web Component.
    Provides real-time insights into customer behavior, sales trends, and 
    performance metrics with interactive charts and customizable views.
  contact:
    name: Analytics Team
    email: analytics@company.example
    url: https://company.example/analytics/support
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

extension:
  type: panel
  rendering:
    mode: native
    sdk:
      type: lightning-web-component
      entry: c/customerAnalyticsDashboard
      framework: lwc
      apiVersion: "57.0"
      initialization:
        cacheEnabled: true
        refreshInterval: 300000
        theme: auto
      methods:
        - name: refreshData
          description: Manually refresh dashboard data
          parameters:
            - name: forceRefresh
              type: boolean
              default: false
          returns:
            type: Promise
            description: Promise resolving when refresh completes
        - name: exportData
          description: Export dashboard data to CSV
          parameters:
            - name: dateRange
              type: object
              properties:
                start: 
                  type: string
                  format: date
                end:
                  type: string
                  format: date
          returns:
            type: string
            description: CSV data as string

  communication:
    channels:
      - type: apex
        config:
          className: CustomerAnalyticsController
          methods:
            - getCustomerMetrics
            - getRevenueData
            - getEngagementStats
            - updateDashboardConfig
      
      - type: platform-events
        config:
          events:
            - Customer_Data_Updated__e
            - Revenue_Alert__e
            - Dashboard_Config_Changed__e
    
    events:
      - name: data.refresh
        direction: outgoing
        description: Request data refresh from server
        payload:
          type: object
          properties:
            component:
              type: string
            lastRefresh:
              type: string
              format: date-time
      
      - name: filter.changed
        direction: bidirectional
        description: Dashboard filters were modified
        payload:
          type: object
          properties:
            filters:
              type: object
              properties:
                dateRange:
                  type: object
                  properties:
                    start: 
                      type: string
                      format: date
                    end:
                      type: string
                      format: date
                customer:
                  type: array
                  items:
                    type: string
                product:
                  type: array
                  items:
                    type: string
      
      - name: drill.down
        direction: outgoing
        description: User clicked on a chart element for drill-down
        payload:
          type: object
          properties:
            chart:
              type: string
            dimension:
              type: string
            value:
              type: string

  capabilities:
    storage:
      platform: true
      customSettings: true
      customMetadata: true
    api:
      platformData:
        - sobjects.read
        - sobjects.write
        - apex.execute
        - reports.read
      externalRequests: true
      allowedDomains:
        - api.analytics-service.example
        - cdn.charts.example
    ui:
      navigation: true
      modals: true
      toasts: true
      quickActions: true
    compute:
      apexCallouts: true
      platformEvents: true
      flows: true

  triggers:
    - type: manual
      config:
        appLauncher: true
        navigationMenu: true
        quickAction: 
          name: View Analytics
          targetObject: Account
    
    - type: contextual
      config:
        recordPages:
          - Account
          - Contact
          - Opportunity
        placement: tab
        label: Analytics
    
    - type: event
      config:
        platformEvents:
          - Customer_Data_Updated__e
          - Revenue_Alert__e
        schedules:
          - name: daily-refresh
            cron: "0 0 6 * * ?"
            timezone: America/New_York

  context:
    required:
      - orgId
      - userId
      - recordId
    optional:
      - sessionId
      - theme
      - language
      - locale
      - timeZone
    
    sobjects:
      access:
        - Account: read
        - Contact: read
        - Opportunity: read,write
        - CustomAnalytics__c: read,write
      
  lifecycle:
    install:
      package: 04t000000EXAMPLE
      dependencies:
        - 04t000000FRAMEWORK
      permissions:
        - Modify_All_Data
        - View_All_Data
        - Manage_Analytics_Templates
    
    upgrade:
      automatic: false
      notification: true
      backupData: true
    
    uninstall:
      cleanupScript: CustomerAnalyticsCleanup
      retainData: true

security:
  - salesforce-oauth:
      - api
      - refresh_token
      - full
  
  csp:
    defaultSrc: "'self'"
    scriptSrc: 
      - "'self'"
      - "'unsafe-inline'"
      - "cdn.charts.example"
    styleSrc:
      - "'self'"
      - "'unsafe-inline'"
    imgSrc:
      - "'self'"
      - "data:"
      - "*.salesforce.com"
    connectSrc:
      - "'self'"
      - "api.analytics-service.example"

deployment:
  hosting: platform
  distribution:
    package:
      name: CustomerAnalyticsDashboard
      namespace: analytics
      version: 3.2.1
      type: managed
    
    files:
      - path: force-app/main/default/lwc/customerAnalyticsDashboard/
        type: lightning-web-component
        metadata:
          apiVersion: 57.0
          isExposed: true
          targets:
            - lightning__AppPage
            - lightning__RecordPage
            - lightning__HomePage
          targetConfigs:
            - lightning__RecordPage:
                objects:
                  - Account
                  - Contact
      
      - path: force-app/main/default/classes/CustomerAnalyticsController.cls
        type: apex-class
        metadata:
          apiVersion: 57.0
      
      - path: force-app/main/default/objects/CustomAnalytics__c/
        type: custom-object
        metadata:
          deploymentStatus: Deployed
          enableActivities: true
          enableReports: true

externalDocs:
  description: Customer Analytics Documentation
  url: https://docs.company.example/analytics-dashboard
  sdkReference: https://developer.salesforce.com/docs/component-library/documentation/lwc
  uiKit: https://www.lightningdesignsystem.com/

tags:
  - name: analytics
  - name: dashboard
  - name: lightning-web-component
  - name: customer-insights

x-salesforce-api-version: "57.0"
x-salesforce-package-namespace: analytics
x-salesforce-managed-package: true