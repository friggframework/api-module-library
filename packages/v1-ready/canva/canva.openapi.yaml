    ExchangeAccessTokenResponse:
      description: Exchange auth token to access token.
      properties:
        access_token:
          description: The bearer access token to use to authenticate to Canva REST API endpoints. If
            requested using a `authorization_code` or `refresh_token`, this allows you to act on behalf
            of a user.
          example: JagALLazU0i2ld9WW4zTO4kaG0lkvP8Y5sSO206ZwxNF4E1y3xKJKF7TzN17BXTfaNOeY0P88AeRCE6cRF7SJzvf3Sx97rA80sGHtFplFo
          type: string
        refresh_token:
          description: The token that you can use to refresh the access token.
          example: JABix5nolsk9k8n2r0f8nq1gw4zjo40ht6sb4i573wgdzmkwdmiy6muh897hp0bxyab276wtgqkvtob2mg9aidt5d6rcltcbcgs101
          type: string
        token_type:
          description: The token type returned. This is always `Bearer`.
          example: Bearer
          type: string
        expires_in:
          description: The expiry time (in seconds) for the access token.
          example: 14400
          format: int64
          type: integer
        scope:
          description: The [scopes](https://www.canva.dev/docs/apps/rest-apis/scopes/) that the token
            has been granted.
          example: asset:read design:meta:read design:permission:read folder:read
          type: string
      required:
      - access_token
      - expires_in
      - refresh_token
      - token_type
      type: object
    ExchangeAuthCodeRequest:
      properties:
        grant_type:
          description: For exchanging an authorization code for an access token.
          enum:
          - authorization_code
          example: authorization_code
          type: string
        code_verifier:
          description: The `code_verifier` value that you generated when creating the user authorization
            URL.
          example: i541qdcfkb4htnork0w92lnu43en99ls5a48ittv6udqgiflqon8vusojojakbq4
          type: string
        code:
          description: The authorization code you received after the user authorized the app.
          example: kp8nnroja7qnx00.opyc1p76rcbyflsxbycjqfp3ub8vzsvltpzwafy9q5l45dn5fxzhe7i7a6mg1i2t8jpsa6sebdeumkzzhicskabgevrxsssec4dvjwfvhq4gs3ugghguar0voiqpfb7axsapiojoter8v3w2s5s3st84jpv2l06h667iw241xngy9c8=vu1tnjp7sz
          type: string
        client_id:
          description: 'Your app''s unique ID, for authenticating the request.


            NOTE: We recommend that you use basic access authentication instead of specifying `client_id`
            and `client_secret` as body parameters.

            '
          example: OC-FAB12-AbCdEf
          type: string
        client_secret:
          description: 'Your app''s client secret, for authenticating the request. Begins with `cnvca`.


            NOTE: We recommend that you use basic access authentication instead of specifying `client_id`
            and `client_secret` as body parameters.

            '
          example: cnvcaAbcdefg12345_hijklm6789
          type: string
        redirect_uri:
          description: 'Only required if a redirect URL was supplied when you [created the user authorization
            URL](https://www.canva.dev/docs/apps/rest-apis/authentication/#create-the-authorization-url).


            Must be one of those already specified by the client. If not supplied, the first redirect_uri
            defined for the client will be used by default.

            '
          example: https://example.com/process-auth
          type: string
      required:
      - code
      - code_verifier
      - grant_type
      type: object
    ExchangeRefreshTokenRequest:
      properties:
        grant_type:
          description: For generating an access token using a refresh token.
          enum:
          - refresh_token
          example: refresh_token
          type: string
        client_id:
          description: 'Your app''s unique ID, for authenticating the request.


            NOTE: We recommend that you use basic access authentication instead of specifying `client_id`
            and `client_secret` as body parameters.

            '
          example: OC-FAB12-AbCdEf
          type: string
        client_secret:
          description: 'Your app''s client secret, for authenticating the request. Begins with `cnvca`.


            NOTE: We recommend that you use basic access authentication instead of specifying `client_id`
            and `client_secret` as body parameters.

            '
          example: cnvcaAbcdefg12345_hijklm6789
          type: string
        refresh_token:
          description: The refresh token to be exchanged. You can copy this value from the successful
            response received when generating an access token.
          example: JABix5nolsk9k8n2r0f8nq1gw4zjo40ht6sb4i573wgdzmkwdmiy6muh897hp0bxyab276wtgqkvtob2mg9aidt5d6rcltcbcgs101
          type: string
        scope:
          description: 'Optional scope value when refreshing an access token. Separate multiple [scopes](https://www.canva.dev/docs/apps/rest-apis/scopes/)
            with a single space between each scope.


            The requested scope cannot include any permissions not already granted, so this parameter
            allows you to limit the scope when refreshing a token. If omitted, the scope for the token
            remains unchanged.

            '
          example: design:meta:read
          type: string
      required:
      - grant_type
      - refresh_token
      type: object
