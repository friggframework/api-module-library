          - plan_edit
          - invite_only
          - workspace_view
          - workspace_edit
        created_at:
          type: string
          format: date-time
          description: The time at which the folder was created.
      required:
      - id
      - name
      - parent_folder_id
    FrameNode:
      allOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - FRAME
            description: The type of this node, represented by the string literal "FRAME"
        required:
        - type
      - $ref: '#/components/schemas/FrameTraits'
    FrameOffset:
      type: object
      description: Position of a comment relative to the frame to which it is attached.
      properties:
        node_id:
          type: string
          description: Unique id specifying the frame.
        node_offset:
          $ref: '#/components/schemas/Vector'
          description: 2D vector offset within the frame from the top-left corner.
      required:
      - node_id
      - node_offset
    FrameOffsetRegion:
      type: object
      description: Position of a region comment relative to the frame to which it is attached.
      properties:
        node_id:
          type: string
          description: Unique id specifying the frame.
        node_offset:
          $ref: '#/components/schemas/Vector'
          description: 2D vector offset within the frame from the top-left corner.
        region_height:
          type: number
          description: The height of the comment region. Must be greater than 0.
        region_width:
          type: number
          description: The width of the comment region. Must be greater than 0.
        comment_pin_corner:
          type: string
          description: The corner of the comment region to pin to the node's corner as a string enum.
          enum:
          - top-left
          - top-right
          - bottom-left
          - bottom-right
          default: bottom-right
      required:
      - node_id
      - node_offset
      - region_height
      - region_width
    FrameTraits:
      allOf:
      - $ref: '#/components/schemas/IsLayerTrait'
      - $ref: '#/components/schemas/HasBlendModeAndOpacityTrait'
      - $ref: '#/components/schemas/HasChildrenTrait'
      - $ref: '#/components/schemas/HasLayoutTrait'
      - $ref: '#/components/schemas/HasFramePropertiesTrait'
      - $ref: '#/components/schemas/CornerTrait'
      - $ref: '#/components/schemas/HasGeometryTrait'
      - $ref: '#/components/schemas/HasExportSettingsTrait'
      - $ref: '#/components/schemas/HasEffectsTrait'
      - $ref: '#/components/schemas/HasMaskTrait'
      - $ref: '#/components/schemas/TransitionSourceTrait'
      - $ref: '#/components/schemas/IndividualStrokesTrait'
      - $ref: '#/components/schemas/VariableWidthStrokesTrait'
      - $ref: '#/components/schemas/ComplexStrokesTrait'
      - $ref: '#/components/schemas/DevStatusTrait'
      - $ref: '#/components/schemas/AnnotationsTrait'
    GradientPaint:
      allOf:
      - type: object
        description: A gradient
        properties:
          type:
            type: string
            description: The string literal representing the paint's type. Always check the `type` before
              reading other properties.
            enum:
            - GRADIENT_LINEAR
            - GRADIENT_RADIAL
            - GRADIENT_ANGULAR
            - GRADIENT_DIAMOND
          gradientHandlePositions:
            type: array
            items:
              $ref: '#/components/schemas/Vector'
            description: This field contains three vectors, each of which are a position in normalized
              object space (normalized object space is if the top left corner of the bounding box of the
              object is (0, 0) and the bottom right is (1,1)). The first position corresponds to the start
              of the gradient (value 0 for the purposes of calculating gradient stops), the second position
              is the end of the gradient (value 1), and the third handle position determines the width
              of the gradient.
          gradientStops:
            type: array
            items:
              $ref: '#/components/schemas/ColorStop'
            description: Positions of key points along the gradient axis with the colors anchored there.
              Colors along the gradient are interpolated smoothly between neighboring gradient stops.
        required:
        - type
        - gradientHandlePositions
        - gradientStops
      - $ref: '#/components/schemas/BasePaint'
    GroupNode:
      allOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - GROUP
            description: The type of this node, represented by the string literal "GROUP"
        required:
        - type
      - $ref: '#/components/schemas/FrameTraits'
    HasBlendModeAndOpacityTrait:
      type: object
      properties:
        blendMode:
          $ref: '#/components/schemas/BlendMode'
          description: How this node blends with nodes behind it in the scene (see blend mode section
            for more details)
        opacity:
          type: number
          description: Opacity of the node
          default: 1
          minimum: 0
          maximum: 1
      required:
      - blendMode
    HasChildrenTrait:
      type: object
      properties:
        children:
          type: array
          description: An array of nodes that are direct children of this node
          items:
            $ref: '#/components/schemas/SubcanvasNode'
      required:
      - children
    HasEffectsTrait:
      type: object
      properties:
        effects:
          type: array
          items:
            $ref: '#/components/schemas/Effect'
          description: An array of effects attached to this node (see effects section for more details)
      required:
      - effects
    HasExportSettingsTrait:
      type: object
      properties:
        exportSettings:
          type: array
          items:
            $ref: '#/components/schemas/ExportSetting'
          description: An array of export settings representing images to export from the node.
    HasFramePropertiesTrait:
      type: object
      properties:
        clipsContent:
          type: boolean
          description: Whether or not this node clip content outside of its bounds
        background:
          type: array
          items:
            $ref: '#/components/schemas/Paint'
          description: Background of the node. This is deprecated, as backgrounds for frames are now in
            the `fills` field.
          deprecated: true
        backgroundColor:
          $ref: '#/components/schemas/RGBA'
          description: Background color of the node. This is deprecated, as frames now support more than
            a solid color as a background. Please use the `fills` field instead.
          deprecated: true
        layoutGrids:
          type: array
          description: An array of layout grids attached to this node (see layout grids section for more
            details). GROUP nodes do not have this attribute
          items:
            $ref: '#/components/schemas/LayoutGrid'
        overflowDirection:
          type: string
          description: Whether a node has primary axis scrolling, horizontal or vertical.
          enum:
          - HORIZONTAL_SCROLLING
          - VERTICAL_SCROLLING
          - HORIZONTAL_AND_VERTICAL_SCROLLING
          - NONE
          default: NONE
        layoutMode:
          type: string
          description: Whether this layer uses auto-layout to position its children.
          enum:
          - NONE
          - HORIZONTAL
          - VERTICAL
          - GRID
          default: NONE
        primaryAxisSizingMode:
          type: string
          description: Whether the primary axis has a fixed length (determined by the user) or an automatic
            length (determined by the layout engine). This property is only applicable for auto-layout
            frames.
          enum:
          - FIXED
          - AUTO
          default: AUTO
        counterAxisSizingMode:
          type: string
          description: Whether the counter axis has a fixed length (determined by the user) or an automatic
            length (determined by the layout engine). This property is only applicable for auto-layout
            frames.
          enum:
          - FIXED
          - AUTO
          default: AUTO
        primaryAxisAlignItems:
          type: string
          description: Determines how the auto-layout frame's children should be aligned in the primary
            axis direction. This property is only applicable for auto-layout frames.
          enum:
          - MIN
          - CENTER
          - MAX
          - SPACE_BETWEEN
          default: MIN
        counterAxisAlignItems:
          type: string
          description: Determines how the auto-layout frame's children should be aligned in the counter
            axis direction. This property is only applicable for auto-layout frames.
          enum:
          - MIN
          - CENTER
          - MAX
          - BASELINE
          default: MIN
        paddingLeft:
          type: number
          description: The padding between the left border of the frame and its children. This property
            is only applicable for auto-layout frames.
          default: 0
        paddingRight:
          type: number
          description: The padding between the right border of the frame and its children. This property
            is only applicable for auto-layout frames.
          default: 0
        paddingTop:
          type: number
          description: The padding between the top border of the frame and its children. This property
            is only applicable for auto-layout frames.
          default: 0
        paddingBottom:
          type: number
          description: The padding between the bottom border of the frame and its children. This property
            is only applicable for auto-layout frames.
          default: 0
        itemSpacing:
          type: number
          description: The distance between children of the frame. Can be negative. This property is only
            applicable for auto-layout frames.
          default: 0
        itemReverseZIndex:
          type: boolean
          description: Determines the canvas stacking order of layers in this frame. When true, the first
            layer will be draw on top. This property is only applicable for auto-layout frames.
          default: false
        strokesIncludedInLayout:
          type: boolean
          description: 'Determines whether strokes are included in layout calculations. When true, auto-layout
            frames behave like css "box-sizing: border-box". This property is only applicable for auto-layout
            frames.'
          default: false
        layoutWrap:
          type: string
          description: Whether this auto-layout frame has wrapping enabled.
          enum:
          - NO_WRAP
          - WRAP
        counterAxisSpacing:
          type: number
          description: 'The distance between wrapped tracks of an auto-layout frame. This property is
            only applicable for auto-layout frames with `layoutWrap: "WRAP"`'
        counterAxisAlignContent:
          type: string
          description: 'Determines how the auto-layout frame’s wrapped tracks should be aligned in the
            counter axis direction. This property is only applicable for auto-layout frames with `layoutWrap:
            "WRAP"`.'
          enum:
          - AUTO
          - SPACE_BETWEEN
          default: AUTO
      required:
      - clipsContent
    HasGeometryTrait:
      allOf:
      - $ref: '#/components/schemas/MinimalFillsTrait'
      - $ref: '#/components/schemas/MinimalStrokesTrait'
      - type: object
        properties:
          fillOverrideTable:
            type: object
            additionalProperties:
              oneOf:
              - $ref: '#/components/schemas/PaintOverride'
              - type: 'null'
            description: Map from ID to PaintOverride for looking up fill overrides. To see which regions
              are overridden, you must use the `geometry=paths` option. Each path returned may have an
              `overrideID` which maps to this table.
          fillGeometry:
            type: array
            items:
              $ref: '#/components/schemas/Path'
            description: Only specified if parameter `geometry=paths` is used. An array of paths representing
              the object fill.
          strokeGeometry:
            type: array
            items:
              $ref: '#/components/schemas/Path'
            description: Only specified if parameter `geometry=paths` is used. An array of paths representing
              the object stroke.
          strokeCap:
            type: string
            description: A string enum describing the end caps of vector paths.
            enum:
            - NONE
            - ROUND
            - SQUARE
            - LINE_ARROW
            - TRIANGLE_ARROW
            - DIAMOND_FILLED
            - CIRCLE_FILLED
            - TRIANGLE_FILLED
            - WASHI_TAPE_1
            - WASHI_TAPE_2
            - WASHI_TAPE_3
            - WASHI_TAPE_4
            - WASHI_TAPE_5
            - WASHI_TAPE_6
            default: NONE
          strokeMiterAngle:
            type: number
            description: Only valid if `strokeJoin` is "MITER". The corner angle, in degrees, below which
              `strokeJoin` will be set to "BEVEL" to avoid super sharp corners. By default this is 28.96
              degrees.
            default: 28.96
    HasLayoutTrait:
      type: object
      properties:
        absoluteBoundingBox:
          description: Bounding box of the node in absolute space coordinates.
          oneOf:
          - $ref: '#/components/schemas/Rectangle'
          - type: 'null'
        absoluteRenderBounds:
          description: The actual bounds of a node accounting for drop shadows, thick strokes, and anything
            else that may fall outside the node's regular bounding box defined in `x`, `y`, `width`, and
            `height`. The `x` and `y` inside this property represent the absolute position of the node
            on the page. This value will be `null` if the node is invisible.
          oneOf:
          - $ref: '#/components/schemas/Rectangle'
          - type: 'null'
        preserveRatio:
          type: boolean
          description: Keep height and width constrained to same ratio.
          default: false
        constraints:
          $ref: '#/components/schemas/LayoutConstraint'
          description: Horizontal and vertical layout constraints for node.
        relativeTransform:
          $ref: '#/components/schemas/Transform'
          description: The top two rows of a matrix that represents the 2D transform of this node relative
            to its parent. The bottom row of the matrix is implicitly always (0, 0, 1). Use to transform
            coordinates in geometry. Only present if `geometry=paths` is passed.
        size:
          $ref: '#/components/schemas/Vector'
          description: Width and height of element. This is different from the width and height of the
            bounding box in that the absolute bounding box represents the element after scaling and rotation.
            Only present if `geometry=paths` is passed.
        layoutAlign:
          type: string
          description: '

            Determines if the layer should stretch along the parent''s counter axis. This property is
            only provided for direct children of auto-layout frames.


            - `INHERIT`

            - `STRETCH`


            In previous versions of auto layout, determined how the layer is aligned inside an auto-layout
            frame. This property is only provided for direct children of auto-layout frames.


            - `MIN`

            - `CENTER`

            - `MAX`

            - `STRETCH`


            In horizontal auto-layout frames, "MIN" and "MAX" correspond to "TOP" and "BOTTOM". In vertical
            auto-layout frames, "MIN" and "MAX" correspond to "LEFT" and "RIGHT".'
          enum:
          - INHERIT
          - STRETCH
          - MIN
          - CENTER
          - MAX
        layoutGrow:
          type: number
          description: This property is applicable only for direct children of auto-layout frames, ignored
            otherwise. Determines whether a layer should stretch along the parent's primary axis. A `0`
            corresponds to a fixed size and `1` corresponds to stretch.
          enum:
          - 0
          - 1
          default: 0
        layoutPositioning:
          type: string
          description: Determines whether a layer's size and position should be determined by auto-layout
            settings or manually adjustable.
          enum:
          - AUTO
          - ABSOLUTE
          default: AUTO
        minWidth:
          type: number
          description: The minimum width of the frame. This property is only applicable for auto-layout
            frames or direct children of auto-layout frames.
          default: 0
        maxWidth:
          type: number
          description: The maximum width of the frame. This property is only applicable for auto-layout
            frames or direct children of auto-layout frames.
          default: 0
        minHeight:
          type: number
          description: The minimum height of the frame. This property is only applicable for auto-layout
            frames or direct children of auto-layout frames.
          default: 0
        maxHeight:
          type: number
          description: The maximum height of the frame. This property is only applicable for auto-layout
            frames or direct children of auto-layout frames.
          default: 0
        layoutSizingHorizontal:
          type: string
          description: 'The horizontal sizing setting on this auto-layout frame or frame child.

            - `FIXED`

            - `HUG`: only valid on auto-layout frames and text nodes

            - `FILL`: only valid on auto-layout frame children'
          enum:
          - FIXED
          - HUG
          - FILL
        layoutSizingVertical:
          type: string
          description: 'The vertical sizing setting on this auto-layout frame or frame child.

            - `FIXED`

            - `HUG`: only valid on auto-layout frames and text nodes

            - `FILL`: only valid on auto-layout frame children'
          enum:
          - FIXED
          - HUG
          - FILL
        gridRowCount:
          type: number
          description: 'The number of rows in the grid layout. This property is only applicable for auto-layout
            frames with `layoutMode: "GRID"`.'
        gridColumnCount:
          type: number
          description: 'The number of columns in the grid layout. This property is only applicable for
            auto-layout frames with `layoutMode: "GRID"`.'
        gridRowGap:
          type: number
          description: 'The distance between rows in the grid layout. This property is only applicable
            for auto-layout frames with `layoutMode: "GRID"`.'
          default: 0
        gridColumnGap:
          type: number
          description: 'The distance between columns in the grid layout. This property is only applicable
            for auto-layout frames with `layoutMode: "GRID"`.'
          default: 0
        gridColumnsSizing:
          type: string
          description: 'The string for the CSS grid-template-columns property. This property is only applicable
            for auto-layout frames with `layoutMode: "GRID"`.'
        gridRowsSizing:
          type: string
          description: 'The string for the CSS grid-template-rows property. This property is only applicable
            for auto-layout frames with `layoutMode: "GRID"`.'
        gridChildHorizontalAlign:
          type: string
          description: 'Determines how a GRID frame''s child should be aligned in the horizontal direction
            within its grid area. This property is only applicable for direct children of frames with
            `layoutMode: "GRID"`.'
          enum:
          - AUTO
          - MIN
          - CENTER
          - MAX
        gridChildVerticalAlign:
          type: string
          description: 'Determines how a GRID frame''s child should be aligned in the vertical direction
            within its grid area. This property is only applicable for direct children of frames with
            `layoutMode: "GRID"`.'
          enum:
          - AUTO
          - MIN
          - CENTER
          - MAX
        gridRowSpan:
          type: number
          description: 'The number of rows that a GRID frame''s child should span. This property is only
            applicable for direct children of frames with `layoutMode: "GRID"`.'
          default: 1
        gridColumnSpan:
          type: number
          description: 'The number of columns that a GRID frame''s child should span. This property is
            only applicable for direct children of frames with `layoutMode: "GRID"`.'
          default: 1
        gridRowAnchorIndex:
          type: number
          description: 'The index of the row that a GRID frame''s child should be anchored to. This property
            is only applicable for direct children of frames with `layoutMode: "GRID"`.'
          default: 0
        gridColumnAnchorIndex:
          type: number
          description: 'The index of the column that a GRID frame''s child should be anchored to. This
            property is only applicable for direct children of frames with `layoutMode: "GRID"`.'
          default: 0
      required:
      - absoluteBoundingBox
      - absoluteRenderBounds
    HasMaskTrait:
      type: object
      properties:
        isMask:
          type: boolean
          description: Does this node mask sibling nodes in front of it?
          default: false
        maskType:
          type: string
          description: 'If this layer is a mask, this property describes the operation used to mask the
            layer''s siblings. The value may be one of the following:


            - ALPHA: the mask node''s alpha channel will be used to determine the opacity of each pixel
            in the masked result.

            - VECTOR: if the mask node has visible fill paints, every pixel inside the node''s fill regions
            will be fully visible in the masked result. If the mask has visible stroke paints, every pixel
            inside the node''s stroke regions will be fully visible in the masked result.

            - LUMINANCE: the luminance value of each pixel of the mask node will be used to determine
            the opacity of that pixel in the masked result.'
          enum:
          - ALPHA
          - VECTOR
          - LUMINANCE
        isMaskOutline:
          type: boolean
          description: True if maskType is VECTOR. This field is deprecated; use maskType instead.
          default: false
          deprecated: true
    HasTextSublayerTrait:
      type: object
      properties:
        characters:
          type: string
          description: Text contained within a text box.
      required:
      - characters
    Hyperlink:
      type: object
      description: A link to either a URL or another frame (node) in the document.
      properties:
        type:
          type: string
          description: The type of hyperlink. Can be either `URL` or `NODE`.
          enum:
          - URL
          - NODE
        url:
          type: string
          description: The URL that the hyperlink points to, if `type` is `URL`.
        nodeID:
          type: string
          description: The ID of the node that the hyperlink points to, if `type` is `NODE`.
      required:
      - type
    ImageFilters:
      type: object
      description: Image filters to apply to the node.
      properties:
        exposure:
          type: number
          default: 0
        contrast:
          type: number
          default: 0
        saturation:
          type: number
          default: 0
        temperature:
          type: number
          default: 0
        tint:
          type: number
          default: 0
        highlights:
          type: number
          default: 0
        shadows:
          type: number
          default: 0
    ImagePaint:
      allOf:
      - type: object
        description: An image
        properties:
          type:
            type: string
            description: The string literal "IMAGE" representing the paint's type. Always check the `type`
              before reading other properties.
            enum:
            - IMAGE
          scaleMode:
            type: string
            description: Image scaling mode.
            enum:
            - FILL
            - FIT
            - TILE
            - STRETCH
          imageRef:
            type: string
            description: A reference to an image embedded in this node. To download the image using this
              reference, use the `GET file images` endpoint to retrieve the mapping from image references
              to image URLs.
          imageTransform:
            $ref: '#/components/schemas/Transform'
            description: Affine transform applied to the image, only present if `scaleMode` is `STRETCH`
          scalingFactor:
            type: number
            description: Amount image is scaled by in tiling, only present if scaleMode is `TILE`.
          filters:
            $ref: '#/components/schemas/ImageFilters'
            description: Defines what image filters have been applied to this paint, if any. If this property
              is not defined, no filters have been applied.
          rotation:
            type: number
            description: Image rotation, in degrees.
            default: 0
          gifRef:
            type: string
            description: A reference to an animated GIF embedded in this node. To download the image using
              this reference, use the `GET file images` endpoint to retrieve the mapping from image references
              to image URLs.
        required:
        - type
        - scaleMode
        - imageRef
      - $ref: '#/components/schemas/BasePaint'
    IndividualStrokesTrait:
      type: object
      properties:
        individualStrokeWeights:
          $ref: '#/components/schemas/StrokeWeights'
          description: An object including the top, bottom, left, and right stroke weights. Only returned
            if individual stroke weights are used.
    InnerShadowEffect:
      allOf:
      - type: object
        description: An inner shadow effect
        properties:
          type:
            type: string
            description: A string literal representing the effect's type. Always check the type before
              reading other properties.
            enum:
            - INNER_SHADOW
      - $ref: '#/components/schemas/BaseShadowEffect'
    InstanceNode:
      allOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - INSTANCE
            description: The type of this node, represented by the string literal "INSTANCE"
          componentId:
            type: string
            description: ID of component that this instance came from.
          isExposedInstance:
            type: boolean
            description: If true, this node has been marked as exposed to its containing component or
              component set.
            default: false
          exposedInstances:
            type: array
            items:
              type: string
            description: IDs of instances that have been exposed to this node's level.
          componentProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/ComponentProperty'
            description: A mapping of name to `ComponentProperty` for all component properties on this
              instance. Each property has a type, value, and other optional values.
          overrides:
            type: array
            items:
              $ref: '#/components/schemas/Overrides'
            description: An array of all of the fields directly overridden on this instance. Inherited
              overrides are not included.
        required:
        - type
        - componentId
        - overrides
      - $ref: '#/components/schemas/FrameTraits'
    InstanceSwapPreferredValue:
      type: object
      description: Instance swap preferred value.
      properties:
        type:
          type: string
          description: Type of node for this preferred value.
          enum:
          - COMPONENT
          - COMPONENT_SET
        key:
          type: string
          description: Key of this component or component set.
      required:
      - type
      - key
    Interaction:
      type: object
      description: An interaction in the Figma viewer, containing a trigger and one or more actions.
      properties:
        trigger:
          oneOf:
          - $ref: '#/components/schemas/Trigger'
          - type: 'null'
          description: The user event that initiates the interaction.
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
          description: The actions that are performed when the trigger is activated.
      required:
      - trigger
    IsLayerTrait:
      type: object
      properties:
        id:
          type: string
          description: A string uniquely identifying this node within the document.
        name:
          type: string
          description: The name given to the node by the user in the tool.
        type:
          type: string
          description: The type of the node
        visible:
          type: boolean
          description: Whether or not the node is visible on the canvas.
          default: true
        locked:
          type: boolean
          description: If true, layer is locked and cannot be edited
          default: false
        isFixed:
          type: boolean
          description: Whether the layer is fixed while the parent is scrolling
          deprecated: true
          default: false
        scrollBehavior:
          type: string
          description: How layer should be treated when the frame is resized
          enum:
          - SCROLLS
          - FIXED
          - STICKY_SCROLLS
          default: SCROLLS
        rotation:
          type: number
          description: The rotation of the node, if not 0.
          default: 0
        componentPropertyReferences:
          type: object
          additionalProperties:
            type: string
          description: A mapping of a layer's property to component property name of component properties
            attached to this node. The component property name can be used to look up more information
            on the corresponding component's or component set's componentPropertyDefinitions.
        pluginData:
          description: Data written by plugins that is visible only to the plugin that wrote it. Requires
            the `pluginData` to include the ID of the plugin.
        sharedPluginData:
          description: Data written by plugins that is visible to all plugins. Requires the `pluginData`
            parameter to include the string "shared".
        boundVariables:
          type: object
          description: A mapping of field to the variables applied to this field. Most fields will only
            map to a single `VariableAlias`. However, for properties like `fills`, `strokes`, `size`,
            `componentProperties`, and `textRangeFills`, it is possible to have multiple variables bound
            to the field.
          properties:
            size:
              type: object
              properties:
                x:
