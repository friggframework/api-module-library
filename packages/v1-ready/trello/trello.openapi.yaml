components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: query
      name: key
      description: Trello Power-Up API key (official swagger.v3.json).
    APIToken:
      type: apiKey
      in: query
      name: token
      description: User token authorized for the API key (official swagger.v3.json).
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.atlassian.com/authorize
          tokenUrl: https://auth.atlassian.com/authorize/oauth/token
          scopes:
            read:board:trello: Read cards, lists, and comments in boards.
            write:board:trello: Create and update cards, lists, and comments in boards.
            write:board:membership:trello: Add, remove, or modify memberships on boards.
            read:organization:trello: Read workspaces.
            write:organization:trello: Update workspaces.
            write:organization:membership:trello: Add, remove, or modify memberships on workspaces.
            read:member:trello: Read email address, public name, public avatar, and memberships of boards,
              workspaces, and enterprises.
            write:member:trello: Upload custom emojis and stickers, star boards, and save searches.
            read:enterprise:trello: Read enterprises.
            write:enterprise:trello: Update and manage enterprises.
  schemas:
    TrelloID:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      example: 5abbe4b7ddc1b351ef961414
    Color:
      type: string
      enum:
      - yellow
      - purple
      - blue
      - red
      - green
      - orange
      - black
      - sky
      - pink
      - lime
      nullable: true
    Member:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        fullName:
          type: string
        username:
          type: string
        url:
          type: string
          format: url
        email:
          type: string
        avatarUrl:
          type: string
          format: url
        initials:
          type: string
        idBoards:
          type: array
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
        idOrganizations:
          type: array
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
        bio:
          type: string
        memberType:
          type: string
          enum:
          - normal
          - ghost
        status:
          type: string
          enum:
          - disconnected
    Board:
      type: object
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        name:
          type: string
          description: The name of the board.
        desc:
          type: string
        closed:
          type: boolean
        idOrganization:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        url:
          type: string
          format: url
        shortUrl:
          type: string
          format: url
        shortLink:
          type: string
        dateLastActivity:
          type: string
          format: date
        prefs:
          type: object
          properties:
            permissionLevel:
              type: string
              enum:
              - org
              - board
            hideVotes:
              type: boolean
            voting:
              type: string
              enum:
              - disabled
              - enabled
            comments:
              type: string
            invitations:
              enum:
              - admins
              - members
            selfJoin:
              type: boolean
            cardCovers:
              type: boolean
            isTemplate:
              type: boolean
            cardAging:
              type: string
              enum:
              - pirate
              - regular
            calendarFeedEnabled:
              type: boolean
            background:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
            backgroundImage:
              type: string
              format: uri
            backgroundImageScaled:
              type: array
              items:
                type: object
                properties:
                  width:
                    description: The width of the image.
                    type: integer
                    example: 100
                  height:
                    description: The height of the image.
                    type: integer
                    example: 64
                  url:
