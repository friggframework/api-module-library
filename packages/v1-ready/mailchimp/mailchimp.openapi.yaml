        default:
          description: An error generated by the Mailchimp API.
          content:
            application/json:
              schema:
                type: object
                description: An error generated by the Mailchimp API. Conforms to IETF draft 'draft-nottingham-http-problem-06'.
                title: Problem Detail Document
                required:
                - type
                - title
                - status
                - detail
                - instance
                properties:
                  type:
                    type: string
                    description: An absolute URI that identifies the problem type. When dereferenced,
                      it should provide human-readable documentation for the problem type.
                    title: Problem Type
                    example: https://mailchimp.com/developer/marketing/docs/errors/
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type. It shouldn't change
                      based on the occurrence of the problem, except for purposes of localization.
                    title: Error Title
                    example: Resource Not Found
                  status:
                    type: integer
                    description: The HTTP status code (RFC2616, Section 6) generated by the origin server
                      for this occurrence of the problem.
                    title: HTTP Status Code
                    example: 404
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence of the problem.
                      [Learn more about errors](/developer/guides/get-started-with-mailchimp-api-3/#Errors).
                    title: Error Message
                    example: The requested resource could not be found.
                  instance:
                    type: string
                    description: A string that identifies this specific occurrence of the problem. Please
                      provide this ID when contacting support.
                    title: Instance ID
                    example: 995c5cb0-3280-4a6e-808b-3b096d0bb219
      parameters:
      - name: fields
        in: query
        required: false
        description: A comma-separated list of fields to return. Reference parameters of sub-objects with
          dot notation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: exclude_fields
        in: query
        required: false
        description: A comma-separated list of fields to exclude. Reference parameters of sub-objects
          with dot notation.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: count
        in: query
        required: false
        description: The number of records to return. Default value is 10. Maximum value is 1000
        schema:
          type: integer
          default: 10
      - name: offset
        in: query
        required: false
        description: Used for [pagination](https://mailchimp.com/developer/marketing/docs/methods-parameters/#pagination),
          this is the number of records from a collection to skip. Default value is 0.
        schema:
          type: integer
          default: 0
      - name: type
        in: query
        required: false
        description: The campaign type.
        schema:
          type: string
          enum:
          - regular
          - plaintext
          - absplit
          - rss
          - variate
      - name: status
        in: query
        required: false
        description: The status of the campaign.
        schema:
          type: string
          enum:
          - save
          - paused
          - schedule
          - sending
          - sent
      - name: before_send_time
        in: query
        required: false
        description: 'Restrict the response to campaigns sent before the set time. Uses ISO 8601 time
          format: 2015-10-21T15:41:36+00:00.'
        schema:
          type: string
          format: date-time
      - name: since_send_time
        in: query
        required: false
        description: 'Restrict the response to campaigns sent after the set time. Uses ISO 8601 time format:
          2015-10-21T15:41:36+00:00.'
        schema:
          type: string
          format: date-time
      - name: before_create_time
        in: query
        required: false
        description: 'Restrict the response to campaigns created before the set time. Uses ISO 8601 time
          format: 2015-10-21T15:41:36+00:00.'
        schema:
          type: string
          format: date-time
      - name: since_create_time
        in: query
        required: false
        description: 'Restrict the response to campaigns created after the set time. Uses ISO 8601 time
          format: 2015-10-21T15:41:36+00:00.'
        schema:
          type: string
          format: date-time
      - name: list_id
        in: query
        required: false
        description: The unique id for the list.
        schema:
          type: string
      - name: folder_id
        in: query
        required: false
        description: The unique folder id.
        schema:
          type: string
      - name: member_id
        in: query
        required: false
        description: Retrieve campaigns sent to a particular list member. Member ID is The MD5 hash of
          the lowercase version of the list member’s email address.
        schema:
          type: string
      - name: sort_field
        in: query
        required: false
        description: Returns files sorted by the specified field.
        schema:
          type: string
          enum:
          - create_time
          - send_time
      - name: sort_dir
        in: query
        required: false
        description: Determines the order direction for sorted results.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: include_resend_shortcut_eligibility
        in: query
        required: false
        description: Return the `resend_shortcut_eligibility` field in the response, which tells you if
          the campaign is eligible for the various Campaign Resend Shortcuts offered.
        schema:
          type: boolean
      - name: include_resend_shortcut_usage
        in: query
        required: false
        description: Return the `resend_shortcut_usage` field in the response.  This includes information
          about campaigns related by a shortcut.
        schema:
          type: boolean
    post:
      operationId: postCampaigns
      summary: Add campaign
      description: Create a new Mailchimp campaign.
      tags:
      - campaigns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: A summary of an individual campaign's settings and content.
                title: Campaign
                properties:
                  id:
                    type: string
                    description: A string that uniquely identifies this campaign.
                    title: Campaign ID
                    readOnly: true
                  web_id:
                    type: integer
                    description: The ID used in the Mailchimp web application. View this campaign in your
                      Mailchimp account at `https://{dc}.admin.mailchimp.com/campaigns/show/?id={web_id}`.
                    title: Campaign Web ID
                    readOnly: true
                  parent_campaign_id:
                    type: string
                    description: If this campaign is the child of another campaign, this identifies the
                      parent campaign. For Example, for RSS or Automation children.
                    title: Parent Campaign ID
                    readOnly: true
                  type:
                    type: string
                    description: There are four types of [campaigns](https://mailchimp.com/help/getting-started-with-campaigns/)
                      you can create in Mailchimp. A/B Split campaigns have been deprecated and variate
                      campaigns should be used instead.
                    title: Campaign Type
                    enum:
                    - regular
                    - plaintext
                    - absplit
                    - rss
                    - variate
                  create_time:
                    type: string
                    format: date-time
                    description: The date and time the campaign was created in ISO 8601 format.
                    title: Create Time
                    readOnly: true
                  archive_url:
                    type: string
                    description: The link to the campaign's archive version in ISO 8601 format.
                    title: Archive URL
                    readOnly: true
                  long_archive_url:
                    type: string
                    description: The original link to the campaign's archive version.
                    title: Long Archive URL
                    readOnly: true
                  status:
                    type: string
                    description: The current status of the campaign.
                    title: Campaign Status
                    enum:
                    - save
                    - paused
                    - schedule
                    - sending
                    - sent
                    - canceled
                    - canceling
                    - archived
                    readOnly: true
                  emails_sent:
                    type: integer
                    description: The total number of emails sent for this campaign.
                    title: Emails Sent
                    readOnly: true
                  send_time:
                    type: string
                    format: date-time
                    description: The date and time a campaign was sent.
                    title: Send Time
                    readOnly: true
                  content_type:
                    type: string
                    description: How the campaign's content is put together.
                    title: Content Type
                    enum:
                    - template
                    - html
                    - url
                    - multichannel
                  needs_block_refresh:
                    type: boolean
                    description: Determines if the campaign needs its blocks refreshed by opening the
                      web-based campaign editor. Deprecated and will always return false.
                    title: Needs Block Refresh
                    readOnly: true
                  resendable:
                    type: boolean
                    description: Determines if the campaign qualifies to be resent to non-openers.
                    title: Resendable
                    readOnly: true
                  recipients:
                    type: object
                    description: List settings for the campaign.
                    title: List
                    properties:
                      list_id:
                        type: string
                        description: The unique list id.
                        title: List ID
                      list_is_active:
                        type: boolean
                        description: The status of the list used, namely if it's deleted or disabled.
                        title: List Status
                        readOnly: true
                      list_name:
                        type: string
                        description: The name of the list.
                        title: List Name
                        readOnly: true
                      segment_text:
                        type: string
                        description: A description of the [segment](https://mailchimp.com/help/create-and-send-to-a-segment/)
                          used for the campaign. Formatted as a string marked up with HTML.
                        title: Segment Text
                        readOnly: true
                      recipient_count:
                        type: integer
                        description: Count of the recipients on the associated list. Formatted as an integer.
                        title: Recipient Count
                        readOnly: true
                      segment_opts:
                        type: object
                        description: An object representing all segmentation options. This object should
                          contain a `saved_segment_id` to use an existing segment, or you can create a
                          new segment by including both `match` and `conditions` options.
                        title: Segment Options
                        properties:
                          saved_segment_id:
                            type: integer
                            description: The id for an existing saved segment.
                            title: Saved Segment ID
                          prebuilt_segment_id:
                            type: string
                            description: The prebuilt segment id, if a prebuilt segment has been designated
                              for this campaign.
                            title: Prebuilt Segment Id
                            example: subscribers-female
                          match:
                            type: string
                            description: Segment match type.
                            title: Match Type
                            enum:
                            - any
                            - all
                          conditions:
                            type: array
                            description: Segment match conditions. There are multiple possible types,
                              see the [condition types documentation](https://mailchimp.com/developer/marketing/docs/alternative-schemas/#segment-condition-schemas).
                            title: Segment Type
                            items: {}
                  settings:
                    type: object
                    description: The settings for your campaign, including subject, from name, reply-to
                      address, and more.
                    title: Campaign Settings
                    properties:
                      subject_line:
                        type: string
                        description: The subject line for the campaign.
                        title: Campaign Subject Line
                      preview_text:
                        type: string
                        description: The preview text for the campaign.
                        title: Campaign Preview Text
                      title:
                        type: string
                        description: The title of the campaign.
                        title: Campaign Title
                      from_name:
                        type: string
                        description: The 'from' name on the campaign (not an email address).
                        title: From Name
                      reply_to:
                        type: string
                        description: The reply-to email address for the campaign.
                        title: Reply To Address
                      use_conversation:
                        type: boolean
                        description: Use Mailchimp Conversation feature to manage out-of-office replies.
                        title: Conversation
                      to_name:
                        type: string
                        description: The campaign's custom 'To' name. Typically the first name [audience
                          field](https://mailchimp.com/help/getting-started-with-merge-tags/).
                        title: To Name
                      folder_id:
                        type: string
                        description: If the campaign is listed in a folder, the id for that folder.
                        title: Folder ID
                      authenticate:
                        type: boolean
                        description: Whether Mailchimp [authenticated](https://mailchimp.com/help/about-email-authentication/)
                          the campaign. Defaults to `true`.
                        title: Authentication
                      auto_footer:
                        type: boolean
                        description: Automatically append Mailchimp's [default footer](https://mailchimp.com/help/about-campaign-footers/)
                          to the campaign.
                        title: Auto-Footer
                      inline_css:
                        type: boolean
                        description: Automatically inline the CSS included with the campaign content.
                        title: Inline CSS
                      auto_tweet:
                        type: boolean
                        description: Automatically tweet a link to the [campaign archive](https://mailchimp.com/help/about-email-campaign-archives-and-pages/)
                          page when the campaign is sent.
                        title: Auto-Tweet
                      auto_fb_post:
                        type: array
                        description: An array of [Facebook](https://mailchimp.com/help/connect-or-disconnect-the-facebook-integration/)
                          page ids to auto-post to.
                        title: Auto Post to Facebook
                        items:
                          type: string
                      fb_comments:
                        type: boolean
                        description: Allows Facebook comments on the campaign (also force-enables the
                          Campaign Archive toolbar). Defaults to `true`.
                        title: Facebook Comments
                      timewarp:
                        type: boolean
                        description: Send this campaign using [Timewarp](https://mailchimp.com/help/use-timewarp/).
                        title: Timewarp Send
                        readOnly: true
                      template_id:
                        type: integer
                        description: The id for the template used in this campaign.
                        title: Template ID
                        readOnly: false
                      drag_and_drop:
                        type: boolean
                        description: Whether the campaign uses the drag-and-drop editor.
                        title: Drag And Drop Campaign
                        readOnly: true
                  variate_settings:
                    type: object
                    description: The settings specific to A/B test campaigns.
                    title: A/B Test Options
                    properties:
                      winning_combination_id:
                        type: string
                        description: ID for the winning combination.
                        title: Winning Combination ID
                        readOnly: true
                      winning_campaign_id:
                        type: string
                        description: ID of the campaign that was sent to the remaining recipients based
                          on the winning combination.
                        title: Winning Campaign ID
                        readOnly: true
                      winner_criteria:
                        type: string
                        description: The combination that performs the best. This may be determined automatically
                          by click rate, open rate, or total revenue -- or you may choose manually based
                          on the reporting data you find the most valuable. For Multivariate Campaigns
                          testing send_time, winner_criteria is ignored. For Multivariate Campaigns with
                          'manual' as the winner_criteria, the winner must be chosen in the Mailchimp
                          web application.
                        title: Winning Criteria
                        enum:
                        - opens
                        - clicks
                        - manual
                        - total_revenue
                      wait_time:
                        type: integer
                        description: The number of minutes to wait before choosing the winning campaign.
                          The value of wait_time must be greater than 0 and in whole hours, specified
                          in minutes.
                        title: Wait Time
                      test_size:
                        type: integer
                        description: The percentage of recipients to send the test combinations to, must
                          be a value between 10 and 100.
                        title: Test Size
                      subject_lines:
                        type: array
                        description: The possible subject lines to test. If no subject lines are provided,
                          settings.subject_line will be used.
                        title: Subject Lines
                        items:
                          type: string
                      send_times:
                        type: array
                        description: The possible send times to test. The times provided should be in
                          the format YYYY-MM-DD HH:MM:SS. If send_times are provided to test, the test_size
                          will be set to 100% and winner_criteria will be ignored.
                        title: Send Times
                        items:
                          type: string
                          format: date-time
                      from_names:
                        type: array
                        description: The possible from names. The number of from_names provided must match
                          the number of reply_to_addresses. If no from_names are provided, settings.from_name
                          will be used.
                        title: From Names
                        items:
                          type: string
                      reply_to_addresses:
                        type: array
                        description: The possible reply-to addresses. The number of reply_to_addresses
                          provided must match the number of from_names. If no reply_to_addresses are provided,
                          settings.reply_to will be used.
                        title: Reply To Addresses
                        items:
                          type: string
                      contents:
                        type: array
                        description: Descriptions of possible email contents. To set campaign contents,
                          make a PUT request to /campaigns/{campaign_id}/content with the field 'variate_contents'.
                        title: Content Descriptions
                        readOnly: true
                        items:
                          type: string
                      combinations:
                        type: array
                        description: Combinations of possible variables used to build emails.
                        title: Combinations
                        readOnly: true
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Unique ID for the combination.
                              title: ID
                            subject_line:
                              type: integer
                              description: The index of `variate_settings.subject_lines` used.
                              title: Subject Line
                            send_time:
                              type: integer
                              description: The index of `variate_settings.send_times` used.
                              title: Send Time
                            from_name:
                              type: integer
                              description: The index of `variate_settings.from_names` used.
                              title: From Name
                            reply_to:
                              type: integer
                              description: The index of `variate_settings.reply_to_addresses` used.
                              title: Reply To
                            content_description:
                              type: integer
                              description: The index of `variate_settings.contents` used.
                              title: Content Description
                            recipients:
                              type: integer
                              description: The number of recipients for this combination.
                              title: Recipients
