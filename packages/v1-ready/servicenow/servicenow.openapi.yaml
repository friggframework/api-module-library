      summary: List CSM cases
      description: >-
        Table API GET with tableName=sn_customerservice_case (official CSM case
        table; not csm_case). Dedicated Case API also exists under
        /api/sn_customerservice/case.
      parameters:
        - $ref: '#/components/parameters/sysparm_query'
        - $ref: '#/components/parameters/sysparm_limit'
        - $ref: '#/components/parameters/sysparm_offset'
        - $ref: '#/components/parameters/sysparm_fields'
        - $ref: '#/components/parameters/sysparm_display_value'
      responses:
        "200":
          description: List of sn_customerservice_case records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableListResponse'
    post:
      tags: [CSM]
      operationId: createCase
      summary: Create a CSM case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableRecordResponse'

